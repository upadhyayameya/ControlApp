/* ---------------------------------- why we're behind ------------------------------------- */
const STAGE_IDX = Object.fromEntries(STAGES.map(([s], i) => [s, i]));
function monthsBefore(month, n) { let [y, m] = month.split("-").map(Number); const out = []; for (let i = 0; i < n; i++) { m--; if (!m) { y--; m = 12; } out.push(`${y}-${pad(m)}`); } return out.reverse(); }
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
const median = (xs) => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const shortMonth = (m) => new Date(m + "-01T00:00:00Z").toLocaleString("en-US", { month: "short", timeZone: "UTC" });
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

/* Each project's first date at each stage, as of a date. Duplicates are left out; a repeat counts at first logging. */
function projectIndex(asOf) {
  const P = new Map();
  for (const e of MODEL.events) {
    if (e.duplicateOf || e.date > asOf) continue;
    const k = normName(e.name) + "\u0001" + e.program;
    let p = P.get(k);
    if (!p) { p = { name: e.name, program: e.program, at: {}, ev: {} }; P.set(k, p); }
    if (!p.at[e.stage] || e.date < p.at[e.stage]) { p.at[e.stage] = e.date; p.ev[e.stage] = e; }
  }
  for (const p of P.values()) {
    let best = -1;
    for (const st in p.at) best = Math.max(best, STAGE_IDX[st]);
    p.furthest = best; p.furthestDate = p.at[STAGES[best][0]];
  }
  return P;
}

/* Where each project stands on the project trackers, by name. Used to tell real waiting work from
   projects that were cancelled, finished, put on hold, or carried on under another program. */
const TRACKER_GROUPS = { cancelled: "new_group11955", onHold: "new_group92794", completed: "new_group" };
const HOLD_STATUS = /stuck|on hold|waiting on info|waiting on others/i;
function trackerIndex() {
  const idx = new Map();
  for (const [tk, t] of Object.entries(CONFIG.trackers)) {
    const b = DATA.boards[tk];
    if (!b) continue;
    for (const it of b.items) {
      const rec = { tracker: t.label, status: it.c[t.status] || null, gid: it.gid, group: it.gt };
      for (const k of [normName(it.name), baseName(it.name)]) { if (!idx.has(k)) idx.set(k, []); idx.get(k).push(rec); }
    }
  }
  return idx;
}
function trackerState(T, name) {
  const recs = T.get(normName(name)) || T.get(baseName(name)) || [];
  if (!recs.length) return { kind: "unknown", label: "not found on the trackers" };
  // A building can sit on more than one tracker; any live record wins over cancelled or finished ones.
  const live = recs.filter((r) => r.gid !== TRACKER_GROUPS.cancelled && r.gid !== TRACKER_GROUPS.completed && !/cancel/i.test(r.status || ""));
  const show = (r) => `${r.tracker}: ${r.status || "no status"} (${r.group})`;
  if (!live.length) {
    const r = recs[0];
    return r.gid === TRACKER_GROUPS.completed ? { kind: "completed", label: show(r) } : { kind: "cancelled", label: show(r) };
  }
  const r = live[0];
  if (r.gid === TRACKER_GROUPS.onHold || HOLD_STATUS.test(r.status || "")) return { kind: "hold", label: show(r) };
  return { kind: "active", label: show(r) };
}

/* Reasons a KPI (stage × program) is off pace, each backed by monday data and, where possible, a list of items. */
function reasonsFor(r, ctx) {
  const { B, P, ag, month, asOf } = ctx;
  const stage = r.stage, prog = r.program, idx = STAGE_IDX[stage];
  const g = goalView(r);
  const out = [];
  const fmt = g.dollar ? (v) => money(v) : (v) => num(v);
  const exp = g.goal * B.pace.fraction, short = Math.max(0, exp - (g.actual || 0)), left = Math.max(0, g.goal - (g.actual || 0));
  const closed = TODAY > monthBounds(month)[1];
  const weeksLeft = closed ? 0 : B.weeks.filter((w) => w.end >= asOf).length;
  const pick = (e) => e.program === prog || prog === "Total";
  const sumVal = (evs) => g.dollar ? (sumOf(evs.map((e) => e.incentive)) || 0) : evs.length;

  // 1. Is the goal in line with what this program normally does?
  const hm = monthsBefore(month, 3);
  const hist = hm.map((mo) => sumVal((MODEL.byStageMonth.get(stage + "|" + mo) || []).filter((e) => pick(e) && e.counted)));
  const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
  const histTxt = hm.map((mo, i) => `${shortMonth(mo)} ${fmt(hist[i])}`).join(", ");
  if (avg === 0) out.push({ kind: "Goal vs. history", sev: 2, head: "Nothing logged in the last 3 months", text: `Nothing was logged here in the last three months (${histTxt}), so the goal of ${fmt(g.goal)} assumes work that hasn't been flowing at all.` });
  else if (g.goal >= avg * 1.5) out.push({ kind: "Goal vs. history", sev: 2, head: `Goal is ${(g.goal / avg).toFixed(1)}× a normal month`, text: `The goal of ${fmt(g.goal)} is ${(g.goal / avg).toFixed(1)}× the recent monthly average of ${fmt(avg)} (${histTxt}). Hitting it needs a step up, not just a normal month.` });
  else if (avg >= g.goal) out.push({ kind: "Goal vs. history", sev: 1, head: "Running below its own normal month", text: `This usually reaches the goal: the last three months averaged ${fmt(avg)} (${histTxt}). This month is running below its own normal, so look for what changed.` });
  else out.push({ kind: "Goal vs. history", sev: 1, head: `Recent average ${fmt(avg)} a month`, text: `Recent months averaged ${fmt(avg)} (${histTxt}) against a goal of ${fmt(g.goal)}.` });

  // 2. Supply waiting at the previous step, and how long that step takes.
  if (idx > 0 && stage !== "impl_completed") {
    const prev = STAGES[idx - 1][0];
    const candidates = [...P.values()].filter((p) => (p.program === prog || prog === "Total") && p.furthest === idx - 1 && daysBetween(p.furthestDate, asOf) <= 180);
    // Same building carried further under another program (e.g. audited as BGE, then submitted as HVAC BTU)?
    const furthestByName = new Map();
    for (const p of P.values()) { const k = normName(p.name); furthestByName.set(k, Math.max(furthestByName.get(k) ?? -1, p.furthest)); }
    const T = ctx.T || (ctx.T = trackerIndex());
    const groups = { active: [], hold: [], unknown: [], cancelled: [], completed: [], movedOn: [] };
    for (const p of candidates) {
      const st = trackerState(T, p.name);
      const moved = furthestByName.get(normName(p.name)) > p.furthest;
      const key = st.kind === "cancelled" || st.kind === "completed" ? st.kind : moved ? "movedOn" : st.kind;
      groups[key].push({ p, st, moved });
    }
    const waiting = [...groups.active, ...groups.hold, ...groups.unknown];
    const ages = waiting.map(({ p }) => daysBetween(p.furthestDate, asOf));
    const lagsP = [...P.values()].filter((p) => (p.program === prog || prog === "Total") && p.at[prev] && p.at[stage] && p.at[stage] >= p.at[prev]).map((p) => daysBetween(p.at[prev], p.at[stage]));
    const lagsAll = lagsP.length >= 5 ? lagsP : [...P.values()].filter((p) => p.at[prev] && p.at[stage] && p.at[stage] >= p.at[prev]).map((p) => daysBetween(p.at[prev], p.at[stage]));
    const lag = median(lagsAll);
    const tag = { active: "In progress", hold: "On hold / waiting on info", unknown: "Not on any tracker", cancelled: "Cancelled — excluded", completed: "Completed — excluded", movedOn: "Moved on under another program — excluded" };
    const order = ["active", "hold", "unknown", "movedOn", "cancelled", "completed"];
    const items = order.flatMap((k) => groups[k].map(({ p, st }) => ({ b: p.ev[prev].boardId, id: p.ev[prev].id, name: p.name,
      detail: `${tag[k]} · ${STAGE_LABEL[prev]} ${p.furthestDate} (${daysBetween(p.furthestDate, asOf)} days) · ${st.label}` })));
    const active = groups.active, val = (xs) => g.dollar ? sumOf(xs.map(({ p }) => p.ev[prev].incentive)) || 0 : xs.length;
    const activeVal = val(active);
    const excluded = groups.cancelled.length + groups.completed.length + groups.movedOn.length;
    const tr = [groups.cancelled.length && `${groups.cancelled.length} ${groups.cancelled.length === 1 ? "is" : "are"} cancelled`, groups.completed.length && `${groups.completed.length} ${groups.completed.length === 1 ? "is" : "are"} completed`].filter(Boolean);
    const why = [tr.length && `${tr.join(" and ")} on the trackers`,
      groups.movedOn.length && `${groups.movedOn.length} carried on under another program in the KPI log (for example audited as BGE, then submitted as a prescriptive tune-up)`].filter(Boolean);
    const head = candidates.length
      ? `${plural(candidates.length, "project")} reached ${STAGE_LABEL[prev]} in the last 6 months with nothing after it in the KPI log.${excluded ? ` Of these, ${why.join(", and ")}, so ${excluded === 1 ? "it isn't" : "they aren't"} really waiting.` : ""}`
      : "";
    let text, sev;
    if (!waiting.length) { text = `${head} ${candidates.length ? "None are still open, so" : "Nothing is waiting at " + STAGE_LABEL[prev] + ", so"} there is nothing in the pipeline to turn into ${STAGE_LABEL[stage].toLowerCase()} this month. The gap starts upstream.`; sev = 3; }
    else {
      const holdTxt = groups.hold.length ? `, ${groups.hold.length} ${groups.hold.length === 1 ? "is" : "are"} on hold or waiting on information` : "";
      const unkTxt = groups.unknown.length ? `, ${groups.unknown.length} ${groups.unknown.length === 1 ? "isn't" : "aren't"} on any tracker` : "";
      const still = `Of the ${waiting.length} still open, ${active.length} ${active.length === 1 ? "is" : "are"} in progress${g.dollar && active.length ? ` (${money(activeVal)})` : ""}${holdTxt}${unkTxt}.`;
      if (activeVal >= left) { text = `${head} ${still} The ones in progress could cover what's left of the goal if they move this month. The oldest open one has waited ${Math.max(...ages)} days.`; sev = 2; }
      else { text = `${head} ${still} Even if every project in progress moved this month, the goal would still be ${fmt(left - activeVal)} short: the pipeline is too thin.`; sev = 3; }
    }
    const phead = !waiting.length ? `Nothing open at ${STAGE_LABEL[prev]}` : sev === 3 ? `Pipeline too thin: ${active.length} in progress at ${STAGE_LABEL[prev]}` : `${active.length} waiting at ${STAGE_LABEL[prev]}, not moving`;
    out.push({ kind: "Pipeline", sev, head: phead, text: text.trim(), items,
      stats: [["reached " + STAGE_LABEL[prev], candidates.length], ["in progress", active.length], ["on hold", groups.hold.length], ["not on a tracker", groups.unknown.length],
              ["moved on under another program", groups.movedOn.length], ["cancelled", groups.cancelled.length], ["completed", groups.completed.length]].filter(([, n], i) => i < 2 || n) });
    if (lag != null) {
      const daysLeft = daysBetween(asOf, monthBounds(month)[1]);
      const late = !closed && lag > daysLeft;
      out.push({ kind: "Lead time", sev: late ? 2 : 0, head: `Takes ~${Math.round(lag)} days from the previous step`, text: `Projects typically take ${Math.round(lag)} days from ${STAGE_LABEL[prev]} to ${STAGE_LABEL[stage]}${lagsP.length >= 5 ? "" : " (all programs; too few for this one alone)"}.${late ? ` With ${daysLeft} days left in the month, work reaching ${STAGE_LABEL[prev]} from now on mostly lands next month.` : closed ? ` Work reaching ${STAGE_LABEL[prev]} in the last ${Math.round(lag)} days of a month mostly lands in the next one.` : ""}` });
    }
  }

  // 3. Implementations past their date but not marked done.
  if (stage === "impl_completed") {
    const st = prog === "Total" ? Object.values(MODEL.stale).flat() : MODEL.stale[prog] || [];
    const thisMonth = st.filter((x) => monthOf(x.date) === month);
    if (st.length) out.push({ kind: "Not marked done", sev: 3, head: `${st.length} past their date, not marked done`, text: `${plural(st.length, "implementation")} on the trackers ${st.length === 1 ? "has" : "have"} a date that has passed but ${st.length === 1 ? "isn't" : "aren't"} marked done${thisMonth.length ? ` (${thisMonth.length} dated this month)` : ""}. If the work happened, updating the tracker status counts ${st.length === 1 ? "it" : "them"}.`, items: st });
  }

  // 4. ICF / HBS holding work in the RFI loop.
  if (ag && ag.ok && ["pa_approved", "co_approved", "pa_submitted", "co_submitted"].includes(stage)) {
    const phase = stage.startsWith("pa") ? /pre-?approval/i : /closeout/i;
    const loop = ag.loop.filter((x) => (prog === "Total" || x.program === prog) && phase.test(x.phase || ""));
    const icf = loop.filter((x) => x.holder === "ICF"), hbs = loop.filter((x) => x.holder === "HBS" && !x.blocked), blk = loop.filter((x) => x.blocked);
    const toItems = (xs) => xs.map((x) => ({ b: ag.boardId, id: x.id, name: x.name, detail: `${x.status}${x.tu ? ` · tracker: ${x.tu}` : ""} · ${x.dfr == null ? "?" : Math.round(x.dfr)} days since update${x.overdue ? ` · follow-up was due ${md(x.next)}` : ""}` }));
    if (blk.length) out.push({ kind: "Waiting on customer", sev: 2, head: `${blk.length} waiting on the customer or others`, text: `${plural(blk.length, "project")} in this phase ${blk.length === 1 ? "is" : "are"} with HBS but the project tracker says ${blk.length === 1 ? "it's" : "they're"} waiting on information from the customer or others (${money(sumOf(blk.map((x) => x.value)) || 0)}).`, items: toItems(blk) });
    const late = loop.filter((x) => x.overdue);
    if (late.length) out.push({ kind: "Follow-up overdue", sev: 2, head: `${late.length} follow-up${late.length === 1 ? "" : "s"} overdue`, text: `${plural(late.length, "project")} in the RFI loop for this phase ${late.length === 1 ? "has" : "have"} a Next Action Date that has passed.`, items: toItems(late) });
    if (stage.endsWith("approved") && icf.length) out.push({ kind: "Waiting on ICF", sev: 2, head: `${icf.length} with ICF`, text: `${plural(icf.length, "project")} in this phase ${icf.length === 1 ? "is" : "are"} with ICF after an RFI response or resubmission (${money(sumOf(icf.map((x) => x.value)) || 0)}). Approvals depend on ICF clearing ${icf.length === 1 ? "it" : "them"}.`, items: toItems(icf) });
    if (hbs.length) out.push({ kind: "Waiting on HBS", sev: 3, head: `${hbs.length} waiting on HBS (RFIs, revisions)`, text: `${plural(hbs.length, "project")} in this phase ${hbs.length === 1 ? "is" : "are"} waiting on HBS: open RFIs or revisions (${money(sumOf(hbs.map((x) => x.value)) || 0)}). These are in HBS's control to move.`, items: toItems(hbs) });
  }

  // 5. Timing: nothing logged recently.
  const cur = (MODEL.byStageMonth.get(stage + "|" + month) || []).filter((e) => pick(e) && e.counted);
  const last = cur.map((e) => e.date).sort().pop();
  const since = last ? daysBetween(last, asOf) : daysBetween(monthBounds(month)[0], asOf);
  if (since >= 7) out.push({ kind: "Activity", sev: 2, head: last ? `Nothing logged since ${md(last)}` : "Nothing logged yet this month", text: last ? `Nothing has been logged here since ${md(last)} (${since} days).` : `Nothing has been logged here yet this month (${since} days in).` });

  // 6. Dollars vs count: are the projects smaller than the goal assumes?
  if (r.goal.count != null && r.goal.dollars != null && r.mtd.count) {
    const avgVal = (r.mtd.dollars || 0) / r.mtd.count, goalAvg = r.goal.dollars / r.goal.count;
    const pc = r.mtd.count / r.goal.count, pdol = (r.mtd.dollars || 0) / r.goal.dollars;
    if (pdol < pc * 0.75) out.push({ kind: "Project size", sev: 2, head: "Smaller projects than the goal assumes", text: `Count is ${pct(pc)} of goal but dollars are ${pct(pdol)}: the average project is ${money(avgVal)}, against ${money(goalAvg)} per project in the goal. The mix has shifted to smaller jobs.` });
    else if (pc < pdol * 0.75) out.push({ kind: "Project size", sev: 1, head: "Fewer, larger projects", text: `Dollars (${pct(pdol)} of goal) are ahead of count (${pct(pc)}): fewer, larger projects (${money(avgVal)} average vs ${money(goalAvg)} in the goal).` });
  }

  // 7. Data: corrections and records that can't be placed.
  const all = (MODEL.byStageMonth.get(stage + "|" + month) || []).filter(pick);
  const dups = all.filter((e) => e.duplicateOf).length, reps = all.filter((e) => e.repeatOf && !e.duplicateOf && !e.counted).length;
  if (dups || reps) out.push({ kind: "Data", sev: 1, head: `${dups + reps} logged twice, counted once`, text: `monday has ${all.length} rows here; ${[dups ? plural(dups, "duplicate") : "", reps ? plural(reps, "repeat submission") : ""].filter(Boolean).join(" and ")} ${dups + reps === 1 ? "was" : "were"} removed. A hand-built count of raw rows would show ${dups + reps} more.` });
  if (prog !== "Total") {
    const un = (MODEL.byStageMonth.get(stage + "|" + month) || []).filter((e) => e.program === UNMAPPED && e.counted);
    if (un.length) out.push({ kind: "Data", sev: 1, head: `${un.length} with no usable Utility`, text: `${plural(un.length, "record")} at this stage this month ${un.length === 1 ? "has" : "have"} a blank or unknown Utility and can't be counted to any program. Some may belong here.`, items: un.map((e) => ({ b: e.boardId, id: e.id, name: e.name, detail: `Utility "${e.utility || ""}"` })) });
  }
  return { r, g, exp, short, left, weeksLeft, closed, reasons: out.sort((a, b) => b.sev - a.sev) };
}

/* Reasons for every off-pace KPI, computed once per render. */
function whyContext(B, month) {
  const [, last] = monthBounds(month);
  const asOf = last < TODAY ? last : TODAY;
  return { B, P: projectIndex(asOf), ag: aging(DATA), month, asOf };
}
const isOff = (r) => hasGoal(r) && r.mtd.count != null && (r.status === "behind" || r.status === "watch");
function offCounts(B) {
  const c = {};
  for (const [s] of STAGES) for (const r of [...B.sections[s], B.totals[s]]) if (isOff(r)) {
    const k = r.program; c[k] = c[k] || { behind: 0, watch: 0 }; c[k][r.status]++;
  }
  return c;
}

function whyCard(d, B, open) {
  const { r, g } = d;
  const top = d.reasons.filter((x) => x.sev >= 2).slice(0, 2);
  const sevCls = (x) => x.sev >= 3 ? "error" : x.sev === 2 ? "warning" : "info";
  const fmtN = (v) => g.dollar ? money(v) : num(v, v < 10 && v % 1 ? 1 : 0);
  const reasonsHtml = d.reasons.map((x) => `<div class="qrow"><span class="sev ${sevCls(x)}"></span><div><h3>${esc(x.head || x.kind)} <span class="sub">· ${esc(x.kind)}</span></h3>
    ${x.stats ? `<div class="stats">${x.stats.map(([l, n]) => `<span><b>${n}</b> ${esc(l)}</span>`).join("")}</div>` : ""}<p>${esc(x.text)}</p>
    ${x.items && x.items.length ? `<details><summary>Show the ${plural(x.items.length, "project")}</summary><div class="scroll"><table class="list"><tbody>${x.items.slice(0, 200).map((it) => `<tr><td class="name">${esc(it.name)}</td><td class="small muted">${esc(it.detail || "")}</td><td style="white-space:nowrap">${itemLink(it.b, it.id)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}</div><span></span></div>`).join("");
  return `<details class="whyrow" id="why-${r.stage}" ${open ? "open" : ""}>
    <summary>
      <span class="wk"><b>${esc(STAGE_LABEL[r.stage])}</b>${chip(r.status)}</span>
      <span class="wp"><span class="small tnum"><b>${g.actual == null ? "—" : g.fmt(g.actual)}</b> of ${g.fmt(g.goal)}${d.closed ? "" : ` · <span style="color:var(--bad)">${fmtN(d.short)} short</span>`}</span>
        <span class="bullet"><i style="width:${Math.round(Math.min(1, g.pct || 0) * 100)}%"></i><b style="left:calc(${Math.round(B.pace.fraction * 100)}% - 1px)"></b></span></span>
      <span class="wr">${top.length ? top.map((x) => `<span class="reason"><span class="sev ${sevCls(x)}"></span>${esc(x.head || x.kind)}</span>`).join("") : `<span class="muted small">No clear cause in the monday data</span>`}</span>
      <span class="chev" aria-hidden="true">›</span>
    </summary>
    <div class="whybody">
      <div class="small" style="display:flex;flex-wrap:wrap;gap:4px 18px;padding:0 18px 10px">
        ${d.closed ? `<span style="color:var(--bad)">Missed the goal by <b>${g.fmt(d.left)}</b></span>` : `<span>Should be <b>${fmtN(d.exp)}</b> by today</span>${d.weeksLeft ? `<span>Needs <b>${g.fmt(d.left / d.weeksLeft)}</b> a week for the ${plural(d.weeksLeft, "week")} left</span>` : ""}`}
        <button type="button" class="linkbtn" data-drill="${esc(JSON.stringify(r.mtd.drill))}">See this month's items →</button></div>
      <div style="border-top:1px solid var(--line)">${reasonsHtml || `<div class="empty">No cause found in the monday data.</div>`}</div>
    </div></details>`;
}

/* The "why" section under a utility's table: a one-paragraph summary, then one card per off-pace KPI. */
function whySection(B, rows, label) {
  const month = state.month, closed = TODAY > monthBounds(month)[1];
  const off = rows.filter(isOff);
  if (!rows.some(hasGoal)) return "";
  if (!off.length) return `<section class="card"><div class="empty"><b>${esc(label)} is on pace for every KPI with a goal</b>Nothing to explain this month.</div></section>`;
  const ctx = whyContext(B, month);
  const diag = off.map((r) => reasonsFor(r, ctx));
  const has = (kind, sev) => diag.filter((d) => d.reasons.some((x) => x.kind === kind && (sev == null || x.sev === sev)));
  const stretch = has("Goal vs. history", 2), thin = has("Pipeline", 3), stuck = has("Pipeline", 2), hbs = has("Waiting on HBS"), icf = has("Waiting on ICF", 2), notDone = has("Not marked done"), quiet = has("Activity");
  const names = (ds) => ds.map((d) => STAGE_LABEL[d.r.stage]).join(", ");
  const pattern = [
    stretch.length && `<li><b>Goal above normal output:</b> ${esc(names(stretch))}. The goal is at least 1.5× a typical recent month, or nothing was logged recently.</li>`,
    thin.length && `<li><b>Not enough in the pipeline:</b> ${esc(names(thin))}. Even if every project waiting at the previous step moved, the goal would not be reached.</li>`,
    stuck.length && `<li><b>Work waiting but not moving:</b> ${esc(names(stuck))}. Enough projects sit at the previous step to cover the goal.</li>`,
    hbs.length && `<li><b>Waiting on HBS in the RFI loop:</b> ${esc(names(hbs))}.</li>`,
    icf.length && `<li><b>Waiting on ICF:</b> ${esc(names(icf))}.</li>`,
    notDone.length && `<li><b>Implementations not marked done</b> on the tracker although their date has passed.</li>`,
    quiet.length && `<li><b>Nothing logged for a week or more:</b> ${esc(names(quiet))}.</li>`,
  ].filter(Boolean);
  let h = `<div class="pagehead" style="margin-top:6px"><div><h1 style="font-size:20px">${closed ? `Why ${esc(label)} missed` : `Why ${esc(label)} is behind`}</h1>
    <p>${plural(off.length, "KPI")} off pace, each with the reasons the monday data shows. Judged on working days gone, not the latest week.</p></div></div>`;
  if (pattern.length) h += `<section class="card"><div class="card-h"><h2>In short</h2></div><div class="card-b"><ul style="margin:0;padding-left:20px;display:grid;gap:6px">${pattern.join("")}</ul></div></section>`;
  const icfNote = ctx.ag && ctx.ag.ok && !ctx.ag.items.some((x) => x.program) ? `<div class="card-note" style="padding-top:12px">ICF RFI loop counts by utility appear after the next Refresh.</div>` : "";
  return h + `<section class="card whylist"><div class="card-h"><h2>Each KPI off pace</h2><div class="right"><button type="button" class="linkbtn" data-expandall>Expand all</button></div></div>
    <div class="card-note" style="padding-top:4px">Click a row for the full reasons and the monday items behind them.</div>
    ${diag.map((d) => whyCard(d, B, false)).join("")}${icfNote}</section>`;
}

/* ---------------------------------- drawer ----------------------------------------------- */
let lastFocus = null;
function openDrawer(d) {
  state.drill = d;
  const { weeks } = monthWeeks(d.month);
  const evs = drillEvents(MODEL, d.stage, d.program, d.month, d.week);
  const counted = evs.filter((e) => e.counted);
  const wl = d.week === "mtd" ? "Month to date" : d.week === "none" ? "Not in any week" : (() => { const w = weeks.find((x) => String(x.index) === d.week); return w ? `Week ${w.index} · ${w.label}` : d.week; })();
  const reason = d.program !== "Total" ? unavailFor(MODEL, d.stage, d.program) : null;
  const dr = $("#drawer");
  dr.innerHTML = `<div class="drawer-h"><div><h2 id="drawerTitle">${esc(STAGE_LABEL[d.stage])} · ${d.program === "Total" ? "All programs" : esc(d.program)}</h2><p>${esc(wl)} · ${esc(monthName(d.month))}</p></div>
      <button type="button" class="iconbtn" id="closeDrawer">Close</button></div>
    <div class="drawer-sum"><span><b>${counted.length}</b> counted</span>${evs.length !== counted.length ? `<span><b>${evs.length}</b> rows in monday</span>` : ""}<span><b>${money(sumOf(counted.map((e) => e.incentive)) || 0)}</b> Incentive</span><span><b>${money(sumOf(counted.map((e) => e.share)) || 0)}</b> HBS Share</span></div>
    ${reason ? `<div class="alert warn" style="margin:12px 20px 0">${ICON.warn}<span>${esc(reason)}</span></div>` : ""}
    ${STAGE_NOTES[d.stage] ? `<p class="small muted" style="margin:10px 20px 0">${esc(STAGE_NOTES[d.stage])}</p>` : ""}
    <div class="drawer-b">${eventRows(evs, false, d.week === "mtd" ? (x) => weekLabelOf(weeks, x) : null)}</div>`;
  lastFocus = document.activeElement;
  dr.hidden = false; $("#backdrop").hidden = false;
  $("#closeDrawer").focus();
}
function closeDrawer() {
  state.drill = null; $("#drawer").hidden = true; $("#backdrop").hidden = true;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* ---------------------------------- page shell ------------------------------------------- */
function renderAlerts() {
  const out = [];
  for (const w of monthWeeks(state.month).warnings) out.push(`<div class="alert bad">${ICON.warn}<span><b>Week setup.</b> ${esc(w)}</span></div>`);
  if (MODEL) for (const i of MODEL.issues.filter((x) => x.kind === "refresh_error")) out.push(`<div class="alert warn">${ICON.warn}<span>${esc(i.msg)}</span></div>`);
  if (ALERT) out.push(ALERT);
  $("#alerts").innerHTML = out.join("");
}
function renderFresh() {
  const stale = !DATA || (MODEL && MODEL.issues.some((x) => x.kind === "refresh_error"));
  const btn = $("#refresh");
  $("#fresh").textContent = REFRESHING ? `Reading monday… ${PROGRESS}%` : ago(DATA && DATA.at);
  btn.querySelector(".dot").className = `dot ${stale && !REFRESHING ? "stale" : ""}`;
  btn.title = REFRESHING ? "Reading monday.com" : `Refresh from monday.com${DATA ? " · last pulled " + fmtTime(DATA.at) : ""}`;
  btn.disabled = REFRESHING; btn.classList.toggle("spin", REFRESHING);
  $("#loadbar i").style.width = REFRESHING ? `${Math.max(4, PROGRESS)}%` : "0";
}
function render() {
  for (const a of document.querySelectorAll("#nav a")) { if (a.getAttribute("href") === "#" + state.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode));
  renderAlerts(); renderFresh();
  if (!MODEL) return;
  const views = { overview: renderOverview, weekly: renderWeekly, pace: renderPace, submissions: renderSubmissions, aging: renderAging, quality: renderQuality };
  const main = $("#main");
  main.innerHTML = (views[state.view] || renderOverview)();
  main.classList.toggle("busy", REFRESHING);
  if (state.drill && !$("#drawer").hidden) openDrawer(state.drill);
}
function fillMonths() {
  const months = new Set(Object.keys(CONFIG.weeks)); months.add(monthOf(TODAY));
  if (MODEL) for (const e of MODEL.events) if (e.date >= addDays(TODAY, -400) && e.date <= TODAY) months.add(e.month);
  $("#month").innerHTML = [...months].sort().reverse().map((m) => `<option value="${m}" ${m === state.month ? "selected" : ""}>${esc(monthName(m))}</option>`).join("");
}

/* ---------------------------------- loading ---------------------------------------------- */
const CACHE_KEY = "btu-scoreboard-v1";
function loadCache() { try { const s = store.get(CACHE_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function saveCache(d) { try { store.set(CACHE_KEY, JSON.stringify(d)); } catch { /* storage full or blocked: page still works */ } }
function useData(d) { DATA = d; ACCOUNT = d.account || ACCOUNT; TODAY = todayNY(); MODEL = compute(DATA, TODAY); fillMonths(); render(); }

const ERROR_COPY = {
  needs_reauth: "Your monday.com connection has expired. Reconnect monday.com in claude.ai Settings → Connectors, then press Refresh.",
  server_not_connected: "monday.com isn't connected to your Claude account. Add it in claude.ai Settings → Connectors, then press Refresh.",
  selection_required: "You have more than one monday.com connector. Choose which one this page should use when claude.ai asks, then press Refresh.",
  not_in_manifest: "This page isn't allowed to use your monday.com connector. Allow it from the page's Permissions menu, then press Refresh.",
  approval_required: "This page needs your approval to read monday.com. Press Refresh and choose Allow.",
  blocked_by_policy: "Your organisation's policy blocks this page from reading monday.com.",
  not_granted: "Connector access isn't available in this view. Open the page on claude.ai while signed in.",
  capability_disabled: "Connector access isn't available in this view. Open the page on claude.ai while signed in.",
};
function emptyState(title, text) { $("#main").innerHTML = `<section class="card"><div class="empty"><b>${esc(title)}</b>${esc(text)}</div></section>`; }

async function refresh() {
  if (!mcp) {
    ALERT = `<div class="alert info">${ICON.info}<span>Live data needs this page open on claude.ai while you're signed in with monday.com connected.${DATA ? ` Showing your last pull from ${esc(fmtTime(DATA.at))}.` : ""}</span></div>`;
    render(); return;
  }
  REFRESHING = true; PROGRESS = 0; ALERT = null; render();
  const keys = Object.keys(CONFIG.boards);
  const prog = Object.fromEntries(keys.map((k) => [k, [0, 0]]));
  const draw = () => {
    const done = keys.reduce((a, k) => a + prog[k][0], 0), tot = keys.reduce((a, k) => a + (prog[k][1] || 500), 0);
    PROGRESS = Math.min(99, Math.round((done / tot) * 100)); renderFresh();
  };
  const prev = DATA || { boards: {}, errors: {} };
  const next = { at: Date.now(), account: prev.account || null, boards: {}, errors: {} };
  try { const acc = await gql("query { account { slug } }", {}); next.account = acc?.account?.slug || next.account; } catch { /* links fall back to monday.com */ }
  const results = await Promise.allSettled(keys.map((k) => pullBoard(k, (kk, n, t) => { prog[kk] = [n, t]; draw(); })));
  const codes = [];
  results.forEach((r, i) => {
    const k = keys[i];
    if (r.status === "fulfilled") next.boards[k] = { ...r.value, at: next.at };
    else {
      const e = r.reason || {};
      codes.push(e.code);
      next.errors[k] = ERROR_COPY[e.code] || e.message || "unknown error";
      if (prev.boards[k]) next.boards[k] = prev.boards[k];   // keep the last good pull, flagged stale
    }
  });
  REFRESHING = false;
  if (codes.length === keys.length && new Set(codes).size === 1 && ERROR_COPY[codes[0]]) {
    ALERT = `<div class="alert warn">${ICON.warn}<span>${esc(ERROR_COPY[codes[0]])}</span></div>`;
    if (!Object.keys(prev.boards).length) { render(); emptyState("Can't read monday.com yet", ERROR_COPY[codes[0]]); return; }
    render(); return;
  }
  useData(next);
  if (!Object.keys(next.errors).length) saveCache(next);
}

/* ---------------------------------- wiring ----------------------------------------------- */
state.month = monthOf(TODAY);
const VIEWS = ["overview", "weekly", "pace", "submissions", "aging", "quality"];
function fromHash() { const h = (location.hash || "").slice(1); state.view = h === "why" ? "weekly" : VIEWS.includes(h) ? h : "overview"; }
fromHash();
try { const p = JSON.parse(store.get("btu-scoreboard-prefs") || "{}"); if (p.mode === "share" || p.mode === "incentive") state.mode = p.mode; if (p.stage && STAGE_LABEL[p.stage]) state.stage = p.stage; if (p.program && (ALL_ROWS.includes(p.program) || p.program === "Total")) state.program = p.program; } catch { /* defaults */ }
const savePrefs = () => store.set("btu-scoreboard-prefs", JSON.stringify({ mode: state.mode, stage: state.stage, program: state.program }));
window.addEventListener("hashchange", () => { fromHash(); render(); window.scrollTo(0, 0); });
$("#month").addEventListener("change", (e) => { state.month = e.target.value; render(); });
$("#refresh").addEventListener("click", () => refresh());
$("#backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer(); });
document.addEventListener("change", (e) => {
  if (e.target.id === "showRaw") { state.showRaw = e.target.checked; render(); }
  if (e.target.id === "subProg") { state.subProg = e.target.value; $("#subResults").innerHTML = subResults(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "subSearch") { state.subQuery = e.target.value; $("#subResults").innerHTML = subResults(); } });
document.addEventListener("click", (e) => {
  const seg = e.target.closest(".seg button");
  if (seg) { state.mode = seg.dataset.mode; savePrefs(); render(); return; }
  const cell = e.target.closest("[data-drill]");
  if (cell) { openDrawer(JSON.parse(cell.getAttribute("data-drill"))); return; }
  if (e.target.closest("#closeDrawer")) { closeDrawer(); return; }
  const tile = e.target.closest("[data-stage]");
  if (tile) { openDrawer({ stage: tile.dataset.stage, program: "Total", month: state.month, week: "mtd" }); return; }
  const pl = e.target.closest("[data-proglink]");
  if (pl) {
    e.preventDefault(); state.program = pl.dataset.proglink; savePrefs();
    const target = pl.dataset.jumpafter;
    if (location.hash === "#weekly") render(); else location.hash = "weekly";
    if (target) setTimeout(() => { const el = document.getElementById(target); if (el) { el.open = true; el.scrollIntoView({ block: "start" }); } }, 60);
    return;
  }
  const jp = e.target.closest("[data-jump]");
  if (jp) { e.preventDefault(); const el = document.getElementById(jp.dataset.jump); if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
  const ex = e.target.closest("[data-expandall]");
  if (ex) { const rows = [...document.querySelectorAll("details.whyrow")]; const open = !rows.every((d) => d.open); rows.forEach((d) => (d.open = open)); ex.textContent = open ? "Collapse all" : "Expand all"; return; }
  const pp = e.target.closest("[data-pickprog]");
  if (pp) { state.program = pp.dataset.pickprog; savePrefs(); render(); return; }
  const ps = e.target.closest("[data-pickstage]");
  if (ps) { state.stage = ps.dataset.pickstage; savePrefs(); render(); return; }
  const sb = e.target.closest("[data-substage]");
  if (sb) { state.subStage = sb.dataset.substage; render(); }
});
setInterval(() => { if (!REFRESHING) renderFresh(); }, 60000);

fillMonths();
const cached = loadCache();
if (cached && cached.boards) useData(cached); else render();

(async () => {
  try { mcp = window.claude && typeof window.claude.use === "function" ? await window.claude.use("mcp") : null; } catch { mcp = null; }
  if (!mcp) {
    ALERT = `<div class="alert info">${ICON.info}<span>Live data needs this page open on claude.ai while you're signed in with monday.com connected.${DATA ? ` Showing your last pull from ${esc(fmtTime(DATA.at))}.` : ""}</span></div>`;
    render();
    if (!DATA) emptyState("Open this page on claude.ai", "Sign in to claude.ai with the monday.com connector added, and the scoreboard loads from monday.");
    return;
  }
  // Re-read on every open: closed weeks are never treated as settled.
  refresh();
})();
</script>
