    if (r.goal.count == null) return `<td class="n"><span class="muted small" title="${esc(r.goal.reason || "")}">—</span></td>`;
    const pctv = r.pctCount == null ? 0 : Math.min(1, r.pctCount);
    const exp = Math.min(1, B.pace.fraction);
    return `<td><div style="display:grid;gap:4px;min-width:150px"><div class="small tnum" style="display:flex;justify-content:space-between"><span>${r.mtd.count ?? "—"} of ${num(r.goal.count)}</span><span class="muted">${pct(r.pctCount)}</span></div>
      <div class="bullet" title="Bar: month to date. Tick: where pace says you should be today."><i style="width:${Math.round(pctv * 100)}%"></i><b style="left:calc(${Math.round(exp * 100)}% - 1px)"></b></div></div></td>`;
  };
  const body = [...visibleRows(rows), total].map((r) => `<tr class="${r.program === "Total" ? "total" : ""}">
      <td class="rowh">${r.program === "Total" ? "All programs" : esc(r.program)}${r.program === OTHER ? `<span class="sub">Potomac Edison, Met ED, National Grid</span>` : r.program === UNMAPPED ? `<span class="sub">blank or unknown Utility</span>` : ""}</td>
      ${r.weeks.map((c) => valueCell(c)).join("")}${B.hasUn ? valueCell(r.un, "orph") : ""}${valueCell(r.mtd, "mtd")}
      ${anyGoal ? goalCell(r) + `<td>${chip(r.status) || `<span class="muted small">—</span>`}</td>` : ""}</tr>`).join("");
  const reasons = [...new Set([...rows, total].map((r) => r.mtd.unavail).filter(Boolean))];
  h += `<section class="card"><div class="card-b scroll"><table><thead><tr><th>Program</th>${cols}${B.hasUn ? `<th class="n orph">Not in any week</th>` : ""}<th class="n mtd">Month to date</th>
      ${anyGoal ? `<th>Goal</th><th>Pace</th>` : ""}</tr></thead><tbody>${body}</tbody></table></div>
    ${reasons.length ? `<div class="card-note">${reasons.map((r) => `n/a: ${esc(r)}`).join("<br>")}</div>` : ""}
    ${anyGoal ? "" : `<div class="card-note">No goals are set for ${esc(monthName(state.month))}, so there is no pace status yet. Send Claude the month's goals to add them.</div>`}</section>`;
  const levels = levelRows(state.month, B.weeks, TODAY);
  if (levels.length) h += `<section class="card"><div class="card-h"><h2>Levels <span class="sub">· readings, never summed across weeks</span></h2></div><div class="card-b scroll"><table><thead><tr><th>Metric</th>${B.weeks.map((w) => `<th class="n">Week ${w.index}</th>`).join("")}<th class="n mtd">Latest</th><th class="n">Target</th></tr></thead><tbody>
    ${levels.map((l) => `<tr><td class="rowh">${esc(l.metric)}</td>${l.weeks.map((r) => `<td class="n">${r ? fmtLevel(l.kind, r.value) : `<span class="future">·</span>`}</td>`).join("")}<td class="n mtd">${l.latest ? fmtLevel(l.kind, l.latest.value) : "—"}</td><td class="n">${l.goal != null ? fmtLevel(l.kind, l.goal) : "—"}</td></tr>`).join("")}</tbody></table></div></section>`;
  return h;
}

function renderPace() {
  const B = scoreboard(MODEL, state.month, state.mode, TODAY);
  const weeksLeft = B.weeks.filter((w) => w.end >= TODAY).length;
  let h = pageHead(`Pace · ${monthName(state.month)}`, `Where each stage stands against its goal, judged on working days gone (${pct(B.pace.fraction)}), with ${B.pace.remaining} working day${B.pace.remaining === 1 ? "" : "s"} and ${weeksLeft} week${weeksLeft === 1 ? "" : "s"} left.`, B);
  const withGoal = [], without = [];
  for (const [stage] of STAGES) for (const r of [...B.sections[stage], B.totals[stage]]) {
    if (r.goal.count != null) withGoal.push(r);
    else if (r.program === "Total") without.push(r);
  }
  if (withGoal.length) {
    h += `<section class="card"><div class="card-h"><h2>Against goal</h2><div class="right small muted">Bar: month to date · Tick: where you should be today</div></div><div class="card-b scroll"><table><thead><tr>
      <th>Stage</th><th>Program</th><th style="min-width:200px">Progress</th><th class="n">Gap to pace</th><th class="n">Needed per week</th><th class="n">Needed per working day</th><th>Status</th></tr></thead><tbody>
      ${withGoal.map((r) => {
        const c = r.mtd.count;
        if (c == null) return `<tr><td>${esc(STAGE_LABEL[r.stage])}</td><td class="rowh">${esc(r.program)}</td><td colspan="5"><span class="na" style="text-align:left">${esc(r.mtd.unavail)}</span></td></tr>`;
        const gap = c - r.expCount, left = Math.max(r.goal.count - c, 0);
        return `<tr class="${r.program === "Total" ? "total" : ""}"><td>${esc(STAGE_LABEL[r.stage])}</td><td class="rowh">${r.program === "Total" ? "All programs" : esc(r.program)}</td>
          <td><div style="display:grid;gap:4px"><div class="small" style="display:flex;justify-content:space-between"><span><b>${c}</b> of ${num(r.goal.count)} · ${money(r.mtd.dollars)}</span><span class="muted">${pct(r.pctCount)}</span></div>
          <div class="bullet"><i style="width:${Math.round(Math.min(1, r.pctCount || 0) * 100)}%"></i><b style="left:calc(${Math.round(B.pace.fraction * 100)}% - 1px)"></b></div></div></td>
          <td class="n" style="color:${gap < 0 ? "var(--bad)" : "var(--good)"}">${gap >= 0 ? "+" : ""}${num(gap, 1)}</td>
          <td class="n">${weeksLeft ? num(left / weeksLeft, 1) : "—"}</td><td class="n">${B.pace.remaining ? num(left / B.pace.remaining, 2) : "—"}</td><td>${chip(r.status)}</td></tr>`;
      }).join("")}</tbody></table></div></section>`;
  } else {
    h += `<section class="card"><div class="empty"><b>No goals set for ${esc(monthName(state.month))}</b>Pace needs a goal per stage and program. Send Claude the month's goals and this page will show progress bars, the gap to pace and the run rate needed for the weeks left.</div></section>`;
  }
  if (without.length) {
    h += `<section class="card"><div class="card-h"><h2>Run rate so far <span class="sub">· all programs, stages without a goal</span></h2></div><div class="card-b scroll"><table><thead><tr><th>Stage</th><th class="n">Month to date</th><th class="n">${state.mode === "incentive" ? "Incentive" : "HBS Share"}</th><th class="n">Per working day</th></tr></thead><tbody>
      ${without.map((r) => r.mtd.count == null ? `<tr><td>${esc(STAGE_LABEL[r.stage])}</td><td colspan="3"><span class="na">${esc(r.mtd.unavail)}</span></td></tr>`
        : `<tr><td>${esc(STAGE_LABEL[r.stage])}</td><td class="n"><b>${r.mtd.count}</b></td><td class="n">${money(r.mtd.dollars)}</td><td class="n">${B.pace.elapsed ? num(r.mtd.count / B.pace.elapsed, 2) : "—"}</td></tr>`).join("")}
      </tbody></table></div></section>`;
  }
  return h;
}

function eventRows(evs, showStage, weekOf) {
  if (!evs.length) return `<div class="empty"><b>No items</b>Nothing was logged here.</div>`;
  return `<table class="list"><thead><tr><th>Date</th>${weekOf ? "<th>Week</th>" : ""}${showStage ? "<th>Stage</th>" : ""}<th>Project</th><th>Program</th><th>Utility</th><th>Engineer</th><th class="n">Incentive</th><th class="n">HBS Share</th><th>Counted?</th><th></th></tr></thead><tbody>
    ${evs.map((e) => `<tr class="${e.counted ? "" : "excluded"}"><td class="tnum" style="white-space:nowrap">${esc(e.date)}</td>${weekOf ? `<td class="small muted" style="white-space:nowrap">${esc(weekOf(e.date))}</td>` : ""}${showStage ? `<td>${esc(STAGE_LABEL[e.stage])}</td>` : ""}
      <td class="name">${esc(e.name)}</td><td title="${esc(e.basis)}">${esc(e.program)}</td><td>${esc(e.utility || "—")}</td><td>${esc(e.engineer || "")}</td>
      <td class="n">${money(e.incentive)}</td><td class="n">${money(e.share)}</td><td>${statusPill(e)}</td><td style="white-space:nowrap">${itemLink(e.boardId, e.id)}</td></tr>`).join("")}</tbody></table>`;
}
function statusPill(e) {
  if (e.duplicateOf) return `<span class="pill mute" title="Same date, project, stage and program as #${esc(e.duplicateOf)}">Duplicate</span>`;
  if (e.repeatOf) return `<span class="pill warn" title="First logged ${esc(e.repeatFirst)} as #${esc(e.repeatOf)}">Repeat${e.counted ? " · counted" : ""}</span>`;
  return `<span class="pill">Yes</span>`;
}

function renderSubmissions() {
  const { weeks } = monthWeeks(state.month);
  const evs = drillEvents(MODEL, state.subStage, null, state.month, null);
  const groups = new Map(weeks.map((w) => [`Week ${w.index} · ${w.label}`, []]));
  for (const e of evs) { const w = weeks.find((x) => inWeek(x, e.date)); const k = w ? `Week ${w.index} · ${w.label}` : "Not in any week"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
  const reason = unavailFor(MODEL, state.subStage, "*");
  let h = pageHead(`Submissions · ${monthName(state.month)}`, "Every item logged at a stage, week by week. Duplicates and repeats stay in the list, greyed out.");
  h += `<div class="stagepick" role="group" aria-label="Stage">${STAGES.map(([s, l]) => `<button type="button" data-substage="${s}" aria-pressed="${s === state.subStage}">${esc(l)}</button>`).join("")}</div>`;
  if (reason) h += `<div class="alert warn">${ICON.warn}<span>${esc(reason)}</span></div>`;
  for (const [label, list] of groups) {
    const counted = list.filter((e) => e.counted), future = weeks.find((w) => label.startsWith(`Week ${w.index} ·`))?.start > TODAY;
    if (future && !list.length) continue;
    h += `<section class="card"><div class="card-h"><h2>${esc(label)}</h2><div class="right small"><b>${counted.length}</b>&nbsp;counted${list.length !== counted.length ? ` <span class="muted">&nbsp;of ${list.length} logged</span>` : ""} · ${money(sumOf(counted.map((e) => dollarsOf(e, state.mode))) || 0)}</div></div>
      <div class="card-b scroll" style="padding-top:6px">${eventRows(list, false, null)}</div></section>`;
  }
  return h;
}

function renderAging() {
  const a = aging(DATA);
  let h = pageHead("Aging", "Who is holding the work in the ICF RFI loop, read from the ICF/HBS Project Tracker. Current state, not tied to the month.");
  if (!a.ok) return h + `<section class="card"><div class="empty"><b>Aging isn't available</b>${esc(a.reason)}</div></section>`;
  const v = (o, k) => o[k] || [0, 0];
  const hbs = v(a.byHolder, "HBS"), icf = v(a.byHolder, "ICF"), tot = hbs[0] + icf[0] || 1;
  h += `<div class="kpis">
    <div class="kpi"><div class="lbl">In the RFI loop</div><div class="val">${a.loop.length}</div><div class="sub">${money(hbs[1] + icf[1])} · ${a.rfiCount} are open RFIs${a.rfiCount ? ` (${(a.loop.length / a.rfiCount).toFixed(1)}× the RFI count)` : ""}</div></div>
    <div class="kpi"><div class="lbl">Ball in HBS's court</div><div class="val">${hbs[0]}</div><div class="sub">${money(hbs[1])} · RFIs and revisions</div></div>
    <div class="kpi"><div class="lbl">Ball in ICF's court</div><div class="val">${icf[0]}</div><div class="sub">${money(icf[1])} · responses and resubmissions</div></div>
    <div class="kpi ${a.overdue.length ? "bad" : "good"}"><div class="lbl">RFIs older than ${CONFIG.icf.rfiOverdueDays} days</div><div class="val">${a.overdue.length}</div><div class="sub">${money(sumOf(a.overdue.map((x) => x.value)) || 0)}</div></div></div>`;
  const bTot = a.buckets.reduce((s, b) => s + b[1], 0) || 1;
  const bColor = (b) => ({ critical: "var(--bad-mark)", watch: "var(--warn-mark)", ok: "var(--good-mark)" }[key(b)] || "var(--line-2)");
  h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px">
    <section class="card"><div class="card-h"><h2>Who holds the loop</h2></div><div class="card-b">
      <div class="split" role="img" aria-label="HBS ${hbs[0]}, ICF ${icf[0]}"><span style="width:${(hbs[0] / tot) * 100}%;background:var(--series)"></span><span style="width:${(icf[0] / tot) * 100}%;background:var(--series-2)"></span></div>
      <div class="legend"><span><i style="background:var(--series)"></i>HBS ${hbs[0]}</span><span><i style="background:var(--series-2)"></i>ICF ${icf[0]}</span></div>
      <table style="margin-top:10px"><thead><tr><th>Status</th><th>Ball with</th><th class="n">Items</th><th class="n">Total Incentive</th></tr></thead><tbody>
      ${Object.entries(CONFIG.icf.loop).map(([s, r]) => `<tr><td>${esc(s)}</td><td>${r.holder}</td><td class="n">${v(a.byKind, r.kind)[0]}</td><td class="n">${money(v(a.byKind, r.kind)[1])}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card"><div class="card-h"><h2>Time in current phase</h2><span class="sub">from the tracker's Aging Bucket</span></div><div class="card-b">
      ${a.buckets.length ? `<div class="split" role="img" aria-label="${esc(a.buckets.map((b) => b[0] + " " + b[1]).join(", "))}">${a.buckets.map((b) => `<span style="width:${(b[1] / bTot) * 100}%;background:${bColor(b[0])}" title="${esc(b[0])}: ${b[1]}"></span>`).join("")}</div>
      <div class="legend">${a.buckets.map((b) => `<span><i style="background:${bColor(b[0])}"></i>${esc(b[0])} ${b[1]}</span>`).join("")}</div>
      <table style="margin-top:10px"><thead><tr><th>Bucket</th><th class="n">Projects</th><th class="n">Total Incentive</th></tr></thead><tbody>
      ${a.buckets.map(([b, n, d]) => `<tr><td>${esc(b)}</td><td class="n">${n}</td><td class="n">${money(d)}</td></tr>`).join("")}</tbody></table>
      <div class="small muted" style="margin-top:8px">Critical: over 60 days in phase. Watch: over 30.</div>` : `<div class="empty">No bucket values on the tracker.</div>`}</div></section></div>`;
  h += `<section class="card"><div class="card-h"><h2>Who is holding the work</h2><span class="sub">HBS-side items by HBS Engineer, ICF-side by ICF Engineer</span></div><div class="card-b scroll"><table><thead><tr><th>Side</th><th>Person</th><th class="n">Items</th><th class="n">Total Incentive</th><th class="n">Longest wait (days)</th></tr></thead><tbody>
    ${a.byPerson.map(([hh, p, n, d, mx]) => `<tr><td><span class="legend" style="margin:0"><span><i style="background:${hh === "HBS" ? "var(--series)" : "var(--series-2)"}"></i>${hh}</span></span></td><td class="rowh">${esc(p)}</td><td class="n">${n}</td><td class="n">${money(d)}</td><td class="n">${num(mx)}</td></tr>`).join("") || `<tr><td colspan="5"><div class="empty">Nothing in the loop.</div></td></tr>`}</tbody></table></div></section>`;
  h += `<section class="card"><div class="card-h"><h2>RFIs older than ${CONFIG.icf.rfiOverdueDays} days</h2><span class="sub">${a.overdue.length} items, longest wait first</span></div><div class="card-b scroll">${agingTable(a.overdue, a.boardId, false)}</div></section>`;
  h += `<details class="how"><summary>Every item in the loop (${a.loop.length})</summary><div class="scroll" style="padding:0 8px 12px">${agingTable(a.loop.slice().sort((x, y) => (y.dfr || 0) - (x.dfr || 0)), a.boardId, true)}</div></details>`;
  if (a.missingValue) h += `<p class="small muted" style="margin:0">${a.missingValue} items in the loop have no Total Incentive, so dollar totals leave them out.</p>`;
  return h;
}
function agingTable(xs, boardId, withStatus) {
  if (!xs.length) return `<div class="empty">None.</div>`;
  return `<table class="list"><thead><tr><th>Project</th>${withStatus ? "<th>Status</th>" : ""}<th>Phase</th><th class="n">Days waiting</th><th class="n">Days in phase</th><th>Bucket</th><th>ICF engineer</th><th>HBS engineer</th><th class="n">Total Incentive</th><th></th></tr></thead><tbody>
    ${xs.map((x) => `<tr><td class="name">${esc(x.name)}</td>${withStatus ? `<td>${esc(x.status)}</td>` : ""}<td>${esc(x.phase || "")}</td><td class="n"><b>${num(x.dfr)}</b></td><td class="n">${num(x.dip)}</td>
      <td>${x.bucket ? `<span class="pill ${key(x.bucket) === "critical" ? "warn" : ""}" style="${key(x.bucket) === "critical" ? "background:var(--bad-bg);color:var(--bad)" : ""}">${esc(x.bucket)}</span>` : ""}</td>
      <td>${esc(x.icf || "")}</td><td>${esc(x.hbs || "")}</td><td class="n">${money(x.value)}</td><td style="white-space:nowrap">${itemLink(boardId, x.id)}</td></tr>`).join("")}</tbody></table>`;
}

function renderQuality() {
  const month = state.month, M = MODEL, kpi = DATA.boards.kpi;
  const count = kpi ? (kpi.meta.items_count ?? kpi.items.length) : null;
  const perMonth = {};
  for (const e of M.events) if (e.board === "kpi") perMonth[e.month] = (perMonth[e.month] || 0) + 1;
  const prev = []; let [y, mo] = TODAY.slice(0, 7).split("-").map(Number);
  for (let i = 0; i < 3; i++) { mo--; if (!mo) { y--; mo = 12; } prev.push(`${y}-${pad(mo)}`); }
  const rates = prev.map((p) => perMonth[p]).filter(Boolean);
  const rate = rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : null;
  const left = count != null && rate ? (CONFIG.itemLimit - count) / rate : null;
  const used = count != null ? count / CONFIG.itemLimit : 0;
  const evsM = STAGES.flatMap(([s]) => M.byStageMonth.get(s + "|" + month) || []);
  const dupGroups = new Map();
  for (const e of evsM) if (e.dupGroup > 1) { const k = e.duplicateOf || e.id; if (!dupGroups.has(k)) dupGroups.set(k, []); dupGroups.get(k).push(e); }
  const dupRows = [...dupGroups.values()].flatMap((g) => g.sort((a, b) => (a.duplicateOf ? 1 : 0) - (b.duplicateOf ? 1 : 0)));
  const repeats = evsM.filter((e) => e.repeatOf && !e.duplicateOf).sort((a, b) => (a.date < b.date ? -1 : 1));

  let h = pageHead(`Data quality · ${monthName(month)}`, "Every correction the scoreboard makes, and every reason a number might be wrong.");
  h += `<div class="kpis">
    <div class="kpi ${left != null && left < 3 ? "bad" : ""}"><div class="lbl">KPI board size (limit ${num(CONFIG.itemLimit)})</div><div class="val">${num(count)}</div>
      <div class="bullet" style="margin:8px 0 6px"><i style="width:${Math.round(used * 100)}%;background:${used > .9 ? "var(--bad-mark)" : "var(--series)"}"></i></div>
      <div class="sub">${count != null ? `${num(CONFIG.itemLimit - count)} left${left != null ? ` · about ${num(left, 1)} months at ${num(rate)} a month` : ""}` : "board not loaded"}</div></div>
    <div class="kpi"><div class="lbl">Duplicates removed this month</div><div class="val">${evsM.filter((e) => e.duplicateOf).length}</div><div class="sub">${evsM.length} rows logged · ${evsM.filter((e) => !e.duplicateOf).length} unique</div></div>
    <div class="kpi ${repeats.length ? "bad" : "good"}"><div class="lbl">Repeat submissions this month</div><div class="val">${repeats.length}</div><div class="sub">${CONFIG.rules.countRepeatsAsNew ? "counted as new work" : "counted once, at first logging"}</div></div></div>`;
  const weekIssues = [...new Set([...Object.keys(CONFIG.weeks), month])].sort().map((m) => [m, monthWeeks(m).warnings]).filter(([, w]) => w.length);
  const titles = { refresh_error: "Refresh problems", unmapped_group: "KPI items in groups that aren't stages", missing_date: "KPI items with no Completion Date",
    phase_rule_disagreement: "BGE Tune-Up vs BPTU disagreements", phase_check_unavailable: "BGE Tune-Up vs BPTU check", blank_utility: "Blank Utility",
    unknown_utility: "Utility values with no program", impl_past_not_complete: "Past implementation date, not shown as done",
    duplicate_value_conflict: "Duplicates with different dollar values", unparseable_number: "Unreadable dollar values", utility_is_type: "Project types in the Utility field" };
  const order = { error: 0, warning: 1, info: 2 };
  const issues = M.issues.filter((i) => titles[i.kind]).sort((a, b) => order[a.sev] - order[b.sev]);
  h += `<section class="card"><div class="card-h"><h2>Checks</h2><span class="sub">${issues.length + weekIssues.length ? `${issues.length + weekIssues.length} to look at` : "all clear"}</span></div><div style="padding-top:8px">
    ${weekIssues.map(([m, ws]) => `<div class="qrow"><span class="sev error"></span><div><h3>Week setup for ${esc(monthName(m))}</h3><p>${ws.map(esc).join(" ")}</p></div><span></span></div>`).join("")}
    ${issues.map((i) => `<div class="qrow"><span class="sev ${i.sev}"></span><div><h3>${esc(titles[i.kind])}</h3><p>${esc(i.msg)}</p>
      ${i.items && i.items.length ? `<details><summary>Show the ${i.items.length} item${i.items.length > 1 ? "s" : ""}</summary><div class="scroll"><table class="list"><tbody>${i.items.slice(0, 300).map((r) => `<tr><td class="name">${esc(r.name)}</td><td class="small muted">${esc(r.detail)}</td><td style="white-space:nowrap">${itemLink(r.b, r.id)}</td></tr>`).join("")}</tbody></table></div>${i.items.length > 300 ? `<p class="small muted">First 300 shown.</p>` : ""}</details>` : ""}</div>
      <span class="count">${i.items ? i.items.length : ""}</span></div>`).join("") || `<div class="empty">Nothing to fix.</div>`}</div></section>`;
  h += `<section class="card"><div class="card-h"><h2>Duplicates removed</h2><span class="sub">same completion date, project, stage and program · first item kept</span></div><div class="card-b scroll">
    ${dupRows.length ? eventRows(dupRows, true, null) : `<div class="empty">None this month.</div>`}</div></section>`;
  h += `<section class="card"><div class="card-h"><h2>Repeat submissions</h2><span class="sub">same project, program and incentive as an earlier submission</span></div><div class="card-b scroll">
    ${repeats.length ? eventRows(repeats, true, null) : `<div class="empty">None this month.</div>`}</div></section>`;
  return h;
}

/* ---------------------------------- drawer ----------------------------------------------- */
let lastFocus = null;
function openDrawer(d) {
  state.drill = d;
  const { weeks } = monthWeeks(d.month);
  const evs = drillEvents(MODEL, d.stage, d.program, d.month, d.week);
  const counted = evs.filter((e) => e.counted);
  const wl = d.week === "mtd" ? "Month to date" : d.week === "none" ? "Not in any week" : (() => { const w = weeks.find((x) => String(x.index) === d.week); return w ? `Week ${w.index} · ${w.label}` : d.week; })();
  const reason = d.program !== "Total" ? unavailFor(MODEL, d.stage, d.program) : null;
  const dr = $("#drawer");
  dr.innerHTML = `<div class="drawer-h"><div><h2 id="drawerTitle">${esc(STAGE_LABEL[d.stage])} · ${d.program === "Total" ? "All programs" : esc(d.program)}</h2><p>${esc(wl)} · ${esc(monthName(d.month))}</p></div>
      <button type="button" class="iconbtn" id="closeDrawer">Close</button></div>
    <div class="drawer-sum"><span><b>${counted.length}</b> counted</span>${evs.length !== counted.length ? `<span><b>${evs.length}</b> rows in monday</span>` : ""}<span><b>${money(sumOf(counted.map((e) => e.incentive)) || 0)}</b> Incentive</span><span><b>${money(sumOf(counted.map((e) => e.share)) || 0)}</b> HBS Share</span></div>
    ${reason ? `<div class="alert warn" style="margin:12px 20px 0">${ICON.warn}<span>${esc(reason)}</span></div>` : ""}
    ${STAGE_NOTES[d.stage] ? `<p class="small muted" style="margin:10px 20px 0">${esc(STAGE_NOTES[d.stage])}</p>` : ""}
    <div class="drawer-b">${eventRows(evs, false, d.week === "mtd" ? (x) => weekLabelOf(weeks, x) : null)}</div>`;
  lastFocus = document.activeElement;
  dr.hidden = false; $("#backdrop").hidden = false;
  $("#closeDrawer").focus();
}
function closeDrawer() {
  state.drill = null; $("#drawer").hidden = true; $("#backdrop").hidden = true;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* ---------------------------------- page shell ------------------------------------------- */
function renderAlerts() {
  const out = [];
  for (const w of monthWeeks(state.month).warnings) out.push(`<div class="alert bad">${ICON.warn}<span><b>Week setup.</b> ${esc(w)}</span></div>`);
  if (MODEL) for (const i of MODEL.issues.filter((x) => x.kind === "refresh_error")) out.push(`<div class="alert warn">${ICON.warn}<span>${esc(i.msg)}</span></div>`);
  if (ALERT) out.push(ALERT);
  $("#alerts").innerHTML = out.join("");
}
function renderFresh() {
  const stale = !DATA || (MODEL && MODEL.issues.some((x) => x.kind === "refresh_error"));
  $("#fresh").innerHTML = REFRESHING ? `<span class="dot"></span><span>Reading monday.com… ${PROGRESS}%</span>`
    : `<span class="dot ${stale ? "stale" : ""}"></span><span title="${DATA ? "Pulled " + esc(fmtTime(DATA.at)) : ""}">${esc(ago(DATA && DATA.at))}</span>`;
  const btn = $("#refresh");
  btn.disabled = REFRESHING; btn.classList.toggle("spin", REFRESHING);
  $("#loadbar i").style.width = REFRESHING ? `${Math.max(4, PROGRESS)}%` : "0";
}
function render() {
  for (const a of document.querySelectorAll("#nav a")) { if (a.getAttribute("href") === "#" + state.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode));
  renderAlerts(); renderFresh();
  if (!MODEL) return;
  const views = { overview: renderOverview, weekly: renderWeekly, pace: renderPace, submissions: renderSubmissions, aging: renderAging, quality: renderQuality };
  const main = $("#main");
  main.innerHTML = (views[state.view] || renderOverview)();
  main.classList.toggle("busy", REFRESHING);
  if (state.drill && !$("#drawer").hidden) openDrawer(state.drill);
}
function fillMonths() {
  const months = new Set(Object.keys(CONFIG.weeks)); months.add(monthOf(TODAY));
  if (MODEL) for (const e of MODEL.events) if (e.date >= addDays(TODAY, -400) && e.date <= TODAY) months.add(e.month);
  $("#month").innerHTML = [...months].sort().reverse().map((m) => `<option value="${m}" ${m === state.month ? "selected" : ""}>${esc(monthName(m))}</option>`).join("");
}

/* ---------------------------------- loading ---------------------------------------------- */
const CACHE_KEY = "btu-scoreboard-v1";
function loadCache() { try { const s = store.get(CACHE_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function saveCache(d) { try { store.set(CACHE_KEY, JSON.stringify(d)); } catch { /* storage full or blocked: page still works */ } }
function useData(d) { DATA = d; ACCOUNT = d.account || ACCOUNT; TODAY = todayNY(); MODEL = compute(DATA, TODAY); fillMonths(); render(); }

const ERROR_COPY = {
  needs_reauth: "Your monday.com connection has expired. Reconnect monday.com in claude.ai Settings → Connectors, then press Refresh.",
  server_not_connected: "monday.com isn't connected to your Claude account. Add it in claude.ai Settings → Connectors, then press Refresh.",
  selection_required: "You have more than one monday.com connector. Choose which one this page should use when claude.ai asks, then press Refresh.",
  not_in_manifest: "This page isn't allowed to use your monday.com connector. Allow it from the page's Permissions menu, then press Refresh.",
  approval_required: "This page needs your approval to read monday.com. Press Refresh and choose Allow.",
  blocked_by_policy: "Your organisation's policy blocks this page from reading monday.com.",
  not_granted: "Connector access isn't available in this view. Open the page on claude.ai while signed in.",
  capability_disabled: "Connector access isn't available in this view. Open the page on claude.ai while signed in.",
};
function emptyState(title, text) { $("#main").innerHTML = `<section class="card"><div class="empty"><b>${esc(title)}</b>${esc(text)}</div></section>`; }

async function refresh() {
  if (!mcp) {
    ALERT = `<div class="alert info">${ICON.info}<span>Live data needs this page open on claude.ai while you're signed in with monday.com connected.${DATA ? ` Showing your last pull from ${esc(fmtTime(DATA.at))}.` : ""}</span></div>`;
    render(); return;
  }
  REFRESHING = true; PROGRESS = 0; ALERT = null; render();
  const keys = Object.keys(CONFIG.boards);
  const prog = Object.fromEntries(keys.map((k) => [k, [0, 0]]));
  const draw = () => {
    const done = keys.reduce((a, k) => a + prog[k][0], 0), tot = keys.reduce((a, k) => a + (prog[k][1] || 500), 0);
    PROGRESS = Math.min(99, Math.round((done / tot) * 100)); renderFresh();
  };
  const prev = DATA || { boards: {}, errors: {} };
  const next = { at: Date.now(), account: prev.account || null, boards: {}, errors: {} };
  try { const acc = await gql("query { account { slug } }", {}); next.account = acc?.account?.slug || next.account; } catch { /* links fall back to monday.com */ }
  const results = await Promise.allSettled(keys.map((k) => pullBoard(k, (kk, n, t) => { prog[kk] = [n, t]; draw(); })));
  const codes = [];
  results.forEach((r, i) => {
    const k = keys[i];
    if (r.status === "fulfilled") next.boards[k] = { ...r.value, at: next.at };
    else {
      const e = r.reason || {};
      codes.push(e.code);
      next.errors[k] = ERROR_COPY[e.code] || e.message || "unknown error";
      if (prev.boards[k]) next.boards[k] = prev.boards[k];   // keep the last good pull, flagged stale
    }
  });
  REFRESHING = false;
  if (codes.length === keys.length && new Set(codes).size === 1 && ERROR_COPY[codes[0]]) {
    ALERT = `<div class="alert warn">${ICON.warn}<span>${esc(ERROR_COPY[codes[0]])}</span></div>`;
    if (!Object.keys(prev.boards).length) { render(); emptyState("Can't read monday.com yet", ERROR_COPY[codes[0]]); return; }
    render(); return;
  }
  useData(next);
  if (!Object.keys(next.errors).length) saveCache(next);
}

/* ---------------------------------- wiring ----------------------------------------------- */
state.month = monthOf(TODAY);
const VIEWS = ["overview", "weekly", "pace", "submissions", "aging", "quality"];
function fromHash() { const h = (location.hash || "").slice(1); state.view = VIEWS.includes(h) ? h : "overview"; }
fromHash();
try { const p = JSON.parse(store.get("btu-scoreboard-prefs") || "{}"); if (p.mode === "share" || p.mode === "incentive") state.mode = p.mode; if (p.stage && STAGE_LABEL[p.stage]) state.stage = p.stage; } catch { /* defaults */ }
const savePrefs = () => store.set("btu-scoreboard-prefs", JSON.stringify({ mode: state.mode, stage: state.stage }));
window.addEventListener("hashchange", () => { fromHash(); render(); window.scrollTo(0, 0); });
$("#month").addEventListener("change", (e) => { state.month = e.target.value; render(); });
$("#refresh").addEventListener("click", () => refresh());
$("#backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer(); });
document.addEventListener("change", (e) => { if (e.target.id === "showRaw") { state.showRaw = e.target.checked; render(); } });
document.addEventListener("click", (e) => {
  const seg = e.target.closest(".seg button");
  if (seg) { state.mode = seg.dataset.mode; savePrefs(); render(); return; }
  const cell = e.target.closest("[data-drill]");
  if (cell) { openDrawer(JSON.parse(cell.getAttribute("data-drill"))); return; }
  if (e.target.closest("#closeDrawer")) { closeDrawer(); return; }
  const tile = e.target.closest("[data-stage]");
  if (tile) { state.stage = tile.dataset.stage; savePrefs(); location.hash = "weekly"; return; }
  const ps = e.target.closest("[data-pickstage]");
  if (ps) { state.stage = ps.dataset.pickstage; savePrefs(); render(); return; }
  const sb = e.target.closest("[data-substage]");
  if (sb) { state.subStage = sb.dataset.substage; render(); }
});
setInterval(() => { if (!REFRESHING) renderFresh(); }, 60000);

fillMonths();
const cached = loadCache();
if (cached && cached.boards) useData(cached); else render();

(async () => {
  try { mcp = window.claude && typeof window.claude.use === "function" ? await window.claude.use("mcp") : null; } catch { mcp = null; }
  if (!mcp) {
    ALERT = `<div class="alert info">${ICON.info}<span>Live data needs this page open on claude.ai while you're signed in with monday.com connected.${DATA ? ` Showing your last pull from ${esc(fmtTime(DATA.at))}.` : ""}</span></div>`;
    render();
    if (!DATA) emptyState("Open this page on claude.ai", "Sign in to claude.ai with the monday.com connector added, and the scoreboard loads from monday.");
    return;
  }
  // Re-read on every open: closed weeks are never treated as settled.
  refresh();
})();
</script>
