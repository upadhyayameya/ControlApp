        <td><div class="need">${esc(t.need)}</div></td>
        <td class="n num">${t.due ? `${esc(t.due)}${t.overdue ? ` <span class="sev sev-critical">overdue</span>` : ""}` : `<span class="ev">no due date</span>`}</td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;

  return `<div class="section-head"><h2>Workload</h2>
      <span class="hint">The Pre-approval and Closeout boards on monday.com — who is holding what, and how long it has been sitting there.</span></div>
    <div class="stats" style="margin-bottom:6px">
      ${stat(open.length, "Open items")}
      ${stat(pa.length, "Pre-approval")}
      ${stat(co.length, "Closeout")}
      ${stat(rfis.length, "RFIs to answer", "is-critical")}
      ${stat(overdue.length, "Overdue", "is-critical")}
      ${stat(longest == null ? "—" : longest + "d", "Longest wait", "is-serious")}
    </div>
    <p class="ev" style="margin:0 0 4px">${state.workHistory.length} finished rows are also read, and are what the turnaround figures below are measured from.
    The boards' PA Lead, Utility and Status columns are mirrors, which cannot be read through the connector — those values come from the Master TU Tracker through the relation column instead.</p>
    ${rfiSection}
    ${queueSection}
    ${turnSection}
    ${listSection}`;
}

/* ---------------------------------------------------------------------------
   Why the goal is being missed.

   Five explanations get offered whenever a month comes up short: too many
   audits, no time left for pre-approvals and closeouts, too many RFIs, not
   enough audits coming in, and the goal being unreachable in the first place.
   They cannot all be true, and some of them are usually false.

   Each one is tested here against a number the boards can produce, and each
   card states the rule it was judged by so the verdict can be argued with.
   Where the boards cannot answer, the card says so rather than guessing — a
   confident wrong diagnosis costs more than an honest gap.
--------------------------------------------------------------------------- */
const MONTH_KEY = s => (s && s.length >= 7 ? s.slice(0, 7) : "");
const monthLabel = k => {
  const [y, m] = k.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "short", year: "2-digit" });
};

/* One row per calendar month, counting the milestones the pipeline actually
   recorded. Built from the project dates rather than the KPI board so that it
   agrees with the cycle-time legs above — the KPI board also carries partner
   firms' work, which would inflate every count here. */
function monthlyFlow(projects, months) {
  const keys = new Set();
  const bump = (map, k, f) => { if (!k) return; keys.add(k); map[k] = map[k] || {}; map[k][f] = (map[k][f] || 0) + 1; };
  const m = {};
  for (const p of projects) {
    bump(m, MONTH_KEY(p.evDates.dAudit), "audit");
    bump(m, MONTH_KEY(p.evDates.dSubPA), "paSub");
    bump(m, MONTH_KEY(p.evDates.dPAd), "paRcv");
    bump(m, MONTH_KEY(p.evDates.dImpl), "impl");
    bump(m, MONTH_KEY(p.evDates.dSubCO), "coSub");
    bump(m, MONTH_KEY(p.evDates.dCOd), "coRcv");
  }
  const now = new Date();
  const out = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    out.push({ k, label: monthLabel(k), ...{ audit: 0, paSub: 0, paRcv: 0, impl: 0, coSub: 0, coRcv: 0 }, ...(m[k] || {}) });
  }
  return out;
}

const sumField = (rows, f) => rows.reduce((a, r) => a + (r[f] || 0), 0);
const avgField = (rows, f) => (rows.length ? sumField(rows, f) / rows.length : 0);

function renderGoals() {
  const all = state.projects;
  if (!all.length) return `<div class="panel empty">No projects have loaded yet.</div>`;
  const live = all.filter(p => lifecycle(p) === "active");

  /* Complete months only. The month in progress is always short simply because
     it has not finished, and comparing it with finished months would
     manufacture a shortfall that is really just the calendar. */
  const flowAll = monthlyFlow(all, 14);
  const flow = flowAll.slice(0, -1);
  const recent = flow.slice(-3);
  const prior = flow.slice(-6, -3);
  const partial = flowAll[flowAll.length - 1];

  /* ---- the benchmark ----
     monday holds no goal column anywhere, so there is no target to read. The
     benchmark used here is the best complete month the team has actually
     delivered: it is beyond argument that it is achievable, because it has
     been achieved. Type a real goal in and every verdict below re-judges. */
  const bestPaRcv = Math.max(0, ...flow.map(r => r.paRcv));
  const goal = state.goals && state.goals.paRcv != null ? state.goals.paRcv : bestPaRcv;
  const lastFull = flow[flow.length - 1] || { paRcv: 0, label: "—" };
  const gap = goal - lastFull.paRcv;

  /* ---- the evidence each verdict draws on ---- */
  const legStat = Object.fromEntries(LEGS.map(l => [l.key, legStats(all, l)]));

  const auditedNotSubmitted = live.filter(p => p.evDates.dAudit && !p.evDates.dSubPA);
  const submittedNotBack    = live.filter(p => p.evDates.dSubPA && !p.evDates.dPAd);
  const implNotClosedOut    = live.filter(p => p.evDates.dImpl && !p.evDates.dSubCO);

  const RFI_RE = /RFI|Flawed/i;
  const rfiNow = live.filter(p => RFI_RE.test(p.tuStatus || "") || RFI_RE.test(p.icfStatus || ""));
  const rfiQueue = state.workloadLoaded ? state.todos.filter(t => t.rfiQueue) : [];

  const auditsRecent = avgField(recent, "audit"), auditsPrior = avgField(prior, "audit");
  const subsRecent = avgField(recent, "paSub");
  const coRecent = avgField(recent, "coSub"), coPrior = avgField(prior, "coSub");

  /* ---- the five claims ---- */
  const pctChange = (a, b) => (b ? Math.round(((a - b) / b) * 100) : null);
  const V = { yes: "Supported", no: "Not supported", unknown: "Not enough data" };

  /* A percentage swing off one or two projects is noise wearing a trend's
     clothes: one audit becoming none is a hundred per cent drop and means
     nothing. No verdict is declared unless there is a real month's work
     underneath it, and no leg is judged on fewer than ten measured projects. */
  const MIN_MONTHLY = 3, MIN_MEASURED = 10;
  const thinFlow = auditsRecent < MIN_MONTHLY && auditsPrior < MIN_MONTHLY;
  const thin = n => n < MIN_MEASURED;

  const claims = [];

  /* 1. too many audits */
  {
    const ratio = subsRecent ? auditsRecent / subsRecent : null;
    const verdict = (ratio == null || thinFlow) ? V.unknown
      : (ratio > 1.1 && auditedNotSubmitted.length > auditsRecent) ? V.yes : V.no;
    claims.push({
      claim: "Way too many audits",
      verdict,
      headline: `${auditedNotSubmitted.length} audited, not yet submitted`,
      rule: "Supported when audits are running more than 10% ahead of pre-approval submissions and the audited-but-unsubmitted pile is bigger than a month of audits.",
      evidence: [
        `Last three complete months: ${auditsRecent.toFixed(0)} audits a month against ${subsRecent.toFixed(0)} pre-approvals submitted.`,
        ratio == null ? "No submissions recorded, so the ratio cannot be formed."
          : `That is ${ratio.toFixed(2)} audits for every submission.`,
        `${auditedNotSubmitted.length} live project${auditedNotSubmitted.length === 1 ? " has" : "s have"} an audit date and no submission date.`,
        legStat.audit.n
          ? `Half of them reach submission within ${legStat.audit.median} days, but the slowest tenth take ${legStat.audit.p90} — ${legStat.audit.n} measured.`
          : "No project has both an audit date and a submission date, so the leg cannot be timed.",
      ],
    });
  }

  /* 2. no time for PA / closeout work */
  {
    const s = legStat.audit, c = legStat.closeout;
    const tail = s.median ? s.p90 / s.median : null;
    const coFell = pctChange(coRecent, coPrior);
    const verdict = (tail == null || thin(s.n)) ? V.unknown
      : (tail >= 3 || (coFell != null && !thinFlow && coFell <= -25)) ? V.yes : V.no;
    claims.push({
      claim: "No time to work on pre-approvals and closeouts",
      verdict,
      headline: tail == null ? "not measurable" : `slowest tenth take ${Math.round(tail)}× the median`,
      rule: "Supported when the slow tail on an HBS leg is three times its median — work started and then left — or when closeout submissions have dropped by a quarter.",
      evidence: [
        s.n ? `Audit to submission: median ${s.median} days, slowest tenth ${s.p90} days, across ${s.n} projects.`
            : "Audit to submission cannot be timed on the current data.",
        c.n ? `Implementation to closeout submitted: median ${c.median} days, slowest tenth ${c.p90} days, across ${c.n} projects.`
            : "Implementation to closeout cannot be timed on the current data.",
        coFell == null ? "No closeout submissions in the earlier three months to compare against."
          : `Closeout submissions ${coFell < 0 ? "fell" : "rose"} ${Math.abs(coFell)}% over the last three months (${coPrior.toFixed(0)} to ${coRecent.toFixed(0)} a month) while audits ${auditsPrior ? (auditsRecent >= auditsPrior ? "rose" : "fell") : "ran"} ${auditsPrior ? Math.abs(pctChange(auditsRecent, auditsPrior)) + "%" : ""}.`,
        `${implNotClosedOut.length} implemented project${implNotClosedOut.length === 1 ? "" : "s"} ${implNotClosedOut.length === 1 ? "is" : "are"} waiting for a closeout package.`,
      ],
    });
  }

  /* 3. RFI load */
  {
    const share = live.length ? rfiNow.length / live.length : 0;
    const verdict = live.length < MIN_MEASURED ? V.unknown : share >= 0.1 ? V.yes : V.no;
    claims.push({
      claim: "A lot of RFIs",
      verdict,
      headline: `${rfiNow.length} of ${live.length} live projects (${Math.round(share * 100)}%)`,
      rule: "Supported when more than one live project in ten is sitting in an RFI or flawed state.",
      evidence: [
        `${rfiNow.length} live project${rfiNow.length === 1 ? " is" : "s are"} in an RFI or flawed status right now.`,
        state.workloadLoaded
          ? `${rfiQueue.length} row${rfiQueue.length === 1 ? "" : "s"} sit in the shared "RFI's to Answer" queue across the two workload boards${rfiQueue.length ? `, the oldest waiting ${Math.max(...rfiQueue.map(t => t.waiting || 0))} days` : ""}.`
          : `Open the Workload tab to also count the shared RFI queue on the two workload boards.`,
        `An RFI does not stop the clock: these projects keep ageing inside whichever leg they were in.`,
      ],
    });
  }

  /* 4. audit supply */
  {
    const ch = pctChange(auditsRecent, auditsPrior);
    const verdict = (ch == null || thinFlow) ? V.unknown : ch <= -15 ? V.yes : V.no;
    claims.push({
      claim: "Not many audits coming in",
      verdict,
      headline: ch == null ? "no earlier months to compare" : `${ch > 0 ? "+" : ""}${ch}% over three months`,
      rule: "Supported when audits performed have fallen by 15% or more against the previous three months.",
      evidence: [
        `Last three complete months averaged ${auditsRecent.toFixed(0)} audits a month; the three before them averaged ${auditsPrior.toFixed(0)}.`,
        ch != null && ch > 0
          ? `Audits are rising, not falling, so a shortfall this month is not explained by the work coming in.`
          : ch != null ? `That is the drop this claim needs.` : ``,
        `${live.filter(p => !p.evDates.dAudit).length} live project${live.filter(p => !p.evDates.dAudit).length === 1 ? " has" : "s have"} no audit date yet — the pool an audit month is drawn from.`,
      ].filter(Boolean),
    });
  }

  /* 5. the goal itself */
  {
    const everHit = flow.filter(r => r.paRcv >= goal).length;
    const median = [...flow.map(r => r.paRcv)].sort((a, b) => a - b)[flow.length >> 1] || 0;
    const verdict = (!flow.length || bestPaRcv < MIN_MONTHLY) ? V.unknown : everHit === 0 ? V.yes : V.no;
    claims.push({
      claim: "The goal is too far fetched",
      verdict,
      headline: everHit ? `hit in ${everHit} of the last ${flow.length} months` : `never hit in ${flow.length} months`,
      rule: "Supported when the goal has not been reached in any complete month on record.",
      evidence: [
        `The goal in use is ${goal} pre-approvals received a month.`,
        `Best complete month on record: ${bestPaRcv}. Typical month: ${median}.`,
        everHit
          ? `It has been reached ${everHit} time${everHit === 1 ? "" : "s"} in ${flow.length} months, so it is reachable — the question is what changed.`
          : `No complete month has reached it, so either the goal or the way the work runs has to change.`,
        legStat.pa.n
          ? `Reaching it also depends on ICF: a submission takes a median ${legStat.pa.median} days to come back, and the slowest tenth take ${legStat.pa.p90}. Submissions made this month largely land next month.`
          : ``,
      ].filter(Boolean),
    });
  }

  /* ---- render ---- */
  const tone = v => v === V.yes ? "critical" : v === V.no ? "good" : "none";
  const stat = (v, l, cls) => `<div class="stat ${v ? (cls || "") : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;

  const maxFlow = Math.max(1, ...flow.flatMap(r => [r.audit, r.paSub, r.paRcv, r.coSub, r.coRcv]));
  const flowCell = (n) => {
    const pct = Math.round((n / maxFlow) * 100);
    return `<td class="n num"><span class="flowbar" style="--w:${pct}%">${n || "·"}</span></td>`;
  };

  return `<div class="section-head"><h2>Why the goal is being missed</h2>
      <span class="hint">Each explanation tested against the boards. The rule behind every verdict is stated, so it can be argued with.</span></div>

    <div class="stats" style="margin-bottom:8px">
      ${stat(goal, "Monthly goal (PAs received)")}
      ${stat(lastFull.paRcv, `Last complete month (${lastFull.label})`, gap > 0 ? "is-critical" : "is-good")}
      ${stat(gap > 0 ? "-" + gap : "+" + Math.abs(gap), "Gap", gap > 0 ? "is-critical" : "is-good")}
      ${stat(partial ? partial.paRcv : 0, `${partial ? partial.label : ""} so far`)}
      ${stat(claims.filter(c => c.verdict === V.yes).length, "Explanations that hold", "is-critical")}
    </div>
    <p class="ev" style="margin:0 0 18px">monday holds no goal column on any board, so there is nothing to read a target from.
    The benchmark above is the best complete month the pipeline has actually delivered &mdash; achievable by definition, because it happened.
    <label style="margin-left:8px">Use a different monthly goal:
      <input type="number" id="g-goal" min="0" step="1" value="${goal}" style="width:6.5em"></label></p>

    <div class="claims">${claims.map(c => `
      <div class="claim claim-${tone(c.verdict)}">
        <div class="claim-hd">
          <span class="claim-q">&ldquo;${esc(c.claim)}&rdquo;</span>
          <span class="sev sev-${tone(c.verdict) === "none" ? "none" : tone(c.verdict)}">${esc(c.verdict)}</span>
          <span class="claim-n num">${esc(c.headline)}</span>
        </div>
        <ul class="claim-ev">${c.evidence.map(e => `<li>${esc(e)}</li>`).join("")}
          ${c.verdict === V.unknown ? `<li><b>Not judged:</b> there is too little recorded here for a percentage to mean anything &mdash;
            a verdict needs at least ${MIN_MONTHLY} a month, or ${MIN_MEASURED} measured projects on a leg.</li>` : ""}</ul>
        <div class="claim-rule">${esc(c.rule)}</div>
      </div>`).join("")}</div>

    <div class="section-head"><h2>Where the time goes</h2>
      <span class="hint">Each leg as you defined it, and whose clock it is. A leg only counts when both dates are recorded.</span></div>
    <div class="panel scroller"><table><thead><tr>
      <th>Leg</th><th>Whose clock</th><th class="n">Median</th><th class="n">Mean</th>
      <th class="n">Slowest 10%</th><th class="n">Measured</th><th>What it is</th>
    </tr></thead><tbody>
    ${LEGS.map(l => {
      const s = legStat[l.key];
      return `<tr>
        <td><b>${esc(l.label)}</b></td>
        <td><span class="chip ${l.owner === "ICF" ? "chip-icf" : l.owner === "HBS" ? "chip-hbs" : ""}">${esc(l.owner)}</span></td>
        <td class="n num">${s.median == null ? `<span class="ev">—</span>` : s.median + "d"}</td>
        <td class="n num">${s.mean == null ? `<span class="ev">—</span>` : Math.round(s.mean) + "d"}</td>
        <td class="n num">${s.p90 == null ? `<span class="ev">—</span>` : s.p90 + "d"}</td>
        <td class="n num">${s.n}${s.bad ? ` <span class="ev">(+${s.bad} unusable)</span>` : ""}</td>
        <td class="who">${esc(l.blurb)}</td>
      </tr>`;
    }).join("")}
    <tr>
      <td><b>Implementation scheduled &rarr; team on site</b></td>
      <td><span class="chip chip-hbs">HBS</span></td>
      <td class="n num" colspan="4"><span class="sev sev-warning">cannot be measured</span></td>
      <td class="who">The TU tracker carries one Implementation Date, not a scheduled date and an actual one.
        Add a second date column and this leg fills in by itself.</td>
    </tr>
    </tbody></table></div>

    <div class="section-head"><h2>Month by month</h2>
      <span class="hint">Where the funnel narrows. ${esc(partial ? partial.label : "")} is still running, so it is shown separately.</span></div>
    <div class="panel scroller"><table><thead><tr>
      <th>Month</th><th class="n">Audits</th><th class="n">PA submitted</th><th class="n">PA received</th>
      <th class="n">Implemented</th><th class="n">CO submitted</th><th class="n">CO received</th>
    </tr></thead><tbody>
    ${flow.map(r => `<tr>
      <td>${esc(r.label)}</td>${flowCell(r.audit)}${flowCell(r.paSub)}${flowCell(r.paRcv)}${flowCell(r.impl)}${flowCell(r.coSub)}${flowCell(r.coRcv)}
    </tr>`).join("")}
    ${partial ? `<tr class="partial">
      <td>${esc(partial.label)} <span class="ev">so far</span></td>
      ${flowCell(partial.audit)}${flowCell(partial.paSub)}${flowCell(partial.paRcv)}${flowCell(partial.impl)}${flowCell(partial.coSub)}${flowCell(partial.coRcv)}
    </tr>` : ""}
    </tbody></table></div>
    <p class="ev" style="margin-top:8px">Counted from the dates on the projects themselves, not the Monthly KPIs board.
    That board also carries partner firms' milestones, which would inflate every figure here.</p>`;
}

/* ---- team to-dos: one card per HBS person ---- */
function renderTodos() {
  if (state.workloadLoading) return `<div class="skel"><span class="spin"></span>Reading the Preapproval and Closeout workload boards…</div>`;
  if (state.errors.workload) return errNote("Workload boards", state.errors.workload, MONDAY);
  if (!state.todos.length) return `<div class="panel empty">No open items on either workload board.</div>`;

  const byPerson = new Map();
  for (const t of state.todos) {
    const key = t.person || RFI_GROUP;
    if (!byPerson.has(key)) byPerson.set(key, []);
    byPerson.get(key).push(t);
  }
  const people = [...byPerson.entries()]
    .sort((a, b) => (a[0] === RFI_GROUP ? -1 : b[0] === RFI_GROUP ? 1 : 0) ||
                    b[1].filter(t => t.overdue).length - a[1].filter(t => t.overdue).length || b[1].length - a[1].length);

  const totalOverdue = state.todos.filter(t => t.overdue).length;
  const noDue = state.todos.filter(t => !t.due).length;

  const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;

  return `<div class="section-head"><h2>Team to-dos</h2>
    <span class="hint">Straight from the Preapproval and Closeout workload boards, where each item already sits in its owner's group.</span></div>
    <div class="stats" style="margin-bottom:16px">
      ${stat(state.todos.length, "Open items", "")}
      ${stat(people.length, "People", "")}
      ${stat(totalOverdue, "Overdue", "is-critical")}
      ${stat(noDue, "No due date", "is-serious")}
    </div>
    <div class="cards">${people.map(([person, items]) => {
      const overdue = items.filter(t => t.overdue).length;
      const soon = items.filter(t => !t.overdue && t.due).length;
      const undated = items.filter(t => !t.due).length;
      return `<div class="card">
        <div class="card-hd">
          <span class="avatar">${esc((person === RFI_GROUP ? "RFI" : person).split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase())}</span>
          <span class="nm">${esc(person)}</span>
          ${person === RFI_GROUP ? `<span class="chip chip-hbs">shared queue</span>` : `<span class="chip chip-hbs">HBS</span>`}
          <span class="to">${items.length} open</span>
        </div>
        <div class="card-bd">
          <div class="stats">
            ${stat(items.length, "Open", "")}
            ${stat(overdue, "Overdue", "is-critical")}
            ${stat(soon, "Dated", "")}
            ${stat(undated, "No due date", "is-serious")}
          </div>
          ${todoTable(items)}
        </div>
      </div>`;
    }).join("")}</div>`;
}

/* ---- ASAP: what needs an update right now ---- */
const WATCH_BUCKETS = [
  { key: "implDone", title: "Implementation completed", hint: "Implementation and M&V are done — the closeout package is now owed.",
    test: p => p.tuStatus === "Implementation & MV Complete" },
  { key: "cd", title: "CD to submit", hint: "Closeout documentation is ready to go in.",
    test: p => p.tuStatus === "CD to Submit" },
  { key: "flawed", title: "Flawed", hint: "Rejected in the utility portal — must be corrected and resubmitted.",
    test: p => /Flawed|FLAWED/.test(p.tuStatus + " " + p.icfStatus) },
  { key: "rfi", title: "RFI received", hint: "ICF or TRC has asked a question and is waiting on HBS.",
    test: p => p.tuStatus === "TRC/ICF RFI Received" || p.icfStatus === "RFI Sent to HBS" || p.icfStatus === "RFI Respond by HBS" },
];

function renderAsap(list) {
  const ranked = [...list].sort((a, b) => b.priority - a.priority);
  const urgent = ranked.filter(p => p.band === "critical");
  const soon = ranked.filter(p => p.band === "serious");
  const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;

  let out = `<div class="section-head"><h2>Needs an update now</h2>
    <span class="hint">Ranked automatically from what the boards say is owed, how long it has sat, and whether anyone owns it.</span></div>
    <div class="stats" style="margin-bottom:16px">
      ${stat(urgent.length, "Urgent", "is-critical")}
      ${stat(soon.length, "Soon", "is-serious")}
      ${WATCH_BUCKETS.map(b => stat(list.filter(b.test).length, b.title, "")).join("")}
    </div>`;

  out += `<div class="section-head"><h2>Top priority</h2><span class="hint">Highest score first — hover a score to see why it ranked</span>
    <span class="hint num" style="margin-left:auto">${urgent.length}</span></div>` + ptable(urgent.slice(0, 50), { priority: true });

  for (const b of WATCH_BUCKETS) {
    const rows = ranked.filter(b.test);
    out += `<div class="section-head"><h2>${esc(b.title)}</h2><span class="hint">${esc(b.hint)}</span>
      <span class="hint num" style="margin-left:auto">${rows.length}</span></div>` + ptable(rows, { priority: true });
  }

  const noTu = list.filter(p => !p.hasTu);
  if (noTu.length) {
    out += `<div class="section-head"><h2>Not linked to the Master TU Tracker</h2>
      <span class="hint">No SOW, audit or implementation dates can be read for these — the link is missing on the board.</span>
      <span class="hint num" style="margin-left:auto">${noTu.length}</span></div>` + ptable(noTu.slice(0, 40), {});
  }
  return out;
}

/* ---------------------------------------------------------------------------
   Phase boards: audits, pre-approvals and closeouts share one shape —
   what is in flight, when it is dated, who leads it, what it still needs.
--------------------------------------------------------------------------- */
const PA_STATUSES = ["Audit Phase Complete", "PA Submitted", "PA Received", "Sent for Review/QAQC",
  "Review sent back for corrections", "Signed PA/RA Needed", "Signed SOW Received"];
const CO_STATUSES = ["Implementation & MV Complete", "CD to Submit", "CO Submitted", "CO Received",
  "CO Processed/Need Signed PA/RA"];

const PHASE_VIEWS = {
  audits: {
    label: "Audits",
    hint: "Every project in or around the audit phase.",
    test: p => p.phase === "Audit Phase" || p.current === "scheduled" || p.current === "audited" ||
      ["Audit Ready to Schedule", "Scheduled", "Re-Audit Needed", "Audit Phase Complete"].includes(p.tuStatus),
    dateLabel: "Audit date",
    dateOf: p => p.evDates.dAudit,
    doneLabel: "Audited",
    doneOf: p => (p.evDates.dAudit && dparse(p.evDates.dAudit) <= new Date() ? p.evDates.dAudit : ""),
    leadLabel: "Auditor",
    leadOf: p => p.auditor,
    inPeriodLabel: "Audits this period",
    gaps: p => {
      const g = [];
      if (!p.evDates.dAudit) g.push("no audit date");
      if (!p.auditor.length && !p.hbsEngs.length) g.push("no auditor");
      if (!p.hasTu) g.push("not linked to TU tracker");
      if (!p.utility) g.push("no utility");
      if (!p.type) g.push("no project type");
      return g;
    },
  },
  preapprovals: {
    label: "Pre-approvals",
    hint: "Applications being built, submitted or reviewed by ICF.",
    test: p => p.phase === "Pre-Approval Phase" || PA_STATUSES.includes(p.tuStatus) ||
      ["Pre-approval", "Technical Review", "Post-Tech Review", "ARC", "Flawed", "Flawed ARC"].includes(p.icfStatus),
    dateLabel: "Submitted for PA",
    dateOf: p => p.evDates.dSubPA,
    doneLabel: "Pre-approved",
    doneOf: p => p.evDates.dPAd,
    leadLabel: "PA lead",
    leadOf: p => p.paLead,
    inPeriodLabel: "Submitted this period",
    gaps: p => {
      const g = [];
      if (!p.evDates.dSubPA) g.push("no submission date");
      if (!p.paLead.length && !p.hbsEngs.length) g.push("no PA lead");
      if (!p.icfEngs.length) g.push("no ICF reviewer");
      if (p.incentive == null) g.push("no incentive figure");
      if (!p.hasTu) g.push("not linked to TU tracker");
      return g;
    },
  },
  closeouts: {
    label: "Closeouts",
    hint: "Implementation done or nearly done, and the closeout package in flight.",
    test: p => p.phase === "Closeout Phase" || CO_STATUSES.includes(p.tuStatus) ||
      ["Site Inspection Pending", "Site Inspection Scheduled", "Site Inspection Completed"].includes(p.icfStatus),
    dateLabel: "Submitted for CO",
    dateOf: p => p.evDates.dSubCO,
    doneLabel: "Closed out",
    doneOf: p => p.evDates.dCOd,
    leadLabel: "CO lead",
    leadOf: p => p.coLead,
    inPeriodLabel: "Submitted this period",
    gaps: p => {
      const g = [];
      if (!p.evDates.dSubCO) g.push("no CO submission date");
      if (!p.coLead.length && !p.hbsEngs.length) g.push("no CO lead");
      if (!p.evDates.dImpl) g.push("no implementation date");
      if (p.incentive == null) g.push("no incentive figure");
      if (!p.hasTu) g.push("not linked to TU tracker");
      return g;
    },
  },
};

function renderPhases(list) {
  const key = PHASE_VIEWS[state.phaseTab] ? state.phaseTab : "audits";
  const V = PHASE_VIEWS[key];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const r = periodRange(state.period, new Date());

  const rows = list.filter(V.test).map(p => {
    const when = V.dateOf(p);
    const done = V.doneOf(p);
    const d = when ? dparse(when) : null;
    return {
      p, when, done,
      upcoming: !!(d && d >= today),
      inPeriod: inRange(d, r.start, r.end) || inRange(done ? dparse(done) : null, r.start, r.end),
      gaps: V.gaps(p),
    };
  }).sort((a, b) => b.p.priority - a.p.priority || String(a.when || "9999").localeCompare(String(b.when || "9999")));

  const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;

  const subtabs = `<div class="segmented" role="group" aria-label="Phase" style="margin-bottom:14px">
    ${Object.entries(PHASE_VIEWS).map(([k, v]) =>
      `<button data-phasetab="${k}" aria-pressed="${k === key}">${esc(v.label)} <span class="num" style="opacity:.7">${list.filter(v.test).length}</span></button>`).join("")}
  </div>`;

  return `<div class="section-head"><h2>${esc(V.label)} in flight</h2><span class="hint">${esc(V.hint)}</span></div>
    ${subtabs}
    <div class="stats" style="margin-bottom:16px">
      ${stat(rows.length, "In flight", "")}
      ${stat(rows.filter(x => x.inPeriod).length, V.inPeriodLabel, "is-good")}
      ${stat(rows.filter(x => x.upcoming).length, "Dated ahead", "")}
      ${stat(rows.filter(x => !x.when).length, "No date set", "is-critical")}
      ${stat(rows.filter(x => x.gaps.length).length, "Missing info", "is-serious")}
    </div>
    <div class="panel scroller tall"><table><thead><tr>
      <th>Project</th><th class="n">Pri</th><th>${esc(V.dateLabel)}</th><th>${esc(V.doneLabel)}</th>
      <th>Status</th><th>Next step</th><th>${esc(V.leadLabel)}</th><th>Is the info here?</th>
    </tr></thead><tbody>${rows.map(({ p, when, done, upcoming, inPeriod, gaps }) => `<tr>
      <td><div class="proj-name">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}</div>
          <div class="ev">${esc([p.utility ? utilityLabel(p.utility) : "", p.type].filter(Boolean).join(" · "))}</div></td>
      <td class="n"><span class="cell num ${p.band === "critical" ? "m5" : p.band === "serious" ? "m4" : p.band === "warning" ? "m2" : "m0"}" title="${esc(p.priorityWhy.join("; "))}">${p.priority}</span></td>
      <td class="num">${when
        ? `${esc(when)}${upcoming ? ` <span class="sev sev-good">ahead</span>` : ""}${inPeriod ? ` <span class="chip">this period</span>` : ""}`
        : `<span class="sev sev-critical">${sevIcon("critical")}not set</span>`}</td>
      <td class="num">${done ? esc(done) : `<span class="ev">—</span>`}</td>
      <td>${esc(p.tuStatus || p.icfStatus || "—")}</td>
      <td><div class="need">${esc(p.need)}</div>${p.evidence ? `<div class="ev"><b>Latest:</b> ${esc(p.evidence.slice(0, 130))}</div>` : ""}</td>
      <td>${V.leadOf(p).length ? `<span class="who">${esc(V.leadOf(p).join(", "))}</span>` : ownerCell(p)}</td>
      <td>${gaps.length
        ? `<span class="sev sev-serious">${sevIcon("serious")}${gaps.length} gap${gaps.length > 1 ? "s" : ""}</span><div class="ev">${esc(gaps.join(", "))}</div>`
        : `<span class="sev sev-good">${sevIcon("good")}complete</span>`}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* Placeholder assignments on the board are not people — never address a digest to one. */
const NOT_A_PERSON = new Set(["TBD", "N/A", "NONE", "None", "---"]);

/* ---------------------------------------------------------------------------
   ICF isolation.

   The ICF/HBS Project Tracker is the board ICF already shares with us. The
   Master TU Tracker is HBS-internal: it carries SOW commercials (Rahl's, the
   client, CGS), internal QA/QC states, deal owners and a running admin-notes
   log. Teams messages, Fireflies notes and calendar invites are internal too.

   So the rule is drawn at the source, not field by field: anything bound for
   ICF may use ONLY the shared ICF board, plus the project's identity. Nothing
   from the TU tracker, no free text, no chatter, no money. It is a whitelist,
   so a column added to the TU board later cannot leak by default.
--------------------------------------------------------------------------- */
function icfSafeView(p) {
  return {
    name: p.name,
    projectId: p.projectId,
    utility: p.utility ? utilityLabel(p.utility) : "",
    type: p.type,
    phase: p.phase,
    status: p.icfStatus,
    submittedPA: p.evDates.dSubPA,
    paDate: p.evDates.dPAd,
    submittedCO: p.evDates.dSubCO,
    coDate: p.evDates.dCOd,
    nextActionDate: p.nextActionDate,
    ecd: p.ecd,
    /* Derived from the shared board's own status column only. */
    need: ICF_ACTIONS[p.icfStatus] ? ICF_ACTIONS[p.icfStatus].need : "",
    withHbs: !!(ICF_ACTIONS[p.icfStatus] && ICF_ACTIONS[p.icfStatus].role === "hbs"),
  };
}

function icfDigestBody(name, mine) {
  const rows = mine.map(icfSafeView);
  const onIcf = rows.filter(r => r.need && !r.withHbs);
  const onHbs = rows.filter(r => r.withHbs);
  const quiet = rows.filter(r => !r.need);

  const L = [];
  L.push(`Hi ${/\s/.test(name) ? name.split(" ")[0] : name},`, "");
  L.push(`Here is the current state of the HBS projects assigned to you, as of ${new Date().toLocaleDateString(undefined, { dateStyle: "medium" })}.`, "");
  L.push(`${rows.length} project${rows.length === 1 ? "" : "s"}.`);
  const line = r => `  • ${r.name}${r.projectId ? ` (${r.projectId})` : ""} — ${r.status || r.phase}`;
  if (onIcf.length) {
    L.push("", `WITH ICF (${onIcf.length})`);
    for (const r of onIcf) { L.push(line(r)); L.push(`      ${r.need}`); }
  }
  if (onHbs.length) {
    L.push("", `WITH HBS — WE OWE YOU A RESPONSE (${onHbs.length})`);
    for (const r of onHbs) { L.push(line(r)); L.push(`      ${r.need}`); }
  }
  if (quiet.length) {
    L.push("", `NO OPEN ACTION (${quiet.length})`);
    for (const r of quiet) L.push(line(r));
  }
  L.push("", "Dates on record:");
  for (const r of rows.filter(r => r.submittedPA || r.paDate || r.submittedCO || r.coDate)) {
    const bits = [];
    if (r.submittedPA) bits.push(`PA submitted ${r.submittedPA}`);
    if (r.paDate) bits.push(`PA'd ${r.paDate}`);
    if (r.submittedCO) bits.push(`CO submitted ${r.submittedCO}`);
    if (r.coDate) bits.push(`CO'd ${r.coDate}`);
    L.push(`  • ${r.name} — ${bits.join(", ")}`);
  }
  L.push("", "Automated from the shared ICF/HBS Project Tracker.");
  return L.join("\n");
}

/* Splits one engineer's projects into the buckets the digest is built from. */
function digestFor(name, org, list) {
  if (NOT_A_PERSON.has(name)) return null;
  const mine = list.filter(p => (org === "ICF" ? p.icfEngs : p.hbsAll).includes(name));
  if (!mine.length) return null;
  const r = periodRange("week", new Date());
  const owns = p => !p.ownerNames.length || p.ownerNames.includes(name);

  const moved   = mine.filter(p => STAGES.some(s => inRange(p.ev[s.key], r.start, r.end)));
  const yours   = mine.filter(p => (p.sev === "critical" || p.sev === "serious") && owns(p));
  const waiting = mine.filter(p => p.sev === "critical" && !owns(p));
  const ageing  = mine.filter(p => p.aging === "Critical" && !yours.includes(p) && !waiting.includes(p));
  const rest    = mine.filter(p => !yours.includes(p) && !waiting.includes(p) && !ageing.includes(p));

  const byStage = {};
  for (const s of STAGES) byStage[s.key] = 0;
  for (const p of mine) if (p.current) byStage[p.current]++;

  const movedStages = new Map();
  for (const p of moved) movedStages.set(p, STAGES.filter(s => inRange(p.ev[s.key], r.start, r.end)).map(s => s.label).join(", "));

  let text;
  if (org === "ICF") {
    text = icfDigestBody(name, mine);
  } else {
    const L = [];
    L.push(`Hi ${/\s/.test(name) ? name.split(" ")[0] : name},`, "");
    L.push(`Here is where your HBS tune-up projects stand as of ${new Date().toLocaleDateString(undefined, { dateStyle: "medium" })}.`, "");
    L.push(`You have ${mine.length} active project${mine.length === 1 ? "" : "s"}.`);
    const anyStage = STAGES.filter(s => byStage[s.key]);
    if (anyStage.length) {
      L.push("", "WHERE THEY SIT");
      for (const s of anyStage) L.push(`  ${s.label}: ${byStage[s.key]}`);
    }
    if (moved.length) {
      L.push("", `MOVED THIS WEEK (${moved.length})`);
      for (const p of moved) L.push(`  • ${p.name} — ${movedStages.get(p)}`);
    }
    if (yours.length) {
      L.push("", `NEEDS YOUR ACTION (${yours.length})`);
      for (const p of yours) {
        L.push(`  • ${p.name}`, `      ${p.need}`);
        if (p.evidence) L.push(`      Latest: ${p.evidence.slice(0, 160)}`);
      }
    }
    if (waiting.length) {
      L.push("", `WAITING ON SOMEONE ELSE (${waiting.length})`);
      for (const p of waiting) L.push(`  • ${p.name} — ${p.need} (with ${p.ownerNames.join(", ")})`);
    }
    if (ageing.length) {
      L.push("", `AGEING PAST 60 DAYS (${ageing.length})`);
      for (const p of ageing) L.push(`  • ${p.name} — ${p.daysInPhase == null ? "?" : p.daysInPhase} days in ${p.phase} — ${p.need}`);
    }
    if (rest.length) {
      L.push("", `EVERYTHING ELSE (${rest.length})`);
      for (const p of rest) L.push(`  • ${p.name} — ${p.need}${p.ownerNames.length && !p.ownerNames.includes(name) ? ` (with ${p.ownerNames.join(", ")})` : ""}`);
    }
    L.push("", "— Sent automatically from the ICF × HBS pipeline tracker.");
    text = L.join("\n");
  }

  return { name, org, count: mine.length, owed: yours.length, ageingCount: ageing.length, movedCount: moved.length,
           byStage, moved, movedStages, yours, waiting, ageing, rest, mine, text };
}

/* A compact nine-cell strip of where one engineer's projects sit.
   Position carries the stage, the count is printed, and the tint is that
   stage's share of the engineer's book — one hue, so no false identity. */
function stageProfile(byStage, total) {
  const cells = STAGES.map(s => {
    const v = byStage[s.key] || 0;
    const share = total > 0 ? v / total : 0;
    const cls = !v ? "m0" : share > 0.5 ? "m5" : share > 0.32 ? "m4" : share > 0.18 ? "m3" : share > 0.08 ? "m2" : "m1";
    return `<span class="sc"><span class="cell num ${cls}" title="${esc(s.label)}: ${v}">${v || "\u00b7"}</span>` +
           `<span class="sl" title="${esc(s.label)}">${esc(s.short)}</span></span>`;
  }).join("");
  return `<div class="profile"><span class="cap">Where their projects sit</span><div class="strip">${cells}</div></div>`;
}

function bucket(title, cls, items, lineFn) {
  if (!items.length) return "";
  return `<div class="bucket b-${cls}">
    <h4 class="sev-${cls === "plain" ? "none" : cls}">${cls !== "plain" ? sevIcon(cls) : ""}${esc(title)} (${items.length})</h4>
    <ul class="blist">${items.map(p => `<li><span class="rail"></span><span>${lineFn(p)}</span></li>`).join("")}</ul>
  </div>`;
}

function renderDigest(list) {
  const names = new Map();
  for (const p of list) {
    for (const n of p.icfEngs) names.set("ICF " + n, { name: n, org: "ICF" });
    /* Someone who moved to the reviewing side gets one entry, not two: his old
       HBS rows are the same person, and two cards would split his work. */
    for (const n of p.hbsAll) if (!NOW_ICF_SIDE.has(n)) names.set("HBS " + n, { name: n, org: "HBS" });
  }
  const wanted = [...names.values()].filter(e => state.org === "both" || (state.org === "icf" ? e.org === "ICF" : e.org === "HBS"));
  const byBlocked = (a, b) => b.owed - a.owed || b.ageingCount - a.ageingCount || b.count - a.count;
  const digests = wanted.map(e => digestFor(e.name, e.org, list)).filter(Boolean).sort(byBlocked);
  if (!digests.length) return `<div class="panel empty">No engineers match these filters.</div>`;

  const totalOwed = digests.reduce((n, d) => n + d.owed, 0);

  /* Three groups rather than one list. The roster is the engineering team and
     is what a weekly digest is for. Someone who has left still appears while
     projects are named to them, because those need a new owner and silence
     would hide that. Everyone else holding live work — deal owners,
     subcontracted auditors, reviewers — is shown last: they are not sent an
     engineer's digest, but their work is not invisible either. */
  const groups = [
    { key: "team", title: "Engineering team",
      hint: "The roster. These are the digests that send on Monday.",
      list: digests.filter(d => d.org === "HBS" && onRoster(d.name) && !hasLeft(d.name)) },
    { key: "left", title: "No longer at HBS",
      hint: "Still named on live projects. Nothing is emailed to them — these projects need a new owner.",
      list: digests.filter(d => d.org === "HBS" && hasLeft(d.name)) },
    { key: "other", title: "Also holding live projects",
      hint: "Reviewers, deal owners and auditors who are not on the engineering roster.",
      list: digests.filter(d => d.org !== "HBS" || !onRoster(d.name)) },
  ].filter(g => g.list.length);

  /* Collapsed by default so the whole team fits on one screen: the summary row
     carries the numbers you would otherwise open a card to read, and only the
     engineers with something owed start open. */
  const owedCount = digests.filter(d => d.owed > 0).length;

  return `<div class="section-head"><h2>Weekly digest, per engineer</h2>
    <span class="hint">One row per engineer, sorted by who is most blocked. Open a row for exactly what the Monday-morning email says.</span>
    <span class="hint num" style="margin-left:auto">${digests.length} engineers &middot; ${totalOwed} action${totalOwed === 1 ? "" : "s"} owed</span></div>
  <div class="dg-tools">
    <button class="chip-btn" data-dg="open">Expand all</button>
    <button class="chip-btn" data-dg="close">Collapse all</button>
    <span class="ev">${owedCount} of ${digests.length} open by default &mdash; the ones with an action owed.</span>
  </div>
  ${groups.map(g => `
    <div class="section-head"><h2>${esc(g.title)} <span class="num" style="opacity:.65">${g.list.length}</span></h2>
      <span class="hint">${esc(g.hint)}</span></div>
    <div class="cards">${g.list.map((d) => {
    const i = digests.indexOf(d);
    const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;
    const pill = (v, l, cls) => v ? `<span class="dg-pill ${cls}"><b class="num">${v}</b> ${esc(l)}</span>` : "";
    const meta = HBS_ROSTER[d.name] || {};
    return `<details class="card dg-card"${d.owed && !hasLeft(d.name) ? " open" : ""}>
      <summary class="card-hd dg-sum">
        <span class="avatar">${esc(d.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase())}</span>
        <span class="nm">${esc(d.name)}</span>
        <span class="chip ${d.org === "ICF" ? "chip-icf" : "chip-hbs"}">${d.org}</span>
        ${meta.role ? `<span class="chip">${esc(meta.role)}</span>` : ""}
        ${meta.left ? `<span class="chip" style="border-color:var(--serious);color:var(--serious)">has left &mdash; needs reassigning</span>` : ""}
        <span class="dg-pills">
          ${pill(d.count, "active", "is-plain")}
          ${pill(d.owed, "owed", "is-critical")}
          ${pill(d.ageingCount, "ageing", "is-serious")}
          ${pill(d.movedCount, "moved", "is-good")}
        </span>
        <span class="to">week of ${esc(weekOfLabel())}</span>
      </summary>
      <div class="card-bd">
        <div class="stats">
          ${stat(d.count, "Active", "")}
          ${stat(d.owed, "Action owed", "is-critical")}
          ${stat(d.ageingCount, "Ageing 60d+", "is-serious")}
          ${stat(d.movedCount, "Moved this week", "is-good")}
        </div>
        ${stageProfile(d.byStage, d.count)}
        ${bucket("Needs their action", "critical", d.yours, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(p.need)}</div>${p.evidence ? `<div class="m">Latest: ${esc(p.evidence.slice(0, 150))}</div>` : ""}`)}
        ${bucket("Waiting on someone else", "warning", d.waiting, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(p.need)}</div><div class="m">With ${esc(p.ownerNames.join(", "))}</div>`)}
        ${bucket("Ageing past 60 days", "serious", d.ageing, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(p.need)}</div><div class="m">${p.daysInPhase == null ? "?" : p.daysInPhase} days in ${esc(p.phase)}</div>`)}
        ${bucket("Moved this week", "good", d.moved, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(d.movedStages.get(p) || "")}</div>`)}
        ${d.rest.length ? `<details class="detail"><summary>Everything else (${d.rest.length})</summary>
          <div class="detail-body">${d.rest.map(p => `<div><b>${esc(p.name)}</b> &mdash; ${esc(p.need)}</div>`).join("")}</div></details>` : ""}
        <details class="detail"><summary>Show the email exactly as it sends</summary>
          <div class="detail-body"><pre id="dg-${i}">${esc(d.text)}</pre>
          <div class="digest-actions"><button data-copy="dg-${i}">Copy</button></div></div></details>
      </div>
    </details>`;
  }).join("")}</div>`).join("")}`;
}
function weekOfLabel() {
  const r = periodRange("week", new Date());
  return r.start.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* ---- meeting intel ---- */
function projectTags(pred) {
  const hits = state.projects.filter(pred);
  if (!hits.length) return `<div class="tags"><span class="tag none">no project matched by name</span></div>`;
  return `<div class="tags">${hits.slice(0, 8).map(h =>
    `<span class="tag">${esc(h.name)}</span>`).join("")}${hits.length > 8 ? `<span class="tag none">+${hits.length - 8} more</span>` : ""}</div>`;
}

/* --------------------------------------------------------------------------
   Meeting prep.

   Everything here is read off the boards and the calendar — the projects the
   meeting touches, what each of them is waiting on, who is in the room and
   what they own, and what the last instance of a recurring meeting covered.
   Nothing is invented; each line names the project it came from.
-------------------------------------------------------------------------- */

/* Recurring meetings keep their subject, so a normalised title matches this
   week's invite to the last Fireflies recap of the same series. */
const normTitle = t => String(t).toLowerCase()
  .replace(/\b(weekly|bi-?weekly|monthly|recurring)\b/g, "")
  .replace(/[0-9]{1,2}[\/.-][0-9]{1,2}([\/.-][0-9]{2,4})?/g, "")
  .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();

/* Attendee addresses are firstinitial+lastname at HBS (PLawson, AWhite), so a
   surname match maps most of the room to a person on the boards. Anything that
   does not resolve is shown as the raw address rather than guessed at. */
function attendeeName(email, names) {
  const local = String(email).split("@")[0].toLowerCase().replace(/[._-]/g, "");
  let best = null;
  for (const n of names) {
    const parts = n.toLowerCase().split(/\s+/);
    if (parts.length < 2) continue;
    const last = parts[parts.length - 1], first = parts[0];
    if (local === (first[0] + last) || local === (first + last) || local === last) { best = n; break; }
    const stem = local.slice(1);
    if (local[0] === first[0] && stem.length >= 4 && last.startsWith(stem)) { best = n; break; }
    if (!best && local.endsWith(last) && last.length >= 5) best = n;
  }
  return best;
}

function meetingBrief(m) {
  const touched = state.projects.filter(p =>
    (p.calendar || []).some(x => x.id === m.id) || (p.meetings || []).some(x => x.id === m.id));

  /* everyone who appears anywhere on the boards, for attendee resolution */
  const allNames = new Set();
  for (const p of state.projects) { for (const n of p.hbsAll) allNames.add(n); for (const n of p.icfEngs) allNames.add(n); }
  const names = [...allNames];

  const people = (m.attendees || []).map(a => {
    const who = attendeeName(a, names);
    if (!who) return { email: a, name: null, external: !isHbs(a), icf: isIcf(a) };
    const theirs = state.projects.filter(p => p.hbsAll.includes(who) || p.icfEngs.includes(who));
    return {
      email: a, name: who, external: !isHbs(a), icf: isIcf(a),
      active: theirs.length,
      owed: theirs.filter(p => p.band === "critical").length,
    };
  });

  /* what the last instance of this series covered */
  const key = normTitle(m.title);
  const prior = key ? state.meetings
    .filter(x => x.id !== m.id && normTitle(x.title) === key && x.bullets.length)
    .sort((a, b) => String(b.when).localeCompare(String(a.when)))[0] : null;

  const owed = touched.filter(p => p.band === "critical" || p.band === "serious")
    .sort((a, b) => b.priority - a.priority);
  const decisions = touched.filter(p => !p.ownerNames.length || !p.evDates.dAudit || !p.hasTu);

  /* When ICF is in the room, the meeting is external: keep prep to the shared
     board's facts, exactly as the ICF digests do. */
  const withIcf = people.some(x => x.icf) || m.withIcf;

  return { touched, people, prior, owed, decisions, withIcf };
}

function briefText(m, b) {
  const L = [];
  L.push(m.title);
  L.push(`${m.when}${m.tz ? " " + m.tz : ""}`);
  L.push("");
  if (b.withIcf) L.push("[ICF in the room — internal notes and commercials left out]", "");
  if (b.touched.length) {
    L.push(`PROJECTS ON THE TABLE (${b.touched.length})`);
    for (const p of b.touched) {
      L.push(`  * ${p.name} — ${p.phase}${p.icfStatus ? " / " + p.icfStatus : ""}`);
      L.push(`      Next: ${p.need}${p.ownerNames.length ? " — " + p.ownerNames.join(", ") : " — nobody assigned"}`);
      if (!b.withIcf && p.evidence) L.push(`      Latest: ${p.evidence.slice(0, 150)}`);
    }
    L.push("");
  }
  if (b.owed.length) {
    L.push(`NEEDS A DECISION OR AN ANSWER (${b.owed.length})`);
    for (const p of b.owed) L.push(`  * ${p.name} — ${p.need}${p.daysInPhase != null ? ` (${p.daysInPhase} days in phase)` : ""}`);
    L.push("");
  }
  if (b.decisions.length) {
    L.push("GAPS TO CLOSE");
    for (const p of b.decisions) {
      const g = [];
      if (!p.ownerNames.length) g.push("no owner on the next step");
      if (!p.evDates.dAudit) g.push("no audit date");
      if (!p.hasTu) g.push("not linked to the TU tracker");
      L.push(`  * ${p.name} — ${g.join(", ")}`);
    }
    L.push("");
  }
  if (b.prior) {
    L.push(`CARRIED OVER FROM ${b.prior.when}`);
    for (const x of b.prior.bullets) L.push(`  * ${x}`);
    L.push("");
  }
  if (b.people.length) {
    L.push("IN THE ROOM");
    for (const x of b.people) {
      if (x.name) L.push(`  * ${x.name}${x.active ? ` — ${x.active} active, ${x.owed} owed` : ""}`);
      else L.push(`  * ${x.email}${x.external ? " (external)" : ""}`);
    }
  }
  return L.join("\n");
}

      ${bucket("Gaps to close", "warning", b.decisions, p => {

        if (!p.ownerNames.length) g.push("no owner on the next step");

      ${b.people.length ? `<div class="bucket"><h4>In the room</h4><div class="tags">${b.people.map(x =>

      <details class="detail"><summary>Copy as an agenda</summary>
