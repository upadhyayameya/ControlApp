<style>
/* ---------- tokens: light is the base, both dark scopes redefine only tokens ---------- */
:root {
  color-scheme: light;
  --surface:      #fcfcfb;
  --panel:        #f3f5f8;
  --panel-2:      #e9edf2;
  --ink:          #12171d;
  --ink-2:        #5a656f;
  --ink-3:        #8a939c;
  --rule:         #dde3ea;
  --rule-strong:  #c4cdd7;
  --accent:       #2a78d6;
  --accent-ink:   #1c5cab;
  --org-icf:      #2a78d6;
  --org-hbs:      #eb6834;
  --good:         #0ca30c;
  --warning:      #fab219;
  --serious:      #ec835a;
  --critical:     #d03b3b;
  --on-accent:    #ffffff;
  --mag-1:        #86b6ef;  --m1-ink: #12171d;
  --mag-2:        #5598e7;  --m2-ink: #12171d;
  --mag-3:        #2a78d6;  --m3-ink: #ffffff;
  --mag-4:        #1c5cab;  --m4-ink: #ffffff;
  --mag-5:        #104281;  --m5-ink: #ffffff;
  --focus:        #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:     #14181c;
    --panel:       #1b2026;
    --panel-2:     #232a31;
    --ink:         #eef2f6;
    --ink-2:       #a9b4bf;
    --ink-3:       #78838d;
    --rule:        #2a3138;
    --rule-strong: #3a434c;
    --accent:      #3987e5;
    --accent-ink:  #86b6ef;
    --org-icf:     #3987e5;
    --org-hbs:     #d95926;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
    --on-accent:   #0d1114;
    --mag-1:       #184f95;  --m1-ink: #eef2f6;
    --mag-2:       #2a78d6;  --m2-ink: #ffffff;
    --mag-3:       #5598e7;  --m3-ink: #0d1114;
    --mag-4:       #86b6ef;  --m4-ink: #0d1114;
    --mag-5:       #b7d3f6;  --m5-ink: #0d1114;
    --focus:       #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:     #14181c;
  --panel:       #1b2026;
  --panel-2:     #232a31;
  --ink:         #eef2f6;
  --ink-2:       #a9b4bf;
  --ink-3:       #78838d;
  --rule:        #2a3138;
  --rule-strong: #3a434c;
  --accent:      #3987e5;
  --accent-ink:  #86b6ef;
  --org-icf:     #3987e5;
  --org-hbs:     #d95926;
  --good:        #0ca30c;
  --warning:     #fab219;
  --serious:     #ec835a;
  --critical:    #d03b3b;
  --on-accent:   #0d1114;
  --mag-1:       #184f95;  --m1-ink: #eef2f6;
  --mag-2:       #2a78d6;  --m2-ink: #ffffff;
  --mag-3:       #5598e7;  --m3-ink: #0d1114;
  --mag-4:       #86b6ef;  --m4-ink: #0d1114;
  --mag-5:       #b7d3f6;  --m5-ink: #0d1114;
  --focus:       #86b6ef;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.num, .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.wrap { max-width: 1480px; margin: 0 auto; padding: 0 20px 72px; }

/* ---------- masthead ---------- */
.masthead {
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  position: sticky; top: 0; z-index: 40;
}
.masthead-in {
  max-width: 1480px; margin: 0 auto; padding: 14px 20px 0;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
}
h1 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
h1 .x { color: var(--ink-3); font-weight: 400; padding: 0 2px; }
.sub { color: var(--ink-2); font-size: 12.5px; margin: 0; }
.masthead-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.stamp { font-size: 11.5px; color: var(--ink-3); }
.stamp b { color: var(--ink-2); font-weight: 500; }

button, select, input[type="search"] {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule-strong); border-radius: 5px; padding: 5px 10px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { background: var(--panel-2); }
button:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; margin-top: 12px; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  border-radius: 0; padding: 8px 12px; color: var(--ink-2); font-size: 13px; font-weight: 500;
}
.tab:hover { background: var(--panel); color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- controls ---------- */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  padding: 12px 0; margin-bottom: 4px; border-bottom: 1px solid var(--rule);
}
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.segmented { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; }
.segmented button {
  border: none; border-radius: 0; background: var(--surface); padding: 5px 11px;
  font-size: 12.5px; color: var(--ink-2); border-right: 1px solid var(--rule);
}
.segmented button:last-child { border-right: none; }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 500; }
input[type="search"] { min-width: 220px; }

/* ---------- funnel rail ---------- */
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
.section-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.section-head .hint { font-size: 12px; color: var(--ink-3); }

.rail { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 1180px) { .rail { grid-template-columns: repeat(5, minmax(0,1fr)); } }
@media (max-width: 700px)  { .rail { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.stage {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 7px;
  padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 2px;
  text-align: left; position: relative; overflow: hidden;
}
.stage .ord { font-size: 10px; color: var(--ink-3); letter-spacing: .06em; }
.stage .nm { font-size: 11.5px; font-weight: 600; color: var(--ink-2); line-height: 1.25; min-height: 2.5em; }
.stage .big { font-size: 27px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.stage .open { font-size: 11.5px; color: var(--ink-3); }
.stage .open b { color: var(--ink-2); font-weight: 500; }
.stage .delta { font-size: 11px; }
.up { color: var(--good); } .down { color: var(--critical); } .flat { color: var(--ink-3); }
.stage .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }

/* ---------- panels & tables ---------- */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
.scroller { overflow-x: auto; }
.scroller.tall { max-height: 72vh; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600;
  border-bottom: 1px solid var(--rule-strong); white-space: nowrap; background: var(--panel);
}
.scroller.tall thead th { position: sticky; top: 0; z-index: 2; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--panel-2); }
td.n, th.n { text-align: right; }

/* matrix */
.matrix th.rot { white-space: normal; max-width: 74px; }
.cell { display: block; text-align: center; border-radius: 4px; padding: 3px 0; font-size: 12.5px; }
.m0 { color: var(--ink-3); }
.m1 { background: var(--mag-1); color: var(--m1-ink); }
.m2 { background: var(--mag-2); color: var(--m2-ink); }
.m3 { background: var(--mag-3); color: var(--m3-ink); }
.m4 { background: var(--mag-4); color: var(--m4-ink); }
.m5 { background: var(--mag-5); color: var(--m5-ink); }

.legend { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); }
.legend .sw { width: 16px; height: 11px; border-radius: 2px; display: inline-block; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 10px;
  font-size: 11px; font-weight: 500; border: 1px solid var(--rule-strong); color: var(--ink-2); white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.chip-icf { border-color: var(--org-icf); color: var(--org-icf); }
.chip-hbs { border-color: var(--org-hbs); color: var(--org-hbs); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.sev svg { flex: none; }
.sev-good { color: var(--good); } .sev-warning { color: var(--warning); }
.sev-serious { color: var(--serious); } .sev-critical { color: var(--critical); }
.sev-none { color: var(--ink-3); }

.need { color: var(--ink); }
.who { color: var(--ink-2); font-size: 12.5px; }
.who .unassigned { color: var(--serious); }
.ev { color: var(--ink-3); font-size: 11.5px; margin-top: 3px; }
.ev b { color: var(--ink-2); font-weight: 500; }
.proj-name { font-weight: 500; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* status banners */
.note { padding: 11px 13px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--panel); font-size: 13px; margin: 12px 0; }
.note-critical { border-color: var(--critical); }
.note-warning  { border-color: var(--warning); }
.note h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.note p { margin: 0; color: var(--ink-2); }
.empty { padding: 26px; text-align: center; color: var(--ink-3); font-size: 13px; }

.grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 1080px) { .grid-2 { grid-template-columns: 1fr; } }

.digest { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.digest h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.digest .meta { font-size: 11.5px; color: var(--ink-3); margin-bottom: 9px; }
.digest pre {
  margin: 0; white-space: pre-wrap; word-wrap: break-word; font-size: 12.5px; line-height: 1.55;
  font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 11px 12px; max-height: 340px; overflow: auto;
}
.digest-actions { display: flex; gap: 8px; margin-top: 9px; }

/* thirteen-month trend — one hue, height carries the amount */
.tbars { display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; align-items: end; height: 150px; }
.tb { display: grid; grid-template-rows: auto 1fr auto; align-items: end; height: 100%; gap: 3px; }
.tb .tv { font-size: 9.5px; color: var(--ink-2); text-align: center; white-space: nowrap; }
.tb .tbar { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; align-self: end; }
.tb .tbar.live { background: var(--mag-2); }
.tb .tl { font-size: 10px; color: var(--ink-3); text-align: center; }
.tb:hover .tbar { filter: brightness(1.15); }

/* period comparison — previous behind, current in front */
.cmp { display: block; position: relative; height: 14px; }
.cmp-prev, .cmp-cur { position: absolute; left: 0; border-radius: 2px; }
.cmp-prev { top: 0; height: 6px; background: var(--rule-strong); }
.cmp-cur  { top: 8px; height: 6px; background: var(--accent); }

button.linkish {
  background: none; border: none; padding: 0; font: inherit; font-weight: 500;
  color: var(--accent); cursor: pointer; text-align: left; border-radius: 3px;
}
button.linkish:hover { text-decoration: underline; background: none; }

/* ---------- digest & intel cards ---------- */
.cards { display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.card-hd { display: flex; align-items: center; gap: 9px; padding: 12px 15px 0; flex-wrap: wrap; }
.card-hd .nm { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.card-hd .to { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.card-bd { padding: 10px 15px 13px; display: grid; gap: 10px; }

/* stat strip */
.stats { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
.stat { flex: 1 1 0; min-width: 74px; padding: 6px 11px; border-right: 1px solid var(--rule); }
.stat:last-child { border-right: none; }
.stat .v { font-size: 19px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
.stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; margin-top: 1px; }
.stat.is-critical .v { color: var(--critical); }
.stat.is-serious  .v { color: var(--serious); }
.stat.is-good     .v { color: var(--good); }
.stat.is-zero .v { color: var(--ink-3); font-weight: 500; }

/* stage profile — one hue, height carries the count */
.profile { display: grid; gap: 5px; }
.profile .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
.strip { display: grid; grid-template-columns: repeat(9, minmax(0,1fr)); gap: 3px; }
.strip .sc { display: grid; gap: 2px; }
.strip .sl { font-size: 9px; text-align: center; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .cell { padding: 4px 0; font-size: 12px; }

/* grouped project lines */
.bucket { border-top: 1px solid var(--rule); padding-top: 9px; }
.bucket > h4 { margin: 0 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.bucket ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.bucket li { display: grid; grid-template-columns: 3px 1fr; gap: 9px; align-items: start; }
.bucket li .rail { border-radius: 2px; align-self: stretch; background: var(--rule-strong); }
.bucket.b-critical li .rail { background: var(--critical); }
.bucket.b-serious  li .rail { background: var(--serious); }
.bucket.b-good     li .rail { background: var(--good); }
.bucket li .t { font-size: 13px; }
.bucket li .s { font-size: 12px; color: var(--ink-2); }
.bucket li .m { font-size: 11.5px; color: var(--ink-3); }

/* meeting + chat feed */
.feed { display: grid; gap: 10px; }
.fitem { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 11px 14px; display: grid; gap: 7px; }
.fitem .top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.fitem .who2 { font-weight: 600; font-size: 13.5px; }
.fitem .when { font-size: 11.5px; color: var(--ink-3); }
.fitem .msg { font-size: 13px; color: var(--ink-2); }
.fitem ul.ov { margin: 0; padding-left: 15px; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--rule-strong); color: var(--ink-2); }
.tag.none { color: var(--ink-3); border-style: dashed; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--rule-strong); color: var(--ink-2); flex: none; }

details.detail { border-top: 1px dashed var(--rule); margin-top: 5px; padding-top: 5px; }
details.detail summary { cursor: pointer; font-size: 11.5px; color: var(--ink-3); }
details.detail summary:hover { color: var(--ink-2); }
.detail-body { padding: 7px 0 2px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 5px; }
.detail-body .k { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }

.skel { color: var(--ink-3); font-size: 13px; padding: 20px 0; }
.spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--rule-strong); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
.srcline { font-size: 11.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 0 0; }
</style>

  <div class="controls" id="controls" hidden>

      <label id="lbl-period">Period</label>

<script type="module">
"use strict";

/* ============================================================================
   ICF × HBS Pipeline
   Reads live from the viewer's own connectors. Nothing is stored in this page.

   monday.com  — ICF/HBS Project Tracker (18424932045) joined to
                 Master TU Tracker (1069746645) through the board-relation column.
   Microsoft 365 — Teams messages and Fireflies meeting recaps in Outlook,
                 matched to projects by name to surface the latest real-world signal.
   ========================================================================== */

const MONDAY = "monday.com";
const MS365  = "Microsoft 365";

const BOARD_ICF = 18424932045;
const BOARD_TU  = 1069746645;
const BOARD_KPI = 1069742731;       // Monthly KPIs — one row per milestone, with money on it

/* ========================= value normalisation ============================ */
function txt(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "number") return String(v);
  if (typeof v === "string") {
    const t = v.trim();
    if (!t || t === "null" || t === "Column value type is not supported") return "";
    return t;
  }
  if (Array.isArray(v)) return v.map(x => (x && x.name) ? x.name : "").filter(Boolean).join(", ");
  if (typeof v === "object") {
    if ("checked" in v) return v.checked ? "yes" : "";
    if (typeof v.label === "string") return v.label;
    if (typeof v.text === "string") return v.text.trim();
    if (typeof v.date === "string") return v.date;
    if (Array.isArray(v.labels)) return v.labels.join(", ");
    if (Array.isArray(v.ids)) return "";
  }
  return "";
}
const col = (item, id) => txt(item && item.column_values ? item.column_values[id] : "");
function people(item, id) {
  const s = col(item, id);
  return s ? s.split(",").map(x => x.trim()).filter(Boolean) : [];
}
function num(item, id) {
  const n = parseFloat(String(col(item, id)).replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? n : null;
}
function relIds(item, id, boardId) {
  const raw = item && item.column_values ? item.column_values[id] : null;
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(r => r && (!boardId || String(r.board && r.board.id) === String(boardId)))
    .map(r => String(r.id));
}
const dstr = s => (/^\d{4}-\d{2}-\d{2}/.test(s || "") ? s.slice(0, 10) : "");
function dparse(s) {
  const d = dstr(s);
  if (!d) return null;
  const [y, m, dd] = d.split("-").map(Number);
  return new Date(y, m - 1, dd);
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ========================= period maths =================================== */
function periodRange(kind, now) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let start;
  if (kind === "day") start = d;
  else if (kind === "week") { const dow = (d.getDay() + 6) % 7; start = new Date(d); start.setDate(d.getDate() - dow); }
  else if (kind === "month") start = new Date(d.getFullYear(), d.getMonth(), 1);
  else if (kind === "quarter") start = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
  else start = new Date(d.getFullYear(), 0, 1);
  const end = new Date(d); end.setDate(end.getDate() + 1);
  const span = Math.round((end - start) / 86400000);
  const prevEnd = new Date(start);
  const prevStart = new Date(start); prevStart.setDate(prevStart.getDate() - span);
  return { start, end, prevStart, prevEnd, span };
}
const inRange = (dt, a, b) => !!dt && dt >= a && dt < b;

function mcpError(e) {
  const code = (e && e.code) || "upstream_error";
  const known = ["needs_reauth","server_not_connected","selection_required","server_not_found","server_unavailable",
    "not_in_manifest","blocked_by_policy","approval_required","tool_error","bad_request","cancelled","rate_limited",
    "upstream_error","not_granted","capability_disabled","capability_removed","transform_error"];
  return { code: known.includes(code) ? code : "upstream_error", message: (e && e.message) || String(e), retryable: !!(e && e.retryable), retryAfterMs: e && e.retryAfterMs };
}
function fixCopy(err, server) {
  switch (err.code) {
    case "needs_reauth":         return `Reconnect ${server} in claude.ai Settings → Connectors, then refresh.`;
    case "server_not_connected": return `Add ${server} in claude.ai Settings → Connectors, then refresh.`;
    case "selection_required":   return `You have more than one ${server} connector. Choose one when claude.ai asks, then refresh.`;
    case "server_not_found":     return `The ${server} connector no longer exists upstream.`;
    case "blocked_by_policy":    return `Your organisation's policy blocks this ${server} tool.`;
    case "approval_required":    return `This ${server} tool needs per-call approval, which artifacts cannot request yet.`;
    case "not_in_manifest":      return `This page is not authorised to call that ${server} tool.`;
    case "server_unavailable":   return `${server} did not answer. It is usually brief — try Refresh.`;
    case "tool_error":           return `${server} reported: ${err.message}`;
    case "not_granted":
    case "capability_disabled":
    case "capability_removed":   return `This view cannot reach your connectors.`;
    default:                     return `${server} call failed: ${err.message}`;
  }
}
const AUTHZ = new Set(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"]);
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function call(server, tool, input, { retry = true, refresh = false } = {}) {
  try {
    return await mcp.callTool(server, tool, input, { cache: { staleTime: 60_000, gcTime: 900_000, refresh } });
  } catch (raw) {
    const err = mcpError(raw);
    if (retry && err.retryable) {
      await sleep(Math.min(err.retryAfterMs || 900, 4000) + Math.random() * 500);
      return call(server, tool, input, { retry: false, refresh });
    }
    throw err;
  }
}

/* "Read 14:22" must reflect when the data was actually produced, not when we rendered.
   A result served from the call cache carries cache.storedAt; a fresh one does not. */
function stampFrom(res) {
  const st = res && res.cache && res.cache.storedAt;
  if (typeof st === "number") state.storedAt = state.storedAt ? Math.min(state.storedAt, st) : st;
}

/* A connector may answer with one JSON array, or with one text block per record.
   `payload` only ever exposes the first block, so fall back to reading them all. */
function rowsFrom(res) {
  const out = [];
  const push = v => { if (v && typeof v === "object" && !Array.isArray(v)) out.push(v); };
  const p = res && res.payload;
  if (Array.isArray(p)) { p.forEach(push); return out; }
  push(p);
  const blocks = (res && Array.isArray(res.content)) ? res.content : [];
  for (const b of blocks) {
    if (!b || b.type !== "text" || typeof b.text !== "string") continue;
    try {
      const v = JSON.parse(b.text);
      if (Array.isArray(v)) v.forEach(push); else push(v);
    } catch { /* a non-JSON block is not a record */ }
  }
  const seen = new Set();
  return out.filter(r => {
    const k = r.id == null ? Symbol() : String(r.id);
    if (typeof k === "string") { if (seen.has(k)) return false; seen.add(k); }
    return true;
  });
}

async function fetchBoard(boardId, columnIds, filters, refresh) {
  const items = [];
  let cursor = null;
  for (let page = 0; page < 30; page++) {
    const input = { boardId, limit: 200, includeColumns: true, includeGroup: true, columnIds };
    if (filters) { input.filters = filters; input.filtersOperator = "and"; }
    if (cursor) input.cursor = cursor;
    const res = await call(MONDAY, "get_board_items_page", input, { refresh: refresh && page === 0 });
    if (page === 0) stampFrom(res);
    const p = res && res.payload;
    if (!p || !Array.isArray(p.items)) break;
    items.push(...p.items);
    const pg = p.pagination || {};
    if (!pg.has_more || !pg.nextCursor) break;
    cursor = pg.nextCursor;
  }
  return items;
}

/* ========================= building the projects ========================== */
function latestNoteLine(text) {
  if (!text) return null;
  const lines = String(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) return null;
  const dated = lines.find(l => /^\d{1,2}[\/\-]\d{1,2}\b/.test(l));
  return dated || lines[0];
}

function buildProjects(icfItems, tuItems) {
  const tuByIcf = new Map();
  for (const t of tuItems) for (const id of relIds(t, T.rel, BOARD_ICF)) if (!tuByIcf.has(id)) tuByIcf.set(id, t);

  const today = new Date(); today.setHours(0, 0, 0, 0);

  const built = icfItems.map(it => {
    const tu = tuByIcf.get(String(it.id)) || null;
    const g = (id) => (tu ? col(tu, id) : "");

    const phase     = col(it, C.phase);
    const icfStatus = col(it, C.status);
    const tuStatus  = g(T.status);
    const sowStatus = g(T.sowStatus);

    const icfEngs = people(it, C.icfEng);
    const hbsEngs = people(it, C.hbsEng);
    const auditor = tu ? people(tu, T.auditor) : [];
    const paLead  = tu ? people(tu, T.paLead)  : [];
    const coLead  = tu ? people(tu, T.coLead)  : [];
    const owner   = tu ? people(tu, T.dealOwner) : [];
    const revEng  = tu ? people(tu, T.reviewEng).map(s => s.replace(/^ICF\s*-\s*/, "").replace(/^TRC\s*-\s*/, "")) : [];

    const dAudit   = dparse(g(T.dAudit));
    const dImpl    = dparse(g(T.dImpl));
    const dPAd     = dparse(col(it, C.dPAd))   || dparse(g(T.dSignedPA));
    const dSubPA   = dparse(col(it, C.dSubPA));
    const dSubCO   = dparse(col(it, C.dSubCO));          // actually submitted for closeout
    const dProjCO  = dparse(g(T.dProjCO));               // forecast only — never advances a stage
    const dCOd     = dparse(col(it, C.dCOd));
    const dSowSent = dparse(g(T.dSowClient))   || dparse(g(T.dSowRahls));
    const dSowSign = dparse(g(T.dSowSigned));

    const paidNow = PAYMENT_STATUS.has(tuStatus) || PAYMENT_ICF.has(icfStatus) || phase === "Payment Processing" || phase === "Completed Project";
    const auditedNow = (dAudit && dAudit <= today) || POST_AUDIT.has(tuStatus) || POST_AUDIT_PHASES.includes(phase);

    /* stage event dates — when the project crossed each milestone */
    const ev = {
      scheduled: dAudit,
      audited:   auditedNow ? dAudit : null,
      preapp:    dPAd,
      sowSent:   dSowSent,
      sowSigned: dSowSign,
      impl:      dImpl,
      coSched:   dSubCO,
      coDone:    dCOd,
      payment:   paidNow ? dCOd : null,
    };

    /* current stage — the furthest milestone actually reached */
    let current = null;
    if (paidNow) current = "payment";
    else if (dCOd || tuStatus === "CO Received") current = "coDone";
    else if (dSubCO || tuStatus === "CO Submitted" || phase === "Closeout Phase") current = "coSched";
    else if (dImpl || phase === "Implementation Phase" || icfStatus === "Install" ||
             ["Implementation Ready to Schedule","Implementation & MV Complete","CD to Submit"].includes(tuStatus)) current = "impl";
    else if (dSowSign || SOW_SIGNED_LABELS.has(sowStatus) || tuStatus === "Signed SOW Received") current = "sowSigned";
    else if (dSowSent || SOW_SENT_LABELS.has(sowStatus)) current = "sowSent";
    else if (dPAd || tuStatus === "PA Received" || phase === "Pre-Approval Phase") current = "preapp";
    else if (auditedNow) current = "audited";
    else if (dAudit) current = "scheduled";

    /* next step: what has to happen, and who owns it */
    const rule = TU_ACTIONS[tuStatus] || ICF_ACTIONS[icfStatus] || PHASE_FALLBACK[phase] || null;
    const roleOwners = {
      auditor: auditor.length ? auditor : (hbsEngs.length ? hbsEngs : owner),
      paLead:  paLead.length  ? paLead  : (hbsEngs.length ? hbsEngs : owner),
      coLead:  coLead.length  ? coLead  : (hbsEngs.length ? hbsEngs : owner),
      hbs:     hbsEngs.length ? hbsEngs : (owner.length ? owner : paLead),
      icf:     icfEngs.length ? icfEngs : revEng,
    };
    const ownerNames = rule && rule.role ? (roleOwners[rule.role] || []) : [];
    const ownerOrg   = rule && rule.role === "icf" ? "ICF" : (rule && rule.role ? "HBS" : null);

    const aging = col(it, C.aging);
    const daysInPhase = (() => { const n = parseFloat(col(it, C.daysPhase)); return Number.isFinite(n) ? n : null; })();

    let sev = (rule && rule.sev) || null;
    if (!sev) {
      if (aging === "Critical") sev = "serious";
      else if (aging === "Watch") sev = "warning";
    }
    if (sev !== "good" && aging === "Critical" && (rule && rule.sev === "warning")) sev = "critical";

    const notes = col(it, C.notes);
    const adminNotes = g(T.adminNotes);
    const evidence = latestNoteLine(adminNotes) || latestNoteLine(notes) || "";
    const evidenceFrom = latestNoteLine(adminNotes) ? "TU admin notes" : (latestNoteLine(notes) ? "ICF board notes" : "");

    return {
      id: String(it.id),
      name: it.name || "(untitled)",
      url: it.url || "",
      tuUrl: tu ? (tu.url || "") : "",
      group: (it.group && it.group.title) || "",
      projectId: col(it, C.projectId) || g(T.projectId),
      utility: col(it, C.utility),
      type: col(it, C.type),
      phase, icfStatus, tuStatus, sowStatus,
      icfEngs, hbsEngs, auditor, paLead, coLead, owner, revEng,
      ev, current,
      evDates: {
        dSubPA: dstr(col(it, C.dSubPA)), dPAd: dstr(col(it, C.dPAd)),
        dSubCO: dstr(col(it, C.dSubCO)), dCOd: dstr(col(it, C.dCOd)),
        dAudit: dstr(g(T.dAudit)), dImpl: dstr(g(T.dImpl)),
      },
      need: rule ? rule.need : "No status recorded — set a status on the board",
      ownerNames, ownerOrg,
      sev: sev || "none",
      aging, daysInPhase,
      nextActionDate: dstr(col(it, C.dNextAct)),
      projectedCO: dProjCO ? dstr(g(T.dProjCO)) : "",
      ecd: dstr(col(it, C.ecd)),
      lastUpdate: dstr(col(it, C.dLastUpd)),
      lastBy: col(it, C.lastBy),
      incentive: num(it, C.incentive),
      kwh: num(it, C.kwh),
      therms: num(it, C.therms),
      aiSummary: g(T.aiSummary),
      notes, adminNotes, evidence, evidenceFrom,
      hasTu: !!tu,
      priority: 0, priorityWhy: [], band: "none",
      teams: [],
      meetings: [],
      calendar: [],
    };
  });
  for (const p of built) {
    const sc = scoreProject(p);
    p.priority = sc.score;
    p.priorityWhy = sc.why;
    p.band = priorityBand(sc.score);
  }
  return built;
}

/* ---------------------------------------------------------------------------
   Automatic priority.

   Every input is something the boards already record, so the ranking needs no
   judgement from anyone: what the status says is owed, how long it has sat,
   whether a due date has passed, and whether anyone owns it at all.
--------------------------------------------------------------------------- */
function scoreProject(p) {
  const why = [];
  let n = 0;
  if (/RFI/i.test(p.tuStatus) && /Received/i.test(p.tuStatus)) { n += 45; why.push("ICF/TRC RFI open"); }
  if (/RFI/i.test(p.icfStatus)) { n += 45; why.push("RFI with HBS"); }
  if (/Flawed|FLAWED/.test(p.tuStatus + " " + p.icfStatus)) { n += 40; why.push("flawed in portal"); }
  if (p.tuStatus === "Action Needed from HBS") { n += 35; why.push("action needed from HBS"); }
  if (p.tuStatus === "Stuck") { n += 30; why.push("marked stuck"); }
  if (p.tuStatus === "CD to Submit") { n += 25; why.push("closeout docs to submit"); }
  if (p.tuStatus === "Implementation & MV Complete") { n += 22; why.push("implementation complete, closeout owed"); }
  if (p.tuStatus === "Waiting on Info/Others") { n += 15; why.push("waiting on outside info"); }
  if (p.aging === "Critical") { n += 30; why.push("60+ days without movement"); }
  else if (p.aging === "Watch") { n += 12; why.push("30+ days without movement"); }
  if (p.daysInPhase != null && p.daysInPhase > 120) { n += 12; why.push(`${p.daysInPhase} days in phase`); }
  if (!p.ownerNames.length && p.sev !== "good") { n += 20; why.push("no owner on the next step"); }
  if (p.nextActionDate) {
    const d = dparse(p.nextActionDate);
    if (d && d < new Date()) { n += 18; why.push("next-action date has passed"); }
  }
  if (p.sev === "good") n = Math.max(0, n - 40);
  return { score: n, why };
}
const priorityBand = n => n >= 60 ? "critical" : n >= 35 ? "serious" : n >= 18 ? "warning" : "none";

/* ========================= matching chatter to projects =================== */
const STOP = new Set(["the","and","for","with","project","projects","building","center","centre","llc","inc","apartments","at"]);
function matchKeys(name) {
  const keys = [];
  const parts = String(name).split(/\s+-\s+/);
  for (const p of parts) {
    const clean = p.trim();
    if (clean.length >= 6) keys.push(clean.toLowerCase());
  }
  const words = String(name).toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length >= 5 && !STOP.has(w));
  for (let i = 0; i < words.length - 1; i++) keys.push(words[i] + " " + words[i + 1]);
  return [...new Set(keys)];
}
function attachMentions(projects, records, field) {
  const index = projects.map(p => ({ p, keys: matchKeys(p.name) }));
  for (const r of records) {
    const hay = String(r.text || "").toLowerCase();
    if (!hay) continue;
    for (const { p, keys } of index) {
      if (keys.some(k => hay.includes(k))) {
        p[field].push(r);
        if (p[field].length > 6) p[field].length = 6;
      }
    }
  }
}

function engineersOf(p) {
  if (state.org === "icf") return p.icfEngs;
  if (state.org === "hbs") return p.hbsEngs;
  return [...p.icfEngs, ...p.hbsEngs];
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  return state.projects.filter(p => {
    if (state.utility && p.utility !== state.utility) return false;
    if (state.type && p.type !== state.type) return false;
    if (state.org === "icf" && !p.icfEngs.length) return false;
    if (state.org === "hbs" && !p.hbsEngs.length) return false;
    if (state.engineer && !engineersOf(p).includes(state.engineer)) return false;
    if (q) {
      const hay = [p.name, p.projectId, p.phase, p.icfStatus, p.tuStatus, p.need, p.ownerNames.join(" "), p.utility, p.type, p.evidence].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

const $ = sel => document.querySelector(sel);
const main = $("#main");

function sevIcon(sev) {

const SEV_LABEL = { good: "On track", warning: "Watch", serious: "Ageing", critical: "Action owed" };
const sevTag = sev => (sev === "none" || !SEV_LABEL[sev])
  ? `<span class="sev sev-none">—</span>`
  : `<span class="sev sev-${sev}">${sevIcon(sev)}${SEV_LABEL[sev]}</span>`;

function magClass(v, max) {
  if (!v) return "m0";
  if (max < 3) return "m3";        /* too little range to read as a ramp — one flat step */
  const r = v / max;
  if (r > 0.8) return "m5";
  if (r > 0.6) return "m4";
  if (r > 0.4) return "m3";
  if (r > 0.2) return "m2";
  return "m1";
}
function ownerCell(p) {
  if (!p.ownerNames.length) return `<span class="who"><span class="unassigned">Unassigned</span></span>`;
  const cls = p.ownerOrg === "ICF" ? "chip-icf" : "chip-hbs";
  return `<span class="who">${esc(p.ownerNames.join(", "))} <span class="chip ${cls}">${p.ownerOrg}</span></span>`;
}

/* ---- pipeline view ---- */
function renderPipeline(list) {
  const now = new Date();
  const r = periodRange(state.period, now);
  const counts = {}, prev = {}, open = {};
  for (const s of STAGES) { counts[s.key] = 0; prev[s.key] = 0; open[s.key] = 0; }
  for (const p of list) {
    for (const s of STAGES) {
      const d = p.ev[s.key];
      if (inRange(d, r.start, r.end)) counts[s.key]++;
      if (inRange(d, r.prevStart, r.prevEnd)) prev[s.key]++;
    }
    if (p.current) open[p.current]++;
  }
  const maxOpen = Math.max(1, ...Object.values(open));

  const tiles = STAGES.map((s, i) => {
    const c = counts[s.key], pv = prev[s.key];
    const delta = c - pv;
    const dcls = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
    const dtxt = (pv === 0 && c === 0) ? "none either period"
               : delta === 0 ? "level with prior"
               : `${delta > 0 ? "+" : ""}${delta} vs prior`;
    return `<div class="stage">
      <span class="ord num">${String(i + 1).padStart(2, "0")}</span>
      <span class="nm">${esc(s.label)}</span>
      <span class="big num">${c}</span>
      <span class="delta num ${dcls}">${esc(dtxt)}</span>
      <span class="open">Open now <b class="num">${open[s.key]}</b></span>
      <span class="bar" style="width:${Math.round((open[s.key] / maxOpen) * 100)}%"></span>
    </div>`;
  }).join("");

  /* engineer × stage matrix */
  const rows = new Map();
  for (const p of list) {
    /* an engineer is counted once per project, under the org they are assigned in */
    const pairs = [];
    if (state.org !== "hbs") for (const n of new Set(p.icfEngs)) pairs.push([n, "ICF"]);
    if (state.org !== "icf") for (const n of new Set(p.hbsEngs)) pairs.push([n, "HBS"]);
    for (const [n, org] of pairs) {
      const key = org + " " + n;
      if (!rows.has(key)) rows.set(key, { name: n, org, counts: {}, open: 0, attention: 0 });
      const row = rows.get(key);
      for (const s of STAGES) if (inRange(p.ev[s.key], r.start, r.end)) row.counts[s.key] = (row.counts[s.key] || 0) + 1;
      row.open++;
      if (p.sev === "critical" || p.sev === "serious") row.attention++;
    }
  }
  const engRows = [...rows.values()].sort((a, b) => b.open - a.open || a.name.localeCompare(b.name));
  const maxCell = Math.max(1, ...engRows.flatMap(rw => STAGES.map(s => rw.counts[s.key] || 0)));

  const matrix = engRows.length ? `<div class="panel scroller"><table class="matrix">
    <thead><tr>
      <th>Engineer</th><th></th>
      ${STAGES.map(s => `<th class="rot n" title="${esc(s.label)}">${esc(s.short)}</th>`).join("")}
      <th class="n">Active</th><th class="n">Needs action</th>
    </tr></thead>
    <tbody>${engRows.map(rw => `<tr>
      <td><button class="linkish" data-engineer="${esc(rw.name)}">${esc(rw.name)}</button></td>
      <td><span class="chip ${rw.org === "ICF" ? "chip-icf" : "chip-hbs"}">${rw.org}</span></td>
      ${STAGES.map(s => { const v = rw.counts[s.key] || 0; return `<td class="n"><span class="cell num ${magClass(v, maxCell)}">${v || "·"}</span></td>`; }).join("")}
      <td class="n num">${rw.open}</td>
      <td class="n num">${rw.attention ? `<span class="sev sev-serious">${rw.attention}</span>` : "·"}</td>
    </tr>`).join("")}</tbody></table></div>`
    : `<div class="panel empty">No engineers match these filters.</div>`;

  const swatches = ["--mag-1","--mag-2","--mag-3","--mag-4","--mag-5"]
    .map(v => `<span class="sw" style="background:var(${v})"></span>`).join("");

  return `
  ${renderCompare(list)}
  <div class="section-head">
    <h2>Funnel</h2>
    <span class="hint">Big number: milestones reached ${esc(PERIOD_LABEL[state.period])}. Bar and “open now”: where projects sit right now.</span>
  </div>
  <div class="rail">${tiles}</div>

  <div class="section-head">
    <h2>Per engineer</h2>
    <span class="hint">Milestones reached ${esc(PERIOD_LABEL[state.period])}, by the engineer assigned on the board.</span>
    <span class="legend" style="margin-left:auto">fewer ${swatches} more</span>
  </div>
  ${matrix}`;
}

/* Two periods side by side, so movement is visible rather than inferred. */
function comparePair(list, kind) {
  const now = new Date();
  const r = periodRange(kind, now);
  const cur = {}, prev = {};
  for (const s of STAGES) { cur[s.key] = 0; prev[s.key] = 0; }
  for (const p of list) for (const s of STAGES) {
    if (inRange(p.ev[s.key], r.start, r.end)) cur[s.key]++;
    if (inRange(p.ev[s.key], r.prevStart, r.prevEnd)) prev[s.key]++;
  }
  return { cur, prev, r };
}
function renderCompare(list) {
  const blocks = [
    { kind: "week", label: "This week vs last week", note: "Week starts Monday. The current week is counted to today, so a Monday reading is naturally small." },
    { kind: "month", label: "This month vs last month", note: "The current month is counted to today against the same number of days last month." },
  ].map(b => {
    const { cur, prev } = comparePair(list, b.kind);
    const curTotal = STAGES.reduce((n, s) => n + cur[s.key], 0);
    const prevTotal = STAGES.reduce((n, s) => n + prev[s.key], 0);
    const rows = STAGES.map(s => {
      const c = cur[s.key], v = prev[s.key], d = c - v;
      const max = Math.max(1, c, v);
      return `<tr>
        <td>${esc(s.label)}</td>
        <td class="n num">${v}</td>
        <td class="n num">${c}</td>
        <td style="width:34%"><span class="cmp">
          <span class="cmp-prev" style="width:${(v / max) * 100}%"></span>
          <span class="cmp-cur" style="width:${(c / max) * 100}%"></span>
        </span></td>
        <td class="n num ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "+" : ""}${d || "—"}</td>
      </tr>`;
    }).join("");
    const dTotal = curTotal - prevTotal;
    return `<div class="panel" style="padding:12px 14px">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
        <b style="font-size:13px">${esc(b.label)}</b>
        <span class="num ${dTotal > 0 ? "up" : dTotal < 0 ? "down" : "flat"}" style="font-size:12px">${dTotal > 0 ? "+" : ""}${dTotal} milestones</span>
      </div>
      <div class="scroller"><table><thead><tr><th>Stage</th><th class="n">Prev</th><th class="n">Now</th><th>&nbsp;</th><th class="n">&Delta;</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="ev" style="margin-top:6px">${esc(b.note)}</div>
    </div>`;
  }).join("");

  return `<div class="section-head"><h2>Period comparison</h2>
    <span class="hint">Milestones reached, current period against the one before it.</span>
    <span class="legend" style="margin-left:auto"><span class="sw" style="background:var(--rule-strong)"></span>previous
      <span class="sw" style="background:var(--accent);margin-left:8px"></span>current</span></div>
    <div class="grid-2">${blocks}</div>`;
}

/* ---------------------------------------------------------------------------
   Company numbers. Every figure is a sum over the Monthly KPIs rows whose
   completion date falls in the selected period, compared with the same length
   of time immediately before it.
--------------------------------------------------------------------------- */
function money(n) {
  const sign = n < 0 ? "-" : "";
  const a = Math.abs(n);
  return sign + (a >= 1e6 ? "$" + (a / 1e6).toFixed(2) + "m" : a >= 1e3 ? "$" + Math.round(a / 1e3) + "k" : "$" + Math.round(a));
}
function qty(n) {
  const sign = n < 0 ? "-" : "";
  const a = Math.abs(n);
  return sign + (a >= 1e6 ? (a / 1e6).toFixed(2) + "m" : a >= 1e3 ? Math.round(a / 1e3) + "k" : String(Math.round(a)));
}
const MILESTONE_ORDER = ["Audits Performed", "Preapprovals Submitted", "Preapprovals Received",
  "Implementations Scheduled", "Closeouts Submitted", "Closeouts Received"];

function sumRows(rows) {
  return rows.reduce((a, k) => ({
    count: a.count + 1, incentive: a.incentive + k.incentive,
    hbsShare: a.hbsShare + k.hbsShare, savings: a.savings + k.savings,
  }), { count: 0, incentive: 0, hbsShare: 0, savings: 0 });
}

function renderNumbers() {
  if (state.kpisLoading) return `<div class="skel"><span class="spin"></span>Reading the Monthly KPIs board — thirteen months of milestones…</div>`;
  if (state.errors.kpis) return errNote("Monthly KPIs board", state.errors.kpis, MONDAY);
  if (!state.kpis.length) return `<div class="panel empty">No KPI rows found in the last thirteen months.</div>`;

  const r = periodRange(state.period, new Date());
  const inCur = state.kpis.filter(k => inRange(k.when, r.start, r.end));
  const inPrev = state.kpis.filter(k => inRange(k.when, r.prevStart, r.prevEnd));
  const cur = sumRows(inCur), prev = sumRows(inPrev);
  const label = PERIOD_LABEL[state.period];

  const delta = (c, v, fmt) => {
    const d = c - v;
    if (!d) return `<span class="num flat" style="font-size:11.5px">level with prior</span>`;
    const cls = d > 0 ? "up" : "down";
    const pct = v > 0 ? ` (${d > 0 ? "+" : ""}${Math.round((d / v) * 100)}%)` : "";
    return `<span class="num ${cls}" style="font-size:11.5px">${d > 0 ? "+" : ""}${fmt(d)}${pct} vs prior</span>`;
  };

  let out = `<div class="section-head"><h2>Company numbers</h2>
    <span class="hint">Milestones banked ${esc(label)}, against the period before it. Change the period at the top.</span></div>
    <div class="stats" style="margin-bottom:6px">
      <div class="stat"><div class="v num">${money(cur.incentive)}</div><div class="l">Incentive</div><div>${delta(cur.incentive, prev.incentive, money)}</div></div>
      <div class="stat"><div class="v num">${money(cur.hbsShare)}</div><div class="l">HBS share</div><div>${delta(cur.hbsShare, prev.hbsShare, money)}</div></div>
      <div class="stat"><div class="v num">${qty(cur.savings)}</div><div class="l">kWh / therms</div><div>${delta(cur.savings, prev.savings, qty)}</div></div>
      <div class="stat"><div class="v num">${cur.count}</div><div class="l">Milestones</div><div>${delta(cur.count, prev.count, n => String(n))}</div></div>
    </div>`;

  /* per milestone group */
  const groups = MILESTONE_ORDER.filter(g => state.kpis.some(k => k.milestone === g));
  out += `<div class="section-head"><h2>By milestone</h2><span class="hint">What the company actually banked ${esc(label)}</span></div>
    <div class="panel scroller"><table><thead><tr>
      <th>Milestone</th><th class="n">Count</th><th class="n">Prev</th><th class="n">Incentive</th><th class="n">HBS share</th><th class="n">kWh / therms</th>
    </tr></thead><tbody>${groups.map(g => {
      const c = sumRows(inCur.filter(k => k.milestone === g));
      const v = sumRows(inPrev.filter(k => k.milestone === g));
      const d = c.count - v.count;
      return `<tr><td>${esc(g)}</td>
        <td class="n num">${c.count}</td>

        <td class="n num">${money(c.incentive)}</td><td class="n num">${money(c.hbsShare)}</td><td class="n num">${qty(c.savings)}</td></tr>`;
    }).join("")}</tbody></table></div>`;

  /* thirteen-month trend */
  const months = [];
  const m0 = new Date(); m0.setDate(1);
  for (let i = 12; i >= 0; i--) {
    const d = new Date(m0.getFullYear(), m0.getMonth() - i, 1);
    const nx = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const rows = state.kpis.filter(k => k.when >= d && k.when < nx);
    months.push({ key: d.toLocaleDateString(undefined, { month: "short" }), year: d.getFullYear(), ...sumRows(rows) });
  }
  const maxInc = Math.max(1, ...months.map(m => m.incentive));
  out += `<div class="section-head"><h2>Thirteen-month trend</h2><span class="hint">Incentive banked per month; the last column is the month in progress</span></div>
    <div class="panel" style="padding:14px 16px">
      <div class="tbars">${months.map((m, i) => `<div class="tb" title="${esc(m.key)} ${m.year}: ${money(m.incentive)} across ${m.count} milestones">
        <span class="tv num">${m.incentive ? money(m.incentive) : ""}</span>
        <span class="tbar${i === months.length - 1 ? " live" : ""}" style="height:${Math.max(2, Math.round((m.incentive / maxInc) * 100))}%"></span>
        <span class="tl">${esc(m.key)}</span></div>`).join("")}</div>
    </div>`;

  /* per engineer */
  const byEng = new Map();
  for (const k of inCur) for (const n of (k.engineers.length ? k.engineers : ["Unassigned"])) {
    if (!byEng.has(n)) byEng.set(n, []);
    byEng.get(n).push(k);
  }
  const engRows = [...byEng.entries()].map(([n, rows]) => ({ n, ...sumRows(rows) }))
    .sort((a, b) => b.incentive - a.incentive || b.count - a.count);
  out += `<div class="section-head"><h2>By engineer</h2><span class="hint">Credited on the KPI row; a milestone with several names counts for each</span></div>
    <div class="panel scroller${engRows.length > 14 ? " tall" : ""}"><table><thead><tr>
      <th>Engineer</th><th class="n">Milestones</th><th class="n">Incentive</th><th class="n">HBS share</th><th class="n">kWh / therms</th>
    </tr></thead><tbody>${engRows.map(e => `<tr>
      <td class="proj-name">${esc(e.n)}</td><td class="n num">${e.count}</td>
      <td class="n num">${money(e.incentive)}</td><td class="n num">${money(e.hbsShare)}</td><td class="n num">${qty(e.savings)}</td>
    </tr>`).join("")}</tbody></table></div>`;

  /* per utility */
  const byUtil = new Map();
  for (const k of inCur) {
    const u = k.utility || "—";
    if (!byUtil.has(u)) byUtil.set(u, []);
    byUtil.get(u).push(k);
  }
  const utilRows = [...byUtil.entries()].map(([u, rows]) => ({ u, ...sumRows(rows) })).sort((a, b) => b.incentive - a.incentive);
  out += `<div class="section-head"><h2>By utility programme</h2></div>
    <div class="panel scroller"><table><thead><tr><th>Utility</th><th class="n">Milestones</th><th class="n">Incentive</th><th class="n">kWh / therms</th></tr></thead>
    <tbody>${utilRows.map(x => `<tr><td>${esc(x.u)}</td><td class="n num">${x.count}</td><td class="n num">${money(x.incentive)}</td><td class="n num">${qty(x.savings)}</td></tr>`).join("")}</tbody></table></div>`;

  return out;
}

/* ---- projects view ---- */
function renderProjects(list) {
  const sorted = [...list].sort((a, b) => {
    const rank = { critical: 0, serious: 1, warning: 2, none: 3, good: 4 };
    return (rank[a.sev] - rank[b.sev]) || (b.daysInPhase || 0) - (a.daysInPhase || 0) || a.name.localeCompare(b.name);
  });
  if (!sorted.length) return `<div class="panel empty">No projects match these filters.</div>`;
  return `<div class="section-head"><h2>Every project, and what it needs next</h2>
    <span class="hint">Next step is derived from the live board status; the note beneath it is the most recent real entry on that project.</span></div>
  <div class="panel scroller tall"><table>
    <thead><tr>
      <th>Project</th><th>Stage</th><th>Status</th><th>What needs to happen</th><th>Who</th><th class="n">Days</th><th>Flag</th>
    </tr></thead>
    <tbody>${sorted.map(p => {
      const stage = p.current ? STAGES[STAGE_INDEX[p.current]].label : "Not started";
      const chatter = [...p.teams.slice(0, 2), ...p.meetings.slice(0, 2)];
      return `<tr>
        <td>
          <div class="proj-name">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}</div>

        </td>
        <td>${esc(stage)}<div class="ev">${esc(p.phase)}</div></td>
        <td>${esc(p.tuStatus || p.icfStatus || "—")}${p.sowStatus ? `<div class="ev">SOW: ${esc(p.sowStatus)}</div>` : ""}</td>
        <td>
          <div class="need">${esc(p.need)}</div>
          ${p.evidence ? `<div class="ev"><b>Latest:</b> ${esc(p.evidence.slice(0, 190))}${p.evidence.length > 190 ? "…" : ""} <span style="opacity:.75">(${esc(p.evidenceFrom)})</span></div>` : ""}
          ${chatter.length ? `<details class="detail"><summary>${chatter.length} recent mention${chatter.length > 1 ? "s" : ""} in Teams / meetings</summary>
            <div class="detail-body">${chatter.map(c => `<div><span class="k">${esc(c.source)} · ${esc(c.when || "")}</span><br>${esc(String(c.text).slice(0, 300))}</div>`).join("")}</div></details>` : ""}
          ${p.aiSummary ? `<details class="detail"><summary>Board update summary</summary><div class="detail-body">${esc(p.aiSummary)}</div></details>` : ""}

/* ---- shared row renderers ---- */
function pline(p, extra) {

/* ---- my desk: the manager's own work and the things to chase ---- */
function renderMyDesk(list) {
  const meIn = arr => arr.some(n => n === ME.name);

  const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;

  let out = `<div class="section-head"><h2>My desk</h2>
    <span class="hint">${esc(ME.name)} — everything with your name on it, plus what you should be chasing.</span></div>
    <div class="stats" style="margin-bottom:16px">
      ${stat(onMe.length, "On me now", "is-critical")}
      ${stat(myTodos.length, "Workload to-dos", "")}
      ${stat(chase.length, "To chase", "is-serious")}
      ${stat(noOwner.length, "Nobody owns", "is-serious")}
      ${stat(mine.length, "Projects I touch", "")}

  out += `<div class="section-head"><h2>On me now</h2><span class="hint">The board says the next step is yours</span>
    <span class="hint num" style="margin-left:auto">${onMe.length}</span></div>` + ptable(onMe, { priority: true });

  if (state.workloadLoading) out += `<div class="skel"><span class="spin"></span>Reading your workload boards…</div>`;

  else if (myTodos.length) {
    out += `<div class="section-head"><h2>My workload to-dos</h2><span class="hint">From the Preapproval and Closeout workload boards</span>
      <span class="hint num" style="margin-left:auto">${myTodos.length}</span></div>` + todoTable(myTodos);
  }

  out += `<div class="section-head"><h2>To chase</h2><span class="hint">Yours to shepherd, but the next step sits with someone else</span>
    <span class="hint num" style="margin-left:auto">${chase.length}</span></div>` + ptable(chase, { priority: true });

  out += `<div class="section-head"><h2>Nobody owns the next step</h2><span class="hint">A manager call — these have no assignee on the board</span>
    <span class="hint num" style="margin-left:auto">${noOwner.length}</span></div>` + ptable(noOwner.slice(0, 40), { priority: true });

  if (upcoming.length) {

  }
  return out;

/* ---- team to-dos: one card per HBS person ---- */
function renderTodos() {
  if (state.workloadLoading) return `<div class="skel"><span class="spin"></span>Reading the Preapproval and Closeout workload boards…</div>`;

const WATCH_BUCKETS = [
  { key: "implDone", title: "Implementation completed", hint: "Implementation and M&V are done — the closeout package is now owed.",
