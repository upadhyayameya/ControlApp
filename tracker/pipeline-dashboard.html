       a leg takes. Compare that against the queue and against the people who
       have actually moved something this period. */
    const live = state.projects.filter(p => lifecycle(p) === "active");
    const { awaitingPA, awaitingCO } = workInHand(live);
    const cyc = cycleByEngineer(live);
    const avgOf = key => {
      const vals = cyc.map(c => c[key]).filter(v => v != null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    };
    const paDays = avgOf("paDays"), coDays = avgOf("coDays");

    /* Capacity is measured, not derived from cycle time. An engineer carries a
       portfolio in parallel, so elapsed days from audit to submission says
       nothing about how many they can carry at once — dividing a queue by it
       gives an absurd headcount. What answers the question is how many each
       engineer actually submitted per period, taken from the KPI board. */
    const perEngine = (phase) => {
      const rows2 = inCur.filter(k => k.milestone === phase);
      const people2 = new Set(rows2.flatMap(k => k.engineers));
      return people2.size ? { rate: rows2.length / people2.size, n: people2.size, done: rows2.length } : null;
    };
    const paThru = perEngine("Preapprovals Submitted");
    const coThru = perEngine("Closeouts Submitted");
    const needEngPA = paThru && paThru.rate > 0 ? Math.ceil(awaitingPA.length / paThru.rate) : null;
    const needEngCO = coThru && coThru.rate > 0 ? Math.ceil(awaitingCO.length / coThru.rate) : null;
    const activeEng = new Set(inCur.flatMap(k => k.engineers)).size;

    const rowsChart = cyc.filter(c => c.paDays != null || c.coDays != null).slice(0, 12).map(c => ({
      k: c.name,
      v: Math.round(c.paDays ?? c.coDays ?? 0),
      label: [c.paDays != null ? `PA ${Math.round(c.paDays)}d` : null,
              c.coDays != null ? `CO ${Math.round(c.coDays)}d` : null].filter(Boolean).join("  ·  "),
      tone: (c.paDays ?? c.coDays) > (paDays || 45) * 1.35 ? "critical"
          : (c.paDays ?? c.coDays) > (paDays || 45) ? "warning" : "good",
      title: `${c.name}: ${c.paN} pre-approvals, ${c.coN} closeouts measured`,
    }));

    return `<div class="section-head"><h2>How many engineers the work in hand needs</h2>
      <span class="hint">Queue size divided by how many each engineer actually submitted this period</span></div>
      <div class="panel" style="padding:16px 18px;margin-bottom:18px;display:grid;gap:14px">
        <div class="stats">
          ${tile(awaitingPA.length, "Awaiting a pre-approval submission", paThru ? `${paThru.rate.toFixed(1)} per engineer this ${esc(state.period)}` : "no throughput measured")}
          ${tile(needEngPA == null ? "—" : needEngPA, "Engineers that would need", paThru ? `${paThru.n} submitted ${paThru.done} between them` : "")}
          ${tile(awaitingCO.length, "Awaiting a closeout submission", coThru ? `${coThru.rate.toFixed(1)} per engineer this ${esc(state.period)}` : "no throughput measured")}
          ${tile(needEngCO == null ? "—" : needEngCO, "Engineers that would need", coThru ? `${coThru.n} submitted ${coThru.done} between them` : "")}
          ${tile(activeEng || "—", "Engineers who moved something", "this period, on the KPI board")}
        </div>
        ${(needEngPA != null || needEngCO != null) ? `<div class="ans-note">
          At the rate each engineer actually submitted this ${esc(state.period)}, clearing both queues would take about
          <b>${Math.max(needEngPA || 0, needEngCO || 0)}</b> engineer${Math.max(needEngPA || 0, needEngCO || 0) === 1 ? "" : "s"}
          working both legs${activeEng ? `, against ${activeEng} who moved something` : ""}.
          Raising the rate is the alternative to adding people: one more pre-approval each per ${esc(state.period)}
          ${paThru ? `takes it from ${paThru.rate.toFixed(1)} to ${(paThru.rate + 1).toFixed(1)}, and the queue from
          ${needEngPA} engineers to ${Math.ceil(awaitingPA.length / (paThru.rate + 1))}` : ""}.
          <br><br>This counts submissions per engineer, not elapsed days — an engineer carries several projects at once,
          so the days below measure how long a project waits, not how many one person can hold.
        </div>` : `<div class="ev">Not enough submitted this period to measure a rate.</div>`}
      </div>

    <div class="section-head"><h2>Days per engineer</h2>
      <span class="hint">Average days from audit to pre-approval submitted, and from implementation to closeout submitted</span></div>
      <div class="panel" style="padding:16px 18px;margin-bottom:12px">
        ${rowsChart.length ? barChart(rowsChart) : `<div class="ev">No completed legs to measure.</div>`}
        <div class="chart-legend">
          <span><i style="background:var(--good)"></i> at or under the team average</span>
          <span><i style="background:var(--warning)"></i> above average</span>
          <span><i style="background:var(--critical)"></i> well above</span>
        </div>
      </div>
      <div class="panel scroller" style="margin-bottom:18px"><table><thead><tr>
        <th>Engineer</th><th class="n">Days to submit PA</th><th class="n">Measured on</th>
        <th class="n">Days to submit CO</th><th class="n">Measured on</th></tr></thead><tbody>
        ${cyc.map(c => `<tr>
          <td><button class="linkish" data-engineer="${esc(c.name)}">${esc(c.name)}</button></td>
          <td class="n num">${c.paDays != null ? Math.round(c.paDays) : "—"}</td>
          <td class="n num ev">${c.paN || "—"}</td>
          <td class="n num">${c.coDays != null ? Math.round(c.coDays) : "—"}</td>
          <td class="n num ev">${c.coN || "—"}</td>
        </tr>`).join("")}
        </tbody></table></div>`;
  })()}

  <div class="section-head"><h2>By engineer</h2>
    <span class="hint">HBS from the KPI board; ICF taken from the pipeline where the project matches</span></div>
    <div class="panel scroller tall"><table><thead><tr>
      <th>Engineer</th><th>Side</th><th class="n">Audits</th><th class="n">PAs</th><th class="n">COs</th>
      <th class="n">$ per engineer</th><th class="n">kWh per engineer</th><th class="n">Avg $ per milestone</th></tr></thead><tbody>
      ${engRows.length ? engRows.map(x => `<tr>
        <td><button class="linkish" data-engineer="${esc(x.name)}">${esc(x.name)}</button></td>
        <td><span class="chip ${x.org === "ICF" ? "chip-icf" : "chip-hbs"}">${x.org}</span></td>
        <td class="n num">${x.audits || "—"}</td>
        <td class="n num">${x.pas || "—"}</td>
        <td class="n num">${x.cos || "—"}</td>
        <td class="n num"><b>${money(x.incentive)}</b></td>
        <td class="n num"><b>${qty(x.savings)}</b></td>
        <td class="n num">${money(x.avgInc)}</td>
      </tr>`).join("") : `<tr><td colspan="8" class="ev">Nothing in this period.</td></tr>`}
      </tbody></table></div>`;

  /* ---- thirteen months, stage by stage ---- */
  const now2 = new Date();
  const buckets = [];
  for (let i = 12; i >= 0; i--) {
    const d = new Date(now2.getFullYear(), now2.getMonth() - i, 1);
    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
                   label: d.toLocaleString("en-US", { month: "short" }) + (d.getMonth() === 0 ? " " + String(d.getFullYear()).slice(2) : "") });
  }
  const idxOf = when => {
    if (!when) return -1;
    const d = dparse(when) || when;
    if (!(d instanceof Date) || isNaN(d)) return -1;
    return buckets.findIndex(b => b.key === `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };
  const monthly = phase => {
    const n = buckets.map(() => 0), inc = buckets.map(() => 0), kwh = buckets.map(() => 0);
    for (const k of scoped) {
      if (phase && k.milestone !== phase) continue;
      const i = idxOf(k.when);
      if (i < 0) continue;
      n[i]++; inc[i] += k.incentive || 0; kwh[i] += k.savings || 0;
    }
    return { n, inc, kwh, avgInc: n.map((c, i) => c ? inc[i] / c : 0), avgKwh: n.map((c, i) => c ? kwh[i] / c : 0) };
  };
  const mAudit = monthly("Audits Performed");
  const mPAs   = monthly("Preapprovals Submitted");
  const mPAr   = monthly("Preapprovals Received");
  const mImpl  = monthly("Implementations Scheduled");
  const mCO    = monthly("Closeouts Received");
  const labels = buckets.map(b => b.label);

  out += `<div class="section-head"><h2>Thirteen months, stage by stage</h2>
    <span class="hint">What an audit was worth, then how much of it made it through each stage</span></div>
    <div class="panel" style="padding:6px 18px 14px">
      ${monthCols(mAudit.avgInc, labels, { k: "Average audit value", sub: "incentive per audit", fmt: money })}
      ${monthCols(mAudit.avgKwh, labels, { k: "Average audit savings", sub: "kWh / therms per audit", fmt: v => qty(Math.round(v)) })}
      ${monthCols(mAudit.n, labels, { k: "Audits completed", tone: "good" })}
      ${monthCols(mPAs.n, labels, { k: "Pre-approvals submitted" })}
      ${monthCols(mPAr.n, labels, { k: "Pre-approvals received" })}
      ${monthCols(mImpl.n, labels, { k: "Implementations scheduled", tone: "warning" })}
      ${monthCols(mCO.n, labels, { k: "Closeouts completed", tone: "good" })}
    </div>
    <div class="ans-note" style="margin-bottom:20px">
      Read top to bottom: the first two rows are what one audit is worth, the rest are how many
      survived each stage that month. Implementations scheduled is recorded on only
      ${mImpl.n.reduce((a, b) => a + b, 0)} rows across the whole period, so that row understates the real work.
    </div>`;

  return out;
}

/* --------------------------------------------------------------------------
   Notes and tasks.

   Type what needs to happen. Whatever names a project is posted to that
   project as a monday update — the comment thread, so nothing is overwritten
   and any entry can be deleted. Anything that is an action becomes a task on
   the shared to-do board with an owner and a due date.

   Matching is the same one the meeting briefs and reply logger use, and the
   page never posts to a project it had to guess at.
-------------------------------------------------------------------------- */
function noteMatches(text) {
  const paras = String(text).split(/\n\s*\n|\n(?=\s*[-*•]\s)/).map(p => p.trim()).filter(p => p.length > 3);
  const index = state.projects.map(p => ({ p, keys: matchKeys(p.name), pid: (p.projectId || "").toUpperCase() }));
  const perProject = new Map();
  const unplaced = [];
  for (const para of paras) {
    const hay = para.toLowerCase(), up = para.toUpperCase();
    const hits = index.filter(e => (e.pid.length >= 8 && up.includes(e.pid)) || e.keys.some(k => hay.includes(k)));
    if (!hits.length || hits.length > 3) { unplaced.push(para); continue; }
    for (const h of hits) {
      if (!perProject.has(h.p.id)) perProject.set(h.p.id, { project: h.p, paras: [] });
      perProject.get(h.p.id).paras.push(para);
    }
  }
  return { matches: [...perProject.values()], unplaced, paragraphs: paras.length };
}

async function postNote() {
  const text = state.note.trim();
  if (!text || state.noteBusy) return;
  const { matches } = noteMatches(text);
  if (!matches.length) return;
  state.noteBusy = true; state.noteResult = null; render();

  const stamp = new Date().toLocaleDateString(undefined, { dateStyle: "medium" });
  const ok = [], failed = [];
  for (const m of matches) {
    const body = `<b>${esc(ME.name)}</b> noted on ${esc(stamp)}:<br><br>` +
      m.paras.map(p => esc(p).replace(/\n/g, "<br>")).join("<br><br>");
    try {
      await call(MONDAY, "create_update", { itemId: Number(m.project.id), body }, { retry: false });
      ok.push(m.project.name);
    } catch (e) {
      failed.push({ name: m.project.name, err: mcpError(e) });
    }
  }
  state.noteBusy = false;
  state.noteResult = { kind: "note", ok, failed };
  if (!failed.length) state.note = "";
  render();
}

async function addTask(fields) {
  if (state.noteBusy) return;
  state.noteBusy = true; state.noteResult = null; render();
  const cols = {};
  if (fields.person) cols[TODO.person] = { labels: [fields.person] };
  if (fields.status) cols[TODO.status] = { label: fields.status };
  if (fields.priority) cols[TODO.priority] = { label: fields.priority };
  if (fields.due) cols[TODO.due] = { date: fields.due };
  if (fields.notes) cols[TODO.notes] = fields.notes;
  try {
    await call(MONDAY, "create_item", {
      boardId: BOARD_TODO, groupId: "topics", name: fields.name.slice(0, 255),
      columnValues: JSON.stringify(cols),
    }, { retry: false });
    state.noteBusy = false;
    state.noteResult = { kind: "task", ok: [fields.name], failed: [] };
    state.note = "";
    await loadTasks(true);
  } catch (e) {
    state.noteBusy = false;
    state.noteResult = { kind: "task", ok: [], failed: [{ name: fields.name, err: mcpError(e) }] };
    render();
  }
}

/* --------------------------------------------------------------------------
   The assistant.

   It answers from the boards, not from a language model: it recognises the
   projects and people you name, works out whether you are asking something or
   telling it something, replies with what it knows, and offers the write-backs
   that follow. Every answer is traceable to a row on a board.
-------------------------------------------------------------------------- */
const WEEKDAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];

/* "friday", "tomorrow", "next week", "in 3 days", "on the 28th" */
function readDate(text) {
  const t = text.toLowerCase();
  const base = new Date(); base.setHours(0, 0, 0, 0);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  if (/\btoday\b/.test(t)) return iso(base);
  if (/\btomorrow\b/.test(t)) { const d = new Date(base); d.setDate(d.getDate() + 1); return iso(d); }
  if (/\bnext week\b/.test(t)) { const d = new Date(base); d.setDate(d.getDate() + 7); return iso(d); }
  const inDays = t.match(/\bin (\d{1,2}) days?\b/);
  if (inDays) { const d = new Date(base); d.setDate(d.getDate() + Number(inDays[1])); return iso(d); }
  const explicit = t.match(/\b(\d{4}-\d{2}-\d{2})\b/);
  if (explicit) return explicit[1];
  for (let i = 0; i < 7; i++) {
    if (new RegExp(`\\b(next |this )?${WEEKDAYS[i]}\\b`).test(t)) {
      const d = new Date(base);
      let delta = (i - d.getDay() + 7) % 7;
      if (delta === 0) delta = 7;
      if (/\bnext /.test(t)) delta += 7;
      d.setDate(d.getDate() + delta);
      return iso(d);
    }
  }
  return "";
}

function peopleIndex() {
  const names = new Set();
  for (const p of state.projects) { for (const n of p.hbsAll) names.add(n); for (const n of p.icfEngs) names.add(n); }
  return [...names];
}

function readPeople(text) {
  const t = text.toLowerCase();
  return peopleIndex().filter(n => {
    const parts = n.toLowerCase().split(/\s+/);
    if (t.includes(n.toLowerCase())) return true;
    return parts[0].length >= 4 && new RegExp(`\\b${parts[0]}\\b`).test(t);
  });
}

const ASK = /^(who|what|when|which|how many|how much|where|why|is |are |does |do |can )/i;
const ACTION_VERBS = /\b(chase|call|email|schedule|submit|resubmit|assign|follow up|send|check|book|order|fix|review|remind|escalate|close out|invoice)\b/i;

function projectLine(p) {
  const bits = [p.phase, p.icfStatus || p.tuStatus, p.utility && utilityLabel(p.utility)].filter(Boolean).join(" · ");
  return `<div class="ans-row">
    <div class="t">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}
      <span class="cell num ${p.band === "critical" ? "m5" : p.band === "serious" ? "m4" : p.band === "warning" ? "m2" : "m0"}"
            title="${esc(p.priorityWhy.join("; "))}">${p.priority}</span></div>
    <div class="s">${esc(p.need)}${p.ownerNames.length ? ` — <b>${esc(p.ownerNames.join(", "))}</b>` : ` — <b>nobody assigned</b>`}</div>
    <div class="m">${esc(bits)}${p.daysInPhase != null ? ` · ${p.daysInPhase} days in phase` : ""}</div>
    ${p.evidence ? `<div class="m"><b>Latest:</b> ${esc(p.evidence.slice(0, 160))}</div>` : ""}
  </div>`;
}

/* Work out what was said, and answer it from the boards. */
function assistantReply(text) {
  const raw = text.trim();
  const t = raw.toLowerCase();
  const list = state.projects;
  const { matches, unplaced } = noteMatches(raw);
  const named = matches.map(m => m.project);
  const people = readPeople(raw);
  const asking = ASK.test(raw) || raw.trim().endsWith("?");
  const actions = [];
  let html = "";

  const me = n => n && ME.name && n.toLowerCase().includes(ME.name.split(" ")[0].toLowerCase());

  /* ---- a project was named ---- */
  if (named.length) {
    html += `<p>${named.length === 1 ? "Here is where that stands." : `Here is where those ${named.length} stand.`}</p>`;
    html += named.map(projectLine).join("");

    const chatter = named.flatMap(p => [
      ...(p.teams || []).map(m => ({ ...m, src: "Teams" })),
      ...(p.meetings || []).map(m => ({ title: m.title, when: m.when, src: "Fireflies" })),
    ]).slice(0, 3);
    if (chatter.length) {
      html += `<div class="ans-note"><b>Recently mentioned in</b><br>${chatter.map(c =>
        `${esc(c.src)} · ${esc(c.when || "")} — ${esc((c.text || c.title || "").slice(0, 120))}`).join("<br>")}</div>`;
    }

    if (!asking) {
      actions.push({ kind: "note", label: `Log this on ${named.length} project${named.length > 1 ? "s" : ""}` });
      if (ACTION_VERBS.test(raw)) {
        const due = readDate(raw);
        const owner = people.find(n => !me(n)) || named[0].ownerNames[0] || "";
        actions.push({ kind: "task", label: `Make it a task${due ? ` due ${due}` : ""}`, due, owner });
      } else {
        actions.push({ kind: "task", label: "Make it a task", due: readDate(raw), owner: people[0] || "" });
      }
    }
    if (unplaced.length && !asking) {
      html += `<div class="ans-note">${unplaced.length} line${unplaced.length > 1 ? "s" : ""} didn't name a project, so ${unplaced.length > 1 ? "they are" : "it is"} not going anywhere on their own.</div>`;
    }
    return { html, actions };
  }

  /* ---- a person was named ---- */
  if (people.length && !named.length) {
    const who = people[0];
    const theirs = list.filter(p => p.hbsAll.includes(who) || p.icfEngs.includes(who));
    const owed = theirs.filter(p => p.ownerNames.includes(who)).sort((a, b) => b.priority - a.priority);
    const aged = theirs.filter(p => p.aging === "Critical");
    html += `<p><b>${esc(who)}</b> — ${theirs.length} active project${theirs.length === 1 ? "" : "s"}, ${owed.length} where the next step is theirs, ${aged.length} past 60 days.</p>`;
    if (owed.length) html += owed.slice(0, 6).map(projectLine).join("");
    else html += `<div class="ans-note">Nothing is currently sitting with them.</div>`;
    if (theirs.length) actions.push({ kind: "goto", label: `Open ${who.split(" ")[0]}'s projects`, engineer: who });
    if (ACTION_VERBS.test(raw)) actions.push({ kind: "task", label: "Make it a task", due: readDate(raw), owner: who });
    return { html, actions };
  }

  /* ---- general questions ---- */
  const rfis = list.filter(p => p.tuStatus === "TRC/ICF RFI Received" || p.icfStatus === "RFI Sent to HBS" || p.icfStatus === "RFI Respond by HBS");
  const flawed = list.filter(p => /Flawed|FLAWED/.test(`${p.tuStatus} ${p.icfStatus}`));
  const noOwner = list.filter(p => !p.ownerNames.length && p.phase !== "Completed Project");
  const aged = list.filter(p => p.aging === "Critical").sort((a, b) => (b.daysInPhase || 0) - (a.daysInPhase || 0));
  const mine = list.filter(p => p.hbsAll.some(me) || p.ownerNames.some(me));

  const answer = (title, rows, empty) => {
    html += `<p>${title}</p>`;
    html += rows.length ? rows.slice(0, 8).map(projectLine).join("") +
      (rows.length > 8 ? `<div class="ans-note">…and ${rows.length - 8} more.</div>` : "")
      : `<div class="ans-note">${empty}</div>`;
  };

  if (/\brfi/.test(t)) { answer(`${rfis.length} RFI${rfis.length === 1 ? "" : "s"} outstanding.`, rfis, "No RFIs outstanding."); actions.push({ kind: "goto", label: "Open ASAP", view: "asap" }); }
  else if (/\bflaw/.test(t)) answer(`${flawed.length} flawed.`, flawed, "Nothing is flawed.");
  else if (/(no one|nobody|unassigned|no owner|who owns nothing)/.test(t)) answer(`${noOwner.length} with nobody assigned.`, noOwner, "Everything has an owner.");
  else if (/(stuck|ag(e)?ing|oldest|stale|60 days)/.test(t)) answer(`${aged.length} past 60 days.`, aged, "Nothing is past 60 days.");
  else if (/\b(mine|my|i own|on me)\b/.test(t)) { answer(`${mine.length} on you.`, mine.sort((a, b) => b.priority - a.priority), "Nothing is assigned to you."); actions.push({ kind: "goto", label: "Open My desk", view: "mydesk" }); }
  else if (/\b(today|this week|due|deadline|coming up)\b/.test(t)) {
    const soon = list.filter(p => p.nextActionDate && p.nextActionDate >= isoDay(0) && p.nextActionDate <= isoDay(7))
      .sort((a, b) => String(a.nextActionDate).localeCompare(String(b.nextActionDate)));
    answer(`${soon.length} with a next action inside seven days.`, soon, "Nothing dated in the next seven days.");
  }
  else if (/\b(priorit|asap|urgent|worst|attention)\b/.test(t)) { answer("Highest priority right now.", list.slice().sort((a, b) => b.priority - a.priority), "Nothing ranked."); actions.push({ kind: "goto", label: "Open ASAP", view: "asap" }); }
  else if (asking) {
    html += `<p>I couldn't tie that to a project or a person. I answer from the boards, so I do best with a name.</p>
      <div class="ans-note">Try a site name, an engineer, or one of: RFIs · flawed · unassigned · stuck · what's mine · due this week · priorities.</div>`;
  }
  else {
    html += `<p>Nothing in that named a project, so I can't file it against one.</p>
      <div class="ans-note">Name the site and I'll log it there, or make it a standalone task.</div>`;
    actions.push({ kind: "task", label: "Make it a task anyway", due: readDate(raw), owner: people[0] || "" });
  }
  return { html, actions };
}

async function chatSend(text) {
  const raw = (text || "").trim();
  if (!raw || state.noteBusy) return;
  state.chat.push({ who: "you", text: raw });
  const { html, actions } = assistantReply(raw);
  state.chat.push({ who: "tracker", html, actions, source: raw });
  state.note = "";
  state.chatDraft = "";
  render();
  const feed = $("#chat-feed"); if (feed) feed.scrollTop = feed.scrollHeight;
}

async function runChatAction(idx, ai) {
  const msg = state.chat[idx];
  if (!msg || !msg.actions) return;
  const a = msg.actions[ai];
  if (!a) return;
  if (a.kind === "goto") {
    state.view = a.view || "projects";
    if (a.engineer) state.engineer = a.engineer;
    render();
    return;
  }
  state.note = msg.source;
  if (a.kind === "note") {
    await postNote();
    state.chat.push({ who: "tracker", html: state.noteResult && !state.noteResult.failed.length
      ? `<p>Logged on ${state.noteResult.ok.length} project${state.noteResult.ok.length > 1 ? "s" : ""}: ${esc(state.noteResult.ok.join(", "))}.</p>`
      : `<p>That didn't post — ${esc(state.noteResult ? fixCopy(state.noteResult.failed[0].err, MONDAY) : "unknown error")}</p>` });
  } else if (a.kind === "task") {
    /* Name it after the project and the first clause, not the whole paragraph. */
    const first = msg.source.split(/\n/)[0].replace(/^[-*•]\s*/, "").trim();
    const clause = (first.split(/(?<=[.;])\s|,\s(?=(?:chase|call|email|schedule|submit|resubmit|assign|follow|send|check|book|order|fix|review|remind)\b)/i)[0] || first).trim();
    let name = clause.length > 5 ? clause : first;
    if (name.length > 90) name = name.slice(0, 87).replace(/\s+\S*$/, "") + "…";
    await addTask({ name, notes: msg.source.slice(name.length).trim().slice(0, 500),
      person: a.owner && TODO_PEOPLE.includes(a.owner.split(" ")[0]) ? a.owner.split(" ")[0] : "Caitlyn",
      priority: "Medium", status: "Working on it", due: a.due || "" });
    state.chat.push({ who: "tracker", html: state.noteResult && !state.noteResult.failed.length
      ? `<p>Added “${esc(name)}” to the task list${a.due ? `, due ${esc(a.due)}` : ""}.</p>`
      : `<p>That didn't save — ${esc(state.noteResult ? fixCopy(state.noteResult.failed[0].err, MONDAY) : "unknown error")}</p>` });
  }
  render();
  const feed = $("#chat-feed"); if (feed) feed.scrollTop = feed.scrollHeight;
}

const CHAT_SUGGESTIONS = ["What's on me?", "Any RFIs outstanding?", "What's stuck?", "Which have nobody assigned?", "Priorities"];

function renderNotes() {
  let out = `<div class="section-head"><h2>Ask the tracker</h2>
    <span class="hint">Answers come from the boards, not a language model — name a project or a person and it will tell you what it knows, then offer to write it back.</span>
    ${state.chat.length ? `<button id="chat-clear" style="margin-left:auto">Clear conversation</button>` : ""}</div>`;

  out += `<div class="chat">
    <div class="chat-feed" id="chat-feed">
      ${state.chat.length ? state.chat.map((m, i) => m.who === "you"
        ? `<div class="bub you">${esc(m.text)}</div>`
        : `<div class="bub bot">${m.html}${m.actions && m.actions.length
            ? `<div class="bub-acts">${m.actions.map((a, ai) =>
                `<button data-chat-act="${i}:${ai}" ${state.noteBusy ? "disabled" : ""}>${esc(a.label)}</button>`).join("")}</div>` : ""}</div>`).join("")
        : `<div class="bub bot"><p>Tell me what's happening, or ask me something.</p>
           <div class="ans-note">“Ice World is waiting on the client for the ECM list, chase Robert Friday” — I'll show you the project and offer to log it or turn it into a task.</div></div>`}
      ${state.noteBusy ? `<div class="bub bot"><span class="spin"></span> Working…</div>` : ""}
    </div>
    <div class="chat-sugg">${CHAT_SUGGESTIONS.map(s => `<button class="chip-btn" data-chat-sugg="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div class="chat-input">
      <textarea id="chat-box" rows="2" placeholder="Name a site or a person…">${esc(state.chatDraft || "")}</textarea>
      <button id="chat-send" class="btn-primary" ${state.noteBusy ? "disabled" : ""}>Send</button>
    </div>
    <div class="ev">Enter to send, Shift+Enter for a new line. Nothing is written to monday until you press one of the buttons in a reply.</div>
  </div>`;

  /* ---- the shared task list ---- */
  if (state.tasksLoading) out += `<div class="skel"><span class="spin"></span>Reading the shared to-do board…</div>`;
  else if (state.errors.tasks) out += errNote("Shared to-do board", state.errors.tasks, MONDAY);
  else {
    /* The to-do board only holds what someone typed there. The work that
       actually needs doing is on the pipeline and the workload boards, so all
       three feed this list and each row says where it came from. */
    const typed = state.tasks.filter(t => t.group !== "Completed" && t.status !== "Done")
      .map(t => ({ ...t, src: "task" }));

    const live = state.projects.filter(p => lifecycle(p) === "active");
    const derived = [];
    for (const p of live) {
      if (p.band !== "critical" && p.band !== "serious") continue;
      const owners = p.ownerNames.length ? p.ownerNames : ["Unassigned"];
      for (const n of owners) {
        derived.push({
          id: "p" + p.id + n, name: p.name, url: p.url, person: n, src: "project",
          status: p.tuStatus || p.icfStatus || "", priority: p.band === "critical" ? "Critical ⚠️️" : "High",
          due: p.nextActionDate || "", notes: p.need, priorityScore: p.priority,
        });
      }
    }

    const fromWorkload = (state.todos || []).filter(t => !t.done).map(t => ({
      id: "w" + t.id, name: t.name, url: t.url, person: t.person, src: "workload",
      status: t.status || t.kind || "", priority: t.overdue ? "Critical ⚠️️" : "",
      due: t.due || "", notes: t.kind ? t.kind + " workload" : "",
    }));

    const open = [...typed, ...derived, ...fromWorkload];
    const byPerson = new Map();
    for (const t of open) {
      for (const n of (t.person ? String(t.person).split(",").map(x => x.trim()) : ["Unassigned"])) {
        if (!byPerson.has(n)) byPerson.set(n, []);
        byPerson.get(n).push(t);
      }
    }
    /* Caitlyn and Ameya first — this list exists for the two of them. */
    const order = [...byPerson.keys()].sort((a, b) => {
      const rank = n => n === "Caitlyn" ? 0 : n === "Ameya" ? 1 : 2;
      return rank(a) - rank(b) || byPerson.get(b).length - byPerson.get(a).length || a.localeCompare(b);
    });
    const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;
    const today = isoDay(0);

    out += `<div class="section-head"><h2>Everything on the team's plate</h2>
      <span class="hint">Typed tasks, workload items and projects whose next step is owed — by owner</span>
      <span class="hint num" style="margin-left:auto">${open.length} open</span></div>
      <div class="stats" style="margin-bottom:14px">
        ${stat((byPerson.get("Caitlyn") || []).length, "Caitlyn", "")}
        ${stat((byPerson.get("Ameya") || []).length, "Ameya", "")}
        ${stat(open.filter(t => t.due && t.due < today).length, "Overdue", "is-critical")}
        ${stat(open.filter(t => /Critical/.test(t.priority)).length, "Critical", "is-critical")}
        ${stat(open.filter(t => t.status === "Stuck" || t.status === "Waiting on information").length, "Blocked", "is-serious")}
      </div>`;

    if (!order.length) {
      out += `<div class="panel empty">No open tasks yet. Write a note above and press “Add as task”.</div>`;
    } else {
      out += `<div class="cards">${order.map(person => {
        const items = byPerson.get(person).sort((a, b) =>
          (b.priorityScore || 0) - (a.priorityScore || 0) ||
          String(a.due || "9999").localeCompare(String(b.due || "9999")));
        return `<div class="card">
          <div class="card-hd">
            <span class="avatar">${esc(person.slice(0, 2).toUpperCase())}</span>
            <span class="nm">${esc(person)}</span>
            <span class="to">${items.length} open</span>
          </div>
          <div class="card-bd"><div class="panel scroller"><table><thead><tr>
            <th>Task</th><th>From</th><th>Status</th><th>Priority</th><th>Due</th><th>What it needs</th></tr></thead><tbody>
            ${items.map(t => `<tr>
              <td><div class="proj-name">${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a>` : esc(t.name)}</div></td>
              <td><span class="chip">${t.src === "task" ? "typed" : t.src === "workload" ? "workload" : "project"}</span></td>
              <td>${t.status ? `<span class="sev ${t.status === "Stuck" ? "sev-critical" : t.status === "Waiting on information" ? "sev-warning" : "sev-none"}">${esc(t.status)}</span>` : "—"}</td>
              <td>${t.priority ? esc(t.priority) : "—"}</td>
              <td class="num">${t.due ? `${esc(t.due)}${t.due < today ? ` <span class="sev sev-critical">overdue</span>` : ""}` : `<span class="ev">—</span>`}</td>
              <td class="ev">${esc(t.notes.slice(0, 120))}</td>
            </tr>`).join("")}</tbody></table></div></div>
        </div>`;
      }).join("")}</div>`;
    }
  }
  return out;
}

/* --------------------------------------------------------------------------
   Strategy.

   The one real strategic choice here is volume against quality. Submitting
   more raises what goes in, but a flawed or queried application comes back and
   is submitted again, so the work that counts — approved applications — does
   not rise as fast as the work that is sent. This tab estimates that trade-off
   from what the boards already record, and works out the submission rate that
   maximises approvals rather than submissions.

   It deliberately does not model ICF or TRC as an opponent. They are a partner,
   the boards cannot observe their costs, and the useful question is not how to
   beat them — it is how to submit in the way their review actually rewards.
-------------------------------------------------------------------------- */
const REWORK_STATUSES = [
  "TRC/ICF RFI Received", "TRC/ICF RFI Responded", "FLAWED in Portal",
  "Review sent back for corrections", "Re-Audit Needed",
];
const REWORK_ICF = ["Flawed", "Flawed ARC", "RFI Sent to HBS", "RFI Respond by HBS", "Internal Update Required"];

function strategyStats() {
  const live = state.projects.filter(p => lifecycle(p) === "active");
  const all  = state.projects;

  /* Per engineer: how much they have in flight, how much of it is in rework,
     and how long their submissions take to come back approved. */
  const per = new Map();
  const touch = n => {
    if (!per.has(n)) per.set(n, { name: n, inFlight: 0, rework: 0, submitted: 0, approved: 0, days: [] });
    return per.get(n);
  };
  for (const p of live) {
    const owners = new Set([...(p.hbsAll || [])]);
    const isRework = REWORK_STATUSES.includes(p.tuStatus) || REWORK_ICF.includes(p.icfStatus);
    for (const n of owners) {
      const e = touch(n);
      e.inFlight++;
      if (isRework) e.rework++;
    }
  }
  for (const p of all) {
    const owners = new Set([...(p.hbsAll || [])]);
    const d = p.evDates || {};
    for (const n of owners) {
      const e = touch(n);
      if (d.dSubPA) e.submitted++;
      if (d.dPAd) e.approved++;
      if (d.dSubPA && d.dPAd) {
        const days = Math.round((dparse(d.dPAd) - dparse(d.dSubPA)) / 86400000);
        if (days >= 0 && days < 400) e.days.push(days);
      }
    }
  }
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const rows = [...per.values()].filter(e => e.inFlight >= 2 || e.submitted >= 2).map(e => ({
    ...e,
    reworkRate: e.inFlight ? e.rework / e.inFlight : 0,
    approvalRate: e.submitted ? e.approved / e.submitted : null,
    turnaround: mean(e.days),
  })).sort((a, b) => b.inFlight - a.inFlight);

  /* Team-level: does carrying more actually correlate with more rework? */
  const withBoth = rows.filter(r => r.inFlight >= 3);
  const n = withBoth.length;
  let slope = 0, corr = 0;
  if (n >= 3) {
    const xs = withBoth.map(r => r.inFlight), ys = withBoth.map(r => r.reworkRate);
    const mx = mean(xs), my = mean(ys);
    const sxy = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0);
    const sxx = xs.reduce((a, x) => a + (x - mx) ** 2, 0);
    const syy = ys.reduce((a, y, i) => a + (ys[i] - my) ** 2, 0);
    slope = sxx ? sxy / sxx : 0;
    corr = (sxx && syy) ? sxy / Math.sqrt(sxx * syy) : 0;
  }
  return { rows, slope, corr, n, live };
}

function renderStrategy() {
  if (!state.projects.length) return `<div class="panel empty">No projects loaded yet.</div>`;
  const { rows, slope, corr, n, live } = strategyStats();
  const teamRework = live.length
    ? live.filter(p => REWORK_STATUSES.includes(p.tuStatus) || REWORK_ICF.includes(p.icfStatus)).length / live.length : 0;

  const tile = (v, l, sub) => `<div class="stat"><div class="v num">${v}</div><div class="l">${esc(l)}</div>${sub ? `<div class="ev">${sub}</div>` : ""}</div>`;
  const pct = x => `${Math.round(x * 100)}%`;

  let out = `<div class="section-head"><h2>Volume against quality</h2>
    <span class="hint">Submitting more only pays if it comes back approved — this is what the boards say about that trade</span></div>`;

  out += `<div class="stats" style="margin-bottom:16px">
    ${tile(live.length, "Live projects", "cancelled and completed excluded")}
    ${tile(pct(teamRework), "In rework right now", "flawed, queried or sent back")}
    ${tile(n >= 3 ? (corr >= 0 ? "+" : "") + corr.toFixed(2) : "—", "Load vs rework correlation",
        n >= 3 ? `across ${n} engineers` : "needs at least three engineers")}
    ${tile(n >= 3 ? (slope >= 0 ? "+" : "") + pct(slope) : "—", "Rework per extra project",
        n >= 3 ? "estimated, per project carried" : "")}
  </div>`;

  /* The reading, stated in plain terms rather than left to the reader. */
  let verdict, tone;
  if (n < 3) { verdict = "There are not enough engineers with a measurable book to estimate the trade-off yet."; tone = "ghost"; }
  else if (corr > 0.35) {
    verdict = `Carrying more is costing quality: each extra project a person holds is associated with about ${pct(Math.abs(slope))} more of their book landing in rework. Adding volume to the same people will return less than it appears to.`;
    tone = "critical";
  } else if (corr < -0.35) {
    verdict = `The people carrying most have the least rework, so load is not what drives quality here — the constraint is somewhere other than headcount.`;
    tone = "good";
  } else {
    verdict = `Load and rework are close to unrelated (correlation ${corr.toFixed(2)}), so on this evidence volume is not what drives rework. Look at the outliers below rather than at the average.`;
    tone = "warning";
  }
  out += `<div class="ans-note" style="margin-bottom:20px"><b>What this says.</b> ${esc(verdict)}</div>`;

  /* Per-engineer standings on the two axes that matter. */
  const chartRows = rows.slice(0, 14).map(r => ({
    k: r.name,
    v: Math.round(r.reworkRate * 100),
    of: 100,
    label: `${pct(r.reworkRate)} of ${r.inFlight}`,
    tone: r.reworkRate > teamRework * 1.4 ? "critical" : r.reworkRate > teamRework ? "warning" : "good",
    title: `${r.name}: ${r.rework} of ${r.inFlight} in rework${r.turnaround != null ? `, ${Math.round(r.turnaround)} day approval turnaround` : ""}`,
  }));

  out += `<div class="section-head"><h2>Rework, per engineer</h2>
    <span class="hint">Share of each person's live book sitting in flawed, queried or sent-back states</span></div>
    <div class="panel" style="padding:16px 18px;margin-bottom:12px">
      ${chartRows.length ? barChart(chartRows) : `<div class="ev">Not enough live work to compare.</div>`}
      <div class="chart-legend">
        <span><i style="background:var(--good)"></i> at or under the team's ${pct(teamRework)}</span>
        <span><i style="background:var(--warning)"></i> above it</span>
        <span><i style="background:var(--critical)"></i> well above</span>
      </div>
    </div>

  <div class="panel scroller tall" style="margin-bottom:20px"><table><thead><tr>
    <th>Engineer</th><th class="n">Live book</th><th class="n">In rework</th><th class="n">Rework rate</th>
    <th class="n">Submitted</th><th class="n">Approved</th><th class="n">Approval rate</th><th class="n">Approval turnaround</th>
  </tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td><button class="linkish" data-engineer="${esc(r.name)}">${esc(r.name)}</button></td>
      <td class="n num">${r.inFlight}</td>
      <td class="n num">${r.rework || "—"}</td>
      <td class="n num ${r.reworkRate > teamRework * 1.4 ? "" : ""}">${pct(r.reworkRate)}</td>
      <td class="n num">${r.submitted || "—"}</td>
      <td class="n num">${r.approved || "—"}</td>
      <td class="n num">${r.approvalRate == null ? "—" : pct(r.approvalRate)}</td>
      <td class="n num">${r.turnaround == null ? "—" : Math.round(r.turnaround) + "d"}</td>
    </tr>`).join("")}
  </tbody></table></div>`;

  /* The best-response calculation: what a change actually buys. */
  const avgApproval = rows.filter(r => r.approvalRate != null);
  const teamApproval = avgApproval.length ? avgApproval.reduce((a, r) => a + r.approvalRate, 0) / avgApproval.length : null;
  const submittedNow = rows.reduce((a, r) => a + r.submitted, 0);
  const approvedNow = rows.reduce((a, r) => a + r.approved, 0);

  const scenario = (label, dSub, dQual) => {
    const base = teamApproval || 0;
    const q = Math.max(0, Math.min(1, base * (1 + dQual)));
    const subs = submittedNow * (1 + dSub);
    return { label, subs: Math.round(subs), approved: Math.round(subs * q), q };
  };
  const now = { label: "As things stand", subs: submittedNow, approved: approvedNow, q: teamApproval || 0 };
  const scenarios = teamApproval == null ? [] : [
    now,
    scenario("Submit 20% more, same quality", 0.20, 0),
    scenario("Same volume, 20% fewer come back", 0, 0.20),
    scenario("Submit 20% more and it costs 15% quality", 0.20, -0.15),
  ];

  out += `<div class="section-head"><h2>What each move actually buys</h2>
    <span class="hint">Approved applications, not submitted ones — measured against the team's current approval rate</span></div>
    <div class="panel" style="padding:16px 18px;margin-bottom:12px">
      ${scenarios.length ? barChart(scenarios.map(x => ({
        k: x.label, v: x.approved,
        label: `${x.approved} approved`,
        tone: x.approved > now.approved ? "good" : x.approved < now.approved ? "critical" : null,
        title: `${x.label}: ${x.subs} submitted at ${pct(x.q)} approval`,
      }))) : `<div class="ev">No approval history yet to model against.</div>`}
    </div>
    ${scenarios.length ? (() => {
      /* State whichever lever the numbers actually favour, rather than
         asserting one. With a thin approval history, say that instead. */
      const moreVolume = scenarios[1], betterQuality = scenarios[2], both = scenarios[3];
      const thin = now.approved < 12;
      let read;
      if (thin) {
        read = `Only ${now.approved} approval${now.approved === 1 ? " is" : "s are"} recorded against ${now.subs} submissions,
          which is too thin a base to rank these against each other. The shape is right but the numbers will not
          mean much until more applications have been through.`;
      } else if (betterQuality.approved > moreVolume.approved) {
        read = `Cutting rework a fifth reaches <b>${betterQuality.approved}</b> approved without submitting anything extra,
          against <b>${moreVolume.approved}</b> from submitting a fifth more at today's quality. Quality is the cheaper lever here.`;
      } else if (moreVolume.approved > betterQuality.approved) {
        read = `Submitting a fifth more reaches <b>${moreVolume.approved}</b> approved, against <b>${betterQuality.approved}</b>
          from cutting rework a fifth. On these numbers volume pays better — the approval rate is already high enough
          that there is little rework left to win back.`;
      } else {
        read = `Both levers land at <b>${moreVolume.approved}</b>, so on current numbers there is nothing to choose between them.`;
      }
      const cost = both.approved - now.approved;
      return `<div class="ans-note" style="margin-bottom:20px"><b>The read.</b> ${read}
        ${!thin ? `Doing both — a fifth more submitted at a seventh worse quality — lands at <b>${both.approved}</b>,
        ${cost > 0 ? `a gain of ${cost}` : cost < 0 ? `${Math.abs(cost)} fewer than today` : "no change"} for a good deal more work.` : ""}
      </div>`;
    })() : ""}`;

  return out;
}

/* ---- projects view ---- */
function renderProjects(list) {
  const sorted = [...list].sort((a, b) => {
    const rank = { critical: 0, serious: 1, warning: 2, none: 3, good: 4 };
    return (rank[a.sev] - rank[b.sev]) || (b.daysInPhase || 0) - (a.daysInPhase || 0) || a.name.localeCompare(b.name);
  });
  if (!sorted.length) return `<div class="panel empty">No projects match these filters.</div>`;
  return `<div class="section-head"><h2>Every project, and what it needs next</h2>
    <span class="hint">Next step is derived from the live board status; the note beneath it is the most recent real entry on that project.</span></div>
  <div class="panel scroller tall"><table>
    <thead><tr>
      <th>Project</th><th>Stage</th><th>Status</th><th>What needs to happen</th><th>Who</th><th class="n">Days</th><th>Flag</th>
    </tr></thead>
    <tbody>${sorted.map(p => {
      const stage = p.current ? STAGES[STAGE_INDEX[p.current]].label : "Not started";
      const chatter = [...p.teams.slice(0, 2), ...p.meetings.slice(0, 2)];
      return `<tr>
        <td>
          <div class="proj-name">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}</div>
          <div class="ev">${esc([p.utility && utilityLabel(p.utility), p.type, p.projectId].filter(Boolean).join(" · "))}</div>
        </td>
        <td>${esc(stage)}<div class="ev">${esc(p.phase)}</div></td>
        <td>${esc(p.tuStatus || p.icfStatus || "—")}${p.sowStatus ? `<div class="ev">SOW: ${esc(p.sowStatus)}</div>` : ""}</td>
        <td>
          <div class="need">${esc(p.need)}</div>
          ${p.evidence ? `<div class="ev"><b>Latest:</b> ${esc(p.evidence.slice(0, 190))}${p.evidence.length > 190 ? "…" : ""} <span style="opacity:.75">(${esc(p.evidenceFrom)})</span></div>` : ""}
          ${chatter.length ? `<details class="detail"><summary>${chatter.length} recent mention${chatter.length > 1 ? "s" : ""} in Teams / meetings</summary>
            <div class="detail-body">${chatter.map(c => `<div><span class="k">${esc(c.source)} · ${esc(c.when || "")}</span><br>${esc(String(c.text).slice(0, 300))}</div>`).join("")}</div></details>` : ""}
          ${p.aiSummary ? `<details class="detail"><summary>Board update summary</summary><div class="detail-body">${esc(p.aiSummary)}</div></details>` : ""}
        </td>
        <td>${ownerCell(p)}${p.nextActionDate ? `<div class="ev">Due ${esc(p.nextActionDate)}</div>` : ""}</td>
        <td class="n num">${p.daysInPhase == null ? "·" : p.daysInPhase}</td>
        <td>${sevTag(p.sev)}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

/* ---- shared row renderers ---- */
function pline(p, extra) {
  return `<li><span class="rail"></span><span>
    <span class="t">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}</span>
    <div class="s">${esc(p.need)}</div>
    <div class="m">${esc([p.utility && utilityLabel(p.utility), p.tuStatus || p.icfStatus, p.ownerNames.length ? p.ownerNames.join(", ") : "no owner",
      p.daysInPhase != null ? p.daysInPhase + "d in phase" : ""].filter(Boolean).join(" · "))}${extra ? " · " + esc(extra) : ""}</div>
  </span></li>`;
}
function ptable(rows, opts = {}) {
  if (!rows.length) return `<div class="panel empty">Nothing here right now.</div>`;
  return `<div class="panel scroller${rows.length > 14 ? " tall" : ""}"><table><thead><tr>
    <th>Project</th>${opts.priority ? '<th class="n">Pri</th>' : ""}<th>Status</th><th>What needs to happen</th><th>Who</th>
    ${opts.due ? "<th>Due</th>" : ""}<th class="n">Days</th></tr></thead><tbody>
    ${rows.map(p => `<tr>
      <td><div class="proj-name">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name)}</div>
          <div class="ev">${esc([p.utility ? utilityLabel(p.utility) : "", p.type].filter(Boolean).join(" · "))}</div></td>
      ${opts.priority ? `<td class="n"><span class="cell num ${p.band === "critical" ? "m5" : p.band === "serious" ? "m4" : p.band === "warning" ? "m2" : "m0"}" title="${esc(p.priorityWhy.join("; "))}">${p.priority}</span></td>` : ""}
      <td>${esc(p.tuStatus || p.icfStatus || "—")}</td>
      <td><div class="need">${esc(p.need)}</div>${p.evidence ? `<div class="ev"><b>Latest:</b> ${esc(p.evidence.slice(0, 150))}</div>` : ""}
          ${p.priorityWhy && p.priorityWhy.length ? `<div class="ev">Flagged: ${esc(p.priorityWhy.join(", "))}</div>` : ""}</td>
      <td>${ownerCell(p)}</td>
      ${opts.due ? `<td class="num">${esc(p.nextActionDate || p.ecd || "—")}</td>` : ""}
      <td class="n num">${p.daysInPhase == null ? "·" : p.daysInPhase}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* ---- my desk: the manager's own work and the things to chase ---- */
function renderMyDesk(list) {
  const meIn = arr => arr.some(n => n === ME.name);
  const mine = list.filter(p => meIn(p.hbsAll) || meIn(p.ownerNames));
  const onMe = mine.filter(p => meIn(p.ownerNames)).sort((a, b) => b.priority - a.priority);
  const chase = mine.filter(p => !meIn(p.ownerNames) && (p.band === "critical" || p.band === "serious")).sort((a, b) => b.priority - a.priority);
  const noOwner = list.filter(p => !p.ownerNames.length && p.sev !== "good").sort((a, b) => b.priority - a.priority);
  const myTodos = state.todos.filter(t => t.person === ME.name.split(" ")[0] || t.person === ME.name);
  const upcoming = state.calendar.filter(m => m.day >= isoDay(0)).slice(0, 12).reverse();

  const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;

  let out = `<div class="section-head"><h2>My desk</h2>
    <span class="hint">${esc(ME.name)} — everything with your name on it, plus what you should be chasing.</span></div>
    <div class="stats" style="margin-bottom:16px">
      ${stat(onMe.length, "On me now", "is-critical")}
      ${stat(myTodos.length, "Workload to-dos", "")}
      ${stat(chase.length, "To chase", "is-serious")}
      ${stat(noOwner.length, "Nobody owns", "is-serious")}
      ${stat(mine.length, "Projects I touch", "")}
    </div>`;

  out += `<div class="section-head"><h2>On me now</h2><span class="hint">The board says the next step is yours</span>
    <span class="hint num" style="margin-left:auto">${onMe.length}</span></div>` + ptable(onMe, { priority: true });

  if (state.workloadLoading) out += `<div class="skel"><span class="spin"></span>Reading your workload boards…</div>`;
  else if (state.errors.workload) out += errNote("Workload boards", state.errors.workload, MONDAY);
  else if (myTodos.length) {
    out += `<div class="section-head"><h2>My workload to-dos</h2><span class="hint">From the Preapproval and Closeout workload boards</span>
      <span class="hint num" style="margin-left:auto">${myTodos.length}</span></div>` + todoTable(myTodos);
  }

  out += `<div class="section-head"><h2>To chase</h2><span class="hint">Yours to shepherd, but the next step sits with someone else</span>
    <span class="hint num" style="margin-left:auto">${chase.length}</span></div>` + ptable(chase, { priority: true });

  out += `<div class="section-head"><h2>Nobody owns the next step</h2><span class="hint">A manager call — these have no assignee on the board</span>
    <span class="hint num" style="margin-left:auto">${noOwner.length}</span></div>` + ptable(noOwner.slice(0, 40), { priority: true });

  if (upcoming.length) {
    out += `<div class="section-head"><h2>Coming up on your calendar</h2>
      <span class="hint">Talking points for each, built from the boards</span></div>
      <div class="cards">${upcoming.slice(0, 6).map(meetingPrepCard).join("")}</div>`;
  }
  return out;
}

function todoTable(rows) {
  return `<div class="panel scroller${rows.length > 14 ? " tall" : ""}"><table><thead><tr>
    <th>Item</th><th>Queue</th><th>Status</th><th>What needs to happen</th><th>Owner</th><th>Due</th><th class="n">Hrs</th></tr></thead><tbody>
    ${rows.sort((a, b) => (b.overdue - a.overdue) || String(a.due || "9999").localeCompare(String(b.due || "9999"))).map(t => `<tr>
      <td><div class="proj-name">${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a>` : esc(t.name)}</div>
        ${t.notes ? `<div class="ev">${esc(t.notes.slice(0, 130))}</div>` : ""}</td>
      <td>${esc(t.kind)}${t.rfiQueue ? ` <span class="chip">RFI queue</span>` : ""}</td>
      <td>${esc(t.tuStatus || t.status || "—")}</td>
      <td><div class="need">${esc(t.need)}</div></td>
      <td class="who">${esc(t.lead || "—")}</td>
      <td class="num">${t.due ? `${esc(t.due)}${t.overdue ? ` <span class="sev sev-critical">overdue</span>` : ""}` : `<span class="ev">no due date</span>`}</td>
      <td class="n num">${t.hours == null ? "·" : t.hours}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* ---------------------------------------------------------------------------
   Workload — the Pre-approval and Closeout boards.

   These two boards are the queue: every project waiting for an application to
   be written sits in a group named after the engineer who owns it, and the
   shared "RFI's to Answer" group holds the ones a reviewer has come back on.

   Their PA Lead / Utility / Status columns are mirrors, which the connector
   cannot read, so those values are joined back from the Master TU Tracker
   through the relation column instead. Nothing here is a mirror read.

   Finished rows are kept (loadWorkload puts them in state.workHistory) because
   they are the only record of how long this work takes.
--------------------------------------------------------------------------- */
function medianOf(xs) {
  if (!xs.length) return null;
  const a = [...xs].sort((x, y) => x - y);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

/* The board's audit-to-submitted formula goes negative when a completion date
   precedes the audit date, and runs to nearly two years at the top end. Both
   are data faults, not turnaround, so they are excluded and counted rather
   than quietly averaged in. */
const SUBMIT_MAX_DAYS = 365;
function cleanDays(xs) {
  const ok = xs.filter(n => n != null && n >= 0 && n <= SUBMIT_MAX_DAYS);
  return { ok, dropped: xs.filter(n => n != null).length - ok.length };
}

/* ---------------------------------------------------------------------------
   One person, one name.

   The same engineer is written two ways across the boards: the ICF/HBS tracker
   and the TU tracker carry a full name ("Soumya Agrawal"), while the two
   workload boards title their groups with a first name only ("Soumya"). Left
   alone the same person appears twice in every list.

   Group titles are resolved to the full name; the ICF Engineer dropdown is
   deliberately left alone. Its first names are reviewers at other companies,
   and a shared first name there is a different person — ICF's Devin is not
   HBS's Devin Simons, so merging on the first name would file one company's
   projects under another person's name.

   Resolution is from the data, not a hardcoded list, so a new engineer needs
   no change here. Where a first name matches more than one full name the
   engineer named on the ICF board wins, and if that is still ambiguous the
   short name is left as it is rather than attributed to the wrong person.
--------------------------------------------------------------------------- */
/* ---------------------------------------------------------------------------
   Cycle time, leg by leg.

   These definitions are Ameya's, 2026-08-25, and the distinction matters:
   "how long a pre-approval takes" means one thing to the engineer writing it
   and another to the reviewer approving it. Averaged together, whichever side
   is actually slow disappears. Each leg therefore records whose clock it is.

     Audit         audit carried out       -> pre-approval submitted     HBS
     Pre-approval  pre-approval submitted  -> pre-approval received      ICF
     SOW out       pre-approval submitted  -> SOW sent to the client     HBS
     SOW signed    SOW sent                -> signed SOW received        client
     Closeout      implementation done     -> closeout submitted         HBS
     Payment       closeout submitted      -> closeout approved by ICF   ICF

   "Implementation scheduled -> team on site" is deliberately missing. The TU
   tracker carries a single Implementation Date, not a scheduled date and an
   actual one, so that leg cannot be measured from the boards as they stand.
   It is reported as unmeasurable rather than filled with the nearest pair of
   dates that happen to exist.
--------------------------------------------------------------------------- */
const LEGS = [
  { key: "audit", label: "Audit \u2192 PA submitted", owner: "HBS",
    from: p => p.evDates.dAudit, to: p => p.evDates.dSubPA,
    blurb: "An engineer turning a finished audit into a submitted application." },
  { key: "pa", label: "PA submitted \u2192 PA received", owner: "ICF",
    from: p => p.evDates.dSubPA, to: p => p.evDates.dPAd,
    blurb: "The reviewer's turnaround. Nothing HBS does moves this." },
  { key: "sowOut", label: "PA submitted \u2192 SOW sent", owner: "HBS",
    from: p => p.evDates.dSubPA, to: p => p.evDates.dSowSent,
    blurb: "The SOW can be written as soon as the pre-approval goes in." },
  { key: "sowSigned", label: "SOW sent \u2192 SOW signed", owner: "Client",
    from: p => p.evDates.dSowSent, to: p => p.evDates.dSowSigned,
    blurb: "Waiting on the customer to sign. Chasing helps; engineering does not." },
  { key: "closeout", label: "Implementation \u2192 closeout submitted", owner: "HBS",
    from: p => p.evDates.dImpl, to: p => p.evDates.dSubCO,
    blurb: "An engineer assembling the closeout package after the work is done." },
  { key: "payment", label: "Closeout submitted \u2192 approved", owner: "ICF",
    from: p => p.evDates.dSubCO, to: p => p.evDates.dCOd,
    blurb: "The reviewer approving the closeout, which is when the project completes." },
];

/* A leg only counts when both ends are recorded and land the right way round.
   A negative span is a date typed wrongly, not a fast project, and a span past
   two years is a project that was reopened rather than one that ran that long;
   both are excluded and counted, never averaged in. */
const LEG_MAX_DAYS = 730;
function legDays(p, leg) {
  const a = dparse(leg.from(p)), b = dparse(leg.to(p));
  if (!a || !b) return null;
  const d = Math.round((b - a) / 86400000);
  return (d < 0 || d > LEG_MAX_DAYS) ? NaN : d;   // NaN = recorded but unusable
}
function legStats(list, leg) {
  const ok = [], bad = [];
  for (const p of list) {
    const d = legDays(p, leg);
    if (d === null) continue;
    if (Number.isNaN(d)) bad.push(p); else ok.push(d);
  }
  ok.sort((x, y) => x - y);
  return {
    leg, n: ok.length, bad: bad.length,
    median: ok.length ? ok[ok.length >> 1] : null,
    mean: ok.length ? ok.reduce((a, b) => a + b, 0) / ok.length : null,
    p90: ok.length ? ok[Math.min(ok.length - 1, Math.floor(ok.length * 0.9))] : null,
    values: ok,
  };
}

/* Devashis moved from HBS to ESAI, which reviews for ICF. One person, so one
   entry: the full name is kept, and he sits on the ICF side where his work is
   now. The auditor and PA-lead rows still carrying his short name on the TU
   tracker are the same person. */
const NAME_ALIASES = { "Devashis": "Devashis Shrestha", "Devashis Shrestha": "Devashis Shrestha" };
const NOW_ICF_SIDE = new Set(["Devashis Shrestha"]);
const alias = n => NAME_ALIASES[String(n || "").trim()] || String(n || "").trim();

let canonMap = null;
function buildCanonMap() {
  const full = new Set(), onIcfBoard = new Set();
  for (const p of state.projects) {
    for (const n of p.hbsAll) if (/\s/.test(n)) full.add(n);
    for (const n of p.hbsEngs) if (/\s/.test(n)) onIcfBoard.add(n);
  }
  const first = new Map();
  for (const n of full) {
    const k = n.split(/\s+/)[0].toLowerCase();
    if (!first.has(k)) first.set(k, []);
    first.get(k).push(n);
  }
  const m = new Map();
  for (const [k, names] of first) {
    let pick = names.length === 1 ? names[0] : null;
    if (!pick) {
      const preferred = names.filter(n => onIcfBoard.has(n));
      if (preferred.length === 1) pick = preferred[0];
    }
    if (pick) m.set(k, pick);
  }
  return m;
}
function canonName(n) {
  const name = String(n || "").trim();
  if (!name) return name;
  if (NAME_ALIASES[name]) return NAME_ALIASES[name];
  if (/\s/.test(name)) return name;               // already a full name
  if (!canonMap) canonMap = buildCanonMap();
  return canonMap.get(name.toLowerCase()) || name;
}

function renderWorkload() {

  const co = open.filter(t => t.kind === "Closeout");

  const assigned = open.filter(t => !t.rfiQueue);
  const overdue = open.filter(t => t.overdue);

     can be attributed to an engineer without a second round of fetches. ---- */
  const byTu = new Map();
  for (const p of state.projects) if (p.tuId) byTu.set(p.tuId, p);
  const projOf = row => row.tuIds.map(id => byTu.get(id)).find(Boolean) || null;

  /* ================= 1. RFIs ================= */
  const rfiRows = [...rfis].sort((a, b) => (b.waiting ?? -1) - (a.waiting ?? -1));
  const rfiSection = `
    <div class="section-head"><h2>RFIs to answer</h2>
      <span class="hint">A reviewer has come back with a question on these. They sit in the shared queue on both boards until someone picks them up — nobody's group owns them.</span></div>
    ${!rfiRows.length ? `<div class="panel empty">No outstanding RFIs on either board.</div>` : `
    <div class="panel scroller"><table><thead><tr>
      <th>Project</th><th>Board</th><th class="n">Waiting</th><th>Utility</th>
      <th>Lead on the project</th><th>Where it sits</th><th class="n">Due</th>
    </tr></thead><tbody>
    ${rfiRows.map(t => {
      const p = projOf(t);
      const late = t.waiting != null && t.waiting >= 14;
      return `<tr>
        <td><div class="proj-name">${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a>` : esc(t.name)}</div>
            ${t.notes ? `<div class="ev">${esc(t.notes.slice(0, 130))}</div>` : ""}</td>
        <td><span class="chip">${esc(t.kind)}</span></td>
        <td class="n num">${t.waiting == null ? `<span class="ev">—</span>`
          : `<span class="${late ? "sev sev-critical" : ""}">${t.waiting}d</span>`}</td>
        <td class="who">${esc(p && p.utility ? utilityLabel(p.utility) : "—")}</td>
        <td class="who">${esc(t.lead || (p && p.ownerNames && p.ownerNames[0]) || "")

        <td><div class="need">${esc(t.tuStatus || t.status || "—")}</div></td>

  /* ================= 2. queue by engineer ================= */
  const byEng = new Map();
  for (const t of assigned) {
    if (!byEng.has(t.person)) byEng.set(t.person, []);
    byEng.get(t.person).push(t);
  }
  const engRows = [...byEng.entries()].map(([name, items]) => {
    const w = items.map(t => t.waiting).filter(n => n != null);
    return {
      name, items,
      pa: items.filter(t => t.kind === "Pre-approval").length,
      co: items.filter(t => t.kind === "Closeout").length,
      overdue: items.filter(t => t.overdue).length,
      longest: w.length ? Math.max(...w) : null,
      median: medianOf(w),
    };
  }).sort((a, b) => b.items.length - a.items.length || b.overdue - a.overdue);

  const queueSection = `
    <div class="section-head"><h2>Queue by engineer</h2>
      <span class="hint">Each board puts an item in a group named after its owner — this is that grouping, with the two boards side by side.</span></div>
    <div class="grid-2">
      <div class="panel pad">
        ${barChart(engRows.map(r => ({
          k: r.name, v: r.items.length,
          label: `${r.items.length}  (${r.pa} PA · ${r.co} CO)`,

      </div>
      <div class="panel scroller"><table><thead><tr>
        <th>Engineer</th><th class="n">Pre-app</th><th class="n">Closeout</th><th class="n">Total</th>

      ${engRows.map(r => `<tr>

        <td class="n num">${medianOf(waits) == null ? "—" : Math.round(medianOf(waits)) + "d"}</td>
      </tr>
      </tbody></table></div>
    </div>`;

  /* ================= 3. how long this takes ================= */
  const hist = state.workHistory;
  const paHist = hist.filter(h => h.kind === "Pre-approval");
  const submit = cleanDays(paHist.map(h => h.daysToSubmit));

  /* Closeout has no equivalent formula on the board, so it is measured from the
     implementation date on the project to the date the closeout row was
     completed. Rows without both dates are simply not counted. */
  const coDays = [];
  for (const h of hist.filter(h => h.kind === "Closeout")) {
    const p = projOf(h);
    const from = p && p.evDates && p.evDates.dImpl ? dparse(p.evDates.dImpl) : null;

    if (from && to) coDays.push(Math.round((to - from) / 86400000));
  }
  const coClean = cleanDays(coDays);

  const buckets = [
    { k: "14 days or less", test: n => n <= 14 },
    { k: "15 – 30 days",    test: n => n > 14 && n <= 30 },
    { k: "31 – 60 days",    test: n => n > 30 && n <= 60 },
    { k: "61 – 90 days",    test: n => n > 60 && n <= 90 },
    { k: "over 90 days",    test: n => n > 90 },
  ];

  /* Per-engineer turnaround, attributed through the project's PA lead. */
  const engDays = new Map();
  for (const h of paHist) {
    if (h.daysToSubmit == null || h.daysToSubmit < 0 || h.daysToSubmit > SUBMIT_MAX_DAYS) continue;
    const p = projOf(h);
    const leads = p && p.paLead && p.paLead.length ? p.paLead : [];
    for (const n of leads) {
      if (!engDays.has(n)) engDays.set(n, []);
      engDays.get(n).push(h.daysToSubmit);
    }
  }
  const engDayRows = [...engDays.entries()]
    .filter(([, v]) => v.length >= 5)          // fewer than five is not a rate
    .map(([k, v]) => ({ k, n: v.length, med: medianOf(v) }))

  const turnSection = `

      ${stat(submit.ok.length, "Pre-approvals measured")}

    <div class="grid-2">

      </div>
    </div>`;

  /* ================= 4. the queue itself ================= */
  const qRows = [...assigned].sort((a, b) =>
    Number(b.overdue) - Number(a.overdue) || (b.waiting ?? -1) - (a.waiting ?? -1));
  const listSection = `
    <div class="section-head"><h2>Everything in the queue</h2>

    <div class="panel scroller tall"><table><thead><tr>
      <th>Project</th><th>Board</th><th>Owner</th><th class="n">Waiting</th>

      const p = projOf(t);
      return `<tr>
