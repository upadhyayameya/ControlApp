<title>ICF × HBS Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ---------- tokens: light is the base, both dark scopes redefine only tokens ---------- */
:root {
  color-scheme: light;
  --surface:      #fcfcfb;
  --panel:        #f3f5f8;
  --panel-2:      #e9edf2;
  --ink:          #12171d;
  --ink-2:        #5a656f;
  --ink-3:        #8a939c;
  --rule:         #dde3ea;
  --rule-strong:  #c4cdd7;
  --accent:       #2a78d6;
  --accent-ink:   #1c5cab;
  --org-icf:      #2a78d6;
  --org-hbs:      #eb6834;
  --good:         #0ca30c;
  --warning:      #fab219;
  --serious:      #ec835a;
  --critical:     #d03b3b;
  --on-accent:    #ffffff;
  --mag-1:        #86b6ef;  --m1-ink: #12171d;
  --mag-2:        #5598e7;  --m2-ink: #12171d;
  --mag-3:        #2a78d6;  --m3-ink: #ffffff;
  --mag-4:        #1c5cab;  --m4-ink: #ffffff;
  --mag-5:        #104281;  --m5-ink: #ffffff;
  --focus:        #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:     #14181c;
    --panel:       #1b2026;
    --panel-2:     #232a31;
    --ink:         #eef2f6;
    --ink-2:       #a9b4bf;
    --ink-3:       #78838d;
    --rule:        #2a3138;
    --rule-strong: #3a434c;
    --accent:      #3987e5;
    --accent-ink:  #86b6ef;
    --org-icf:     #3987e5;
    --org-hbs:     #d95926;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
    --on-accent:   #0d1114;
    --mag-1:       #184f95;  --m1-ink: #eef2f6;
    --mag-2:       #2a78d6;  --m2-ink: #ffffff;
    --mag-3:       #5598e7;  --m3-ink: #0d1114;
    --mag-4:       #86b6ef;  --m4-ink: #0d1114;
    --mag-5:       #b7d3f6;  --m5-ink: #0d1114;
    --focus:       #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:     #14181c;
  --panel:       #1b2026;
  --panel-2:     #232a31;
  --ink:         #eef2f6;
  --ink-2:       #a9b4bf;
  --ink-3:       #78838d;
  --rule:        #2a3138;
  --rule-strong: #3a434c;
  --accent:      #3987e5;
  --accent-ink:  #86b6ef;
  --org-icf:     #3987e5;
  --org-hbs:     #d95926;
  --good:        #0ca30c;
  --warning:     #fab219;
  --serious:     #ec835a;
  --critical:    #d03b3b;
  --on-accent:   #0d1114;
  --mag-1:       #184f95;  --m1-ink: #eef2f6;
  --mag-2:       #2a78d6;  --m2-ink: #ffffff;
  --mag-3:       #5598e7;  --m3-ink: #0d1114;
  --mag-4:       #86b6ef;  --m4-ink: #0d1114;
  --mag-5:       #b7d3f6;  --m5-ink: #0d1114;
  --focus:       #86b6ef;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.num, .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.wrap { max-width: 1480px; margin: 0 auto; padding: 12px 20px 72px; }

/* ---------- masthead ---------- */
.masthead {
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  position: sticky; top: 0; z-index: 40;
}
.masthead-in {
  max-width: 1480px; margin: 0 auto; padding: 14px 20px 0;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
}
h1 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
h1 .x { color: var(--ink-3); font-weight: 400; padding: 0 2px; }
.sub { color: var(--ink-2); font-size: 12.5px; margin: 0; }
.masthead-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.stamp { font-size: 11.5px; color: var(--ink-3); }
.stamp b { color: var(--ink-2); font-weight: 500; }

button, select, input[type="search"] {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule-strong); border-radius: 5px; padding: 5px 10px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { background: var(--panel-2); }
button:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; margin-top: 12px; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  border-radius: 0; padding: 8px 12px; color: var(--ink-2); font-size: 13px; font-weight: 500;
}
.tab:hover { background: var(--panel); color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- controls ---------- */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  padding: 10px 0 11px; width: 100%;
}
/* The masthead carries the tabs and the filters, and stays put while the
   boards scroll underneath — no going back up to change a filter. */
.masthead { max-height: 100vh; overflow-y: auto; }
.masthead-in:last-child { padding-bottom: 0; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.segmented { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; }
.segmented button {
  border: none; border-radius: 0; background: var(--surface); padding: 5px 11px;
  font-size: 12.5px; color: var(--ink-2); border-right: 1px solid var(--rule);
}
.segmented button:last-child { border-right: none; }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 500; }
input[type="search"] { min-width: 220px; }

/* ---------- funnel rail ---------- */
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 11px; }
.section-head:first-child { margin-top: 4px; }
.section-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.section-head .hint { font-size: 12px; color: var(--ink-3); }

.rail { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 1180px) { .rail { grid-template-columns: repeat(5, minmax(0,1fr)); } }
@media (max-width: 700px)  { .rail { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.stage {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 7px;
  padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 2px;
  text-align: left; position: relative; overflow: hidden;
}
.stage .ord { font-size: 10px; color: var(--ink-3); letter-spacing: .06em; }
.stage .nm { font-size: 11.5px; font-weight: 600; color: var(--ink-2); line-height: 1.25; min-height: 2.5em; }
.stage .big { font-size: 27px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.stage .open { font-size: 11.5px; color: var(--ink-3); }
.stage .open b { color: var(--ink-2); font-weight: 500; }
.stage .delta { font-size: 11px; }
.up { color: var(--good); } .down { color: var(--critical); } .flat { color: var(--ink-3); }
.stage .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }

/* ---------- panels & tables ---------- */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.scroller { overflow-x: auto; }
.scroller.tall { max-height: 72vh; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600;
  border-bottom: 1px solid var(--rule-strong); white-space: nowrap; background: var(--panel);
}
.scroller.tall thead th { position: sticky; top: 0; z-index: 2; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--panel-2); }
td.n, th.n { text-align: right; }

/* matrix */
.matrix th.rot { white-space: normal; max-width: 74px; }
.cell { display: block; text-align: center; border-radius: 4px; padding: 3px 0; font-size: 12.5px; }
.m0 { color: var(--ink-3); }
.m1 { background: var(--mag-1); color: var(--m1-ink); }
.m2 { background: var(--mag-2); color: var(--m2-ink); }
.m3 { background: var(--mag-3); color: var(--m3-ink); }
.m4 { background: var(--mag-4); color: var(--m4-ink); }
.m5 { background: var(--mag-5); color: var(--m5-ink); }

.legend { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-3); }
.legend .sw { width: 16px; height: 11px; border-radius: 2px; display: inline-block; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 10px;
  font-size: 11px; font-weight: 500; border: 1px solid var(--rule-strong); color: var(--ink-2); white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.chip-icf { border-color: var(--org-icf); color: var(--org-icf); }
.chip-hbs { border-color: var(--org-hbs); color: var(--org-hbs); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.sev svg { flex: none; }
.sev-good { color: var(--good); } .sev-warning { color: var(--warning); }
.sev-serious { color: var(--serious); } .sev-critical { color: var(--critical); }
.sev-none { color: var(--ink-3); }

.need { color: var(--ink); }
.who { color: var(--ink-2); font-size: 12.5px; }
.who .unassigned { color: var(--serious); }
.ev { color: var(--ink-3); font-size: 11.5px; margin-top: 3px; }
.ev b { color: var(--ink-2); font-weight: 500; }
.proj-name { font-weight: 500; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* status banners */
.note { padding: 11px 13px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--panel); font-size: 13px; margin: 12px 0; }
.note-critical { border-color: var(--critical); }
.note-warning  { border-color: var(--warning); }
.note h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.note p { margin: 0; color: var(--ink-2); }
.empty { padding: 26px; text-align: center; color: var(--ink-3); font-size: 13px; }

.grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 1080px) { .grid-2 { grid-template-columns: 1fr; } }

.digest { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.digest h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.digest .meta { font-size: 11.5px; color: var(--ink-3); margin-bottom: 9px; }
.digest pre {
  margin: 0; white-space: pre-wrap; word-wrap: break-word; font-size: 12.5px; line-height: 1.55;
  font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 11px 12px; max-height: 340px; overflow: auto;
}
.digest-actions { display: flex; gap: 8px; margin-top: 9px; }

/* thirteen-month trend — one hue, height carries the amount */
.tbars { display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; align-items: end; height: 150px; }
.tb { display: grid; grid-template-rows: auto 1fr auto; align-items: end; height: 100%; gap: 3px; }
.tb .tv { font-size: 9.5px; color: var(--ink-2); text-align: center; white-space: nowrap; }
.tb .tbar { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; align-self: end; }
.tb .tbar.live { background: var(--mag-2); }
.tb .tl { font-size: 10px; color: var(--ink-3); text-align: center; }
.tb:hover .tbar { filter: brightness(1.15); }

/* Charts. One accent for magnitude, status colours reserved for state; a bar
   carries a hover title so a value is always reachable without a number on
   every mark. Rounded ends sit at the data end only, anchored to the baseline. */
.chart { display: grid; gap: 9px; }
.chart-row { display: grid; grid-template-columns: minmax(120px, 190px) 1fr auto; gap: 12px; align-items: center; }
.chart-row .k { font-size: 12.5px; color: var(--ink-2); text-align: right; }
.chart-track {
  position: relative; height: 16px; border-radius: 3px;
  background: linear-gradient(to right, var(--rule) 1px, transparent 1px) 0 0 / 25% 100%;
  box-shadow: inset 0 0 0 1px transparent;
}
.chart-track::after {
  content: ""; position: absolute; inset: 0; border-bottom: 1px solid var(--rule);
}
.chart-bar {
  position: absolute; left: 0; top: 2px; bottom: 2px; min-width: 2px;
  background: var(--accent); border-radius: 0 4px 4px 0;
}
.chart-bar.is-good { background: var(--good); }
.chart-bar.is-warning { background: var(--warning); }
.chart-bar.is-critical { background: var(--critical); }
.chart-bar.is-ghost { background: var(--rule-strong); }
.chart-row .v { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 92px; text-align: right; }
.chart-target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-3); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

.mrow { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 92px; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); }
.mrow:first-child { border-top: 0; }
.mrow-k { font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-align: right; }
.mrow-v { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.cols .c.is-good { background: var(--good); }
.cols .c.is-warning { background: var(--warning); }

/* columns for the month-by-month trend */
.cols { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
.cols .c { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.cols .c:hover { opacity: 1; }
.col-labels { display: flex; gap: 3px; margin-top: 5px; }
.col-labels span { flex: 1; font-size: 10px; color: var(--ink-3); text-align: center; overflow: hidden; white-space: nowrap; }

/* the assistant: a transcript, suggestions, and a composer */
.chat { display: grid; gap: 12px; }
.chat-feed {
  display: grid; gap: 10px; align-content: start;
  max-height: 56vh; overflow-y: auto; padding: 14px 16px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel);
}
.bub { max-width: 78%; padding: 10px 13px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
.bub p { margin: 0 0 8px; }
.bub p:last-child { margin-bottom: 0; }
.bub.you { justify-self: end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; white-space: pre-wrap; }
.bub.bot { justify-self: start; background: var(--surface); border: 1px solid var(--rule); border-bottom-left-radius: 3px; max-width: 88%; }
.ans-row { border-left: 3px solid var(--rule-strong); padding: 2px 0 2px 10px; margin: 8px 0; }
.ans-row .t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ans-row .s { font-size: 13px; margin-top: 2px; }
.ans-row .m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ans-note { font-size: 12.5px; color: var(--ink-2); background: var(--panel); border-radius: 6px; padding: 7px 9px; margin-top: 8px; }
.bub-acts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.bub-acts button { font-size: 12.5px; padding: 5px 11px; }
.chat-sugg { display: flex; flex-wrap: wrap; gap: 7px; }
.chip-btn {
  font-size: 12.5px; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-2); cursor: pointer;
}
.chip-btn:hover { color: var(--ink); border-color: var(--accent); }
.chat-input { display: flex; gap: 8px; align-items: flex-end; }
.chat-input textarea {
  flex: 1; font: inherit; padding: 9px 12px; border-radius: 8px; resize: vertical;
  border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink);
}

/* a folded-away section: closed by default, still one click from everything */
details.fold { margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 12px; }
details.fold > summary {
  cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px;
  padding: 4px 0; border-radius: 4px;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before {
  content: "\25B8"; color: var(--ink-3); font-size: 11px; transition: transform .15s ease; display: inline-block;
}
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary:hover .fold-title { color: var(--ink); }
.fold-title { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.fold-meta { font-size: 12px; color: var(--ink-3); margin-left: auto; }

/* period comparison — previous behind, current in front */
.cmp { display: block; position: relative; height: 14px; }
.cmp-prev, .cmp-cur { position: absolute; left: 0; border-radius: 2px; }
.cmp-prev { top: 0; height: 6px; background: var(--rule-strong); }
.cmp-cur  { top: 8px; height: 6px; background: var(--accent); }

button.linkish {
  background: none; border: none; padding: 0; font: inherit; font-weight: 500;
  color: var(--accent); cursor: pointer; text-align: left; border-radius: 3px;
}
button.linkish:hover { text-decoration: underline; background: none; }

/* ---------- digest & intel cards ---------- */
.cards { display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.card-hd { display: flex; align-items: center; gap: 9px; padding: 12px 15px 0; flex-wrap: wrap; }
.card-hd .nm { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.card-hd .to { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.card-bd { padding: 10px 15px 13px; display: grid; gap: 10px; }

/* stat strip */
.stats { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
.stat { flex: 1 1 0; min-width: 74px; padding: 6px 11px; border-right: 1px solid var(--rule); }
.stat:last-child { border-right: none; }
.stat .v { font-size: 23px; font-weight: 600; line-height: 1.15; letter-spacing: -.025em; }
.stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; margin-top: 1px; }
.stat.is-critical .v { color: var(--critical); }
.stat.is-serious  .v { color: var(--serious); }
.stat.is-good     .v { color: var(--good); }
.stat.is-zero .v { color: var(--ink-3); font-weight: 500; }

/* stage profile — one hue, height carries the count */
.profile { display: grid; gap: 5px; }
.profile .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
.strip { display: grid; grid-template-columns: repeat(9, minmax(0,1fr)); gap: 3px; }
.strip .sc { display: grid; gap: 2px; }
.strip .sl { font-size: 9px; text-align: center; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .cell { padding: 4px 0; font-size: 12px; }

/* grouped project lines */
.bucket { border-top: 1px solid var(--rule); padding-top: 9px; }
.bucket > h4 { margin: 0 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.bucket ul.blist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.bucket ul.blist > li { display: grid; grid-template-columns: 3px 1fr; gap: 9px; align-items: start; }
.bucket ul.blist > li .rail { border-radius: 2px; align-self: stretch; background: var(--rule-strong); }
.bucket.b-critical ul.blist > li .rail { background: var(--critical); }
.bucket.b-serious  ul.blist > li .rail { background: var(--serious); }
.bucket.b-good     ul.blist > li .rail { background: var(--good); }
.bucket .t { font-size: 13px; }

/* Weekly digest: a collapsed row still has to answer "does this person need
   me?", so the summary carries the counts and the marker sits on the left
   where the eye already is. */
.dg-tools { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
.dg-tools .ev { margin-left: auto; }
.dg-card > summary.dg-sum {

  border-radius: 10px;
}
.dg-card > summary.dg-sum::-webkit-details-marker { display: none; }
.dg-card > summary.dg-sum::before {
  content: ""; width: 7px; height: 7px; flex: none;

/* Diagnosis cards. The verdict is carried by a word and a left rail, not by a
   wash of colour behind the text, so the evidence stays as readable as it
   would be on paper. */
.claims { display: grid; gap: 12px; }
.claim {
  background: var(--panel); border: 1px solid var(--rule); border-left: 3px solid var(--rule-strong);

/* A count with its own magnitude behind it, so a column reads as a shape

.flowbar { position: relative; display: inline-block; min-width: 2.6em; padding: 1px 4px; z-index: 0; }

@keyframes sp { to { transform: rotate(360deg); } }

/* ========================= value normalisation ============================ */
function txt(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "number") return String(v);
  if (typeof v === "string") {
    const t = v.trim();
    if (!t || t === "null" || t === "Column value type is not supported") return "";
    return t;
  }
  if (Array.isArray(v)) return v.map(x => (x && x.name) ? x.name : "").filter(Boolean).join(", ");
  if (typeof v === "object") {
    if ("checked" in v) return v.checked ? "yes" : "";
    if (typeof v.label === "string") return v.label;
    if (typeof v.text === "string") return v.text.trim();
    if (typeof v.date === "string") return v.date;
    if (Array.isArray(v.labels)) return v.labels.join(", ");
    if (Array.isArray(v.ids)) return "";
  }

const col = (item, id) => txt(item && item.column_values ? item.column_values[id] : "");

/* Formula columns arrive as already-formatted strings. Null when unparseable

function numStr(v) {

  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? n : null;
}

  const raw = item && item.column_values ? item.column_values[id] : null;
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(r => r && (!boardId || String(r.board && r.board.id) === String(boardId)))
    .map(r => String(r.id));
}
const dstr = s => (/^\d{4}-\d{2}-\d{2}/.test(s || "") ? s.slice(0, 10) : "");
function dparse(s) {
  const d = dstr(s);
  if (!d) return null;

  return new Date(y, m - 1, dd);

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ========================= period maths =================================== */
function periodRange(kind, now) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let start;
  if (kind === "day") start = d;
  else if (kind === "week") { const dow = (d.getDay() + 6) % 7; start = new Date(d); start.setDate(d.getDate() - dow); }
  else if (kind === "month") start = new Date(d.getFullYear(), d.getMonth(), 1);
  else if (kind === "quarter") start = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
  else start = new Date(d.getFullYear(), 0, 1);
  const end = new Date(d); end.setDate(end.getDate() + 1);
  const span = Math.round((end - start) / 86400000);
  const prevEnd = new Date(start);
  const prevStart = new Date(start); prevStart.setDate(prevStart.getDate() - span);
  return { start, end, prevStart, prevEnd, span };
}
const inRange = (dt, a, b) => !!dt && dt >= a && dt < b;
const PERIOD_LABEL = { day: "today", week: "this week", month: "this month", quarter: "this quarter", year: "this year" };

/* ========================= connector plumbing ============================= */
let mcp = null;
const sourceState = { monday: "pending", teams: "pending", fireflies: "pending", calendar: "pending" };

function mcpError(e) {
  const code = (e && e.code) || "upstream_error";
  const known = ["needs_reauth","server_not_connected","selection_required","server_not_found","server_unavailable",
    "not_in_manifest","blocked_by_policy","approval_required","tool_error","bad_request","cancelled","rate_limited",
    "upstream_error","not_granted","capability_disabled","capability_removed","transform_error"];
  return { code: known.includes(code) ? code : "upstream_error", message: (e && e.message) || String(e), retryable: !!(e && e.retryable), retryAfterMs: e && e.retryAfterMs };
}
function fixCopy(err, server) {
  switch (err.code) {
    case "needs_reauth":         return `Reconnect ${server} in claude.ai Settings → Connectors, then refresh.`;
    case "server_not_connected": return `Add ${server} in claude.ai Settings → Connectors, then refresh.`;
    case "selection_required":   return `You have more than one ${server} connector. Choose one when claude.ai asks, then refresh.`;
    case "server_not_found":     return `The ${server} connector no longer exists upstream.`;
    case "blocked_by_policy":    return `Your organisation's policy blocks this ${server} tool.`;
    case "approval_required":    return `This ${server} tool needs per-call approval, which artifacts cannot request yet.`;
    case "not_in_manifest":      return `This page is not authorised to call that ${server} tool.`;
    case "server_unavailable":   return `${server} did not answer. It is usually brief — try Refresh.`;
    case "tool_error":           return `${server} reported: ${err.message}`;
    case "not_granted":
    case "capability_disabled":
    case "capability_removed":   return `This view cannot reach your connectors.`;
    default:                     return `${server} call failed: ${err.message}`;
  }
}
const AUTHZ = new Set(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"]);
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function call(server, tool, input, { retry = true, refresh = false } = {}) {
  try {
    return await mcp.callTool(server, tool, input, { cache: { staleTime: 60_000, gcTime: 900_000, refresh } });
  } catch (raw) {
    const err = mcpError(raw);
    if (retry && err.retryable) {
      await sleep(Math.min(err.retryAfterMs || 900, 4000) + Math.random() * 500);
      return call(server, tool, input, { retry: false, refresh });
    }
    throw err;
  }
}

/* "Read 14:22" must reflect when the data was actually produced, not when we rendered.
   A result served from the call cache carries cache.storedAt; a fresh one does not. */
function stampFrom(res) {
  const st = res && res.cache && res.cache.storedAt;
  if (typeof st === "number") state.storedAt = state.storedAt ? Math.min(state.storedAt, st) : st;
}

/* A connector may answer with one JSON array, or with one text block per record.
   `payload` only ever exposes the first block, so fall back to reading them all. */
function rowsFrom(res) {
  const out = [];
  const push = v => { if (v && typeof v === "object" && !Array.isArray(v)) out.push(v); };
  const p = res && res.payload;
  if (Array.isArray(p)) { p.forEach(push); return out; }
  push(p);
  const blocks = (res && Array.isArray(res.content)) ? res.content : [];
  for (const b of blocks) {
    if (!b || b.type !== "text" || typeof b.text !== "string") continue;
    try {
      const v = JSON.parse(b.text);
      if (Array.isArray(v)) v.forEach(push); else push(v);
    } catch { /* a non-JSON block is not a record */ }
  }
  const seen = new Set();
  return out.filter(r => {
    const k = r.id == null ? Symbol() : String(r.id);
    if (typeof k === "string") { if (seen.has(k)) return false; seen.add(k); }
    return true;
  });
}

async function fetchBoard(boardId, columnIds, filters, refresh) {
  const items = [];
  let cursor = null;
  for (let page = 0; page < 30; page++) {
    const input = { boardId, limit: 200, includeColumns: true, includeGroup: true, columnIds };
    if (filters) { input.filters = filters; input.filtersOperator = "and"; }
    if (cursor) input.cursor = cursor;
    const res = await call(MONDAY, "get_board_items_page", input, { refresh: refresh && page === 0 });
    if (page === 0) stampFrom(res);
    const p = res && res.payload;
    if (!p || !Array.isArray(p.items)) break;
    items.push(...p.items);
    const pg = p.pagination || {};
    if (!pg.has_more || !pg.nextCursor) break;
    cursor = pg.nextCursor;
  }
  return items;
}

/* ========================= building the projects ========================== */
function latestNoteLine(text) {
  if (!text) return null;
  const lines = String(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) return null;
  const dated = lines.find(l => /^\d{1,2}[\/\-]\d{1,2}\b/.test(l));
  return dated || lines[0];
}

/* The Master TU Tracker holds every project across every utility. The ICF/HBS
   board holds the subset ICF reviews, with the ICF-side status and engineer on
   it. Pair them up and walk the union, so a project shows up whether it is
   reviewed by ICF, by TRC, or by nobody outside HBS. */
function pairBoards(icfItems, tuItems) {
  const icfById = new Map(icfItems.map(it => [String(it.id), it]));
  const pairs = [];
  const claimedIcf = new Set();

  for (const tu of tuItems) {
    let icf = null;
    for (const id of relIds(tu, T.rel, BOARD_ICF)) {
      if (icfById.has(id) && !claimedIcf.has(id)) { icf = icfById.get(id); claimedIcf.add(id); break; }
    }
    pairs.push({ icf, tu });
  }
  /* ICF-board rows with no TU counterpart still belong in the pipeline. */
  for (const [id, icf] of icfById) if (!claimedIcf.has(id)) pairs.push({ icf, tu: null });
  return pairs;
}

/* The TU tracker's utility is free text, so the same programme appears as
   "PEPCO" and "Pepco", "Met ED" and "Met-Ed". Fold on case and punctuation and
   settle on one spelling. Programmes that genuinely differ — Dominion and
   Dominion - TRC — fold to different keys and stay separate. */
/* Some ICF Engineer values name a group rather than a person; expand them to
   the people who do the work so those projects reach someone. "TBD" means no
   reviewer has been picked yet, so it counts as unassigned rather than as a
   name. Confirmed by Ameya: Centralized Engineering is covered by Jason, and
   ESAI Team is Devashis, Ven and Kirti. */
const ICF_GROUPS = {
  "ESAI Team":               ["Devashis", "Ven", "Kirti"],
  "EASI Team":               ["Devashis", "Ven", "Kirti"],   // spelling seen on the TU board
  "Centralized Engineering": ["Jason"],
};
const ICF_UNASSIGNED = new Set(["TBD", "N/A", "NONE", "None", "---"]);

function expandReviewers(names) {
  const out = [];
  let unassigned = false;
  for (const n of names) {
    if (!n) continue;
    if (ICF_UNASSIGNED.has(n)) { unassigned = true; continue; }
    const group = ICF_GROUPS[n];
    if (group) { out.push(...group); continue; }
    out.push(n);
  }
  return { names: [...new Set(out)], unassigned: unassigned || out.length === 0 };
}

const UTILITY_KEY = u => String(u || "").trim().toLowerCase().replace(/[\s\-_]+/g, " ");
const utilitySpellings = new Map();
function normUtility(u) {
  const raw = String(u || "").trim();
  if (!raw) return "";
  const key = UTILITY_KEY(raw);
  if (!utilitySpellings.has(key)) utilitySpellings.set(key, new Map());
  const m = utilitySpellings.get(key);
  m.set(raw, (m.get(raw) || 0) + 1);
  return key;
}
function utilityLabel(key) {
  const m = utilitySpellings.get(key);
  if (!m) return key || "—";
  const cased = str => /[A-Z]/.test(str) ? 1 : 0;
  return [...m.entries()].sort((a, b) => b[1] - a[1] || cased(b[0]) - cased(a[0]))[0][0];
}

function buildProjects(icfItems, tuItems) {
  utilitySpellings.clear();
  const today = new Date(); today.setHours(0, 0, 0, 0);

  const built = pairBoards(icfItems, tuItems).map(({ icf, tu }) => {
    const it = icf || tu;                      // the row the project is named by
    const g = (id) => (tu ? col(tu, id) : "");
    const ci = (id) => (icf ? col(icf, id) : "");

    const phase     = ci(C.phase);
    const icfStatus = ci(C.status);
    const tuStatus  = g(T.status);
    const sowStatus = g(T.sowStatus);

    const utility = normUtility(ci(C.utility) || g(T.utility));
    const type    = ci(C.type) || g(T.type);

    /* Who reviews it. ICF work is on the shared board; TRC work is named on
       the TU tracker's Review Engineer, or by the utility itself. */
    const revRaw = g(T.reviewEng);
    const reviewer = icf ? "ICF"
      : /^TRC\s*-/.test(revRaw) ? "TRC"
      : /^ICF\s*-/.test(revRaw) ? "ICF"
      : /\bTRC\b/i.test(utility) ? "TRC"
      : "In-house";

    const icfRaw = (icf ? people(icf, C.icfEng) : []).map(alias);
    const { names: icfEngs, unassigned: icfUnassigned } = expandReviewers(icfRaw);
    const hbsEngs = (icf ? people(icf, C.hbsEng) : []).map(alias);
    const auditor = tu ? people(tu, T.auditor) : [];
    const paLead  = tu ? people(tu, T.paLead)  : [];
    const coLead  = tu ? people(tu, T.coLead)  : [];
    const owner   = tu ? people(tu, T.dealOwner) : [];
    const revEng  = tu ? people(tu, T.reviewEng).map(s => s.replace(/^ICF\s*-\s*/, "").replace(/^TRC\s*-\s*/, "")) : [];

    const dAudit   = dparse(g(T.dAudit));
    const dImpl    = dparse(g(T.dImpl));
    const dPAd     = dparse(ci(C.dPAd))   || dparse(g(T.dSignedPA));
    const dSubPA   = dparse(ci(C.dSubPA));
    const dSubCO   = dparse(ci(C.dSubCO));          // actually submitted for closeout
    const dProjCO  = dparse(g(T.dProjCO));               // forecast only — never advances a stage
    const dCOd     = dparse(ci(C.dCOd));
    const dSowSent = dparse(g(T.dSowClient))   || dparse(g(T.dSowRahls));
    const dSowSign = dparse(g(T.dSowSigned));

    const paidNow = PAYMENT_STATUS.has(tuStatus) || PAYMENT_ICF.has(icfStatus) || phase === "Payment Processing" || phase === "Completed Project";
    const auditedNow = (dAudit && dAudit <= today) || POST_AUDIT.has(tuStatus) || POST_AUDIT_PHASES.includes(phase);

    /* stage event dates — when the project crossed each milestone */
    const ev = {
      scheduled: dAudit,
      audited:   auditedNow ? dAudit : null,
      preapp:    dPAd,
      sowSent:   dSowSent,
      sowSigned: dSowSign,
      impl:      dImpl,
      coSched:   dSubCO,
      coDone:    dCOd,
      payment:   paidNow ? dCOd : null,
    };

    /* current stage — the furthest milestone actually reached */
    let current = null;
    if (paidNow) current = "payment";
    else if (dCOd || tuStatus === "CO Received") current = "coDone";
    else if (dSubCO || tuStatus === "CO Submitted" || phase === "Closeout Phase") current = "coSched";
    else if (dImpl || phase === "Implementation Phase" || icfStatus === "Install" ||
             ["Implementation Ready to Schedule","Implementation & MV Complete","CD to Submit"].includes(tuStatus)) current = "impl";
    else if (dSowSign || SOW_SIGNED_LABELS.has(sowStatus) || tuStatus === "Signed SOW Received") current = "sowSigned";
    else if (dSowSent || SOW_SENT_LABELS.has(sowStatus)) current = "sowSent";
    else if (dPAd || tuStatus === "PA Received" || phase === "Pre-Approval Phase") current = "preapp";
    else if (auditedNow) current = "audited";
    else if (dAudit) current = "scheduled";

    /* next step: what has to happen, and who owns it */
    const rule = TU_ACTIONS[tuStatus] || ICF_ACTIONS[icfStatus] || PHASE_FALLBACK[phase] || null;
    const roleOwners = {
      auditor: auditor.length ? auditor : (hbsEngs.length ? hbsEngs : owner),
      paLead:  paLead.length  ? paLead  : (hbsEngs.length ? hbsEngs : owner),
      coLead:  coLead.length  ? coLead  : (hbsEngs.length ? hbsEngs : owner),
      hbs:     hbsEngs.length ? hbsEngs : (owner.length ? owner : paLead),
      icf:     icfEngs.length ? icfEngs : revEng,
    };
    const ownerNames = rule && rule.role ? (roleOwners[rule.role] || []) : [];
    const ownerOrg   = rule && rule.role === "icf" ? "ICF" : (rule && rule.role ? "HBS" : null);

    /* The ICF board's HBS Engineer column is only one of the ways a person is
       attached to a project. Auditor, PA lead, CO lead and deal owner all live
       on the TU tracker, and several people — Ameya among them — appear only
       there. Group and filter on everyone involved, keeping the role that put
       them there so the reason is visible. */
    const roleMap = new Map();
    const addRole = (names, role) => {
      for (const n of names) {
        if (!n) continue;
        if (!roleMap.has(n)) roleMap.set(n, []);
        if (!roleMap.get(n).includes(role)) roleMap.get(n).push(role);
      }
    };
    addRole(hbsEngs, "HBS engineer");
    addRole(auditor.map(alias), "Auditor");
    addRole(paLead.map(alias), "PA lead");
    addRole(coLead.map(alias), "CO lead");
    addRole(owner.map(alias), "Deal owner");
    const hbsAll = [...roleMap.keys()];
    const hbsRoles = Object.fromEntries([...roleMap].map(([k, v]) => [k, v.join(", ")]));

    const aging = ci(C.aging);
    const daysInPhase = (() => { const n = parseFloat(ci(C.daysPhase)); return Number.isFinite(n) ? n : null; })();

    let sev = (rule && rule.sev) || null;
    if (!sev) {
      if (aging === "Critical") sev = "serious";
      else if (aging === "Watch") sev = "warning";
    }
    if (sev !== "good" && aging === "Critical" && (rule && rule.sev === "warning")) sev = "critical";

    const notes = ci(C.notes);
    const adminNotes = g(T.adminNotes);
    const evidence = latestNoteLine(adminNotes) || latestNoteLine(notes) || "";
    const evidenceFrom = latestNoteLine(adminNotes) ? "TU admin notes" : (latestNoteLine(notes) ? "ICF board notes" : "");

    return {
      id: String(it.id),
      name: it.name || "(untitled)",
      url: it.url || "",
      tuUrl: tu ? (tu.url || "") : "",
      group: (it.group && it.group.title) || "",
      projectId: ci(C.projectId) || g(T.projectId),
      phase, icfStatus, tuStatus, sowStatus,
      utility, type, reviewer,
      icfEngs, icfRaw, icfUnassigned, hbsEngs, hbsAll, hbsRoles, auditor, paLead, coLead, owner, revEng,
      ev, current,
      evDates: {
        dSubPA: dstr(ci(C.dSubPA)), dPAd: dstr(ci(C.dPAd)),
        dSubCO: dstr(ci(C.dSubCO)), dCOd: dstr(ci(C.dCOd)),
        dAudit: dstr(g(T.dAudit)), dImpl: dstr(g(T.dImpl)),
        dSowSent: dstr(g(T.dSowClient)) || dstr(g(T.dSowRahls)),
        dSowSigned: dstr(g(T.dSowSigned)),
      },
      need: rule ? rule.need : "No status recorded — set a status on the board",
      ownerNames, ownerOrg,
      sev: sev || "none",
      aging, daysInPhase,
      nextActionDate: dstr(ci(C.dNextAct)),
      projectedCO: dProjCO ? dstr(g(T.dProjCO)) : "",
      ecd: dstr(ci(C.ecd)),
      lastUpdate: dstr(ci(C.dLastUpd)),
      lastBy: ci(C.lastBy),
      incentive: (icf ? num(icf, C.incentive) : null),
      kwh: (icf ? num(icf, C.kwh) : null),
      therms: (icf ? num(icf, C.therms) : null),
      aiSummary: g(T.aiSummary),
      notes, adminNotes, evidence, evidenceFrom,
      hasTu: !!tu,
      tuId: tu ? String(tu.id) : "",   // lets the workload boards join without re-fetching
      priority: 0, priorityWhy: [], band: "none",
      teams: [],
      meetings: [],
      calendar: [],
    };
  });
  for (const p of built) {
    const sc = scoreProject(p);
    p.priority = sc.score;
    p.priorityWhy = sc.why;
    p.band = priorityBand(sc.score);
  }
  return built;
}

/* ---------------------------------------------------------------------------
   Automatic priority.

   Every input is something the boards already record, so the ranking needs no
   judgement from anyone: what the status says is owed, how long it has sat,
   whether a due date has passed, and whether anyone owns it at all.
--------------------------------------------------------------------------- */
function scoreProject(p) {
  const why = [];
  let n = 0;
  if (/RFI/i.test(p.tuStatus) && /Received/i.test(p.tuStatus)) { n += 45; why.push("ICF/TRC RFI open"); }
  if (/RFI/i.test(p.icfStatus)) { n += 45; why.push("RFI with HBS"); }
  if (/Flawed|FLAWED/.test(p.tuStatus + " " + p.icfStatus)) { n += 40; why.push("flawed in portal"); }
  if (p.tuStatus === "Action Needed from HBS") { n += 35; why.push("action needed from HBS"); }
  if (p.tuStatus === "Stuck") { n += 30; why.push("marked stuck"); }
  if (p.tuStatus === "CD to Submit") { n += 25; why.push("closeout docs to submit"); }
  if (p.tuStatus === "Implementation & MV Complete") { n += 22; why.push("implementation complete, closeout owed"); }
  if (p.tuStatus === "Waiting on Info/Others") { n += 15; why.push("waiting on outside info"); }
  if (p.aging === "Critical") { n += 30; why.push("60+ days without movement"); }
  else if (p.aging === "Watch") { n += 12; why.push("30+ days without movement"); }
  if (p.daysInPhase != null && p.daysInPhase > 120) { n += 12; why.push(`${p.daysInPhase} days in phase`); }
  if (!p.ownerNames.length && p.sev !== "good") { n += 20; why.push("no owner on the next step"); }
  if (p.nextActionDate) {
    const d = dparse(p.nextActionDate);
    if (d && d < new Date()) { n += 18; why.push("next-action date has passed"); }
  }
  if (p.sev === "good") n = Math.max(0, n - 40);
  return { score: n, why };
}
const priorityBand = n => n >= 60 ? "critical" : n >= 35 ? "serious" : n >= 18 ? "warning" : "none";

/* ========================= matching chatter to projects =================== */
const STOP = new Set(["the","and","for","with","project","projects","building","center","centre","llc","inc","apartments","at"]);
function matchKeys(name) {
  const keys = [];
  const parts = String(name).split(/\s+-\s+/);
  for (const p of parts) {
    const clean = p.trim();
    if (clean.length >= 6) keys.push(clean.toLowerCase());
  }
  const words = String(name).toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length >= 5 && !STOP.has(w));
  for (let i = 0; i < words.length - 1; i++) keys.push(words[i] + " " + words[i + 1]);
  return [...new Set(keys)];
}
function attachMentions(projects, records, field) {
  const index = projects.map(p => ({ p, keys: matchKeys(p.name) }));
  for (const r of records) {
    const hay = String(r.text || "").toLowerCase();
    if (!hay) continue;
    for (const { p, keys } of index) {
      if (keys.some(k => hay.includes(k))) {
        p[field].push(r);
        if (p[field].length > 6) p[field].length = 6;
      }
    }
  }
}

function engineersOf(p) {

/* Where a project sits in its life. Cancelled work is gone for good and never
   shown. Completed work is finished, so it is out of the working views by
   default — but it still counts toward the period funnel, otherwise "closeouts
   completed this month" would read zero the moment they were done. */
function lifecycle(p) {
  if (p.tuStatus === "Cancelled" || p.group === "Cancelled Projects") return "cancelled";
  if (p.phase === "Completed Project" || p.group === "Completed Projects" ||
      p.tuStatus === "Complete/Paid") return "completed";
  return "active";
}

function filtered(opts) {
  const includeDone = !!(opts && opts.includeDone) || state.showDone;
  const q = state.q.trim().toLowerCase();
  return state.projects.filter(p => {
    const life = lifecycle(p);
    if (life === "cancelled") return false;
    if (life === "completed" && !includeDone) return false;
    if (state.utility && p.utility !== state.utility) return false;
    if (state.reviewer && p.reviewer !== state.reviewer) return false;
    if (state.type && p.type !== state.type) return false;
    if (state.org === "icf" && !p.icfEngs.length) return false;
    if (state.org === "hbs" && !p.hbsAll.length) return false;
    if (state.engineer && !engineersOf(p).includes(state.engineer)) return false;
    if (q) {
      const hay = [p.name, p.projectId, p.phase, p.icfStatus, p.tuStatus, p.need, p.ownerNames.join(" "), p.utility, utilityLabel(p.utility), p.type, p.evidence].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function applyViewFilters() {
  const allowed = new Set(VIEW_FILTERS[state.view] || []);
  let shown = 0;
  document.querySelectorAll("#controls [data-filter]").forEach(el => {

const main = $("#main");

function sevIcon(sev) {

const SEV_LABEL = { good: "On track", warning: "Watch", serious: "Ageing", critical: "Action owed" };
const sevTag = sev => (sev === "none" || !SEV_LABEL[sev])
  ? `<span class="sev sev-none">—</span>`
  : `<span class="sev sev-${sev}">${sevIcon(sev)}${SEV_LABEL[sev]}</span>`;

function magClass(v, max) {
  if (!v) return "m0";
  if (max < 3) return "m3";        /* too little range to read as a ramp — one flat step */
  const r = v / max;
  if (r > 0.8) return "m5";
  if (r > 0.6) return "m4";
  if (r > 0.4) return "m3";
  if (r > 0.2) return "m2";
  return "m1";
}
function ownerCell(p) {
  if (!p.ownerNames.length) return `<span class="who"><span class="unassigned">Unassigned</span></span>`;
  const cls = p.ownerOrg === "ICF" ? "chip-icf" : "chip-hbs";

/* ---- pipeline view ---- */
function renderPipeline(list) {
  const now = new Date();
  const r = periodRange(state.period, now);
  const counts = {}, prev = {}, open = {};
  for (const s of STAGES) { counts[s.key] = 0; prev[s.key] = 0; open[s.key] = 0; }
  /* Throughput counts finished work; "open now" counts only what is still live. */
  for (const p of filtered({ includeDone: true })) {
    for (const s of STAGES) {
      const d = p.ev[s.key];
      if (inRange(d, r.start, r.end)) counts[s.key]++;
      if (inRange(d, r.prevStart, r.prevEnd)) prev[s.key]++;
    }
  }
  for (const p of list) if (p.current) open[p.current]++;
  const maxOpen = Math.max(1, ...Object.values(open));

  const tiles = STAGES.map((s, i) => {
    const c = counts[s.key], pv = prev[s.key];
    const delta = c - pv;
    const dcls = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
    const dtxt = (pv === 0 && c === 0) ? "none either period"
               : delta === 0 ? "level with prior"
               : `${delta > 0 ? "+" : ""}${delta} vs prior`;
    return `<div class="stage">
      <span class="ord num">${String(i + 1).padStart(2, "0")}</span>
      <span class="nm">${esc(s.label)}</span>
      <span class="big num">${c}</span>
      <span class="delta num ${dcls}">${esc(dtxt)}</span>
      <span class="open">Open now <b class="num">${open[s.key]}</b></span>
      <span class="bar" style="width:${Math.round((open[s.key] / maxOpen) * 100)}%"></span>
    </div>`;
  }).join("");

  /* engineer × stage matrix */
  const rows = new Map();
  for (const p of list) {
    /* an engineer is counted once per project, under the org they are assigned in */
    const pairs = [];
    if (state.org !== "hbs") for (const n of new Set(p.icfEngs)) pairs.push([n, "ICF"]);
    if (state.org !== "icf") for (const n of new Set(p.hbsAll)) pairs.push([n, "HBS"]);
    for (const [n, org] of pairs) {
      const key = org + " " + n;
      if (!rows.has(key)) rows.set(key, { name: n, org, counts: {}, open: 0, attention: 0, roles: new Set() });
      const row = rows.get(key);
      if (org === "HBS" && p.hbsRoles[n]) for (const r of p.hbsRoles[n].split(", ")) row.roles.add(r);
      if (org === "ICF") row.roles.add("ICF engineer");
      for (const s of STAGES) if (inRange(p.ev[s.key], r.start, r.end)) row.counts[s.key] = (row.counts[s.key] || 0) + 1;
      row.open++;
      if (p.sev === "critical" || p.sev === "serious") row.attention++;
    }
  }
  const engRows = [...rows.values()].sort((a, b) => b.open - a.open || a.name.localeCompare(b.name));
  const maxCell = Math.max(1, ...engRows.flatMap(rw => STAGES.map(s => rw.counts[s.key] || 0)));

  const matrix = engRows.length ? `<div class="panel scroller"><table class="matrix">
    <thead><tr>
      <th>Engineer</th><th></th>
      ${STAGES.map(s => `<th class="rot n" title="${esc(s.label)}">${esc(s.short)}</th>`).join("")}
      <th class="n">Active</th><th class="n">Needs action</th>
    </tr></thead>
    <tbody>${engRows.map(rw => `<tr>
      <td><button class="linkish" data-engineer="${esc(rw.name)}">${esc(rw.name)}</button>
          <div class="ev">${esc([...rw.roles].join(", "))}</div></td>
      <td><span class="chip ${rw.org === "ICF" ? "chip-icf" : "chip-hbs"}">${rw.org}</span></td>
      ${STAGES.map(s => { const v = rw.counts[s.key] || 0; return `<td class="n"><span class="cell num ${magClass(v, maxCell)}">${v || "·"}</span></td>`; }).join("")}
      <td class="n num">${rw.open}</td>
      <td class="n num">${rw.attention ? `<span class="sev sev-serious">${rw.attention}</span>` : "·"}</td>
    </tr>`).join("")}</tbody></table></div>`
    : `<div class="panel empty">No engineers match these filters.</div>`;

  const swatches = ["--mag-1","--mag-2","--mag-3","--mag-4","--mag-5"]
    .map(v => `<span class="sw" style="background:var(${v})"></span>`).join("");

  return `
  ${renderCompare(list)}
  <div class="section-head">
    <h2>Funnel</h2>
    <span class="hint">Big number: milestones reached ${esc(PERIOD_LABEL[state.period])}. Bar and “open now”: where projects sit right now.</span>
  </div>
  <div class="rail">${tiles}</div>

  <div class="section-head">
    <h2>Per engineer</h2>
    <span class="hint">Milestones reached ${esc(PERIOD_LABEL[state.period])}, by the engineer assigned on the board.</span>
    <span class="legend" style="margin-left:auto">fewer ${swatches} more</span>
  </div>
  ${matrix}`;
}

/* Two periods side by side, so movement is visible rather than inferred. */
function comparePair(list, kind) {
  const now = new Date();
  const r = periodRange(kind, now);
  const cur = {}, prev = {};
  for (const s of STAGES) { cur[s.key] = 0; prev[s.key] = 0; }
  for (const p of list) for (const s of STAGES) {
    if (inRange(p.ev[s.key], r.start, r.end)) cur[s.key]++;
    if (inRange(p.ev[s.key], r.prevStart, r.prevEnd)) prev[s.key]++;
  }
  return { cur, prev, r };
}
function renderCompare(list) {
  const blocks = [
    { kind: "week", label: "This week vs last week", note: "Week starts Monday. The current week is counted to today, so a Monday reading is naturally small." },
    { kind: "month", label: "This month vs last month", note: "The current month is counted to today against the same number of days last month." },
  ].map(b => {
    const { cur, prev } = comparePair(list, b.kind);
    const curTotal = STAGES.reduce((n, s) => n + cur[s.key], 0);
    const prevTotal = STAGES.reduce((n, s) => n + prev[s.key], 0);
    const rows = STAGES.map(s => {
      const c = cur[s.key], v = prev[s.key], d = c - v;
      const max = Math.max(1, c, v);
      return `<tr>
        <td>${esc(s.label)}</td>
        <td class="n num">${v}</td>
        <td class="n num">${c}</td>
        <td style="width:34%"><span class="cmp">
          <span class="cmp-prev" style="width:${(v / max) * 100}%"></span>
          <span class="cmp-cur" style="width:${(c / max) * 100}%"></span>
        </span></td>
        <td class="n num ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "+" : ""}${d || "—"}</td>
      </tr>`;
    }).join("");
    const dTotal = curTotal - prevTotal;
    return `<div class="panel" style="padding:12px 14px">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
        <b style="font-size:13px">${esc(b.label)}</b>
        <span class="num ${dTotal > 0 ? "up" : dTotal < 0 ? "down" : "flat"}" style="font-size:12px">${dTotal > 0 ? "+" : ""}${dTotal} milestones</span>
      </div>
      <div class="scroller"><table><thead><tr><th>Stage</th><th class="n">Prev</th><th class="n">Now</th><th>&nbsp;</th><th class="n">&Delta;</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="ev" style="margin-top:6px">${esc(b.note)}</div>
    </div>`;
  }).join("");

  return `<div class="section-head"><h2>Period comparison</h2>
    <span class="hint">Milestones reached, current period against the one before it.</span>
    <span class="legend" style="margin-left:auto"><span class="sw" style="background:var(--rule-strong)"></span>previous
      <span class="sw" style="background:var(--accent);margin-left:8px"></span>current</span></div>
    <div class="grid-2">${blocks}</div>`;
}

/* ---------------------------------------------------------------------------
   Company numbers. Every figure is a sum over the Monthly KPIs rows whose
   completion date falls in the selected period, compared with the same length
   of time immediately before it.
--------------------------------------------------------------------------- */
function money(n) {
  const sign = n < 0 ? "-" : "";
  const a = Math.abs(n);
  return sign + (a >= 1e6 ? "$" + (a / 1e6).toFixed(2) + "m" : a >= 1e3 ? "$" + Math.round(a / 1e3) + "k" : "$" + Math.round(a));
}
function qty(n) {
  const sign = n < 0 ? "-" : "";
  const a = Math.abs(n);
  return sign + (a >= 1e6 ? (a / 1e6).toFixed(2) + "m" : a >= 1e3 ? Math.round(a / 1e3) + "k" : String(Math.round(a)));
}
const MILESTONE_ORDER = ["Audits Performed", "Preapprovals Submitted", "Preapprovals Received",
  "Implementations Scheduled", "Closeouts Submitted", "Closeouts Received"];

function sumRows(rows) {
  return rows.reduce((a, k) => ({
    count: a.count + 1, incentive: a.incentive + k.incentive,
    hbsShare: a.hbsShare + k.hbsShare, savings: a.savings + k.savings,
  }), { count: 0, incentive: 0, hbsShare: 0, savings: 0 });
}

/* --------------------------------------------------------------------------
   Numbers.

   The Monthly KPIs board records one row per milestone reached, across every
   programme HBS touches and every partner who delivers work — not just the
   ICF pipeline. That is why totals here are larger than the pipeline's, and
   why the Source filter matters: HBS is a little under two thirds of it.

   ICF engineers are not on this board at all, so where a KPI row matches a
   project on the ICF/HBS tracker by name, the reviewer is taken from there.
   Only that matched subset can be broken down by ICF engineer, and the page
   says how much of the total it covers.
-------------------------------------------------------------------------- */
/* The KPI board's Utility column carries two different kinds of thing: real
   utilities, and service groups — tune-ups and coil cleaning, which are a type
   of work rather than a programme. They are reported separately, because
   mixing them makes both harder to read and because service groups record no
   kWh at all, which drags a combined savings average toward zero.

   Confirmed by Ameya: HVAC BTU, HVAC BPTU and HVAC Tune Up are service groups. */
const SERVICE_GROUPS = new Set(["hvac btu", "hvac bptu", "hvac tune up", "hvac tuneup"]);

/* Spellings that are the same programme written short. */
const UTILITY_ALIASES = { "potomac": "potomac edison" };

const KPI_PHASES = ["Audits Performed", "Preapprovals Submitted", "Preapprovals Received",
  "Implementations Scheduled", "Closeouts Submitted", "Closeouts Received"];

function kpiUtilLabel(key, spellings) {
  const m = spellings.get(key);
  if (!m) return "—";
  const cased = s => /[A-Z]/.test(s) ? 1 : 0;
  return [...m.entries()].sort((a, b) => b[1] - a[1] || cased(b[0]) - cased(a[0]))[0][0];
}

/* rows: [{k, v, of, tone, label}] — `of` is the bar's own denominator so a
   row can be shown against a target rather than against the largest row. */
function barChart(rows, opts) {
  const o = opts || {};
  /* A row carrying its own denominator is scaled against that, so the bar
     length reads as attainment and the marker always sits at 100%. Rows
     without one share a scale, so their lengths compare to each other. */
  const shared = o.max || Math.max(1, ...rows.filter(r => !r.of).map(r => r.v), 1);
  return `<div class="chart">${rows.map(r => {
    const denom = r.of || shared;
    const pct = Math.max(0, Math.min(100, (r.v / denom) * 100));
    const tPct = r.of ? 100 : null;
    return `<div class="chart-row">
      <div class="k">${esc(r.k)}</div>
      <div class="chart-track" title="${esc(r.title || `${r.k}: ${r.label ?? r.v}`)}">
        <div class="chart-bar ${r.tone ? "is-" + r.tone : ""}" style="width:${pct}%"></div>
        ${tPct != null ? `<div class="chart-target" style="left:calc(${tPct}% - 2px)" title="needs ${esc(String(r.of))}"></div>` : ""}
      </div>
      <div class="v">${esc(String(r.label ?? r.v))}</div>
    </div>`;
  }).join("")}</div>`;
}

/* How long the HBS side takes on each leg, per engineer.
     audit  -> PA submitted   is the engineer preparing the application
     impl   -> CO submitted   is the engineer preparing the closeout
   The reviewer's own turnaround (submitted -> received) is a separate thing and
   is not mixed in here. */
function cycleByEngineer(projects) {
  const per = new Map();
  const add = (name, key, days) => {
    if (!name || !Number.isFinite(days) || days < 0 || days > 720) return;
    if (!per.has(name)) per.set(name, { pa: [], co: [] });
    per.get(name)[key].push(days);
  };
  const gap = (a, b) => (a && b) ? Math.round((dparse(b) - dparse(a)) / 86400000) : NaN;

  for (const p of projects) {
    const d = p.evDates || {};
    const paDays = gap(d.dAudit, d.dSubPA);
    const coDays = gap(d.dImpl, d.dSubCO);
    for (const n of new Set([...(p.paLead || []), ...(p.hbsEngs || [])])) add(n, "pa", paDays);
    for (const n of new Set([...(p.coLead || []), ...(p.hbsEngs || [])])) add(n, "co", coDays);
  }
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return [...per.entries()].map(([name, v]) => ({
    name, paN: v.pa.length, coN: v.co.length,
    paDays: mean(v.pa), coDays: mean(v.co),
  })).filter(x => x.paN || x.coN).sort((a, b) => (b.paN + b.coN) - (a.paN + a.coN));
}

/* What is sitting in each queue right now, waiting for an HBS engineer to
   submit it. These are the two legs the team actually controls. */
function workInHand(projects) {
  const awaitingPA = projects.filter(p => !p.evDates.dSubPA &&
    (p.evDates.dAudit || p.tuStatus === "Audit Phase Complete" || p.phase === "Pre-Approval Phase"));
  const awaitingCO = projects.filter(p => !p.evDates.dSubCO &&
    (p.tuStatus === "Implementation & MV Complete" || p.tuStatus === "CD to Submit" ||
     p.phase === "Closeout Phase" || p.evDates.dImpl));
  return { awaitingPA, awaitingCO };
}

/* A month-by-month column chart on a shared axis, so several of them stack
   into one story: what an audit was worth, how many were done, and how many
   made it through each later stage. */
function monthCols(series, months, opts) {
  const o = opts || {};
  const max = Math.max(1, ...series);
  return `<div class="mrow">
    <div class="mrow-k">${esc(o.k || "")}${o.sub ? `<div class="ev">${esc(o.sub)}</div>` : ""}</div>
    <div class="mrow-c">
      <div class="cols">${series.map((v, i) => `<div class="c${o.tone ? " is-" + o.tone : ""}"
        style="height:${Math.max(2, (v / max) * 100)}%"
        title="${esc(months[i])}: ${esc(o.fmt ? o.fmt(v) : String(v))}"></div>`).join("")}</div>
      <div class="col-labels">${months.map((m, i) =>
        `<span>${i === 0 || i === months.length - 1 || m.startsWith("Jan") ? esc(m) : ""}</span>`).join("")}</div>
    </div>
    <div class="mrow-v">${esc(o.fmt ? o.fmt(series[series.length - 1]) : String(series[series.length - 1]))}
      <div class="ev">latest</div></div>
  </div>`;
}

function renderNumbers() {
  if (state.kpisLoading) return `<div class="skel"><span class="spin"></span>Reading the Monthly KPIs board — thirteen months of milestones…</div>`;
  if (state.errors.kpis) return errNote("Monthly KPIs board", state.errors.kpis, MONDAY);
  if (!state.kpis.length) return `<div class="panel empty">No KPI rows found in the last thirteen months.</div>`;

  const utilKey = u => {
    const k = String(u || "").trim().toLowerCase().replace(/[\s\-_]+/g, " ");
    return UTILITY_ALIASES[k] || k;
  };
  const spellings = new Map();
  for (const k of state.kpis) {
    const key = utilKey(k.utility);
    if (!key) continue;
    if (!spellings.has(key)) spellings.set(key, new Map());
    const m = spellings.get(key);
    m.set(k.utility, (m.get(k.utility) || 0) + 1);
  }
  const uLabel = key => kpiUtilLabel(key, spellings);

  /* Reviewer, borrowed from the ICF board by project name. */
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const icfByName = new Map();
  for (const p of state.projects) if (p.name) icfByName.set(norm(p.name), p);

  const rows = state.kpis.map(k => {
    const proj = icfByName.get(norm(k.name)) || null;
    return { ...k, uKey: utilKey(k.utility), proj,
             icfEngs: proj ? proj.icfEngs : [], onPipeline: !!proj };
  });

  /* ---- filters that belong to this board ---- */
  const f = state.num;
  const pass = k =>
    (!f.source   || k.source === f.source) &&
    (!f.utility  || k.uKey === f.utility) &&
    (!f.phase    || k.milestone === f.phase) &&
    (!f.engineer || k.engineers.includes(f.engineer) || k.icfEngs.includes(f.engineer)) &&
    (!f.pipelineOnly || k.onPipeline);

  const scoped = rows.filter(pass);
  const r = periodRange(state.period, new Date());
  const inCur  = scoped.filter(k => inRange(k.when, r.start, r.end));
  const inPrev = scoped.filter(k => inRange(k.when, r.prevStart, r.prevEnd));
  const cur = sumRows(inCur), prev = sumRows(inPrev);

  const opts = (vals, sel, labeller) => [...new Set(vals)].filter(Boolean)
    .sort((a, b) => String(labeller ? labeller(a) : a).localeCompare(String(labeller ? labeller(b) : b)))
    .map(v => `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(labeller ? labeller(v) : v)}</option>`).join("");

  const engineerNames = new Set();
  for (const k of rows) { for (const n of k.engineers) engineerNames.add(n); for (const n of k.icfEngs) engineerNames.add(n); }

  let out = `<div class="section-head"><h2>Numbers</h2>
    <span class="hint">Milestones recorded on the Monthly KPIs board over the last thirteen months.</span></div>

    <div class="panel" style="padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center">
      <div class="ctl"><label for="n-src">Source</label>
        <select id="n-src"><option value="">All sources</option>${opts(rows.map(k => k.source), f.source)}</select></div>
      <div class="ctl"><label for="n-util">Utility</label>
        <select id="n-util"><option value="">All utilities</option>${opts(rows.map(k => k.uKey), f.utility, uLabel)}</select></div>
      <div class="ctl"><label for="n-phase">Phase</label>
        <select id="n-phase"><option value="">All phases</option>${opts(rows.map(k => k.milestone), f.phase)}</select></div>
      <div class="ctl"><label for="n-eng">Engineer</label>
        <select id="n-eng"><option value="">Everyone</option>${opts([...engineerNames], f.engineer)}</select></div>
      <div class="ctl"><label><input type="checkbox" id="n-pipe"${f.pipelineOnly ? " checked" : ""}> ICF pipeline only</label></div>
      <span class="stamp" style="margin-left:auto">${scoped.length} of ${rows.length} rows</span>
    </div>`;

  /* ---- what the numbers cover ---- */
  const bySource = new Map();
  for (const k of scoped) bySource.set(k.source || "—", (bySource.get(k.source || "—") || 0) + 1);
  const srcMix = [...bySource.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([s, n]) => `${esc(s)} ${n}`).join(" · ");
  const matched = scoped.filter(k => k.onPipeline).length;
  out += `<div class="ans-note" style="margin-bottom:16px">
    This board records work delivered by HBS <b>and</b> by partner firms, so it is wider than the pipeline.
    In view: ${srcMix}. ${matched} of ${scoped.length} rows match a project on the ICF/HBS tracker —
    only those can be broken down by ICF engineer.</div>`;

  /* ---- headline, with averages ---- */
  const delta = (a, b) => {
    if (!b) return a ? `<span class="sev sev-good">new</span>` : "";
    const d = Math.round(((a - b) / b) * 100);
    if (!d) return `<span class="ev">level</span>`;
    return `<span class="sev ${d > 0 ? "sev-good" : "sev-critical"}">${d > 0 ? "+" : ""}${d}%</span>`;
  };
  const per = (total, n) => n ? total / n : 0;
  const tile = (v, l, sub) => `<div class="stat"><div class="v num">${v}</div><div class="l">${esc(l)}</div>${sub ? `<div class="ev">${sub}</div>` : ""}</div>`;

  /* One project crosses several stages, carrying its incentive each time, so a
     figure summed across stages counts the same money repeatedly. Nothing here
     is totalled across stages: each stage is reported on its own. */
  const stageOf = m => {
    const rs = inCur.filter(k => k.milestone === m), ps = inPrev.filter(k => k.milestone === m);
    const a = sumRows(rs), b = sumRows(ps);
    return { m, ...a, prevCount: b.count, prevInc: b.incentive };
  };
  const HEADLINE = ["Audits Performed", "Preapprovals Submitted", "Preapprovals Received",
    "Implementations Scheduled", "Closeouts Submitted", "Closeouts Received"];
  const stages = HEADLINE.map(stageOf).filter(x => x.count || x.prevCount);

  /* The target is the value of work approved — pre-approvals received — not a
     sum across stages. That is the figure the business actually wins. */
  const approvedStage = stages.find(x => x.m === "Preapprovals Received");
  const defaultTarget = Math.round((approvedStage && (approvedStage.prevInc || approvedStage.incentive)) || 0);
  const TARGET = f.target != null ? f.target : defaultTarget;

  out += `<div class="stats" style="margin-bottom:10px">
    ${stages.map(x => tile(
      x.count,
      x.m.replace("Preapprovals", "Pre-approvals"),
      `${x.incentive ? money(x.incentive) : "no incentive recorded"} ${delta(x.count, x.prevCount)}`
    )).join("")}
  </div>
  <div class="ans-note" style="margin-bottom:18px">Each stage is counted and valued on its own. Nothing is added
  across stages: a project that was audited, pre-approved and closed out in this period appears at all three,
  carrying its incentive each time, so a combined total would count the same money more than once.
  ${stages.some(x => x.count && !x.incentive) ? `Audits carry no incentive on this board, which is why that figure is blank rather than zero.` : ""}</div>`;

  /* ---- per phase, with averages: the PA and CO numbers to move ---- */
  const byPhase = new Map();
  for (const k of inCur) {
    if (!byPhase.has(k.milestone)) byPhase.set(k.milestone, []);
    byPhase.get(k.milestone).push(k);
  }
  const prevPhase = new Map();
  for (const k of inPrev) prevPhase.set(k.milestone, (prevPhase.get(k.milestone) || 0) + 1);

  const phaseRows = KPI_PHASES.filter(m => byPhase.has(m) || prevPhase.has(m)).map(m => {
    const rs = byPhase.get(m) || [];
    const s = sumRows(rs);
    return { m, ...s, avgInc: per(s.incentive, s.count), avgKwh: per(s.savings, s.count), was: prevPhase.get(m) || 0 };
  });

  out += `<div class="section-head"><h2>By phase</h2>
    <span class="hint">Counts and the average size of what went through — the averages are the levers</span></div>
    <div class="panel scroller" style="margin-bottom:18px"><table><thead><tr>
      <th>Phase</th><th class="n">Count</th><th class="n">Previous</th><th class="n">Incentive</th>
      <th class="n">Avg incentive</th><th class="n">kWh / therms</th><th class="n">Avg kWh</th></tr></thead><tbody>
      ${phaseRows.map(x => `<tr>
        <td>${esc(x.m)}</td>
        <td class="n num">${x.count}</td>
        <td class="n num">${x.was || "—"} ${delta(x.count, x.was)}</td>
        <td class="n num">${money(x.incentive)}</td>
        <td class="n num"><b>${money(x.avgInc)}</b></td>
        <td class="n num">${qty(x.savings)}</td>
        <td class="n num"><b>${qty(Math.round(x.avgKwh))}</b></td>
      </tr>`).join("")}
      </tbody></table></div>`;

  /* ---- per utility, with averages ---- */
  const byUtil = new Map(), byService = new Map();
  for (const k of inCur) {
    const u = k.uKey || "—";
    const bucket = SERVICE_GROUPS.has(u) ? byService : byUtil;
    if (!bucket.has(u)) bucket.set(u, []);
    bucket.get(u).push(k);
  }
  const spanMonths = (r.end - r.start) / (30.44 * 86400000);
  const showRate = spanMonths >= 1.8;      // below that, a monthly rate just repeats the count
  const mkRows = map => [...map.entries()].map(([u, rs]) => {
    const s = sumRows(rs);
    return { u: u === "—" ? "—" : uLabel(u), ...s,
             avgInc: per(s.incentive, s.count), avgKwh: per(s.savings, s.count),
             perMonth: spanMonths > 0 ? s.count / spanMonths : s.count };
  }).sort((a, b) => b.incentive - a.incentive);
  const utilRows = mkRows(byUtil), svcRows = mkRows(byService);

  out += `<div class="section-head"><h2>By utility</h2>
    <span class="hint">Where the incentive sits, then the averages behind it</span></div>
    <div class="ans-note" style="margin-bottom:10px">A milestone is a stage a project passed, not a project.
    One project that was audited, pre-approved and closed out in this period appears three times, carrying its
    incentive each time — so these totals measure activity, not money earned once.</div>
    <div class="panel" style="padding:16px 18px;margin-bottom:12px">
      ${utilRows.length ? barChart(utilRows.slice(0, 10).map(x => ({
        k: x.u, v: x.incentive, label: money(x.incentive),
        title: `${x.u}: ${money(x.incentive)} across ${x.count} milestones, averaging ${money(x.avgInc)}`,
      }))) : `<div class="ev">Nothing in this period.</div>`}
    </div>
    <div class="panel scroller" style="margin-bottom:18px"><table><thead><tr>
      <th>Utility</th><th class="n">Milestones</th>${showRate ? `<th class="n">Per month</th>` : ""}<th class="n">Incentive</th>
      <th class="n">Avg incentive</th><th class="n">kWh / therms</th><th class="n">Avg kWh</th></tr></thead><tbody>
      ${utilRows.map(x => `<tr>
        <td>${esc(x.u)}</td>
        <td class="n num">${x.count}</td>
        ${showRate ? `<td class="n num">${x.perMonth.toFixed(1)}</td>` : ""}
        <td class="n num">${money(x.incentive)}</td>
        <td class="n num"><b>${money(x.avgInc)}</b></td>
        <td class="n num">${qty(x.savings)}</td>
        <td class="n num"><b>${qty(Math.round(x.avgKwh))}</b></td>
      </tr>`).join("")}
      </tbody></table></div>`;

  if (svcRows.length) {
    const svcTotal = svcRows.reduce((a, x) => a + x.incentive, 0);
    const svcCount = svcRows.reduce((a, x) => a + x.count, 0);
    out += `<div class="section-head"><h2>By service group</h2>
      <span class="hint">Tune-ups and coil cleaning — a type of work rather than a utility programme</span></div>
      <div class="panel scroller" style="margin-bottom:10px"><table><thead><tr>
        <th>Service group</th><th class="n">Milestones</th><th class="n">Incentive</th><th class="n">Avg incentive</th></tr></thead><tbody>
        ${svcRows.map(x => `<tr>
          <td>${esc(x.u)}</td>
          <td class="n num">${x.count}</td>
          <td class="n num">${money(x.incentive)}</td>
          <td class="n num"><b>${money(x.avgInc)}</b></td>
        </tr>`).join("")}
        <tr><td><b>Total</b></td><td class="n num"><b>${svcCount}</b></td>
          <td class="n num"><b>${money(svcTotal)}</b></td><td class="n num"></td></tr>
        </tbody></table></div>
      <div class="ans-note" style="margin-bottom:18px">These record no kWh or therms — that is how the work is
      tracked, not a gap. They are kept out of the utility table above and out of the savings averages, which would
      otherwise be pulled toward zero by ${svcCount} rows carrying none.</div>`;
  }

  /* ---- per engineer, both sides ---- */
  const engRow = (name, org, rs) => {
    const s = sumRows(rs);
    return { name, org, ...s,
      avgInc: per(s.incentive, s.count),
      audits: rs.filter(k => k.milestone === "Audits Performed").length,
      pas:    rs.filter(k => k.milestone === "Preapprovals Submitted").length,
      cos:    rs.filter(k => k.milestone === "Closeouts Submitted").length };
  };
  const hbsMap = new Map(), icfMap = new Map();
  for (const k of inCur) {
    for (const n of k.engineers) { if (!hbsMap.has(n)) hbsMap.set(n, []); hbsMap.get(n).push(k); }
    for (const n of k.icfEngs)   { if (!icfMap.has(n)) icfMap.set(n, []); icfMap.get(n).push(k); }
  }
  const engRows = [
    ...[...hbsMap.entries()].map(([n, rs]) => engRow(n, "HBS", rs)),
    ...[...icfMap.entries()].map(([n, rs]) => engRow(n, "ICF", rs)),
  ].sort((a, b) => b.count - a.count);

  /* ---- what it takes ----
     Given the average size of an audit's incentive, a target implies a number
     of audits. There is no goal column anywhere in monday, so the target is
     whatever you type; it starts at the previous period's total so the first
     answer means "match last period". */
  /* Audits carry no incentive on this board, so the number of audits a target
     needs cannot come from an average audit value. It comes from what an
     approved pre-approval is worth, walked back up the funnel through the rates
     at which audits become submissions and submissions become approvals. */
  const cnt = m => (stages.find(x => x.m === m) || { count: 0, incentive: 0 }).count;
  const val = m => (stages.find(x => x.m === m) || { count: 0, incentive: 0 }).incentive;

  const auditN = cnt("Audits Performed");
  const paSubN = cnt("Preapprovals Submitted"), paRecN = cnt("Preapprovals Received");
  const coSubN = cnt("Closeouts Submitted"), coRecN = cnt("Closeouts Received");

  const avgApproved = paRecN ? val("Preapprovals Received") / paRecN : 0;
  /* Within one period these compare different cohorts — the projects approved
     this month are rarely the ones audited this month — so a rate can come out
     above 1. Clamp for the arithmetic and say so rather than printing 115%. */
  const rawSubmit  = auditN ? paSubN / auditN : null;
  const rawApprove = paSubN ? paRecN / paSubN : null;
  const overflow = (rawSubmit != null && rawSubmit > 1) || (rawApprove != null && rawApprove > 1);
  const rSubmit  = rawSubmit  == null ? null : Math.min(1, rawSubmit);
  const rApprove = rawApprove == null ? null : Math.min(1, rawApprove);
  const valuePerAudit = (avgApproved && rSubmit != null && rApprove != null)
    ? avgApproved * rSubmit * rApprove : null;

  const target = TARGET;
  const needAudits = valuePerAudit > 0 ? Math.ceil(target / valuePerAudit) : null;
  const gapAudits  = needAudits != null ? needAudits - auditN : null;
  const needPA = avgApproved > 0 ? Math.ceil(target / avgApproved) : null;
  const avgCO = coRecN ? val("Closeouts Received") / coRecN : 0;
  const needCO = avgCO > 0 ? Math.ceil(target / avgCO) : null;

  /* Attainment per phase: what each phase delivered against what the target
     implies at that phase's own average size. One bar per phase, the marker
     showing the required count. */
  const attain = KPI_PHASES.map(m => {
    const rs = (byPhase.get(m) || []);
    const s2 = sumRows(rs);
    const avg = per(s2.incentive, s2.count);
    const need = avg > 0 ? Math.ceil(TARGET / avg) : 0;
    const pct = need ? Math.round((s2.count / need) * 100) : null;
    return { k: m, v: s2.count, of: need, label: need ? `${s2.count} / ${need}  (${pct}%)` : `${s2.count}`,
             tone: pct == null ? "ghost" : pct >= 100 ? "good" : pct >= 60 ? "warning" : "critical",
             title: `${m}: ${s2.count} done${need ? `, ${need} needed at ${money(avg)} each` : ""}` };
  }).filter(x => x.v || x.of);

  out += `<div class="section-head"><h2>Reaching the target, by phase</h2>
    <span class="hint">Each bar is what that phase delivered; the marker is what the target needs at that phase's average size</span></div>
    <div class="panel" style="padding:16px 18px;margin-bottom:18px">
      ${attain.length ? barChart(attain) : `<div class="ev">Nothing recorded in this period.</div>`}
      <div class="chart-legend">
        <span><i style="background:var(--good)"></i> at or past the mark</span>
        <span><i style="background:var(--warning)"></i> 60% or more</span>
        <span><i style="background:var(--critical)"></i> under 60%</span>
        <span><i style="background:var(--ink-3)"></i> required</span>
      </div>
    </div>

  <div class="section-head"><h2>What it takes</h2>
    <span class="hint">At the current average size, how much work a target implies</span></div>
    <div class="panel" style="padding:14px 16px;margin-bottom:18px;display:grid;gap:12px">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <label class="ev" for="n-target">Target value approved this ${esc(state.period)}</label>
        <input type="number" id="n-target" value="${target}" step="1000" style="width:160px;font:inherit;padding:6px 9px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface);color:var(--ink)">
        <span class="ev">${f.target != null ? "your figure" : `defaulting to the previous ${esc(state.period)}'s approved value, ${money(defaultTarget)}`}</span>
      </div>
      <div class="stats">
        ${tile(needAudits == null ? "—" : needAudits, "Audits needed",
          valuePerAudit ? `each is worth ${money(valuePerAudit)} once the funnel is applied` : "not enough of the funnel recorded")}
        ${tile(gapAudits == null ? "—" : (gapAudits > 0 ? "+" + gapAudits : "on track"), "Versus audits done", `${auditN} so far`)}
        ${tile(needPA == null ? "—" : needPA, "Approvals needed", avgApproved ? `at ${money(avgApproved)} each` : "none approved")}
        ${tile(needCO == null ? "—" : needCO, "Closeouts needed", avgCO ? `at ${money(avgCO)} each` : "none received")}
      </div>
      <div class="ans-note">${valuePerAudit ? (() => {
        const better = Math.min(1, (rApprove || 0) * 1.25);
        const lift = better / (rApprove || 1);
        const headroom = better > (rApprove || 0);
        return `An audit is worth ${money(valuePerAudit)} on average once the funnel is applied:
          ${Math.round((rSubmit || 0) * 100)}% of audits reach a submission, ${Math.round((rApprove || 0) * 100)}% of
          submissions are approved, and an approval averages ${money(avgApproved)}.
          ${headroom ? `Raising the approval rate to ${Math.round(better * 100)}% would need
            ${Math.ceil(target / (valuePerAudit * lift))} audits instead of ${needAudits}.`
          : `Approvals are already at the ceiling for this period, so volume is the only lever left in this view.`}`;
      })() : `Not enough of the funnel is recorded this ${esc(state.period)} to work back from a target.`}
        <br><br>${overflow
          ? `More reached a later stage than an earlier one this ${esc(state.period)}, which happens because these are
             different cohorts — the projects approved now were audited months ago. The rates above are capped at 100%
             for the arithmetic; pick a quarter or a year for a rate that means something.`
          : `Conversion is measured across this period, so it compares different cohorts — a project audited now is
             rarely the one approved now. Over a quarter or a year it settles down.`}</div>
    </div>

  ${(() => {
    /* ---- how many engineers the work in hand needs ----
       One engineer clears a period's worth of days divided by the average days
