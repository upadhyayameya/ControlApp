/* What a project is missing before it can move on — read off the board, not guessed. */
function infoGaps(p) {
  const gaps = [];
  if (!p.evDates.dAudit) gaps.push("no audit date");
  if (!p.auditor.length && !p.hbsEngs.length) gaps.push("no auditor");
  if (!p.icfEngs.length) gaps.push("no ICF engineer");
  if (!p.hbsEngs.length) gaps.push("no HBS engineer");
  if (!p.hasTu) gaps.push("not linked to TU tracker");
  if (!p.utility) gaps.push("no utility");
  if (!p.type) gaps.push("no project type");
  if (p.incentive == null) gaps.push("no incentive figure");
  return gaps;
}

/* Placeholder assignments on the board are not people — never address a digest to one. */
const NOT_A_PERSON = new Set(["TBD", "N/A", "NONE", "None", "---"]);

/* ---------------------------------------------------------------------------
   ICF isolation.

   The ICF/HBS Project Tracker is the board ICF already shares with us. The
   Master TU Tracker is HBS-internal: it carries SOW commercials (Rahl's, the
   client, CGS), internal QA/QC states, deal owners and a running admin-notes
   log. Teams messages, Fireflies notes and calendar invites are internal too.

   So the rule is drawn at the source, not field by field: anything bound for
   ICF may use ONLY the shared ICF board, plus the project's identity. Nothing
   from the TU tracker, no free text, no chatter, no money. It is a whitelist,
   so a column added to the TU board later cannot leak by default.
--------------------------------------------------------------------------- */
function icfSafeView(p) {
  return {
    name: p.name,
    projectId: p.projectId,
    utility: p.utility,
    type: p.type,
    phase: p.phase,
    status: p.icfStatus,
    submittedPA: p.evDates.dSubPA,
    paDate: p.evDates.dPAd,
    submittedCO: p.evDates.dSubCO,
    coDate: p.evDates.dCOd,
    nextActionDate: p.nextActionDate,
    ecd: p.ecd,
    /* Derived from the shared board's own status column only. */
    need: ICF_ACTIONS[p.icfStatus] ? ICF_ACTIONS[p.icfStatus].need : "",
    withHbs: !!(ICF_ACTIONS[p.icfStatus] && ICF_ACTIONS[p.icfStatus].role === "hbs"),
  };
}

function icfDigestBody(name, mine) {
  const rows = mine.map(icfSafeView);
  const onIcf = rows.filter(r => r.need && !r.withHbs);
  const onHbs = rows.filter(r => r.withHbs);
  const quiet = rows.filter(r => !r.need);

  const L = [];
  L.push(`Hi ${/\s/.test(name) ? name.split(" ")[0] : name},`, "");
  L.push(`Here is the current state of the HBS projects assigned to you, as of ${new Date().toLocaleDateString(undefined, { dateStyle: "medium" })}.`, "");
  L.push(`${rows.length} project${rows.length === 1 ? "" : "s"}.`);
  const line = r => `  • ${r.name}${r.projectId ? ` (${r.projectId})` : ""} — ${r.status || r.phase}`;
  if (onIcf.length) {
    L.push("", `WITH ICF (${onIcf.length})`);
    for (const r of onIcf) { L.push(line(r)); L.push(`      ${r.need}`); }
  }
  if (onHbs.length) {
    L.push("", `WITH HBS — WE OWE YOU A RESPONSE (${onHbs.length})`);
    for (const r of onHbs) { L.push(line(r)); L.push(`      ${r.need}`); }
  }
  if (quiet.length) {
    L.push("", `NO OPEN ACTION (${quiet.length})`);
    for (const r of quiet) L.push(line(r));
  }
  L.push("", "Dates on record:");
  for (const r of rows.filter(r => r.submittedPA || r.paDate || r.submittedCO || r.coDate)) {
    const bits = [];
    if (r.submittedPA) bits.push(`PA submitted ${r.submittedPA}`);
    if (r.paDate) bits.push(`PA'd ${r.paDate}`);
    if (r.submittedCO) bits.push(`CO submitted ${r.submittedCO}`);
    if (r.coDate) bits.push(`CO'd ${r.coDate}`);
    L.push(`  • ${r.name} — ${bits.join(", ")}`);
  }
  L.push("", "Automated from the shared ICF/HBS Project Tracker.");
  return L.join("\n");
}

/* Splits one engineer's projects into the buckets the digest is built from. */
function digestFor(name, org, list) {
  if (NOT_A_PERSON.has(name)) return null;
  const mine = list.filter(p => (org === "ICF" ? p.icfEngs : p.hbsEngs).includes(name));
  if (!mine.length) return null;
  const r = periodRange("week", new Date());
  const owns = p => !p.ownerNames.length || p.ownerNames.includes(name);

  const moved   = mine.filter(p => STAGES.some(s => inRange(p.ev[s.key], r.start, r.end)));
  const yours   = mine.filter(p => (p.sev === "critical" || p.sev === "serious") && owns(p));
  const waiting = mine.filter(p => p.sev === "critical" && !owns(p));
  const ageing  = mine.filter(p => p.aging === "Critical" && !yours.includes(p) && !waiting.includes(p));
  const rest    = mine.filter(p => !yours.includes(p) && !waiting.includes(p) && !ageing.includes(p));

  const byStage = {};
  for (const s of STAGES) byStage[s.key] = 0;
  for (const p of mine) if (p.current) byStage[p.current]++;

  const movedStages = new Map();
  for (const p of moved) movedStages.set(p, STAGES.filter(s => inRange(p.ev[s.key], r.start, r.end)).map(s => s.label).join(", "));

  let text;
  if (org === "ICF") {
    text = icfDigestBody(name, mine);
  } else {
    const L = [];
    L.push(`Hi ${/\s/.test(name) ? name.split(" ")[0] : name},`, "");
    L.push(`Here is where your HBS tune-up projects stand as of ${new Date().toLocaleDateString(undefined, { dateStyle: "medium" })}.`, "");
    L.push(`You have ${mine.length} active project${mine.length === 1 ? "" : "s"}.`);
    const anyStage = STAGES.filter(s => byStage[s.key]);
    if (anyStage.length) {
      L.push("", "WHERE THEY SIT");
      for (const s of anyStage) L.push(`  ${s.label}: ${byStage[s.key]}`);
    }
    if (moved.length) {
      L.push("", `MOVED THIS WEEK (${moved.length})`);
      for (const p of moved) L.push(`  • ${p.name} — ${movedStages.get(p)}`);
    }
    if (yours.length) {
      L.push("", `NEEDS YOUR ACTION (${yours.length})`);
      for (const p of yours) {
        L.push(`  • ${p.name}`, `      ${p.need}`);
        if (p.evidence) L.push(`      Latest: ${p.evidence.slice(0, 160)}`);
      }
    }
    if (waiting.length) {
      L.push("", `WAITING ON SOMEONE ELSE (${waiting.length})`);
      for (const p of waiting) L.push(`  • ${p.name} — ${p.need} (with ${p.ownerNames.join(", ")})`);
    }
    if (ageing.length) {
      L.push("", `AGEING PAST 60 DAYS (${ageing.length})`);
      for (const p of ageing) L.push(`  • ${p.name} — ${p.daysInPhase == null ? "?" : p.daysInPhase} days in ${p.phase} — ${p.need}`);
    }
    if (rest.length) {
      L.push("", `EVERYTHING ELSE (${rest.length})`);
      for (const p of rest) L.push(`  • ${p.name} — ${p.need}${p.ownerNames.length && !p.ownerNames.includes(name) ? ` (with ${p.ownerNames.join(", ")})` : ""}`);
    }
    L.push("", "— Sent automatically from the ICF × HBS pipeline tracker.");
    text = L.join("\n");
  }

  return { name, org, count: mine.length, owed: yours.length, ageingCount: ageing.length, movedCount: moved.length,
           byStage, moved, movedStages, yours, waiting, ageing, rest, mine, text };
}

/* A compact nine-cell strip of where one engineer's projects sit.
   Position carries the stage, the count is printed, and the tint is that
   stage's share of the engineer's book — one hue, so no false identity. */
function stageProfile(byStage, total) {
  const cells = STAGES.map(s => {
    const v = byStage[s.key] || 0;
    const share = total > 0 ? v / total : 0;
    const cls = !v ? "m0" : share > 0.5 ? "m5" : share > 0.32 ? "m4" : share > 0.18 ? "m3" : share > 0.08 ? "m2" : "m1";
    return `<span class="sc"><span class="cell num ${cls}" title="${esc(s.label)}: ${v}">${v || "\u00b7"}</span>` +
           `<span class="sl" title="${esc(s.label)}">${esc(s.short)}</span></span>`;
  }).join("");
  return `<div class="profile"><span class="cap">Where their projects sit</span><div class="strip">${cells}</div></div>`;
}

function bucket(title, cls, items, lineFn) {
  if (!items.length) return "";
  return `<div class="bucket b-${cls}">
    <h4 class="sev-${cls === "plain" ? "none" : cls}">${cls !== "plain" ? sevIcon(cls) : ""}${esc(title)} (${items.length})</h4>
    <ul>${items.map(p => `<li><span class="rail"></span><span>${lineFn(p)}</span></li>`).join("")}</ul>
  </div>`;
}

function renderDigest(list) {
  const names = new Map();
  for (const p of list) {
    for (const n of p.icfEngs) names.set("ICF " + n, { name: n, org: "ICF" });
    for (const n of p.hbsEngs) names.set("HBS " + n, { name: n, org: "HBS" });
  }
  const wanted = [...names.values()].filter(e => state.org === "both" || (state.org === "icf" ? e.org === "ICF" : e.org === "HBS"));
  const digests = wanted.map(e => digestFor(e.name, e.org, list)).filter(Boolean)
    .sort((a, b) => b.owed - a.owed || b.ageingCount - a.ageingCount || b.count - a.count);
  if (!digests.length) return `<div class="panel empty">No engineers match these filters.</div>`;

  const totalOwed = digests.reduce((n, d) => n + d.owed, 0);

  return `<div class="section-head"><h2>Weekly digest, per engineer</h2>
    <span class="hint">One card per engineer, sorted by who is most blocked. Each card is exactly what the Monday-morning email says.</span>
    <span class="hint num" style="margin-left:auto">${digests.length} engineers &middot; ${totalOwed} action${totalOwed === 1 ? "" : "s"} owed</span></div>
  <div class="cards">${digests.map((d, i) => {
    const stat = (v, l, cls) => `<div class="stat ${v ? cls : "is-zero"}"><div class="v num">${v}</div><div class="l">${esc(l)}</div></div>`;
    return `<div class="card">
      <div class="card-hd">
        <span class="avatar">${esc(d.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase())}</span>
        <span class="nm">${esc(d.name)}</span>
        <span class="chip ${d.org === "ICF" ? "chip-icf" : "chip-hbs"}">${d.org}</span>
        <span class="to">Subject: Your project update &mdash; week of ${esc(weekOfLabel())}</span>
      </div>
      <div class="card-bd">
        <div class="stats">
          ${stat(d.count, "Active", "")}
          ${stat(d.owed, "Action owed", "is-critical")}
          ${stat(d.ageingCount, "Ageing 60d+", "is-serious")}
          ${stat(d.movedCount, "Moved this week", "is-good")}
        </div>
        ${stageProfile(d.byStage, d.count)}
        ${bucket("Needs their action", "critical", d.yours, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(p.need)}</div>${p.evidence ? `<div class="m">Latest: ${esc(p.evidence.slice(0, 150))}</div>` : ""}`)}
        ${bucket("Waiting on someone else", "warning", d.waiting, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(p.need)}</div><div class="m">With ${esc(p.ownerNames.join(", "))}</div>`)}
        ${bucket("Ageing past 60 days", "serious", d.ageing, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(p.need)}</div><div class="m">${p.daysInPhase == null ? "?" : p.daysInPhase} days in ${esc(p.phase)}</div>`)}
        ${bucket("Moved this week", "good", d.moved, p =>
          `<span class="t">${esc(p.name)}</span><div class="s">${esc(d.movedStages.get(p) || "")}</div>`)}
        ${d.rest.length ? `<details class="detail"><summary>Everything else (${d.rest.length})</summary>
          <div class="detail-body">${d.rest.map(p => `<div><b>${esc(p.name)}</b> &mdash; ${esc(p.need)}</div>`).join("")}</div></details>` : ""}
        <details class="detail"><summary>Show the email exactly as it sends</summary>
          <div class="detail-body"><pre id="dg-${i}">${esc(d.text)}</pre>
          <div class="digest-actions"><button data-copy="dg-${i}">Copy</button></div></div></details>
      </div>
    </div>`;
  }).join("")}</div>`;
}
function weekOfLabel() {
  const r = periodRange("week", new Date());
  return r.start.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* ---- meeting intel ---- */
function projectTags(pred) {
  const hits = state.projects.filter(pred);
  if (!hits.length) return `<div class="tags"><span class="tag none">no project matched by name</span></div>`;
  return `<div class="tags">${hits.slice(0, 8).map(h =>
    `<span class="tag">${esc(h.name)}</span>`).join("")}${hits.length > 8 ? `<span class="tag none">+${hits.length - 8} more</span>` : ""}</div>`;
}

function meetingCard(m) {
  const link = m.firefliesUrl || m.url;
  const who = m.kind === "calendar"
    ? `${(m.attendees || []).length} attendee${(m.attendees || []).length === 1 ? "" : "s"}`
    : "Fireflies recap";
  return `<div class="fitem">
    <div class="top">
      <span class="who2">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title)}</span>
      <span class="when num">${esc(m.when)}</span>
      <span class="chip">${esc(m.source)}</span>
      ${m.withIcf ? `<span class="chip chip-icf">ICF on the invite</span>` : ""}
      ${m.kind === "calendar" && m.external && !m.withIcf ? `<span class="chip chip-hbs">external</span>` : ""}
      <span class="when" style="margin-left:auto">${esc(who)}</span>
    </div>
    ${m.bullets && m.bullets.length ? `<ul class="ov">${m.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
    ${projectTags(p => (p.meetings || []).some(x => x.id === m.id) || (p.calendar || []).some(x => x.id === m.id))}
  </div>`;
}

function renderIntel() {
  const parts = [];
  const mtg = state.meetings, tm = state.teams, cal = state.calendar;
  const matchedM = state.projects.filter(p => p.meetings.length || p.calendar.length).length;
  const matchedT = state.projects.filter(p => p.teams.length).length;

  parts.push(`<div class="section-head"><h2>Meeting and chat signal</h2>
    <span class="hint">Fireflies recaps and Teams messages, matched to projects by name. Nothing here is typed by hand.</span></div>
    <div class="stats" style="margin-bottom:16px">
      <div class="stat ${cal.length ? "" : "is-zero"}"><div class="v num">${cal.length}</div><div class="l">Meetings</div></div>
      <div class="stat ${mtg.length ? "" : "is-zero"}"><div class="v num">${mtg.length}</div><div class="l">Fireflies recaps</div></div>
      <div class="stat ${tm.length ? "" : "is-zero"}"><div class="v num">${tm.length}</div><div class="l">Teams messages</div></div>
      <div class="stat ${matchedM + matchedT ? "" : "is-zero"}"><div class="v num">${matchedM + matchedT}</div><div class="l">Projects mentioned</div></div>
    </div>`);

  if (state.errors.calendar) parts.push(errNote("Calendar meetings", state.errors.calendar, MS365));
  if (cal.length) {
    const upcoming = cal.filter(m => m.day >= isoDay(0));
    const past = cal.filter(m => m.day < isoDay(0));
    if (upcoming.length) parts.push(`<div class="section-head"><h2>Coming up</h2><span class="hint">Next meetings on your calendar</span>
      <span class="hint num" style="margin-left:auto">${upcoming.length}</span></div>
      <div class="feed">${upcoming.slice().reverse().map(meetingCard).join("")}</div>`);
    if (past.length) parts.push(`<div class="section-head"><h2>Recent meetings</h2><span class="hint">The last three weeks</span>
      <span class="hint num" style="margin-left:auto">${past.length}</span></div>
      <div class="feed">${past.slice(0, 25).map(meetingCard).join("")}</div>`);
  }

  if (state.errors.fireflies) parts.push(errNote("Fireflies recaps (Outlook)", state.errors.fireflies, MS365));
  if (state.errors.teams) parts.push(errNote("Teams messages", state.errors.teams, MS365));

  if (mtg.length) {
    parts.push(`<div class="section-head"><h2>Fireflies meetings</h2><span class="hint">What each meeting covered, newest first</span></div>
      <div class="feed">${mtg.map(meetingCard).join("")}</div>`);
  } else if (!state.errors.fireflies && sourceState.fireflies !== "ok") {
    parts.push(`<div class="skel"><span class="spin"></span>Reading Fireflies recaps from Outlook…</div>`);
  } else if (!state.errors.fireflies) {
    parts.push(`<div class="panel empty">No Fireflies recap emails found in your recent mail.</div>`);
  }

  if (tm.length) {
    parts.push(`<div class="section-head"><h2>Teams chatter</h2><span class="hint">Recent messages mentioning project work</span></div>
      <div class="feed">${tm.map(t => `<div class="fitem">
        <div class="top">
          <span class="avatar">${esc(t.from.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase())}</span>
          <span class="who2">${esc(t.from)}</span><span class="when num">${esc(t.when)}</span></div>
        <div class="msg">${esc(String(t.text).slice(0, 400))}</div>
        ${projectTags(p => p.teams.some(x => x.id === t.id))}
      </div>`).join("")}</div>`);
  } else if (!state.errors.teams && sourceState.teams !== "ok") {
    parts.push(`<div class="skel"><span class="spin"></span>Reading Teams messages…</div>`);
  }
  return parts.join("");
}

function errNote(what, err, server) {
  const cls = AUTHZ.has(err.code) ? "note-critical" : "note-warning";
  return `<div class="note ${cls}"><h3>${esc(what)} unavailable</h3><p>${esc(fixCopy(err, server))}</p></div>`;
}

/* ---- shell ---- */
function render() {
  const list = filtered();
  $("#count-stamp").textContent = `${list.length} of ${state.projects.length} projects`;

  let body = "";
  if (state.view === "pipeline") body = renderPipeline(list);
  else if (state.view === "numbers") body = renderNumbers();
  else if (state.view === "mydesk") body = renderMyDesk(list);
  else if (state.view === "asap") body = renderAsap(list);
  else if (state.view === "todos") body = renderTodos();
  else if (state.view === "audits") body = renderAudits(list);
  else if (state.view === "projects") body = renderProjects(list);
  else if (state.view === "digest") body = renderDigest(list);
  else body = renderIntel();

  const src = [];
  src.push(`<span>monday.com: <b>${state.projects.length}</b> projects · <b>${state.projects.filter(p => p.hasTu).length}</b> joined to the TU tracker</span>`);
  src.push(`<span>Teams: ${sourceState.teams === "ok" ? `<b>${state.teams.length}</b> messages` : state.errors.teams ? "unavailable" : "loading…"}</span>`);
  src.push(`<span>Fireflies: ${sourceState.fireflies === "ok" ? `<b>${state.meetings.length}</b> recaps` : state.errors.fireflies ? "unavailable" : "loading…"}</span>`);
  src.push(`<span>Calendar: ${sourceState.calendar === "ok" ? `<b>${state.calendar.length}</b> meetings` : state.errors.calendar ? "unavailable" : "loading…"}</span>`);
  if (state.workloadLoaded) src.push(`<span>Workload: <b>${state.todos.length}</b> open to-dos</span>`);
  if (state.kpisLoaded) src.push(`<span>Monthly KPIs: <b>${state.kpis.length}</b> milestones (13 months)</span>`);

  main.innerHTML = body + `<div class="srcline">${src.join("")}</div>`;

  main.querySelectorAll("[data-engineer]").forEach(b => b.addEventListener("click", () => {
    state.engineer = b.getAttribute("data-engineer");
    const sel = document.querySelector("#f-eng");
    if (sel) sel.value = state.engineer;
    state.view = "projects";
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x.dataset.view === "projects")));
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));

  main.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const pre = document.getElementById(b.getAttribute("data-copy"));
    if (!pre) return;
    try { await navigator.clipboard.writeText(pre.textContent); b.textContent = "Copied"; }
    catch { b.textContent = "Select the text to copy"; }
    setTimeout(() => { b.textContent = "Copy"; }, 1800);
  }));
}

function renderBanners() {
  const b = [];
  if (state.errors.monday) b.push(errNote("monday.com project data", state.errors.monday, MONDAY));
  $("#banners").innerHTML = b.join("");
}

function setStamp() {
  const el = $("#stamp");
  if (!state.loadedAt) { el.textContent = ""; return; }
  const when = new Date(state.storedAt || state.loadedAt);
  const cached = state.storedAt && (state.loadedAt - state.storedAt > 5000);
  el.innerHTML = `${cached ? "Cached " : "Read "}<b>${when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</b>`;
}

function fillFilters() {
  const engs = new Map();
  for (const p of state.projects) {
    for (const n of p.icfEngs) engs.set(n + " ICF", { n, org: "ICF" });
    for (const n of p.hbsEngs) engs.set(n + " HBS", { n, org: "HBS" });
  }
  const pool = [...engs.values()]
    .filter(e => state.org === "both" || (state.org === "icf" ? e.org === "ICF" : e.org === "HBS"))
    .map(e => e.n);
  const uniq = [...new Set(pool)].sort();
  const sel = $("#f-eng");
  const cur = state.engineer;
  sel.innerHTML = `<option value="">All</option>` + uniq.map(n => `<option value="${esc(n)}"${n === cur ? " selected" : ""}>${esc(n)}</option>`).join("");
  if (!uniq.includes(cur)) { state.engineer = ""; sel.value = ""; }

  const fill = (id, vals) => {
    const s = $(id), c = s.value;
    s.innerHTML = `<option value="">All</option>` + [...new Set(vals)].filter(Boolean).sort().map(v => `<option value="${esc(v)}"${v === c ? " selected" : ""}>${esc(v)}</option>`).join("");
  };
  fill("#f-util", state.projects.map(p => p.utility));
  fill("#f-type", state.projects.map(p => p.type));
}

/* ========================= loading ======================================= */
async function loadMonday(refresh) {
  state.storedAt = null;
  try {
    const [icfItems, tuItems] = await Promise.all([
      fetchBoard(BOARD_ICF, ICF_COLS, null, refresh),
      fetchBoard(BOARD_TU, TU_COLS, [{ columnId: T.rel, operator: "is_not_empty", compareValue: "" }], refresh),
    ]);
    state.projects = buildProjects(icfItems, tuItems);
    state.errors.monday = null;
    sourceState.monday = "ok";
  } catch (e) {
    const err = mcpError(e);
    state.errors.monday = err;
    sourceState.monday = "error";
    if (AUTHZ.has(err.code)) state.projects = [];
  }
  state.loadedAt = Date.now();
}

async function loadTeams() {
  sourceState.teams = "loading";
  try {
    const res = await call(MS365, "chat_message_search", { query: "project", limit: 25 });
    state.teams = rowsFrom(res).filter(r => r.id && r.createdDateTime).map(r => ({
      id: String(r.id),
      source: "Teams",
      from: (r.from && r.from.displayName) || "Unknown",
      when: dstr(r.createdDateTime) || "",
      text: String(r.summary || "").replace(/\s+/g, " ").trim(),
      url: r.webUrl || "",
    })).filter(r => r.text);
    attachMentions(state.projects, state.teams, "teams");
    state.errors.teams = null;
    sourceState.teams = "ok";
  } catch (e) {
    state.errors.teams = mcpError(e);
    sourceState.teams = "error";
  }
}

/* The recap email links straight back to the full notes in Fireflies. */
function firefliesLink(html) {
  try {
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    const a = [...doc.querySelectorAll("a[href]")].map(x => x.getAttribute("href"))
      .find(h => /app\.fireflies\.ai\/view\//i.test(h || ""));
    return a ? a.split("?")[0] : "";
  } catch { return ""; }
}

function bulletsFromRecap(html) {
  try {
    const doc = new DOMParser().parseFromString(String(html), "text/html");
    const cells = [...doc.querySelectorAll("td")];
    const head = cells.find(td => /meeting overview/i.test(td.textContent || ""));
    let ul = null;
    if (head) {
      let n = head.parentElement;
      while (n && !ul) { ul = n.querySelector("ul"); n = n.nextElementSibling; }
    }
    if (!ul) ul = doc.querySelector("ul");
    if (!ul) return [];
    return [...ul.querySelectorAll("li")]
      .map(li => (li.textContent || "").replace(/\s+/g, " ").trim())
      .filter(t => t.length > 12).slice(0, 8);
  } catch { return []; }
}

async function loadFireflies() {
  sourceState.fireflies = "loading";
  try {
    const res = await call(MS365, "outlook_email_search", { query: "Your meeting recap", limit: 25 });
    const recaps = rowsFrom(res).filter(r => r.id && typeof r.subject === "string" && /meeting recap/i.test(r.subject)).slice(0, 14);

    state.meetings = recaps.map(r => ({
      id: String(r.id),
      uri: r.uri || `mail:///messages/${r.id}`,
      source: "Fireflies",
      kind: "recap",
      title: String(r.subject).replace(/^Your meeting recap\s*-\s*/i, "").trim(),
      when: dstr(r.receivedDateTime) || "",
      day: dstr(r.receivedDateTime) || "",
      url: r.webLink || "",
      firefliesUrl: "",
      bullets: [],
      text: String(r.subject || ""),
    }));
    attachMentions(state.projects, state.meetings, "meetings");
    state.errors.fireflies = null;
    sourceState.fireflies = "ok";
    render();

    /* read the bodies one at a time so a slow mailbox never blocks the page */
    for (const m of state.meetings) {
      try {
        const body = await call(MS365, "read_resource", { uri: m.uri });
        const p = body && body.payload;
        const html = p && p.body && p.body.content ? p.body.content : "";
        m.bullets = bulletsFromRecap(html);
        m.firefliesUrl = firefliesLink(html);
        m.text = [m.title, ...m.bullets].join(" ");
      } catch { /* one unreadable recap must not stop the rest */ }
    }
    for (const p of state.projects) p.meetings = [];
    attachMentions(state.projects, state.meetings, "meetings");
  } catch (e) {
    state.errors.fireflies = mcpError(e);
    sourceState.fireflies = "error";
  }
}

/* ---------------------------------------------------------------------------
   Monthly KPIs is the company scoreboard: one row per milestone actually
   reached, carrying the date, the engineer, the incentive and the savings.
   Thirteen months are pulled so month-on-month and year-to-date both work.
   Loaded lazily — it is the biggest board in the account.
--------------------------------------------------------------------------- */
async function loadKpis() {
  if (state.kpisLoaded || state.kpisLoading) return;
  state.kpisLoading = true;
  render();
  try {
    const from = new Date();
    from.setMonth(from.getMonth() - 13);
    from.setDate(1);
    const items = await fetchBoard(BOARD_KPI, Object.values(KPI),
      [{ columnId: KPI.date, operator: "greater_than_or_equals", compareValue: from.toISOString().slice(0, 10) }], false);

    state.kpis = items.map(it => ({
      id: String(it.id),
      name: it.name || "",
      url: it.url || "",
      milestone: (it.group && it.group.title) || "",
      utility: col(it, KPI.utility),
      source: col(it, KPI.source),
      engineers: people(it, KPI.engineer),
      status: col(it, KPI.status),
      date: dstr(col(it, KPI.date)),
      when: dparse(col(it, KPI.date)),
      incentive: num(it, KPI.incentive) || 0,
      hbsShare: num(it, KPI.hbsShare) || 0,
      savings: num(it, KPI.savings) || 0,
    })).filter(k => k.when);
    state.errors.kpis = null;
    state.kpisLoaded = true;
  } catch (e) {
    state.errors.kpis = mcpError(e);
  }
  state.kpisLoading = false;
  render();
}

/* ---------------------------------------------------------------------------
   The workload boards ARE the team's to-do list: each item sits in a group
   named after the person who owns it, with its own due date and hours. Their
   lookup columns are mirrors the connector cannot read, so priority, status
   and notes are joined back from the TU tracker through the relation column.
   Loaded lazily — only when a board that needs it is opened.
--------------------------------------------------------------------------- */
async function loadWorkload() {
  if (state.workloadLoaded || state.workloadLoading) return;
  state.workloadLoading = true;
  try {
    const cols = [...Object.values(W), W_ADDED_PA, W_ADDED_CO];
    const [pa, co] = await Promise.all([
      fetchBoard(BOARD_PA_WORK, cols, null, false),
      fetchBoard(BOARD_CO_WORK, cols, null, false),
    ]);

    const raw = [];
    for (const [items, kind] of [[pa, "Pre-approval"], [co, "Closeout"]]) {
      for (const it of items) {
        const group = (it.group && it.group.title) || "";
        if (WORK_DONE_GROUPS.has(group)) continue;              // finished work is not a to-do
        if (col(it, W.done)) continue;                          // completed on the board
        const st = col(it, W.status);
        if (st === "Done" || st === "Cancelled") continue;
        raw.push({
          id: String(it.id), name: it.name || "(untitled)", url: it.url || "",
          kind, group,
          person: group === RFI_GROUP ? "" : group,
          rfiQueue: group === RFI_GROUP,
          due: dstr(col(it, W.dueDate)) || dstr(col(it, W.due2)) || dstr(col(it, W.due3)),
          added: dstr(col(it, W_ADDED_PA)) || dstr(col(it, W_ADDED_CO)),
          hours: num(it, W.hours),
          status: st,
          tuIds: relIds(it, W.rel, BOARD_TU),
        });
      }
    }

    /* Enrich from the TU tracker, which holds the real (non-mirror) values. */
    const need = [...new Set(raw.flatMap(t => t.tuIds))].map(Number).filter(Boolean);
    const tuById = new Map();
    for (let i = 0; i < need.length; i += 100) {
      const chunk = need.slice(i, i + 100);
      try {
        const res = await call(MONDAY, "get_board_items_page", {
          boardId: BOARD_TU, itemIds: chunk, limit: 100, includeColumns: true, includeGroup: true,
          columnIds: [T.status, T.priority, T.adminNotes, T.dAudit, T.dImpl, T.auditor, T.paLead, T.coLead, T.dealOwner, T.aiSummary],
        });
        for (const it of ((res.payload && res.payload.items) || [])) tuById.set(String(it.id), it);
      } catch { /* a failed chunk just means less detail on those rows */ }
    }

    const today = new Date(); today.setHours(0, 0, 0, 0);
    state.todos = raw.map(t => {
      const tu = t.tuIds.map(id => tuById.get(id)).find(Boolean) || null;
      const tuStatus = tu ? col(tu, T.status) : "";
      const rule = TU_ACTIONS[tuStatus] || null;
      const leads = tu ? [...people(tu, T.paLead), ...people(tu, T.coLead)] : [];
      const overdue = t.due ? (dparse(t.due) < today) : false;
      return {
        ...t, tuStatus,
        priorityLabel: tu ? col(tu, T.priority) : "",
        need: rule ? rule.need : (t.rfiQueue ? "Answer the outstanding RFI" : "Progress this item"),
        sev: rule && rule.sev ? rule.sev : (overdue ? "serious" : "none"),
        overdue,
        lead: t.person || leads[0] || "",
        notes: tu ? latestNoteLine(col(tu, T.adminNotes)) : "",
        auditDate: tu ? dstr(col(tu, T.dAudit)) : "",
        implDate: tu ? dstr(col(tu, T.dImpl)) : "",
      };
    });
    state.errors.workload = null;
    state.workloadLoaded = true;
  } catch (e) {
    state.errors.workload = mcpError(e);
  }
  state.workloadLoading = false;
  render();
}

/* Every meeting on the calendar in a window around today, matched to projects.
   Fireflies recaps say what was decided; the calendar says what is coming up. */
async function loadCalendar() {
  sourceState.calendar = "loading";
  try {
    const rows = [];
    for (let offset = 0; offset < 75; offset += 25) {
      const res = await call(MS365, "outlook_calendar_search", {
        query: "*", afterDateTime: isoDay(-21), beforeDateTime: isoDay(21), limit: 25, offset,
      });
      const page = rowsFrom(res).filter(r => r.id && r.subject);
      rows.push(...page);
      if (page.length < 25) break;
    }
    state.calendar = rows.filter(r => !r.isCancelled).map(r => {
      const att = Array.isArray(r.attendees) ? r.attendees : [];
      const when = (r.start && r.start.dateTime) ? String(r.start.dateTime).slice(0, 16).replace("T", " ") : "";
      return {
        id: String(r.id),
        source: "Meeting",
        kind: "calendar",
        title: String(r.subject).trim(),
        when,
        day: (r.start && r.start.dateTime) ? String(r.start.dateTime).slice(0, 10) : "",
        tz: (r.start && r.start.timeZone) || "",
        organizer: r.organizer || "",
        attendees: att,
        external: att.some(a => !isHbs(a)),
        withIcf: att.some(isIcf),
        url: r.webLink || "",
        bullets: [],
        text: String(r.subject || ""),
      };
    }).sort((a, b) => String(b.day).localeCompare(String(a.day)));
    attachMentions(state.projects, state.calendar, "calendar");
    state.errors.calendar = null;
    sourceState.calendar = "ok";
  } catch (e) {
    state.errors.calendar = mcpError(e);
    sourceState.calendar = "error";
  }
}
function isoDay(deltaDays) {
  const d = new Date();
  d.setDate(d.getDate() + deltaDays);
  return d.toISOString().slice(0, 10);
}

async function boot(refresh) {
  $("#refresh").disabled = true;
  if (!state.projects.length) main.innerHTML = `<div class="skel"><span class="spin"></span>Reading the ICF/HBS Project Tracker and Master TU Tracker…</div>`;

  await loadMonday(refresh);
  renderBanners();
  fillFilters();
  setStamp();
  $("#controls").hidden = false;
  render();

  await Promise.all([
    loadTeams().then(() => render()),
    loadCalendar().then(() => render()),
    loadFireflies().then(() => render()),
  ]);
  render();
  $("#refresh").disabled = false;
}

/* ========================= wiring ======================================== */
function segment(groupSel, key, after) {
  document.querySelectorAll(`${groupSel} button`).forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(`${groupSel} button`).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    state[key] = b.dataset[key];
    if (after) after();
    render();
  }));
}
segment("#period-group", "period");
segment("#org-group", "org", () => fillFilters());

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
  state.view = t.dataset.view;
  render();
  if ((state.view === "todos" || state.view === "mydesk") && mcp) loadWorkload();
  if (state.view === "numbers" && mcp) loadKpis();
}));
$("#f-eng").addEventListener("change", e => { state.engineer = e.target.value; render(); });
$("#f-util").addEventListener("change", e => { state.utility = e.target.value; render(); });
$("#f-type").addEventListener("change", e => { state.type = e.target.value; render(); });
let qt = null;
$("#f-q").addEventListener("input", e => { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => { state.q = v; render(); }, 160); });
$("#refresh").addEventListener("click", () => {
  state.workloadLoaded = false; state.todos = [];
  state.kpisLoaded = false; state.kpis = [];
  boot(true).then(() => {
    if (state.view === "todos" || state.view === "mydesk") loadWorkload();
    if (state.view === "numbers") loadKpis();
  });
});

/* ========================= start ======================================== */
(async function start() {
  mcp = await window.claude?.use?.("mcp");
  if (!mcp) {
    main.innerHTML = `<div class="note note-critical"><h3>Connectors are not available in this view</h3>
      <p>This dashboard reads live from your monday.com and Microsoft 365 connectors. Open it from claude.ai, signed in as yourself, and it will fill in.</p></div>`;
    return;
  }
  try {
    const { servers } = await mcp.listTools();
    const have = new Set((servers || []).filter(s => (s.tools || []).length).map(s => s.server));
    const missing = [MONDAY, MS365].filter(s => !have.has(s));
    if (missing.length) {
      $("#banners").innerHTML = `<div class="note note-warning"><h3>${esc(missing.join(" and "))} not connected</h3>
        <p>Add ${esc(missing.join(" and "))} in claude.ai Settings → Connectors, then press Refresh. Everything that does not depend on ${missing.length > 1 ? "them" : "it"} still loads.</p></div>`;
    }
  } catch { /* listTools is advisory — the calls themselves report the real state */ }
  boot(false);
  setInterval(() => { if (!document.hidden) boot(true); }, 15 * 60 * 1000);
})();
</script>
