<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pen Show">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Pen Show Tracker</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --bg:#f6f6f8; --panel:#ffffff; --panel-2:#f0f1f4; --line:#d9dbe2;
  --ink:#14161c; --ink-2:#5a6172; --ink-3:#878e9f;
  --accent:#1f6feb; --accent-ink:#ffffff;
  --good:#0f8b4c; --warn:#b26a00; --bad:#c02b2b;
  --cash:#0f8b4c; --zelle:#6d28d9; --venmo:#0a7ea4; --card:#b45309; --other:#5a6172;
  --r:12px; --shadow:0 1px 2px rgba(20,22,28,.06),0 8px 24px rgba(20,22,28,.06);
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --panel:#181b22; --panel-2:#20242d; --line:#2c313c;
    --ink:#e9ecf2; --ink-2:#a3abbb; --ink-3:#7b8497;
    --accent:#4d8dff; --accent-ink:#0b0d11;
    --good:#3ecf8e; --warn:#e0a458; --bad:#ff6b6b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --panel:#181b22; --panel-2:#20242d; --line:#2c313c;
  --ink:#e9ecf2; --ink-2:#a3abbb; --ink-3:#7b8497;
  --accent:#4d8dff; --accent-ink:#0b0d11;
  --good:#3ecf8e; --warn:#e0a458; --bad:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}

/* ----------------------------------------------------------------- base */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* stops iOS zoom-on-focus */
a{color:var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* --------------------------------------------------------------- layout */
header.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex; align-items:center; gap:10px;
}
header.top .title{font-size:16px;font-weight:700;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .sub{font-size:12px;color:var(--ink-2);font-weight:500}
main{padding:12px; max-width:1100px; margin:0 auto}
.view{display:none}
.view.on{display:block}

nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  background:none;border:0;padding:8px 2px 10px;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;
}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* ------------------------------------------------------------ primitives */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow)}
.pad{padding:12px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.right{text-align:right}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}

.btn{
  min-height:var(--tap); padding:0 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  font-weight:600; cursor:pointer; display:inline-flex; align-items:center;
  justify-content:center; gap:6px;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.05em}
.input,select.input,textarea.input{
  min-height:var(--tap); padding:9px 11px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); width:100%;
}
textarea.input{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);font-size:12px;font-weight:600}
.chip.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.flat{background:var(--panel-2);color:var(--ink-2)}

/* ------------------------------------------------------------- sell view */
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar .input{flex:1}

.skugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.sku{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;
}
.sku:active{border-color:var(--accent)}
.sku .ph{aspect-ratio:4/3;background:var(--panel-2);position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.sku .ph img{width:100%;height:100%;object-fit:cover;display:block}
.sku .ph .noimg{font-size:26px;opacity:.28}
.sku .qty{position:absolute;top:6px;right:6px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:1px 8px;
  font-size:11.5px;font-weight:800}
.sku .qty.zero{background:var(--bad);border-color:transparent;color:#fff}
.sku .qty.low{background:var(--warn);border-color:transparent;color:#fff}
.sku .meta{padding:8px 9px 9px;display:flex;flex-direction:column;gap:2px;flex:1}
.sku .nm{font-weight:650;font-size:13.5px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sku .br{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;
  letter-spacing:.04em}
.sku .pr{margin-top:auto;padding-top:5px;font-weight:800;font-size:15px}

.cartbar{
  position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));
  z-index:45;background:var(--accent);color:var(--accent-ink);border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);padding:11px 14px;
  display:none;align-items:center;gap:10px;cursor:pointer;font-weight:700;
  max-width:1084px;margin:0 auto;
}
.cartbar.on{display:flex}

.line{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:var(--panel)}
.stepper button{width:32px;height:34px;border:0;background:transparent;font-size:17px;
  font-weight:700;cursor:pointer;color:var(--ink)}
.stepper span{min-width:26px;text-align:center;font-weight:700;font-size:14px}

.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paybtn{min-height:52px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
  font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.paybtn.on{border-color:transparent;color:#fff}
.paybtn.on[data-m="Cash"]{background:var(--cash)}
.paybtn.on[data-m="Zelle"]{background:var(--zelle)}
.paybtn.on[data-m="Venmo"]{background:var(--venmo)}
.paybtn.on[data-m="Card"]{background:var(--card)}
.paybtn.on[data-m="Check"],.paybtn.on[data-m="Trade"]{background:var(--other)}

.sku .typetag{position:absolute;top:6px;left:6px;background:rgba(20,22,28,.62);color:#fff;
  border-radius:6px;padding:1px 6px;font-size:10px;font-weight:800;letter-spacing:.04em}
/* Where the pen physically is — the thing you need once it is sold. */
.sku .loc{position:absolute;left:0;right:0;bottom:0;background:rgba(20,22,28,.72);color:#fff;
  font-size:10.5px;font-weight:700;padding:3px 6px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sku .skucode{font-size:10px;margin-top:1px}
.filterbreak{flex-basis:100%;height:0}
.chip.sub{font-size:11.5px;padding:2px 8px;opacity:.9}

/* Photos / List toggle — recognise the pen by sight, or scan the names. */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--panel);color:var(--ink-2);font-size:12px;font-weight:700;
  padding:6px 12px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.skugrid.aslist{grid-template-columns:1fr;gap:8px}
.skurow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
  box-shadow:var(--shadow);color:var(--ink)}
.skurow:active{border-color:var(--accent)}
.rthumb{width:52px;height:52px;border-radius:9px;overflow:hidden;flex:none;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rthumb .noimg{font-size:20px;opacity:.3}
.rmeta{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.rmeta b{font-size:14px;font-weight:650;line-height:1.2}
.rright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rright b{font-size:15px}
.rright .qty{position:static;padding:1px 8px;font-size:11px}

/* --------------------------------------------------------- inventory row */
.invrow{align-items:flex-start}
.thumb{width:60px;height:60px;border-radius:11px;flex:none;padding:0;cursor:pointer;
  border:1px dashed var(--line);background:var(--panel-2);overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.thumb.has{border-style:solid}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .add{font-size:22px;font-weight:300;line-height:1}
.thumb:active{border-color:var(--accent);color:var(--accent)}
.skucode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  color:var(--ink-3);letter-spacing:.02em}
.big-sku{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.01em}

/* ------------------------------------------------------- editor controls */
.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.chiprow{display:flex;gap:8px}
.chiprow.wrap{flex-wrap:wrap}
.bigchip{flex:1;min-height:52px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;color:var(--ink);padding:6px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.bigchip b{font-size:13px;font-weight:650;line-height:1.15;text-align:center}
.bigchip span{font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.06em}
.bigchip.sm{flex:0 0 auto;min-width:88px;min-height:46px}
.bigchip.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.bigchip.on span{color:var(--accent-ink);opacity:.75}
.chip.lg{min-height:38px;padding:0 14px;font-size:14px;cursor:pointer}

.photozone{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;
  border:1px dashed var(--line);background:var(--panel-2);margin-bottom:4px}
.photozone.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.photozone .pv{width:84px;height:84px;border-radius:10px;flex:none;overflow:hidden;cursor:pointer;
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);border:1px solid var(--line)}
.photozone .pv img{width:100%;height:100%;object-fit:cover;display:block}
.photozone .pv .add{font-size:28px;font-weight:300}

.skubox{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;
  border-radius:11px;background:var(--panel-2);border:1px solid var(--line)}
.skubox>div{flex:1;min-width:0}

/* --------------------------------------------- open sales & held pens */
.openstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.opill{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:7px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;color:var(--ink);min-height:46px;justify-content:center}
.opill b{font-size:12.5px;font-weight:700;white-space:nowrap}
.opill span{font-size:11px;color:var(--ink-3);font-weight:600}
.opill.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.opill.on span{color:var(--accent-ink);opacity:.8}
.opill.hold{background:color-mix(in srgb,var(--warn) 14%,transparent);
  border-color:color-mix(in srgb,var(--warn) 40%,transparent);flex-direction:row;
  align-items:center;gap:8px;cursor:default}
.opill.hold b,.opill.hold span{white-space:nowrap}
.opill.add{border-style:dashed;color:var(--accent);font-weight:700;justify-content:center}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:11px;
  font-weight:700;padding:4px 8px;cursor:pointer;color:var(--ink);min-height:28px}

/* switcher inside the sale sheet */
.ticketbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.tkt{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:6px 11px;
  border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
.tkt b{font-size:12.5px;white-space:nowrap}
.tkt span{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tkt.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.tkt.on span{color:var(--accent-ink);opacity:.8}
.footwrap{width:100%}
.toast.act{cursor:pointer;pointer-events:auto}

/* tap a picture to see it full size */
.sku .zoom{position:absolute;left:6px;bottom:26px;width:28px;height:28px;border-radius:8px;
  background:rgba(20,22,28,.62);color:#fff;font-size:14px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;z-index:2}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(6,8,12,.94);display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top))}
.lightbox img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lbcap{margin-top:14px;text-align:center;color:#f4f5f8;display:flex;flex-direction:column;gap:3px}
.lbcap b{font-size:16px}
.lbcap span{font-size:12.5px;opacity:.72}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;
  border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer}
.lbact{margin-top:16px;display:flex;gap:8px}

/* -------------------------------------------------------------- sheets */
.scrim{position:fixed;inset:0;background:rgba(6,8,12,.5);z-index:60;display:none;
  backdrop-filter:blur(2px)}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--panel);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  max-height:92vh;display:none;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.3);
}
.sheet.on{display:flex}
@media(min-width:760px){
  .sheet{left:50%;transform:translateX(-50%);width:620px;bottom:16px;border-radius:18px;
    border:1px solid var(--line)}
}
.sheet .head{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
  border-radius:18px 18px 0 0}
.sheet .head h2{font-size:16px;flex:1}
.sheet .body{overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.sheet .foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel);flex-wrap:wrap}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel-2);cursor:pointer;font-size:16px;line-height:1;color:var(--ink)}

/* --------------------------------------------------------------- tables */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);padding:6px 6px;border-bottom:1px solid var(--line);font-weight:700}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv+.kv{border-top:1px dashed var(--line)}
.kv b{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat{background:var(--panel-2);border-radius:10px;padding:10px}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  font-weight:700}
.stat .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%}

.empty{text-align:center;padding:36px 16px;color:var(--ink-3)}
.empty .em{font-size:34px;display:block;margin-bottom:8px;opacity:.6}
.warnbox{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);
  padding:9px 11px;border-radius:0 8px 8px 0;font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:90;
  font-weight:650;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media print{nav.tabs,.cartbar,header.top .btn{display:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="grow">
    <div class="title" id="hdrTitle">Pen Show Tracker</div>
    <div class="sub" id="hdrSub">—</div>
  </div>
  <button class="btn sm ghost" id="themeBtn" title="Theme">◐</button>
</header>

<main>
  <!-- ============================================================ SELL -->
  <section class="view on" id="v-sell">
    <div class="searchbar">
      <input class="input" id="sellSearch" placeholder="Model, colour, SKU or case…" autocomplete="off">
      <button class="btn sm" id="customLineBtn" title="Sell something not in inventory">+ Custom</button>
    </div>
    <div id="sellOpen"></div>
    <div class="row wrap tiny" id="sellFilters" style="margin-bottom:6px"></div>

  <button data-v="inv"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>Inventory</button>

  <div class="head"><h2 id="sheetTitle">—</h2><button class="x" id="sheetX">✕</button></div>
  <div class="body" id="sheetBody"></div>
  <div class="foot" id="sheetFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   Pen Show Tracker — offline-first inventory + point of sale for pen shows.
   Single file, no build step, no network. State lives in IndexedDB on the
   device (photos in their own store so the main blob stays small).
   ========================================================================== */

/* ------------------------------------------------------------------ utils */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = p => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const money = n => (n < 0 ? "-$" : "$") + Math.abs(+n || 0).toFixed(2);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayISO = () => new Date().toISOString().slice(0, 10);
const pct = n => (n * 100).toFixed(1) + "%";

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.onclick = null; t.classList.remove("act");
  t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1900);
}

/* A toast you can tap to take the action back — used where a confirm dialog
   would otherwise slow down a queue of customers. */
function toastUndo(msg, undo) {
  const t = $("#toast");
  t.innerHTML = esc(msg) + ' <b style="margin-left:8px;text-decoration:underline">Undo</b>';
  t.classList.add("on", "act");
  t.onclick = () => { t.classList.remove("on", "act"); t.onclick = null; clearTimeout(toast._t); undo(); };
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.classList.remove("on", "act"); t.onclick = null; }, 6000);
}

/* --------------------------------------------------------------- storage */
/* Two object stores: `kv` holds the state JSON (small, loaded every boot),
   `photos` holds one data-URL per item so a 200-pen catalogue of images never
   bloats the thing we parse on startup. localStorage is the fallback when
   IndexedDB is unavailable (private browsing on some iOS versions).        */
const DB = (() => {
  let db = null, ok = false;
  const open = () => new Promise(res => {
    if (!("indexedDB" in window)) return res(null);
    const r = indexedDB.open("penshow", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos");
    };
    r.onsuccess = () => { db = r.result; ok = true; res(db); };
    r.onerror = () => res(null);
  });
  const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
  const get = (store, key) => new Promise(res => {
    if (!ok) return res(JSON.parse(localStorage.getItem("penshow:" + store + ":" + key) || "null"));
    const r = tx(store, "readonly").get(key);
    r.onsuccess = () => res(r.result ?? null); r.onerror = () => res(null);
  });
  const set = (store, key, val) => new Promise(res => {
    if (!ok) { try { localStorage.setItem("penshow:" + store + ":" + key, JSON.stringify(val)); } catch (e) {} return res(); }
    const r = tx(store, "readwrite").put(val, key);
    r.onsuccess = () => res(); r.onerror = () => res();
  });
  const del = (store, key) => new Promise(res => {
    if (!ok) { localStorage.removeItem("penshow:" + store + ":" + key); return res(); }
    const r = tx(store, "readwrite").delete(key);
    r.onsuccess = () => res(); r.onerror = () => res();
  });
  const all = store => new Promise(res => {
    if (!ok) {
      const out = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i), p = "penshow:" + store + ":";
        if (k.startsWith(p)) out[k.slice(p.length)] = JSON.parse(localStorage.getItem(k));
      }
      return res(out);
    }
    const out = {}, s = tx(store, "readonly"), r = s.openCursor();
    r.onsuccess = e => { const c = e.target.result; if (!c) return res(out); out[c.key] = c.value; c.continue(); };
    r.onerror = () => res(out);
  });
  return { open, get, set, del, all, get usable() { return ok; } };
})();

/* ----------------------------------------------------------------- model */
/* The three brands on the table, and the pen types they come in. The short
   codes feed the SKU nomenclature in makeSKU(). */
const BRANDS = [
  { name: "Submarine",   code: "SUB" },
  { name: "Swiss Brand", code: "SWB" },
  { name: "Lamborghini", code: "LAM" },
];
const TYPES = [
  { name: "Fountain Pen", code: "FP", nib: true },
  { name: "Ballpoint",    code: "BP" },
  { name: "Rollerball",   code: "RB" },
  { name: "Pen Set",      code: "ST", nib: true },
  { name: "Ink",          code: "IN" },
  { name: "Accessory",    code: "AC" },
];
/* What the barrel is made of. Deliberately kept out of the SKU: adding it
   would renumber pens that may already be labelled. */
const MATERIALS = ["Metal", "Acrylic", "Ebonite", "Wooden", "Resin"];
const NIBS = ["", "EF", "F", "M", "B", "BB", "Stub", "Italic", "Music", "Flex"];
const NIB_CODE = { EF: "EF", F: "F", M: "M", B: "B", BB: "BB",
                   Stub: "ST", Italic: "IT", Music: "MU", Flex: "FX" };
/* Common finishes get a readable code so a SKU stays scannable on a label;
   anything else falls back to its first three letters. */
const COLOR_CODE = {
  black: "BLK", blue: "BLU", red: "RED", green: "GRN", white: "WHT", silver: "SLV",
  gold: "GLD", grey: "GRY", gray: "GRY", orange: "ORG", purple: "PUR", yellow: "YEL",
  brown: "BRN", pink: "PNK", maroon: "MRN", clear: "CLR", chrome: "CHR", matte: "MAT",
  "rose gold": "RGD", "gun metal": "GUN", gunmetal: "GUN", demonstrator: "DEM",
};
const METHODS = ["Cash", "Zelle", "Venmo", "Card"];

/* SKU nomenclature — BRAND-TYPE-MODEL[-NIB][-FINISH]
       SUB-FP-SHIKAR-M-BLK   Submarine · fountain pen · Shikari · medium · black
       LAM-BP-AVENTA-CHR     Lamborghini · ballpoint · Aventador · chrome
   Sorts by brand then type, reads at a glance on a label, and never collides:
   a clash gets a numeric tail. */
function makeSKU(it, ignoreId) {
  const brand = (BRANDS.find(b => b.name === it.brand) || {}).code
    || (it.brand || "").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "GEN";
  const t = TYPES.find(x => x.name === it.type);
  const model = (it.model || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 6).toUpperCase() || "NA";
  const parts = [brand, (t || {}).code || "XX", model];
  if (t && t.nib && it.nib) parts.push(NIB_CODE[it.nib] || it.nib.slice(0, 2).toUpperCase());
  const v = (it.variant || "").trim().toLowerCase();
  if (v) parts.push(COLOR_CODE[v] || v.replace(/[^a-z0-9]/g, "").slice(0, 3).toUpperCase());
  const base = parts.join("-");
  const taken = s => state.items.some(x => x.id !== ignoreId && !x.archived && x.sku === s);
  let sku = base, n = 1;
  while (taken(sku)) sku = base + "-" + (++n);
  return sku;
}

/* Seeded with the five shows on the 2026 circuit. Dates and — importantly —
   tax rates are placeholders you must confirm; see the VERIFY warning in the
   Shows tab. Rates below are the commonly quoted combined state+local rate
   for the usual venue city, not legal advice. */
const SEED_SHOWS = [
  { name: "SF Pen Show",      city: "San Francisco Bay Area, CA", state: "CA", taxRate: 9.375 },
  { name: "Orlando Pen Show", city: "Orlando, FL",                state: "FL", taxRate: 6.5   },
  { name: "Dallas Pen Show",  city: "Dallas, TX",                 state: "TX", taxRate: 8.25  },
  { name: "Denver Pen Show",  city: "Denver, CO",                 state: "CO", taxRate: 8.81  },
  { name: "Ohio Pen Show",    city: "Columbus, OH",               state: "OH", taxRate: 7.5   },
];

const blankShow = o => ({
  id: uid("sh_"), name: "", city: "", state: "", start: "", end: "",
  taxRate: 0, chargeTax: true, cardFeePct: 2.6, cardFeeFlat: 0.10,
  costs: { table: 0, travel: 0, lodging: 0, meals: 0, shipping: 0, other: 0 },
  openingCash: 0, notes: "", ...o
});

const blankItem = () => ({
  id: uid("it_"), sku: "", skuLocked: false,
  brand: BRANDS[0].name, model: "", variant: "", nib: "", type: TYPES[0].name, material: "",
  cost: 0, msrp: 0, price: 0, floor: 0, wholesale: 0, qty: 1,
  location: "", tags: "", notes: "",
  hasPhoto: false, taxable: true, archived: false, created: Date.now()
});

let state = {
  v: 1,
  settings: { business: "", activeShow: null, lowStock: 2, theme: "auto" },
  shows: [], items: [], sales: [], open: []
};
const photos = new Map();     // itemId -> data URL, kept in memory once loaded
/* Several sales can be in progress at once — a pen show table often has two
   or three customers mid-conversation. Open tickets are persisted, so closing
   the sheet (or the laptop lid) never loses one. */
const tickets       = () => (state.open || (state.open = []));
const activeTicket  = () => tickets().find(t => t.id === state.settings.ticket) || null;
const ticketLabel   = t => (t.customer && t.customer.name)
  ? t.customer.name : "Sale " + (tickets().indexOf(t) + 1);

/* --------------------------------------------------------------- persist */
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const go = () => DB.set("kv", "state", JSON.parse(JSON.stringify(state)));
  if (now) return go();
  saveTimer = setTimeout(go, 250);
}

async function boot() {
  await DB.open();
  const loaded = await DB.get("kv", "state");
  if (loaded && loaded.items) state = Object.assign(state, loaded);
  migrate();
  if (!state.shows.length) {
    state.shows = SEED_SHOWS.map(s => blankShow(s));
    state.settings.activeShow = state.shows[0].id;
    save(true);
  }
  const ph = await DB.all("photos");
  for (const k in ph) photos.set(k, ph[k]);
  pruneOrphanPhotos();
  applyTheme();
  renderAll();
}

/* Anything entered under the older shape (free-text category, a condition
   field) is carried forward rather than dropped. Every pen is new now, so
   condition simply goes away. */
function migrate() {
  const CAT_TO_TYPE = { "Pen": "Fountain Pen", "Vintage Pen": "Fountain Pen", "Nib": "Accessory",
                        "Ink": "Ink", "Paper": "Accessory", "Accessory": "Accessory",
                        "Service": "Accessory" };
  let touched = false;
  for (const i of state.items) {
    if (!i.type) { i.type = CAT_TO_TYPE[i.category] || TYPES[0].name; touched = true; }
    if (i.material === undefined) { i.material = ""; touched = true; }
    if ("condition" in i) { delete i.condition; touched = true; }
    if ("category" in i) { delete i.category; touched = true; }
    if ("serial" in i) { delete i.serial; touched = true; }
    if (i.skuLocked === undefined) { i.skuLocked = !!i.sku; touched = true; }
  }
  if (touched) save(true);
}

/* A photo attached to a pen that was never saved would otherwise sit in storage
   forever. Also re-syncs hasPhoto, which is only bookkeeping now. */
function pruneOrphanPhotos() {
  const live = new Set(state.items.map(i => i.id));
  for (const id of [...photos.keys()])
    if (!live.has(id)) { photos.delete(id); DB.del("photos", id); }
  for (const i of state.items) i.hasPhoto = photos.has(i.id);
}

/* ---------------------------------------------------------------- lookup */
const showById  = id => state.shows.find(s => s.id === id) || null;
const itemById  = id => state.items.find(i => i.id === id) || null;
const activeShow = () => showById(state.settings.activeShow) || state.shows[0] || null;
const liveItems = () => state.items.filter(i => !i.archived);

const itemLabel = i => [i.brand, i.model].filter(Boolean).join(" ") || i.sku || "Untitled";
const itemSub   = i => [i.material, i.type, i.variant, i.nib && i.nib + " nib"].filter(Boolean).join(" · ");
const typeOf    = i => TYPES.find(t => t.name === i.type)
  || { name: i.type || "Item", code: (i.type || "??").slice(0, 2).toUpperCase() };
/* The single source of truth for "does this pen have a picture". */
const photoOf   = i => (i && photos.get(i.id)) || null;

/* Units committed to open holds — reserved but not yet paid for. */
function heldQty(itemId) {
  let n = 0;
  for (const s of state.sales)
    if (s.status === "hold" && !s.voided)
      for (const l of s.lines) if (l.itemId === itemId) n += l.qty;
  return n;
}
/* Units already spoken for in an open ticket. Without this, two tickets could
   each promise the last pen. */
function ticketQty(itemId) {
  let n = 0;
  for (const t of tickets())
    for (const l of t.lines) if (l.itemId === itemId) n += l.qty;
  return n;
}
const availQty = i => i.qty - heldQty(i.id) - ticketQty(i.id);

/* ------------------------------------------------------------------ math */
/* One place that turns a sale (cart or saved) into money. Tax is computed on
   the discounted taxable base and tracked separately — it is a liability you
   remit to the state, never revenue and never profit. */
function calc(sale) {
  const show = showById(sale.showId);
  const rate = (show && show.chargeTax && !sale.noTax) ? (show.taxRate || 0) / 100 : 0;
  let subtotal = 0, taxableSub = 0, cogs = 0;
  for (const l of sale.lines) {
    const gross = l.qty * l.unitPrice;
    subtotal += gross;
    if (l.taxable) taxableSub += gross;
    cogs += l.qty * (l.unitCost || 0);
  }
  const d = sale.discount || { type: "amt", value: 0 };
  const discount = Math.min(subtotal, d.type === "pct" ? subtotal * (num(d.value) / 100) : num(d.value));
  // Spread the discount proportionally so the taxable base shrinks with it.
  const share = subtotal > 0 ? taxableSub / subtotal : 0;
  const taxBase = Math.max(0, taxableSub - discount * share);
  const tax = Math.round(taxBase * rate * 100) / 100;
  const net = Math.round((subtotal - discount) * 100) / 100;
  const total = Math.round((net + tax) * 100) / 100;

  const paid = (sale.payments || []).reduce((a, p) => a + num(p.amount), 0);
  let fees = 0;
  for (const p of (sale.payments || []))
    if (p.method === "Card" && show)
      fees += num(p.amount) * (num(show.cardFeePct) / 100) + num(show.cardFeeFlat);
  fees = Math.round(fees * 100) / 100;

  return { subtotal, discount, net, tax, total, cogs, fees,
           gross: Math.round((net - cogs - fees) * 100) / 100,
           paid, due: Math.round((total - paid) * 100) / 100 };
}

/* =======================================================================
   NAVIGATION
   ======================================================================= */
let view = "sell";
$$("nav.tabs button").forEach(b => b.onclick = () => {
  view = b.dataset.v;
  $$("nav.tabs button").forEach(x => x.classList.toggle("on", x === b));
  $$(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + view));
  window.scrollTo(0, 0);
  renderAll();
});

$("#themeBtn").onclick = () => {
  const order = ["auto", "light", "dark"];
  state.settings.theme = order[(order.indexOf(state.settings.theme || "auto") + 1) % 3];
  applyTheme(); save(); toast("Theme: " + state.settings.theme);
};
function applyTheme() {
  const t = state.settings.theme || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* Tap a picture to see it full size. `manage` adds replace/remove, which
   belongs in Inventory but not behind the table mid-sale. */
function openLightbox(itemId, manage) {
  const url = photos.get(itemId); if (!url) return;
  const it = itemById(itemId) || {};
  const box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = `
    <img src="${url}" alt="">
    <div class="lbcap">
      <b>${esc(itemLabel(it))}</b>
      <span>${esc(itemSub(it))}${it.sku ? " · " + esc(it.sku) : ""}</span>
    </div>
    <button class="lbx" data-close>✕</button>
    ${manage ? `<div class="lbact">
      <button class="btn sm" data-replace>Replace photo</button>
      <button class="btn sm danger" data-remove>Remove</button>
    </div>` : ""}`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = e => { if (e.target === box || e.target.hasAttribute("data-close")) close(); };
  const rep = box.querySelector("[data-replace]");
  if (rep) rep.onclick = () => { close(); grabPhoto(itemId, () => renderAll(), false); };
  const rem = box.querySelector("[data-remove]");
  if (rem) rem.onclick = () => {
    if (!confirm("Remove this photo?")) return;
    photos.delete(itemId); DB.del("photos", itemId);
    const t = itemById(itemId); if (t) { t.hasPhoto = false; save(true); }
    close(); renderAll();
  };
}

/* --------------------------------------------------------------- sheets */
let sheetOnClose = null;
let sheetPaste = null;          // clipboard-image handler, live only while a sheet is open
function openSheet(title, bodyHTML, footHTML, onClose) {
  if (sheetPaste) { document.removeEventListener("paste", sheetPaste); sheetPaste = null; }
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = bodyHTML;
  $("#sheetFoot").innerHTML = footHTML || "";
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
  $("#sheetBody").scrollTop = 0;
  sheetOnClose = onClose || null;
}
function closeSheet() {
  $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
  if (sheetPaste) { document.removeEventListener("paste", sheetPaste); sheetPaste = null; }
  const f = sheetOnClose; sheetOnClose = null; if (f) f();
}
$("#sheetX").onclick = closeSheet;
$("#scrim").onclick = closeSheet;

function renderAll() {
  const s = activeShow();
  $("#hdrTitle").textContent = state.settings.business || "Pen Show Tracker";
  $("#hdrSub").textContent = s
    ? s.name + (s.chargeTax && s.taxRate ? " · tax " + s.taxRate + "%" : " · no tax")
    : "No show selected";
  if (view === "sell") renderSell();
  if (view === "inv") renderInv();
  if (view === "shows") renderShows();
  if (view === "rep") renderReports();
  if (view === "data") renderData();
  renderCartBar();
}

/* =======================================================================
   SELL
   ======================================================================= */
let sellFilter = "All";    // brand
let sellMat = "All";       // barrel material
let sellType = "All";      // pen type

/* Finding one pen among hundreds, fast: narrow by brand, then by type, and
   read the case number off the card so you can physically pick it up. Two
   taps beats typing on a phone with a customer waiting. */
function renderSell() {
  const q = $("#sellSearch").value.trim().toLowerCase();
  const all = liveItems();
  renderOpenStrip();

  const present = new Set(all.map(i => i.brand));
  const brands = ["All", ...BRANDS.map(b => b.name).filter(b => present.has(b)),
                  ...[...present].filter(b => !BRANDS.some(x => x.name === b))];

  /* Each row narrows what the next one offers, so Metal → Fountain Pen is two
     taps and never shows a combination you do not actually have. */
  const inBrand = i => sellFilter === "All" || i.brand === sellFilter;
  const matsPresent = new Set(all.filter(inBrand).map(i => i.material).filter(Boolean));
  const mats = matsPresent.size
    ? ["All", ...MATERIALS.filter(m => matsPresent.has(m)),
       ...[...matsPresent].filter(m => !MATERIALS.includes(m))] : [];
  if (!mats.includes(sellMat)) sellMat = "All";

  const inMat = i => sellMat === "All" || i.material === sellMat;
  const typesPresent = new Set(all.filter(i => inBrand(i) && inMat(i)).map(i => i.type));
  const typeOrder = [...TYPES.map(t => t.name), ...[...typesPresent].filter(t => !TYPES.some(x => x.name === t))];
  const types = ["All", ...typeOrder.filter(t => typesPresent.has(t))];
  if (!types.includes(sellType)) sellType = "All";

  const row = (items, key, cls) => items.map(v =>
    `<button class="chip ${cls} ${v === (key === "cat" ? sellFilter : key === "mat" ? sellMat : sellType) ? "on" : ""}"
       data-${key}="${esc(v)}">${esc(v === "All" ? (key === "mat" ? "All materials" : key === "type" ? "All types" : "All") : v)}</button>`).join("");

  $("#sellFilters").innerHTML =
    row(brands, "cat", "")
    + (mats.length > 2 ? `<span class="filterbreak"></span>` + row(mats, "mat", "sub") : "")
    + (types.length > 2 ? `<span class="filterbreak"></span>` + row(types, "type", "sub") : "");
  $$("#sellFilters [data-cat]").forEach(b => b.onclick = () => { sellFilter = b.dataset.cat; renderSell(); });
  $$("#sellFilters [data-mat]").forEach(b => b.onclick = () => { sellMat = b.dataset.mat; renderSell(); });
  $$("#sellFilters [data-type]").forEach(b => b.onclick = () => { sellType = b.dataset.type; renderSell(); });

  /* A search looks at the whole catalogue. If a filter left over from the last
     customer could hide the pen you just typed the name of, you would conclude
     you had not brought it — the one wrong answer this screen must never give. */
  const list = all.filter(i => {
    if (q) return [i.sku, i.brand, i.model, i.variant, i.nib, i.type, i.material, i.tags, i.location]
      .join(" ").toLowerCase().includes(q);
    return inBrand(i) && inMat(i) && (sellType === "All" || i.type === sellType);
  }).sort((a, b) => itemLabel(a).localeCompare(itemLabel(b))
                 || (a.variant || "").localeCompare(b.variant || ""));

  const crumbs = [sellFilter, sellMat, sellType].filter(v => v && v !== "All").join(" · ");
  $("#sellCount").textContent = q
    ? `${list.length} match “${esc(q)}” · searching all ${all.length}`
    : (crumbs ? `${crumbs} — ${list.length} of ${all.length}`
              : `${all.length} pen${all.length === 1 ? "" : "s"}`);

  const g = $("#sellGrid");
  const view = state.settings.sellView || "grid";
  $$("#sellView button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  g.classList.toggle("aslist", view === "list");

  if (!list.length) {
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><span class="em">🖋</span>
      ${state.items.length ? "Nothing matches that search." :
        "No inventory yet.<br>Add items in the Inventory tab, or import a CSV from the Data tab."}</div>`;
    return;
  }

  /* List view: one dense row per pen — photo, name, SKU, case, price. Faster
     to scan by name when the catalogue is long and photos all look alike. */
  if (view === "list") {
    g.innerHTML = list.map(i => {
      const a = availQty(i);
      const cls = a <= 0 ? "zero" : (a <= (state.settings.lowStock || 2) ? "low" : "");
      const img = photoOf(i)
        ? `<img src="${photoOf(i)}" alt="" loading="lazy">`
        : `<span class="noimg">🖊</span>`;
      const sub = [i.variant, i.nib && i.nib + " nib"].filter(Boolean).join(" · ");
      return `<button class="skurow" data-id="${i.id}">
        <span class="rthumb">${img}</span>
        <span class="rmeta">
          <b>${esc(itemLabel(i))}</b>
          <span class="tiny muted">${esc([typeOf(i).name, sub].filter(Boolean).join(" · "))}</span>
          <span class="row tiny" style="gap:6px;margin-top:2px">
            <span class="skucode">${esc(i.sku)}</span>
            ${i.location ? `<span class="pill flat">📍 ${esc(i.location)}</span>` : ""}
          </span>
        </span>
        <span class="rright">
          <b>${money(i.price)}</b>
          <span class="qty ${cls}">${a}</span>
        </span></button>`;
    }).join("");
    $$("#sellGrid .skurow").forEach(b => b.onclick = () => addToCart(b.dataset.id));
    $$("#sellGrid .rthumb").forEach(t => t.onclick = e => {
      const id = t.closest(".skurow").dataset.id;
      if (!photos.get(id)) return;               // no picture: fall through and sell
      e.stopPropagation(); openLightbox(id, false);
    });
    return;
  }

  g.innerHTML = list.map(i => {
    const a = availQty(i);
    const cls = a <= 0 ? "zero" : (a <= (state.settings.lowStock || 2) ? "low" : "");
    const img = photoOf(i)
      ? `<img src="${photoOf(i)}" alt="" loading="lazy">` : `<span class="noimg">🖊</span>`;
    const sub = [i.variant, i.nib && i.nib + " nib"].filter(Boolean).join(" · ");
    return `<button class="sku" data-id="${i.id}">
      <div class="ph">${img}<span class="qty ${cls}">${a}</span>
        <span class="typetag">${esc(typeOf(i).code)}</span>
        ${photoOf(i) ? `<span class="zoom" data-zoom="${i.id}">⤢</span>` : ""}
        ${i.location ? `<span class="loc">📍 ${esc(i.location)}</span>` : ""}</div>
      <div class="meta">
        <span class="br">${esc(i.brand)}</span>
        <span class="nm">${esc(i.model || i.sku || "Untitled")}</span>
        ${sub ? `<span class="tiny muted">${esc(sub)}</span>` : ""}
        <span class="skucode">${esc(i.sku)}</span>
        <span class="pr">${money(i.price)}</span>
      </div></button>`;
  }).join("");
  $$("#sellGrid .sku").forEach(b => b.onclick = () => addToCart(b.dataset.id));
  $$("#sellGrid [data-zoom]").forEach(z => z.onclick = e => {
    e.stopPropagation(); openLightbox(z.dataset.zoom, false);
  });
}
$("#sellSearch").oninput = () => renderSell();
$$("#sellView button").forEach(b => b.onclick = () => {
  state.settings.sellView = b.dataset.view; save(); renderSell();
});

function newTicket(seed) {
  const t = Object.assign({
    id: uid("sa_"), ts: Date.now(), showId: state.settings.activeShow,
    lines: [], discount: { type: "amt", value: 0 }, payments: [],
    customer: { name: "", email: "", phone: "" }, notes: "",
    status: "paid", voided: false, noTax: false
  }, seed || {});
  tickets().push(t);
  state.settings.ticket = t.id;
  save();
  return t;
}

function ensureCart() { return activeTicket() || newTicket(); }

function closeTicket(id) {
  state.open = tickets().filter(t => t.id !== id);
  if (state.settings.ticket === id)
    state.settings.ticket = (tickets()[0] || {}).id || null;
  save(true);
}

function addToCart(itemId) {
  const it = itemById(itemId); if (!it) return;
  const c = ensureCart();
  const ex = c.lines.find(l => l.itemId === itemId);
  if (ex) ex.qty++;
  else c.lines.push({
    itemId, sku: it.sku, name: itemLabel(it), sub: itemSub(it), location: it.location || "",
    qty: 1, unitPrice: num(it.price), unitCost: num(it.cost),
    floor: num(it.floor), taxable: it.taxable !== false
  });
  if (navigator.vibrate) navigator.vibrate(8);
  save();
  toast(itemLabel(it) + " added");
  renderAll();
}

function renderCartBar() {
  const bar = $("#cartBar"), c = activeTicket();
  const others = tickets().filter(t => t !== c && t.lines.length).length;
  if (!c || !c.lines.length) {
    // Still surface the bar if another ticket is waiting to be finished.
    if (!others) { bar.classList.remove("on"); return; }
  }
  const t = calc(c || { lines: [], payments: [] });
  const n = (c ? c.lines : []).reduce((a, l) => a + l.qty, 0);
  $("#cartCount").textContent = (n ? n + (n === 1 ? " item" : " items") : "Empty sale")
    + (others ? " · +" + others + " open" : "");
  $("#cartTotal").textContent = money(t.total);
  bar.classList.add("on");
}
$("#cartBar").onclick = () => openCart();

$("#customLineBtn").onclick = () => {
  const c = ensureCart();
  c.lines.push({ itemId: null, sku: "", name: "Custom item", sub: "not in inventory",
                 qty: 1, unitPrice: 0, unitCost: 0, floor: 0, taxable: true });
  save(); openCart();
};

/* Sales in progress and reserved pens, shown where you are actually standing.
   A held pen reads as 0 available in the grid, so without this strip it looks
   like it vanished. */
function renderOpenStrip() {
  const open = tickets().filter(t => t.lines.length);
  const holds = state.sales.filter(s => s.status === "hold" && !s.voided);
  const box = $("#sellOpen");
  if (!open.length && !holds.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="openstrip">
    ${open.map(t => `<button class="opill ${t.id === state.settings.ticket ? "on" : ""}"
        data-open="${t.id}"><b>${esc(ticketLabel(t))}</b>
        <span>${money(calc(t).total)}</span></button>`).join("")}
    ${holds.map(h => `<span class="opill hold">
        <b>⏸ ${esc((h.customer && h.customer.name) || "Hold")}</b>
        <span>${h.lines.reduce((a, l) => a + l.qty, 0)} pen${h.lines.reduce((a, l) => a + l.qty, 0) === 1 ? "" : "s"}</span>
        <button class="mini" data-ring="${h.id}">Ring up</button>
        <button class="mini" data-rel="${h.id}">Release</button></span>`).join("")}
    <button class="opill add" id="newTicketBtn">+ New sale</button>
  </div>`;
  $$("#sellOpen [data-open]").forEach(b => b.onclick = () => openCart(b.dataset.open));
  $$("#sellOpen [data-ring]").forEach(b => b.onclick = () => convertHold(b.dataset.ring));
  $$("#sellOpen [data-rel]").forEach(b => b.onclick = () => releaseHold(b.dataset.rel));
  $("#newTicketBtn").onclick = () => { newTicket(); openCart(); renderAll(); };
}

/* ------------------------------------------------------------ cart sheet */
function openCart(id) {
  if (id) state.settings.ticket = id;
  ensureCart();
  openSheet(cartTitle(), cartHTML(), cartFootHTML());
  wireCart();
}
const cartTitle = () => {
  const c = activeTicket(), n = tickets().length;
  return n > 1 ? `${ticketLabel(c)}  (${tickets().indexOf(c) + 1}/${n})` : "Sale";
};
/* Numbers a customer leaning over the table should not read. Off by default;
   the eye reveals them while you are working out a price. */

  const lines = c.lines.map((l, ix) => {

        </div>

        </div>
        <div class="tiny" style="margin-top:4px;color:${below ? "var(--bad)" : "var(--ink-3)"}">
          ${showCosts()
            ? `cost ${money(l.unitCost)} · margin ${pct(marginPctVal)}` +
              (l.floor > 0 ? ` · floor ${money(l.floor)}${below ? " ⚠ BELOW FLOOR" : ""}` : "")
            : (below ? `<b style="color:var(--bad)">⚠ below your floor</b>` : "")}
          ${l.itemId ? "" : " · <span style='color:var(--warn)'>custom line, no stock movement</span>"}
        </div>
      </div>
      <div class="right" style="font-weight:750;min-width:74px">${money(l.qty * l.unitPrice)}</div>
    </div>`;
  }).join("") || `<div class="empty tiny">Cart is empty.</div>`;

  const payRows = (c.payments || []).map((p, ix) => `
    <div class="row" style="margin-top:6px">
      <span class="pill flat" style="min-width:60px">${esc(p.method)}</span>
      <input class="input grow" style="min-height:38px" inputmode="decimal"
             data-pay="${ix}" value="${num(p.amount).toFixed(2)}">
      <input class="input" style="min-height:38px;width:110px" placeholder="ref / last4"

  const others = tickets();
  return `
  ${others.length > 1 ? `<div class="ticketbar">
    ${others.map(t2 => `<button class="tkt ${t2.id === c.id ? "on" : ""}" data-tkt="${t2.id}">
      <b>${esc(ticketLabel(t2))}</b><span>${money(calc(t2).total)}</span></button>`).join("")}
  </div>` : ""}

  <div class="row" style="margin-bottom:12px;gap:8px">
    <button class="btn sm ${c.noTax ? "" : "primary"}" id="taxBtn" style="flex:1">
      ${c.noTax ? "Tax OFF" : `Tax ON${show && show.chargeTax ? " · " + show.taxRate + "%" : ""}`}
    </button>
    <button class="btn sm ${showCosts() ? "primary" : ""}" id="eyeBtn" title="Show or hide your cost and margin">
      ${showCosts() ? "🙈 Hide costs" : "👁 Show costs"}

  </div>

  <div class="field" style="margin-bottom:12px">

  <div class="card pad" style="margin-bottom:12px">${lines}</div>

    <div class="field"><label>Type</label>

function cartFootHTML() {
  const t = calc(activeTicket());
  return `<div class="footwrap">
    <div class="row" style="gap:8px">
      <button class="btn sm grow" id="cartMin">▾ Minimise</button>
      <button class="btn sm grow" id="cartNew">+ New sale</button>
      <button class="btn sm grow" id="cartHold">Hold</button>
      <button class="btn sm danger" id="cartClear">Clear</button>
    </div>
    <button class="btn primary block" id="cartDone" style="margin-top:8px">
      Complete ${money(t.total)}</button>
  </div>`;
}

function wireCart() {
  const body = $("#sheetBody");
  const cart = activeTicket();
  const refresh = () => {
    save();
    $("#sheetTitle").textContent = cartTitle();
    $("#sheetBody").innerHTML = cartHTML();
    $("#sheetFoot").innerHTML = cartFootHTML();
    wireCart(); renderCartBar();
  };

  $$("[data-tkt]", body).forEach(b => b.onclick = () => {
    state.settings.ticket = b.dataset.tkt; save(); openCart();
  });

  $$("[data-act]", body).forEach(b => b.onclick = () => {
    const ix = +b.dataset.ix;
    if (b.dataset.act === "inc") cart.lines[ix].qty++;
    if (b.dataset.act === "dec") cart.lines[ix].qty = Math.max(1, cart.lines[ix].qty - 1);
    if (b.dataset.act === "rm") cart.lines.splice(ix, 1);
    if (b.dataset.act === "rmpay") cart.payments.splice(ix, 1);
    refresh();
  });
  $$("[data-price]", body).forEach(inp => inp.onchange = () => {
    cart.lines[+inp.dataset.price].unitPrice = num(inp.value); refresh();
  });
  $$("[data-pay]", body).forEach(inp => inp.onchange = () => {
    cart.payments[+inp.dataset.pay].amount = num(inp.value); refresh();
  });
  $$("[data-payref]", body).forEach(inp => inp.oninput = () => {
    cart.payments[+inp.dataset.payref].ref = inp.value;
  });
  $$("[data-addpay]", body).forEach(b => b.onclick = () => {
    const t = calc(cart);
    cart.payments.push({ method: b.dataset.addpay, amount: Math.max(0, t.due), ref: "" });
    refresh();
  });
  const pe = $("#payExact"); if (pe) pe.onclick = () => {
    if (!cart.payments.length) return toast("Add a payment method first");
    const t = calc(cart);
    cart.payments[cart.payments.length - 1].amount =
      num(cart.payments[cart.payments.length - 1].amount) + t.due;
    refresh();
  };

  $("#taxBtn").onclick = () => { cart.noTax = !cart.noTax; refresh(); };
  $("#eyeBtn").onclick = () => {
    state.settings.showCosts = !showCosts(); save(); refresh();
  };

  $("#cartShow").onchange = e => { cart.showId = e.target.value; refresh(); };
  $("#discVal").onchange = e => { cart.discount.value = num(e.target.value); refresh(); };
  $("#discType").onchange = e => { cart.discount.type = e.target.value; refresh(); };
  $("#cName").oninput = e => { cart.customer.name = e.target.value; save(); };
  $("#cEmail").oninput = e => { cart.customer.email = e.target.value; save(); };
  $("#cNotes").oninput = e => { cart.notes = e.target.value; save(); };

  $("#cartMin").onclick = () => { save(true); closeSheet(); renderAll(); toast("Sale parked — tap the bar to resume"); };
  $("#cartNew").onclick = () => { newTicket(); openCart(); renderAll(); };

  /* Clear does not ask. It offers the sale back for a few seconds instead,
     which is faster at the table and still recoverable. */
  $("#cartClear").onclick = () => {
    const snapshot = JSON.parse(JSON.stringify(cart));
    closeTicket(cart.id);
    closeSheet(); renderAll();
    toastUndo("Sale cleared", () => {
      tickets().push(snapshot);
      state.settings.ticket = snapshot.id;
      save(true); renderAll(); openCart();
    });
  };
  $("#cartHold").onclick = () => commitSale("hold");
  $("#cartDone").onclick = () => commitSale("paid");
}

function commitSale(status) {
  const cart = activeTicket();
  if (!cart.lines.length) return toast("Nothing in this sale");
  const t = calc(cart);
  if (status === "paid") {
    if (!cart.payments.length) return toast("Add how they paid");
    if (Math.abs(t.due) > 0.005 && !confirm(
      (t.due > 0 ? "Still due " + money(t.due) : "Change owed " + money(-t.due)) + ". Save anyway?")) return;
  }
  // A converted hold replaces its original rather than sitting alongside it.
  if (cart.replaces) state.sales = state.sales.filter(x => x.id !== cart.replaces);
  // Stock only moves for real inventory lines; custom lines are revenue only.
  for (const l of cart.lines) {
    const it = itemById(l.itemId);
    if (it && status === "paid") it.qty = Math.max(0, it.qty - l.qty);
  }
  cart.status = status;
  cart.ts = Date.now();
  cart.totals = { subtotal: t.subtotal, discount: t.discount, tax: t.tax,
                  total: t.total, cogs: t.cogs, fees: t.fees };
  state.sales.push(cart);
  closeTicket(cart.id);
  save(true); closeSheet(); renderAll();
  toast(status === "hold" ? "Held — stock reserved" : "Sale recorded " + money(t.total));
}

/* Converting a hold to a paid sale is where the stock actually leaves.
   The original stays in `state.sales` until the new one commits — abandoning
   the sheet half-way must not silently delete somebody's reserved pen. */
function convertHold(saleId) {
  const s = state.sales.find(x => x.id === saleId); if (!s) return;
  const t = newTicket(JSON.parse(JSON.stringify(s)));
  t.id = uid("sa_");
  t.replaces = saleId;
  t.status = "paid";
  t.payments = [];
  state.settings.ticket = t.id;
  save(true);
  openCart();
}

/* Give the pen back to the table without ringing anything up. */
function releaseHold(saleId) {
  const s = state.sales.find(x => x.id === saleId); if (!s) return;
  s.voided = true; s.voidedAt = Date.now();
  save(true); renderAll();
  toast("Hold released — back in stock");
}

function voidSale(saleId) {
  const s = state.sales.find(x => x.id === saleId); if (!s) return;
  if (!confirm("Void this sale and put the stock back?")) return;
  s.voided = true; s.voidedAt = Date.now();
  if (s.status === "paid")
    for (const l of s.lines) { const it = itemById(l.itemId); if (it) it.qty += l.qty; }
  save(true); renderAll(); toast("Voided, stock restored");
}

/* =======================================================================
   INVENTORY
   ======================================================================= */
function renderInv() {
  const q = $("#invSearch").value.trim().toLowerCase();
  const items = liveItems();
  const units = items.reduce((a, i) => a + i.qty, 0);
  const cost  = items.reduce((a, i) => a + i.qty * num(i.cost), 0);
  const retail = items.reduce((a, i) => a + i.qty * num(i.price), 0);
  $("#invStatItems").textContent  = items.length + " SKUs";
  $("#invStatUnits").textContent  = units + " units";
  $("#invStatCost").textContent   = money(cost) + " at cost";
  $("#invStatRetail").textContent = money(retail) + " at retail";

  const list = items.filter(i => !q || [i.sku, i.brand, i.model, i.variant, i.nib, i.type, i.material, i.tags, i.location]
    .join(" ").toLowerCase().includes(q))
    .sort((a, b) => (a.brand || "").localeCompare(b.brand || "") || itemLabel(a).localeCompare(itemLabel(b)));

  $("#invList").innerHTML = list.length ? list.map(i => {
    const m = i.price > 0 ? (i.price - i.cost) / i.price : 0;
    const img = photoOf(i) ? `<img src="${photoOf(i)}" alt="">` : `<span class="add">＋</span>`;
    const held = heldQty(i.id);
    return `<div class="card pad row invrow" style="gap:11px">
      <button class="thumb ${photoOf(i) ? "has" : ""}" data-photo="${i.id}"
              title="Tap to add a photo">${img}</button>
      <div class="grow" data-edit="${i.id}" style="cursor:pointer">
        <div class="row"><b class="grow">${esc(itemLabel(i))}</b>
          <b class="num">${money(i.price)}</b></div>
        <div class="tiny muted">${esc(itemSub(i))}</div>
        <div class="row tiny" style="margin-top:5px;gap:6px">
          <span class="pill ${i.qty <= 0 ? "bad" : i.qty <= (state.settings.lowStock || 2) ? "warn" : "flat"}">${i.qty} in stock</span>
          ${held ? `<span class="pill warn">${held} held</span>` : ""}
          <span class="skucode">${esc(i.sku)}</span>
        </div>
        <div class="tiny muted" style="margin-top:3px">cost ${money(i.cost)} · margin ${pct(m)}${i.floor ? " · floor " + money(i.floor) : ""}</div>
      </div></div>`;
  }).join("") : `<div class="empty"><span class="em">📦</span>No pens yet.<br>
      <button class="btn sm primary" style="margin-top:10px" onclick="document.getElementById('addItemBtn').click()">Add your first pen</button></div>`;

  $$("#invList [data-edit]").forEach(el => el.onclick = () => editItem(el.dataset.edit));
  // Tapping the square attaches a photo straight away — no need to open the item.
  $$("#invList [data-photo]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const id = el.dataset.photo;
    if (photos.get(id)) openLightbox(id, true);          // look at it
    else grabPhoto(id, () => renderInv());               // or add one
  });
}
$("#invSearch").oninput = () => renderInv();
$("#addItemBtn").onclick = () => editItem(null);

      <div class="chiprow wrap" id="nibRow">
        ${NIBS.map(n => `<button class="chip lg ${it.nib === n ? "on" : ""}"

    <div class="grid3" style="margin-top:14px">
      <div class="field"><label>Cost</label>
        <input class="input" data-f="cost" inputmode="decimal" value="${money2(it.cost)}" placeholder="0"></div>
      <div class="field"><label>Price</label>
        <input class="input" data-f="price" inputmode="decimal" value="${money2(it.price)}" placeholder="0"></div>
      <div class="field"><label>Qty</label>

    $$("#sheetBody [data-f]").forEach(el => {
      const k = el.dataset.f;

        ? num(el.value) : el.value;

  function refreshSKU() {
    if (!it.skuLocked) it.sku = makeSKU(it, isNew ? null : id);

  function hint() {
    read();

    $("#marginHint").innerHTML =
      `Margin <b style="color:${m > 0 ? "var(--good)" : "var(--bad)"}">${it.price ? pct(m) : "—"}</b>` +

      ` · ${it.qty} tie up <b>${money(it.qty * it.cost)}</b>`;

  function wire() {
    $$("#sheetBody [data-f]").forEach(el => el.oninput = hint);

    $$("#brandRow [data-brand]").forEach(b => b.onclick = () => {
      it.brand = b.dataset.brand;

    $$("#typeRow [data-type]").forEach(b => b.onclick = () => {
      it.type = b.dataset.type;
      $$("#typeRow .bigchip").forEach(x => x.classList.toggle("on", x === b));

      if (!typeOf(it).nib) it.nib = "";
      hint();
    });
    $$("#matRow [data-mat]").forEach(b => b.onclick = () => {
      it.material = b.dataset.mat;
      $$("#matRow .chip").forEach(x => x.classList.toggle("on", x === b));
      hint();
    });
    $$("#nibRow [data-nib]").forEach(b => b.onclick = () => {
      it.nib = b.dataset.nib;
      $$("#nibRow .chip").forEach(x => x.classList.toggle("on", x === b));
      hint();
    });

    $("#moreBtn").onclick = () => {
      const box = $("#moreBox"), open = box.style.display !== "none";
      box.style.display = open ? "none" : "";
      $("#moreBtn").textContent = open ? "More options ▾" : "Fewer options ▴";
    };

    $("#skuEdit").onclick = () => {
      it.skuLocked = !it.skuLocked;
      $("#skuEdit").textContent = it.skuLocked ? "Auto" : "Edit";
      $("#skuManual").style.display = it.skuLocked ? "" : "none";
      if (it.skuLocked) $("#skuManual").value = it.sku;
      hint();
    };
    $("#skuManual").oninput = () => { it.sku = $("#skuManual").value.trim(); $("#skuOut").textContent = it.sku || "—"; };

    const redrawPhoto = url => {
      $("#photoBox").innerHTML = url ? `<img src="${url}" alt="">` : `<span class="add">＋</span>`;
      if (url && !$("#photoRm")) {
        const b = document.createElement("button");
        b.className = "btn sm ghost"; b.id = "photoRm"; b.textContent = "Remove photo";
        $("#photoZone").querySelector(".stack").appendChild(b);
        b.onclick = removePhoto;
      }
    };
    const removePhoto = () => {
      photos.delete(it.id); it.hasPhoto = false; DB.del("photos", it.id);
      redrawPhoto(null); const b = $("#photoRm"); if (b) b.remove();
    };
    $("#btnCam").onclick = () => grabPhoto(it, redrawPhoto, true);
    $("#btnLib").onclick = () => grabPhoto(it, redrawPhoto, false);
    $("#photoBox").onclick = () => {
      if (photos.get(it.id)) openLightbox(it.id, false);
      else grabPhoto(it, redrawPhoto, false);
    };
    const rm = $("#photoRm"); if (rm) rm.onclick = removePhoto;

    // Drag an image onto the sheet, or paste one from the clipboard.
    const zone = $("#photoZone");
    zone.ondragover = e => { e.preventDefault(); zone.classList.add("over"); };
    zone.ondragleave = () => zone.classList.remove("over");
    zone.ondrop = e => {
      e.preventDefault(); zone.classList.remove("over");
      attachPhoto(it, e.dataTransfer.files[0], redrawPhoto);
    };
    sheetPaste = e => {
      const f = [...(e.clipboardData || {}).items || []]
        .map(i => i.kind === "file" ? i.getAsFile() : null).filter(Boolean)[0];
      if (f) attachPhoto(it, f, redrawPhoto);
    };
    document.addEventListener("paste", sheetPaste);

    const commit = () => {
      read();
      if (!it.model) { toast("Give it a model name"); return false; }
      refreshSKU();
      if (isNew) state.items.push(it); else Object.assign(itemById(id), it);
      save(true);
      return true;
    };

    $("#itemSave").onclick = () => { if (commit()) { closeSheet(); renderAll(); toast("Saved"); } };

    const nxt = $("#saveNext"); if (nxt) nxt.onclick = () => {
      if (!commit()) return;
      renderAll(); toast("Saved — next one");
      // Carry brand, type and prices forward: consecutive pens are usually
      // the same model in a different colour.
      editItem(null, { brand: it.brand, type: it.type, material: it.material, nib: it.nib,
                       model: it.model, cost: it.cost, price: it.price, floor: it.floor,
                       msrp: it.msrp, wholesale: it.wholesale, location: it.location });
    };

    const dup = $("#itemDup"); if (dup) dup.onclick = () => {
      read();
      editItem(null, { brand: it.brand, type: it.type, material: it.material, nib: it.nib,
                       model: it.model, cost: it.cost, price: it.price, floor: it.floor,
                       msrp: it.msrp, wholesale: it.wholesale, location: it.location, tags: it.tags });
    };

    const del = $("#itemDel"); if (del) del.onclick = () => {
      if (!confirm("Delete " + itemLabel(it) + "? Past sales keep their own record.")) return;
      itemById(id).archived = true;
      save(true); closeSheet(); renderAll(); toast("Deleted");
    };

    hint();
  }
}

/* ------------------------------------------------------------- photos */
/* One path for every way a picture arrives: the camera, the library, a drag,
   or a paste. Attaching is a single tap from the inventory list because with
   a large catalogue that is the action you repeat hundreds of times. */
/* `target` may be an id, or the pen object itself — a pen being created is not
   in state.items yet, and looking it up there would silently drop the flag. */
async function attachPhoto(target, file, done) {
  if (!file || !file.type.startsWith("image/")) return;
  const it = typeof target === "string" ? itemById(target) : target;
  const id = typeof target === "string" ? target : (target || {}).id;
  if (!id) return;
  const dataUrl = await shrinkImage(file, 720, 0.72);
  photos.set(id, dataUrl);
  if (it) it.hasPhoto = true;
  await DB.set("photos", id, dataUrl);
  if (itemById(id)) save(true);
  toast("Photo added");
  if (done) done(dataUrl);
}

/* `camera` opens the rear camera straight away on a phone; without it the
   picker offers the photo library too. */
function grabPhoto(itemId, done, camera) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  if (camera) inp.capture = "environment";
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = async () => {
    await attachPhoto(itemId, inp.files[0], done);
    inp.remove();
  };
  inp.click();
}

/* Downscale to keep the photo store small — a 12MP phone shot is 4MB, this
   makes it ~60KB, which matters when the whole catalogue lives on one device. */
function shrinkImage(file, maxDim, quality) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", quality));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* =======================================================================
   REPORTS  —  the P&L
   ======================================================================= */
function salesFor(showId) {
  return state.sales.filter(s => !s.voided && s.status === "paid" && (!showId || s.showId === showId));
}

function showPL(showId) {
  const rows = salesFor(showId);
  let revenue = 0, tax = 0, cogs = 0, fees = 0, discount = 0, units = 0;
  const byMethod = {}, byDay = {}, byItem = {};
  for (const s of rows) {
    const t = calc(s);
    revenue += t.net; tax += t.tax; cogs += t.cogs; fees += t.fees; discount += t.discount;
    const day = new Date(s.ts).toISOString().slice(0, 10);
    byDay[day] = (byDay[day] || 0) + t.net;
    for (const p of s.payments) byMethod[p.method] = (byMethod[p.method] || 0) + num(p.amount);
    for (const l of s.lines) {
      units += l.qty;
      const k = l.name + (l.sub ? " — " + l.sub : "");
      byItem[k] = byItem[k] || { qty: 0, rev: 0, profit: 0 };
      byItem[k].qty += l.qty;
      byItem[k].rev += l.qty * l.unitPrice;
      byItem[k].profit += l.qty * (l.unitPrice - l.unitCost);
    }
  }
  const shows = showId ? [showById(showId)].filter(Boolean) : state.shows;
  const fixed = shows.reduce((a, s) => a + Object.values(s.costs).reduce((x, y) => x + num(y), 0), 0);
  const grossProfit = revenue - cogs;
  const net = grossProfit - fees - fixed;
  return { revenue, tax, cogs, fees, fixed, discount, units, grossProfit, net,
           byMethod, byDay, byItem, count: rows.length,
           avg: rows.length ? revenue / rows.length : 0 };
}

/* ------------------------------------------------------------ CSV / file */
function download(name, text, mime) {
  const b = new Blob([text], { type: mime || "text/csv;charset=utf-8" });
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 400);
}
const q = v => {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const toCSV = rows => rows.map(r => r.map(q).join(",")).join("\n");

const CSV_COLS = ["sku", "brand", "type", "material", "model", "variant", "nib",
  "cost", "msrp", "price", "floor", "wholesale", "qty", "location", "tags", "notes"];

function exportInventoryCSV() {
  download("inventory-" + todayISO() + ".csv",
    toCSV([CSV_COLS, ...liveItems().map(i => CSV_COLS.map(c => i[c]))]));
}

function exportSalesCSV() {
  const head = ["date", "time", "show", "sale_id", "status", "items", "subtotal", "discount",
    "tax", "total", "cogs", "card_fees", "gross_profit", "payments", "customer", "email", "notes"];
  const rows = state.sales.map(s => {
    const t = calc(s), d = new Date(s.ts);
    return [d.toISOString().slice(0, 10), d.toTimeString().slice(0, 5),
      (showById(s.showId) || {}).name || "", s.id, s.voided ? "void" : s.status,
      s.lines.reduce((a, l) => a + l.qty, 0), t.subtotal.toFixed(2), t.discount.toFixed(2),
      t.tax.toFixed(2), t.total.toFixed(2), t.cogs.toFixed(2), t.fees.toFixed(2), t.gross.toFixed(2),
      s.payments.map(p => p.method + " " + num(p.amount).toFixed(2) + (p.ref ? " #" + p.ref : "")).join(" | "),
      s.customer.name, s.customer.email, s.notes];
  });
  download("sales-" + todayISO() + ".csv", toCSV([head, ...rows]));
}

function exportLinesCSV() {
  const head = ["date", "show", "sale_id", "status", "sku", "item", "detail", "qty",
    "unit_price", "unit_cost", "line_revenue", "line_profit"];
  const rows = [];
  for (const s of state.sales) for (const l of s.lines)
    rows.push([new Date(s.ts).toISOString().slice(0, 10), (showById(s.showId) || {}).name || "",
      s.id, s.voided ? "void" : s.status, l.sku, l.name, l.sub, l.qty,
      num(l.unitPrice).toFixed(2), num(l.unitCost).toFixed(2),
      (l.qty * l.unitPrice).toFixed(2), (l.qty * (l.unitPrice - l.unitCost)).toFixed(2)]);
  download("sale-lines-" + todayISO() + ".csv", toCSV([head, ...rows]));
}

function exportPLCSV() {
  const head = ["show", "sales", "units", "revenue", "cogs", "gross_profit", "margin",
    "card_fees", "show_costs", "net_profit", "tax_collected", "cash", "zelle", "venmo", "card", "check", "trade"];
  const rows = state.shows.map(s => {

    return [s.name, p.count, p.units, p.revenue.toFixed(2), p.cogs.toFixed(2),
      p.grossProfit.toFixed(2), p.revenue ? (p.grossProfit / p.revenue * 100).toFixed(1) + "%" : "",
      p.fees.toFixed(2), p.fixed.toFixed(2), p.net.toFixed(2), p.tax.toFixed(2),
      ...METHODS.map(m => (p.byMethod[m] || 0).toFixed(2))];
  });
  const all = showPL(null);
  rows.push(["TOTAL", all.count, all.units, all.revenue.toFixed(2), all.cogs.toFixed(2),
    all.grossProfit.toFixed(2), all.revenue ? (all.grossProfit / all.revenue * 100).toFixed(1) + "%" : "",
    all.fees.toFixed(2), all.fixed.toFixed(2), all.net.toFixed(2), all.tax.toFixed(2),
    ...METHODS.map(m => (all.byMethod[m] || 0).toFixed(2))]);
  download("p-and-l-" + todayISO() + ".csv", toCSV([head, ...rows]));
}

/* A small tolerant CSV reader — handles quoted fields and embedded commas. */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  text = text.replace(/\r\n?/g, "\n");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}

/* Accept "Fountain Pen", "fountain", "FP" or "fp" for the type column — a
   spreadsheet filled in by hand will not match the canonical string. */
function matchType(v) {
  const s = String(v || "").trim().toLowerCase();
  if (!s) return "";
  const t = TYPES.find(x => x.name.toLowerCase() === s || x.code.toLowerCase() === s)
         || TYPES.find(x => x.name.toLowerCase().startsWith(s));
  return t ? t.name : "";
}

/* "metal", "Metal", "MET" all mean the same thing in a hand-filled sheet. */
function matchMaterial(v) {
  const t = String(v || "").trim().toLowerCase();
  if (!t) return "";
  return MATERIALS.find(m => m.toLowerCase() === t)
      || MATERIALS.find(m => m.toLowerCase().startsWith(t)) || "";
}

function importInventoryCSV(e) {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const rows = parseCSV(fr.result);
    if (rows.length < 2) return toast("Nothing to import");
    const head = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z]/g, ""));
    const idx = k => head.indexOf(k);
    let added = 0, updated = 0;
    for (const r of rows.slice(1)) {
      const get = k => { const i = idx(k); return i >= 0 ? String(r[i] ?? "").trim() : ""; };
      const sku = get("sku");
      const brand = get("brand"), model = get("model");
      if (!sku && !brand && !model) continue;
      let it = sku ? state.items.find(x => x.sku && x.sku.toLowerCase() === sku.toLowerCase()) : null;
      const isNew = !it;
      if (isNew) it = blankItem();
      Object.assign(it, {
        sku: sku || it.sku, brand: brand || it.brand, model: model || it.model,
        variant: get("variant") || it.variant, nib: get("nib") || it.nib,
        type: matchType(get("type")) || it.type,
        material: matchMaterial(get("material")) || it.material,
        location: get("location") || it.location,
        tags: get("tags") || it.tags, notes: get("notes") || it.notes, archived: false
      });
      for (const k of ["cost", "msrp", "price", "floor", "wholesale", "qty"])
        if (get(k) !== "") it[k] = num(get(k));
      it.skuLocked = !!sku;
      if (!it.sku) it.sku = makeSKU(it, it.id);
      if (isNew) { state.items.push(it); added++; } else updated++;
    }
    save(true); renderAll();
    toast(added + " added, " + updated + " updated");
  };
  fr.readAsText(f);
  e.target.value = "";
}

function exportBackup() {
  const blob = { app: "penshow", v: 1, exported: new Date().toISOString(),
                 state, photos: Object.fromEntries(photos) };
  download("penshow-backup-" + todayISO() + ".json", JSON.stringify(blob), "application/json");
  toast("Backup downloaded — email it to yourself");
}

function importBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    let b;
    try { b = JSON.parse(fr.result); } catch (err) { return toast("That is not a valid backup file"); }
    if (!b.state || !b.state.items) return toast("That file is not a Pen Show backup");
    if (!confirm("Replace everything on this device with the backup from " +
      (b.exported || "unknown date").slice(0, 10) + "?")) return;
    state = b.state;
    photos.clear();
    for (const k in (b.photos || {})) { photos.set(k, b.photos[k]); await DB.set("photos", k, b.photos[k]); }
    save(true); applyTheme(); renderAll(); toast("Restored");
  };
  fr.readAsText(f);
  e.target.value = "";
}
