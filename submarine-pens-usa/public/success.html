<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Received — Submarine Pens USA</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap success">
    <h1>Thank you for your order!</h1>
    <p>Your payment was received. Square will email your receipt, and we'll send tracking as soon as your pens ship.</p>
    <p class="demo-banner" id="demo" hidden>Demo mode: no payment was taken. Add your Square keys to take real orders.</p>
    <a class="btn" href="/">Back to the store</a>
  </main>
  <script>
    try { localStorage.removeItem("subpens-cart"); } catch {}
    if (new URLSearchParams(location.search).has("demo")) document.getElementById("demo").hidden = false;
  </script>
</body>
</html>
