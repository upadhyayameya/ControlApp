<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{URL}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:image" content="{{IMAGE}}" />
  <meta property="og:url" content="{{URL}}" />
  <meta property="og:type" content="product" />
  <meta name="theme-color" content="#141c3f" />
  <link rel="icon" type="image/png" href="/img/mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-handle="{{HANDLE}}">
  <main id="main">
    <div class="wrap pdp-wrap" id="product"><p class="muted pad">Loading…</p></div>
    <section class="section ivory" id="relatedSection" hidden aria-labelledby="relTitle">
      <div class="wrap">
        <div class="section-head">
          <div><p class="eyebrow">Complete the collection</p><h2 id="relTitle">You may also like</h2></div>
          <div class="rail-nav"><button type="button" id="relPrev" aria-label="Scroll left"></button><button type="button" id="relNext" aria-label="Scroll right"></button></div>
        </div>
        <div class="rail" id="relRail"></div>
      </div>
    </section>
  </main>
  <div class="sticky-buy" id="stickyBuy" aria-hidden="true">
    <img id="stickyImg" alt="" />
    <div class="meta"><b id="stickyName"></b><span id="stickyPrice"></span></div>
    <button class="btn" type="button" id="stickyAdd">Add to bag</button>
  </div>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/product.js"></script>
</body>
</html>
