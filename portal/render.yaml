# ---------------------------------------------------------------------------
# Render blueprint.
#
# Deliberately the plain Node runtime rather than the Dockerfile: Render builds
# and runs this directly, which is fewer moving parts and skips the container
# build entirely.
#
# Everything below is created for you on the first deploy — including the two
# secrets, which are generated by Render and never pass through anyone's hands.
# See DEPLOY.md for the walkthrough.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: hbs-portal
    runtime: node
    plan: starter # A persistent disk requires a paid instance. Free has no disk.
    region: ohio
    # The application lives in portal/, not at the repository root.
    rootDir: portal
    # --include=dev is not optional: NODE_ENV=production below applies during
    # the build too, and without this npm skips devDependencies — which is
    # where TypeScript lives, so `npm run build` would fail with a missing tsc.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # Liveness only. /api/ready touches the database; a database fault should
    # not make Render redeploy, because redeploying is not the fix.
    healthCheckPath: /api/health

    disk:
      # The whole application state is one SQLite file on this disk. It
      # survives deploys and restarts; without it, every deploy starts empty.
      name: portal-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/portal.db
      # Render terminates TLS at one proxy in front of the app. Without this,
      # every request looks like it came from that proxy and the per-IP rate
      # limit becomes a single global one.
      - key: TRUST_PROXY
        value: "1"
      # Generated by Render, shown to nobody, stable across deploys.
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIAL_KEY
        generateValue: true
      # PUBLIC_ORIGIN is deliberately absent: the server falls back to
      # RENDER_EXTERNAL_URL, so invitation links are right on the first deploy
      # without anyone copying a hostname into a form. Set it explicitly only
      # once a custom domain is attached.
      #
      # Left unset on purpose, added later in the dashboard when there is a
      # relay to point at. Until then invitations are queued and an admin
      # copies the link out of the UI.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Portfolio Manager. Left unset means fixture mode — the portal runs on
      # recorded responses and syncs nothing real, which the server warns about
      # loudly at boot.
      - key: ESPM_USERNAME
        sync: false
      - key: ESPM_PASSWORD
        sync: false
      - key: ESPM_ENVIRONMENT
        sync: false
