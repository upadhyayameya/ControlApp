# HBS Weekly Scoreboard -- layout, goals and Excel mapping.
# Mirrors HBS_Weekly_Scoreboard_4.xlsx. Row numbers are the live workbook's.
#
# measure:  count | dollars | level
#   level  = utilization %, MRR, live contract counts. Never summed across
#            weeks, never divided by week count (rule 7).
# source:   monday | manual
#   manual = owned by the Director of Accounting and entered by hand. The
#            Excel writer never touches these cells (rule 5).

period:
  year: 2026
  month: 9

weeks:
  # calendar = whole-month coverage (default). team = the workbook's own
  # convention, which leaves 9/1-9/6 in no week at all.
  mode: calendar
  count: 4
  team_starts: ["2026-09-07", "2026-09-14", "2026-09-21", "2026-09-28"]

rules:
  # Rule 2: count a repeat submission once, at first logging. Flip to true if
  # the business decides a resubmission after an ICF/TRC RFI is new work.
  # Applied to goals and actuals together either way.
  count_repeats_as_new: false
  # Rule 4: cross-check the phase-marker split against BPTU Tracker membership.
  bptu_membership_crosscheck: true

status:
  # Colour on pace-to-date by working days, not on the latest week. This work
  # batches hard -- 40+ prescriptive preapprovals can land in a single day.
  basis: pace_to_date
  yellow_threshold: 0.85   # >= 85% of pace-to-date target
  green_threshold: 1.00

excel:
  week_columns: ["E", "F", "G", "H"]   # Wk1..Wk4
  sheets:
    tune_up_factory: "Tune-Up Factory"
    company_results: "Company Results"
    direct_install: "Direct Install"
    recurring_revenue: "Recurring Revenue"
    aging: "Aging & Stalled Work"

programs:
  - key: prescriptive
    name: "Prescriptive"
    display: "EmPower MD Prescriptive HVAC Tune-Ups"
    priority: true
    sheet: tune_up_factory
    # Prescriptive records carry no real utility at all (rule 3).
    carries_utility: false
    rows:
      - {row: 6,  kpi: "Audits Completed",                            stage: audits_performed,          measure: count,   owner: "Steve Weaver (PM)"}
      - {row: 7,  kpi: "Pre-Approvals Submitted (count)",             stage: preapprovals_submitted,    measure: count,   owner: "Steve Weaver (PM)"}
      - {row: 8,  kpi: "Pre-Approvals Submitted ($ Value)",           stage: preapprovals_submitted,    measure: dollars, owner: "Steve Weaver (PM)", goal: 80000}
      - {row: 9,  kpi: "Pre-Approvals Approved (count)",              stage: preapprovals_received,     measure: count,   owner: "Steve Weaver (PM)"}
      - {row: 10, kpi: "Implementations Scheduled (Est. Incentive $)", stage: implementations_scheduled, measure: dollars, owner: "David Rodriguez (Ops Mgr)", goal: 80000}
      - {row: 11, kpi: "Implementations Completed (count)",           stage: implementations_completed, measure: count,   owner: "David Rodriguez (Ops Mgr)"}
      - {row: 12, kpi: "Closeouts Submitted (count)",                 stage: closeouts_submitted,       measure: count,   owner: "Steve Weaver (PM)"}
