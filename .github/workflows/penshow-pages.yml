# Publishes penshow/ to GitHub Pages so the tracker is a URL you can open on a
# phone and "Add to Home Screen". Only the penshow directory becomes the site;
# the rest of the repository is not published.
name: Deploy pen show tracker

on:
  push:
    branches:
      - main
      - claude/pen-show-inventory-tracker-sc51of
    paths:
      - "penshow/**"
      - ".github/workflows/penshow-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the app is self-contained before publishing
        run: |
          set -euo pipefail
          for f in index.html sw.js manifest.webmanifest icon.svg; do
            test -f "penshow/$f" || { echo "missing penshow/$f"; exit 1; }
          done
          python3 - <<'PY'
          import pathlib, re, sys
          html = pathlib.Path("penshow/index.html").read_text()
          # An offline app must not reach out to a CDN; convention wifi will not be there.
          external = re.findall(r'(?:src|href)=["\'](?:https?:)?//[^"\']+', html)
          if external:
              sys.exit("external references in index.html: %s" % external[:5])
          for needed in ("<title>", "indexedDB", "serviceWorker"):
              if needed not in html:
                  sys.exit("index.html is missing %r" % needed)
          print("self-contained, %d KB" % (len(html) // 1024))
          PY

      # Enabling Pages needs administration:write, which GITHUB_TOKEN does not
      # get — so configure-pages cannot switch it on for us (it fails with an
      # opaque "Resource not accessible by integration"). Check first and say
      # plainly what the one-time manual step is.
      - name: Require Pages to be enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
                   -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$REPO/pages") || code=000
          if [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::Open https://github.com/$REPO/settings/pages, set Source to 'GitHub Actions', then re-run this workflow. One-time step, needs repo admin."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Could not read Pages settings (HTTP $code)."
            cat /tmp/pages.json || true
            exit 1
          fi
          echo "Pages is enabled."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: penshow

      - id: deployment
        uses: actions/deploy-pages@v4
