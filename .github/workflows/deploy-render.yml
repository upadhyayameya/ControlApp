# Redeploys the Submarine Pens USA store on Render whenever the store changes.
# Setup: in Render, service -> Settings -> Deploy Hook -> Copy; in GitHub, repo Settings ->
# Secrets and variables -> Actions -> New repository secret named RENDER_DEPLOY_HOOK.
name: Deploy store to Render

on:
  push:
    branches: [main, claude/vibrant-maxwell-cygb89]
    paths: ["submarine-pens-usa/**", "render.yaml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set, so Render was not asked to redeploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered."
