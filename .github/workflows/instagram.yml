name: Instagram auto-post

on:
  schedule:
    - cron: '7 16 * * *'   # daily at 16:07 UTC — change to suit your audience
    - cron: '23 3 1,15 * *' # 1st & 15th: refresh the access token
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only, post nothing)'
        type: boolean
        default: false
  push:
    paths: ['instagram/**']  # validate the queue whenever it changes

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node instagram/post.mjs --dry-run

  post:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '7 16 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Post next item from the queue
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: node instagram/post.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit moved files and log
        if: always() && !inputs.dry_run
        run: |
          git config user.name 'instagram-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A instagram
          git diff --cached --quiet || (git commit -m 'Instagram: archive posted item' && git push)

  refresh-token:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 1,15 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Refresh token and save it back to the secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}  # fine-grained PAT with "Secrets: read & write" on this repo
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "GH_PAT not set — skipping auto-refresh (refresh manually every ~50 days)"; exit 0; fi
          NEW=$(node instagram/refresh-token.mjs)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
