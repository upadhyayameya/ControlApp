name: Public works data

# Keeps the Mumbai Public Works dashboard current:
# - every day, refresh live tenders from Mahatenders and commit the change;
# - on every push or pull request touching public-works/, validate all data files.
# Claims about people and companies are never changed here: those go through the
# two-pass review described in .claude/skills/public-works-data/SKILL.md.

on:
  schedule:
    - cron: '17 2 * * *'   # tenders: 02:17 UTC = 07:47 IST, daily
    - cron: '41 */3 * * *' # air quality: every 3 hours
  workflow_dispatch: {}
  push:
    paths: ['public-works/**', '.github/workflows/public-works.yml']
  pull_request:
    paths: ['public-works/**', '.github/workflows/public-works.yml']

permissions:
  contents: write

concurrency:
  group: public-works-data
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate data files
        run: node public-works/tools/validate.cjs | tee -a "$GITHUB_STEP_SUMMARY"

  refresh-aqi:
    # Needs a free OpenAQ key saved as the repository secret OPENAQ_API_KEY.
    if: (github.event_name == 'schedule' && github.event.schedule == '41 */3 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch station readings
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python3 public-works/tools/fetch_aqi.py
      - name: Commit if changed
        run: |
          git diff --quiet -- public-works/data/aqi.js && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-works/data/aqi.js
          git commit -m "Public works: refresh air quality $(date -u +%FT%H:%MZ)"
          git pull --rebase && git push

  refresh-tenders:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Scrape Mahatenders
        # Mahatenders sometimes refuses non-Indian IPs; a failed scrape leaves the file unchanged.
        run: python3 public-works/tools/scrape_mahatenders.py
      - name: Validate
        run: node public-works/tools/validate.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit if changed
        run: |
          if git diff --quiet -- public-works/data/tenders.js; then
            echo "No tender changes." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-works/data/tenders.js
          git commit -m "Public works: refresh tenders $(date -u +%F)"
          git push
