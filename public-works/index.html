<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mumbai Public Works</title>
  <meta name="description" content="Open dashboard of government infrastructure projects in Mumbai: status, cost, who is funding them, and the elected MLAs for each area." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
